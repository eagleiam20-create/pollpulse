<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Poll Pulse</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#18202a;
  overscroll-behavior:none;
}

body{
  overflow-x:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= AUTH ================= */

#authScreen{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 10% 10%,#dfe8ff 0,transparent 32%),
    radial-gradient(circle at 90% 90%,#e7ddff 0,transparent 35%),
    #f7f9ff;
}

.auth-card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:28px;
  padding:30px 24px;
  box-shadow:0 20px 60px rgba(30,40,80,.12);
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:26px;
}

.logo-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  background:linear-gradient(135deg,#635bff,#8b5cf6);
  color:#fff;
  box-shadow:0 10px 25px rgba(99,91,255,.25);
}

.logo-title{
  font-size:23px;
  font-weight:800;
}

.logo-sub{
  color:#7c8494;
  font-size:12px;
  margin-top:2px;
}

.auth-card h1{
  margin:0 0 8px;
  font-size:29px;
}

.auth-desc{
  color:#747c8b;
  margin:0 0 23px;
  line-height:1.5;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field textarea,
.search-input{
  width:100%;
  border:1px solid #e3e7ef;
  background:#f8f9fc;
  border-radius:14px;
  padding:13px 14px;
  outline:none;
  transition:.2s;
}

.field input:focus,
.field textarea:focus,
.search-input:focus{
  border-color:#756cff;
  background:#fff;
  box-shadow:0 0 0 4px rgba(99,91,255,.08);
}

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,#635bff,#8b5cf6);
  font-weight:800;
  box-shadow:0 10px 24px rgba(99,91,255,.22);
}

.primary-btn:disabled{
  opacity:.65;
}

.secondary-btn{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:14px;
  background:#f0f1f7;
  color:#313846;
  font-weight:700;
}

.auth-links{
  display:flex;
  justify-content:space-between;
  margin-top:16px;
  gap:10px;
}

.text-btn{
  background:none;
  color:#635bff;
  font-size:13px;
  font-weight:700;
}

#authMessage{
  min-height:20px;
  margin:12px 0 0;
  font-size:13px;
  text-align:center;
}

.success{
  color:#16834b!important;
}

.error{
  color:#d83b4d!important;
}

/* ================= APP ================= */

#appScreen{
  min-height:100vh;
  min-height:100dvh;
  background:#f6f7fb;
}

.app-shell{
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  min-height:100dvh;
  background:#f6f7fb;
  position:relative;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  height:68px;
  padding:10px 16px;
  padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(246,247,251,.94);
  backdrop-filter:blur(18px);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.top-brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.top-brand .logo-icon{
  width:39px;
  height:39px;
  border-radius:12px;
  font-size:19px;
}

.top-brand span{
  font-weight:850;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#fff;
  box-shadow:0 5px 18px rgba(30,40,70,.07);
  font-size:19px;
  position:relative;
}

.badge{
  position:absolute;
  top:-3px;
  right:-3px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:20px;
  background:#ff4d67;
  color:#fff;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

/* ================= CONTENT ================= */

.content{
  padding:10px 15px 110px;
}

.hero{
  border-radius:25px;
  padding:23px;
  color:#fff;
  background:
    radial-gradient(circle at 100% 0,#a78bfa,transparent 40%),
    linear-gradient(135deg,#4f46e5,#7c3aed);
  box-shadow:0 16px 35px rgba(79,70,229,.22);
  margin-bottom:17px;
}

.hero h2{
  margin:0 0 7px;
  font-size:25px;
}

.hero p{
  margin:0;
  opacity:.9;
  line-height:1.45;
  font-size:14px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:22px 2px 11px;
}

.section-head h3{
  margin:0;
  font-size:17px;
}

.muted{
  color:#818998;
  font-size:12px;
}

/* ================= SUGGESTIONS ================= */

.suggestions{
  display:flex;
  gap:11px;
  overflow-x:auto;
  padding:2px 2px 5px;
  scrollbar-width:none;
}

.suggestions::-webkit-scrollbar{
  display:none;
}

.suggestion-card{
  min-width:150px;
  background:#fff;
  border-radius:19px;
  padding:14px;
  box-shadow:0 7px 22px rgba(25,35,60,.06);
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#e9eaf1;
  display:block;
}

.suggestion-card .avatar{
  margin-bottom:9px;
}

.user-name{
  font-weight:800;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.username{
  color:#89909e;
  font-size:11px;
  margin-top:2px;
}

.follow-btn{
  width:100%;
  margin-top:11px;
  padding:8px;
  border-radius:10px;
  background:#635bff;
  color:#fff;
  font-size:12px;
  font-weight:800;
}

.follow-btn.following{
  background:#ececf5;
  color:#4e5361;
}

/* ================= POLLS ================= */

.poll-card{
  background:#fff;
  border-radius:22px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:0 7px 25px rgba(25,35,60,.06);
}

.poll-author{
  display:flex;
  align-items:center;
  gap:10px;
}

.poll-author .avatar{
  width:39px;
  height:39px;
}

.poll-question{
  font-size:17px;
  line-height:1.35;
  font-weight:800;
  margin:15px 0 12px;
}

.poll-option{
  width:100%;
  position:relative;
  overflow:hidden;
  margin:8px 0;
  padding:12px 13px;
  border-radius:13px;
  border:1px solid #e7e9ef;
  background:#fafbfc;
  text-align:left;
  color:#222936;
}

.poll-option .bar{
  position:absolute;
  inset:0 auto 0 0;
  width:0;
  background:rgba(99,91,255,.12);
  transition:.4s;
}

.poll-option .option-content{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.poll-option.selected{
  border-color:#7168ff;
}

.poll-meta{
  display:flex;
  justify-content:space-between;
  margin-top:13px;
  color:#8b919d;
  font-size:11px;
}

.poll-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
  border-top:1px solid #f0f1f5;
  padding-top:11px;
}

.action-btn{
  flex:1;
  padding:9px;
  border-radius:11px;
  background:#f6f7fa;
  color:#646b79;
  font-size:12px;
  font-weight:700;
}

/* ================= SEARCH ================= */

.search-box{
  margin:5px 0 15px;
}

.search-results{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.search-item{
  background:#fff;
  padding:13px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:0 5px 18px rgba(30,40,70,.05);
}

.search-user{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.search-user .avatar{
  width:43px;
  height:43px;
}

.empty{
  text-align:center;
  color:#8b919d;
  padding:35px 15px;
}

/* ================= CREATE ================= */

.create-card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 7px 25px rgba(25,35,60,.06);
}

.create-card textarea{
  min-height:105px;
  resize:none;
}

.option-input{
  margin-top:9px;
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #e3e6ed;
  background:#fafbfc;
  outline:none;
}

.remove-option{
  margin-top:5px;
  font-size:11px;
  color:#d54b59;
  background:none;
}

/* ================= PROFILE ================= */

.profile-card{
  background:#fff;
  border-radius:23px;
  padding:22px;
  text-align:center;
  box-shadow:0 7px 25px rgba(25,35,60,.06);
}

.profile-avatar-wrap{
  position:relative;
  width:90px;
  height:90px;
  margin:0 auto 12px;
}

.profile-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  background:#e8e9ef;
}

.photo-edit{
  position:absolute;
  right:0;
  bottom:0;
  width:29px;
  height:29px;
  border-radius:50%;
  background:#635bff;
  color:#fff;
  border:3px solid #fff;
}

.profile-stats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin:19px 0;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  color:#858b98;
  font-size:11px;
}

.profile-actions{
  display:flex;
  gap:9px;
}

.profile-actions button{
  flex:1;
}

/* ================= CHAT ================= */

.chat-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:11px;
  background:#fff;
  padding:13px;
  border-radius:17px;
  box-shadow:0 5px 17px rgba(30,40,70,.05);
}

.chat-item-info{
  flex:1;
  min-width:0;
}

.chat-last{
  color:#8a909c;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-window{
  position:fixed;
  inset:0;
  z-index:100;
  background:#f7f8fc;
  display:flex;
  flex-direction:column;
}

.chat-header{
  height:64px;
  padding:8px 13px;
  padding-top:max(8px,env(safe-area-inset-top));
  background:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eceef3;
}

.chat-header button{
  background:none;
  font-size:22px;
}

.chat-header .avatar{
  width:39px;
  height:39px;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:16px;
  margin:6px 0;
  font-size:14px;
  line-height:1.4;
  word-break:break-word;
}

.message.mine{
  margin-left:auto;
  background:#635bff;
  color:#fff;
  border-bottom-right-radius:5px;
}

.message.theirs{
  margin-right:auto;
  background:#fff;
  border-bottom-left-radius:5px;
}

.chat-input{
  padding:9px;
  padding-bottom:max(9px,env(safe-area-inset-bottom));
  background:#fff;
  display:flex;
  gap:8px;
  border-top:1px solid #e9ebf0;
}

.chat-input input{
  flex:1;
  min-width:0;
  border:1px solid #e0e3ea;
  background:#f7f8fa;
  border-radius:13px;
  padding:12px;
  outline:none;
}

.chat-input button{
  width:47px;
  border-radius:13px;
  background:#635bff;
  color:#fff;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  z-index:40;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  padding:7px 9px;
  padding-bottom:max(7px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-top:1px solid #eceef3;
  display:flex;
  justify-content:space-around;
}

.nav-btn{
  flex:1;
  background:none;
  color:#9298a5;
  padding:7px 2px;
  font-size:10px;
  font-weight:700;
}

.nav-btn span{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.nav-btn.active{
  color:#635bff;
}

/* ================= MODALS ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(12,15,25,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-card{
  width:100%;
  max-width:420px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:24px;
  padding:20px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h3{
  margin:0;
}

.close-btn{
  width:35px;
  height:35px;
  border-radius:10px;
  background:#f0f1f5;
}

/* ================= TOAST ================= */

#toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:88px;
  transform:translateX(-50%) translateY(20px);
  background:#202532;
  color:#fff;
  padding:11px 15px;
  border-radius:13px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= DESKTOP ================= */

@media(min-width:700px){
  .app-shell{
    box-shadow:0 0 60px rgba(20,30,60,.08);
  }

  .bottom-nav{
    box-shadow:0 -5px 25px rgba(20,30,60,.08);
  }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<section id="authScreen">

  <div class="auth-card">

    <div class="logo">
      <div class="logo-icon">📊</div>
      <div>
        <div class="logo-title">Poll Pulse</div>
        <div class="logo-sub">Your voice. Your pulse.</div>
      </div>
    </div>

    <h1 id="authTitle">Welcome back</h1>

    <p class="auth-desc" id="authDesc">
      Login to see polls, people and conversations.
    </p>

    <div class="field">
      <label>Email</label>
      <input
        id="emailInput"
        type="email"
        autocomplete="email"
        placeholder="you@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input
        id="passwordInput"
        type="password"
        autocomplete="current-password"
        placeholder="Your password">
    </div>

    <div class="field hidden" id="usernameField">
      <label>Username</label>
      <input
        id="usernameInput"
        type="text"
        autocomplete="username"
        placeholder="yourusername">
    </div>

    <button
      id="loginButton"
      class="primary-btn"
      type="button">
      Login
    </button>

    <button
      id="signupButton"
      class="secondary-btn"
      type="button">
      Create account
    </button>

    <div class="auth-links">
      <button id="forgotButton" class="text-btn" type="button">
        Forgot password?
      </button>

      <button id="modeButton" class="text-btn" type="button">
        Sign up
      </button>
    </div>

    <div id="authMessage"></div>

  </div>
</section>


<!-- ================= APP ================= -->

<section id="appScreen" class="hidden">

<div class="app-shell">

  <header class="topbar">

    <div class="top-brand">
      <div class="logo-icon">📊</div>
      <span>Poll Pulse</span>
    </div>

    <button
      id="notificationButton"
      class="icon-btn"
      type="button">
      🔔
      <span id="notificationBadge" class="badge hidden">0</span>
    </button>

  </header>


  <main id="mainContent" class="content"></main>


  <nav class="bottom-nav">

    <button class="nav-btn active" data-page="home" type="button">
      <span>⌂</span>
      Home
    </button>

    <button class="nav-btn" data-page="search" type="button">
      <span>⌕</span>
      Search
    </button>

    <button class="nav-btn" data-page="create" type="button">
      <span>＋</span>
      Create
    </button>

    <button class="nav-btn" data-page="chat" type="button">
      <span>💬</span>
      Chat
    </button>

    <button class="nav-btn" data-page="profile" type="button">
      <span>◉</span>
      Profile
    </button>

  </nav>

</div>
</section>


<!-- ================= CHAT MODAL ================= -->

<div id="chatWindow" class="chat-window hidden">

  <div class="chat-header">

    <button id="closeChatButton" type="button">‹</button>

    <img id="chatAvatar" class="avatar" src="" alt="">

    <div>
      <div id="chatName" class="user-name">Chat</div>
      <div id="chatUsername" class="username"></div>
    </div>

  </div>

  <div id="chatMessages" class="chat-messages"></div>

  <form id="chatForm" class="chat-input">

    <input
      id="chatInput"
      type="text"
      maxlength="1000"
      autocomplete="off"
      placeholder="Message...">

    <button type="submit">➤</button>

  </form>

</div>


<!-- ================= PHOTO MODAL ================= -->

<div id="photoModal" class="modal hidden">

  <div class="modal-card">

    <div class="modal-head">
      <h3>Profile photo</h3>
      <button id="closePhotoModal" class="close-btn" type="button">✕</button>
    </div>

    <input id="photoInput" type="file" accept="image/*">

    <button
      id="uploadPhotoButton"
      class="primary-btn"
      type="button"
      style="margin-top:14px">
      Upload photo
    </button>

    <div id="photoMessage" class="muted" style="margin-top:10px"></div>

  </div>
</div>


<div id="toast"></div>


<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
  "https://dbpbkvfaxgifjeveijqf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";


/* =========================================================
   GLOBALS
========================================================= */

let supabaseClient = null;
let supabaseLoading = null;

let currentUser = null;
let currentProfile = null;

let currentPage = "home";

let currentChatUser = null;
let chatChannel = null;

let authMode = "login";

let pollCache = [];
let profileCache = [];

const $ = id => document.getElementById(id);


/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function avatarURL(url,name){
  if(url) return url;

  const letter =
    String(name || "?")
      .trim()
      .charAt(0)
      .toUpperCase() || "?";

  return "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(letter) +
    "&background=635bff&color=fff&size=160";
}

function showToast(message){
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2600);
}

function setAuthMessage(message,type=""){
  const el = $("authMessage");

  el.textContent = message;
  el.className = type;
}

function setPhotoMessage(message){
  $("photoMessage").textContent = message;
}

function timeAgo(date){
  const d = new Date(date);
  const diff = Math.floor((Date.now()-d.getTime())/1000);

  if(diff < 60) return "just now";

  const min = Math.floor(diff/60);
  if(min < 60) return min+"m";

  const hour = Math.floor(min/60);
  if(hour < 24) return hour+"h";

  const day = Math.floor(hour/24);
  if(day < 30) return day+"d";

  return d.toLocaleDateString();
}


/* =========================================================
   SUPABASE LOADER
========================================================= */

function loadSupabase(){

  if(
    window.supabase &&
    typeof window.supabase.createClient === "function"
  ){
    return Promise.resolve(window.supabase);
  }

  if(supabaseLoading){
    return supabaseLoading;
  }

  supabaseLoading = new Promise((resolve,reject)=>{

    const sources = [
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
      "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"
    ];

    let index = 0;

    function tryLoad(){

      if(
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ){
        resolve(window.supabase);
        return;
      }

      if(index >= sources.length){
        reject(
          new Error(
            "Supabase library load nahi hui. Internet/CDN check karo."
          )
        );
        return;
      }

      const script = document.createElement("script");

      script.src = sources[index++];
      script.async = true;

      script.onload = ()=>{

        if(
          window.supabase &&
          typeof window.supabase.createClient === "function"
        ){
          resolve(window.supabase);
        }else{
          tryLoad();
        }

      };

      script.onerror = ()=>{
        tryLoad();
      };

      document.head.appendChild(script);
    }

    tryLoad();

  });

  return supabaseLoading;
}


async function initSupabase(){

  const sdk = await loadSupabase();

  if(!supabaseClient){

    supabaseClient = sdk.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );

  }

  return supabaseClient;
}

/* =========================================================
   LOGIN
========================================================= */

async function loginUser(){

  const email =
    $("emailInput").value.trim();

  const password =
    $("passwordInput").value;

  if(!email || !password){
    setAuthMessage(
      "Email aur password dono bharo.",
      "error"
    );
    return;
  }

  const button = $("loginButton");

  button.disabled = true;
  button.textContent = "Logging in...";

  setAuthMessage("Connecting...");

  try{

    const sb = await initSupabase();

    const {data,error} =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(error){
      throw error;
    }

    if(!data || !data.user){
      throw new Error("Login successful nahi hua.");
    }

    currentUser = data.user;

    setAuthMessage(
      "Login successful!",
      "success"
    );

    await openApp(currentUser);

  }catch(error){

    console.error("LOGIN ERROR:",error);

    setAuthMessage(
      error?.message ||
      "Login failed. Internet aur account check karo.",
      "error"
    );

  }finally{

    button.disabled = false;
    button.textContent = "Login";

  }
}


/* =========================================================
   SIGNUP
========================================================= */

async function signupUser(){

  const email =
    $("emailInput").value.trim();

  const password =
    $("passwordInput").value;

  const username =
    $("usernameInput").value.trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"");

  if(!email || !password || !username){

    setAuthMessage(
      "Email, password aur username bharo.",
      "error"
    );

    return;
  }

  if(password.length < 6){

    setAuthMessage(
      "Password kam se kam 6 characters ka hona chahiye.",
      "error"
    );

    return;
  }

  const button = $("signupButton");

  button.disabled = true;
  button.textContent = "Creating...";

  try{

    const sb = await initSupabase();

    const {data,error} =
      await sb.auth.signUp({
        email,
        password,
        options:{
          data:{
            username
          }
        }
      });

    if(error){
      throw error;
    }

    if(data?.session){

      currentUser = data.user;

      await ensureProfile();

      await openApp(currentUser);

    }else{

      setAuthMessage(
        "Account ban gaya. Agar email confirmation enabled hai to email verify karo.",
        "success"
      );

    }

  }catch(error){

    console.error("SIGNUP ERROR:",error);

    setAuthMessage(
      error?.message ||
      "Signup failed.",
      "error"
    );

  }finally{

    button.disabled = false;
    button.textContent = "Create account";

  }
}

/* =========================================================
   PROFILE
========================================================= */

async function ensureProfile(){

  if(!currentUser) return null;

  const sb = await initSupabase();

  try{

    const {data,error} =
      await sb
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();

    if(error){
      throw error;
    }

    if(data){

      currentProfile = data;
      return data;

    }

    const username =
      currentUser.user_metadata?.username ||
      (
        currentUser.email
          ? currentUser.email.split("@")[0]
          : "user"
      );

    const fallback = {
      id:currentUser.id,
      username:username,
      full_name:"",
      avatar_url:""
    };

    const result =
      await sb
        .from("profiles")
        .insert(fallback)
        .select()
        .maybeSingle();

    if(result.error){

      console.warn(
        "Profile create warning:",
        result.error
      );

      currentProfile = fallback;

    }else{

      currentProfile =
        result.data || fallback;

    }

  }catch(error){

    console.warn(
      "ensureProfile:",
      error
    );

    currentProfile = {
      id:currentUser.id,
      username:
        currentUser.email?.split("@")[0] || "user",
      full_name:"",
      avatar_url:""
    };

  }

  return currentProfile;
}

async function setupAuthListener(){

  const sb = await initSupabase();

  sb.auth.onAuthStateChange(
    async(event,session)=>{

      if(
        session?.user &&
        !currentUser
      ){

        currentUser = session.user;

        setTimeout(()=>{
          openApp(session.user);
        },0);

      }

      if(
        event === "SIGNED_OUT"
      ){

        currentUser = null;
        currentProfile = null;

        $("appScreen")
          .classList.add("hidden");

        $("authScreen")
          .classList.remove("hidden");

        setAuthMode("login");

      }

    }
  );
}

async function toggleFollow(userId,button){

  if(!currentUser || !userId) return;

  button.disabled = true;

  try{

    const sb = await initSupabase();

    const {data,error} =
      await sb
        .from("follows")
        .select("id")
        .eq("follower_id",currentUser.id)
        .eq("following_id",userId)
        .maybeSingle();

    if(error) throw error;

    if(data){

      const result =
        await sb
          .from("follows")
          .delete()
          .eq("id",data.id);

      if(result.error) throw result.error;

      button.textContent = "Follow";
      button.classList.remove("following");

      showToast("Unfollowed");

    }else{

      const result =
        await sb
          .from("follows")
          .insert({
            follower_id:currentUser.id,
            following_id:userId
          });

      if(result.error) throw result.error;

      button.textContent = "Following";
      button.classList.add("following");

      showToast("Following");

    }

  }catch(error){

    console.error("FOLLOW ERROR:",error);

      error?.message ||

function renderPoll(poll){

  let options = [];

  if(Array.isArray(poll.options)){
    options = poll.options;
  }else if(typeof poll.options === "string"){
    try{
      options = JSON.parse(poll.options);
    }catch{
      options = poll.options
        .split(",")
        .map(x=>x.trim())
        .filter(Boolean);
    }
  }

  if(!options.length){
    options = ["Yes","No"];
  }

  const author =
    poll.username ||
    poll.author_name ||
    "Poll creator";

  return `

    <article
      class="poll-card"
      data-poll="${poll.id}">

      <div class="poll-author">

        <img
          class="avatar"
          src="${avatarURL(
            poll.avatar_url,
            author
          )}"
          alt="">

        <div>
          <div class="user-name">
            ${escapeHTML(author)}
          </div>
          <div class="username">
            ${timeAgo(poll.created_at)}
          </div>
        </div>

      </div>

      <div class="poll-question">
        ${escapeHTML(
          poll.question ||
          poll.title ||
          "Untitled poll"
        )}
      </div>

      <div class="poll-options">

        ${options.map((option,index)=>`

          <button
            class="poll-option"
            type="button"
            data-vote-poll="${poll.id}"
            data-vote-index="${index}">

            <span class="bar"></span>

            <span class="option-content">
              <span>
                ${escapeHTML(option)}
              </span>
              <strong class="vote-percent">
                0%
              </strong>
            </span>

          </button>

        `).join("")}

      </div>

      <div class="poll-meta">
        <span class="vote-total">0 votes</span>
        <span>Poll</span>
      </div>

    </article>

  `;
}


/* =========================================================
   VOTES
========================================================= */

async function loadPollVotes(){

  if(!pollCache.length) return;

  try{

    const sb = await initSupabase();

    const ids =
      pollCache.map(p=>p.id);

    const {data,error} =
      await sb
        .from("poll_votes")
        .select("*")
        .in("poll_id",ids);

    if(error) throw error;

    const grouped = {};

    (data || []).forEach(v=>{

      if(!grouped[v.poll_id]){
        grouped[v.poll_id] = [];
      }

      grouped[v.poll_id].push(v);

    });

    document
      .querySelectorAll("[data-poll]")
      .forEach(card=>{

        const pollId =
          card.dataset.poll;

        const votes =
          grouped[pollId] || [];

        const total =
          votes.length;

        card.querySelector(".vote-total")
          .textContent =
          total + (total === 1 ? " vote" : " votes");

        const counts = {};

        votes.forEach(v=>{
          counts[v.option_index] =
            (counts[v.option_index] || 0) + 1;
        });

        card
          .querySelectorAll("[data-vote-index]")
          .forEach(button=>{

            const index =
              button.dataset.voteIndex;

            const count =
              counts[index] || 0;

            const percent =
              total
                ? Math.round(
                    count / total * 100
                  )
                : 0;

            button
              .querySelector(".bar")
              .style.width =
              percent + "%";

            button
              .querySelector(".vote-percent")
              .textContent =
              percent + "%";

            const hasVoted =
              votes.some(v=>
                String(v.user_id) ===
                String(currentUser.id) &&
                String(v.option_index) ===
                String(index)
              );

            if(hasVoted){
              button.classList.add("selected");
            }

          });

      });

  }catch(error){

    console.warn(
      "Vote stats unavailable:",
      error
    );

  }
}


async function votePoll(pollId,index){

  if(!currentUser) return;

  try{

    const sb = await initSupabase();

    const existing =
      await sb
        .from("poll_votes")
        .select("id")
        .eq("poll_id",pollId)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    if(existing.error) throw existing.error;

    if(existing.data){

      const result =
        await sb
          .from("poll_votes")
          .update({
            option_index:index
          })
          .eq("id",existing.data.id);

      if(result.error) throw result.error;

    }else{

      const result =
        await sb
          .from("poll_votes")
          .insert({
            poll_id:pollId,
            user_id:currentUser.id,
            option_index:index
          });

      if(result.error) throw result.error;

    }

    showToast("Vote saved!");

    await loadPollVotes();

  }catch(error){

    console.error("VOTE ERROR:",error);

    showToast(
      error?.message ||
      "Vote save nahi hua."
    );

  }
}

  `;

  const box =
    $("chatList");

  try{

    const sb = await initSupabase();

    /*
      conversations/messages schema agar different hai
      to query ko apne Supabase schema ke according adjust
      karna padega.
    */

    const {data,error} =
      await sb
        .from("messages")
        .select("*")
        .or(
          "sender_id.eq." +
          currentUser.id +
          ",receiver_id.eq." +
          currentUser.id
        )
        .order("created_at",{ascending:false})
        .limit(100);

    if(error) throw error;

    const userIds = new Set();

    (data || []).forEach(message=>{

      if(
        message.sender_id &&
        message.sender_id !== currentUser.id
      ){
        userIds.add(message.sender_id);
      }

      if(
        message.receiver_id &&
        message.receiver_id !== currentUser.id
      ){
        userIds.add(message.receiver_id);
      }

    });

    if(!userIds.size){

      box.innerHTML =
        '<div class="empty">No conversations yet.</div>';

      return;
    }

    const {data:users,error:userError} =
      await sb
        .from("profiles")
        .select("*")
        .in("id",[...userIds]);

    if(userError) throw userError;

    const map = {};

    (users || []).forEach(u=>{
      map[u.id] = u;
    });

    const seen = new Set();

    box.innerHTML =
      (data || [])
        .filter(message=>{

          const other =
            message.sender_id === currentUser.id
              ? message.receiver_id
              : message.sender_id;

          if(!other || seen.has(other))
            return false;

          seen.add(other);
          return true;

        })
        .map(message=>{

          const other =
            message.sender_id === currentUser.id
              ? message.receiver_id
              : message.sender_id;

          const user =
            map[other] || {};

          return `

            <button
              class="chat-item"
              type="button"
              data-chat-user="${other}">

              <img
                class="avatar"
                src="${avatarURL(
                  user.avatar_url,
                  user.username
                )}"
                alt="">

              <div class="chat-item-info">

                <div class="user-name">
                  ${escapeHTML(
                    user.full_name ||
                    user.username ||
                    "User"
                  )}
                </div>

                <div class="chat-last">
                  ${escapeHTML(
                    message.content || ""
                  )}
                </div>

              </div>

            </button>
          `;

        })
        .join("");

  }catch(error){

    console.error(
      "CHAT LIST ERROR:",
      error
    );

    box.innerHTML =
      `<div class="empty">
        Messages unavailable.<br>
        <small>${escapeHTML(error.message)}</small>
      </div>`;

  }
}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openChat(userId){

  try{

    const sb = await initSupabase();

    const {data:user,error:userError} =
      await sb
        .from("profiles")
        .select("*")
        .eq("id",userId)
        .maybeSingle();

    if(userError) throw userError;

    currentChatUser =
      user || {
        id:userId,
        username:"User"
      };

    $("chatName").textContent =
      currentChatUser.full_name ||
      currentChatUser.username ||
      "User";

    $("chatUsername").textContent =
      currentChatUser.username
        ? "@"+currentChatUser.username
        : "";

    $("chatAvatar").src =
      avatarURL(
        currentChatUser.avatar_url,
        currentChatUser.username
      );

    $("chatWindow")
      .classList.remove("hidden");

    await loadMessages();

    subscribeChat();

  }catch(error){

    console.error(
      "OPEN CHAT ERROR:",
      error
    );

    showToast(
      error?.message ||
      "Chat open nahi hua."
    );

  }
}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

  if(!currentChatUser) return;

  const box =
    $("chatMessages");

  box.innerHTML =
    '<div class="empty">Loading...</div>';

  try{

    const sb = await initSupabase();

    const me =
      currentUser.id;

    const other =
      currentChatUser.id;

    const {data,error} =
      await sb
        .from("messages")
        .select("*")
        .or(
          "and(sender_id.eq."+me+",receiver_id.eq."+other+"),"+
          "and(sender_id.eq."+other+",receiver_id.eq."+me+")"
        )
        .order("created_at",{ascending:true});

    if(error) throw error;

    if(!data?.length){

      box.innerHTML =
        '<div class="empty">Start the conversation 👋</div>';

      return;
    }

    box.innerHTML =
      data.map(message=>`

        <div class="message ${
          message.sender_id === me
            ? "mine"
            : "theirs"
        }">

          ${escapeHTML(
            message.content || ""
          )}

        </div>

      `).join("");

    box.scrollTop =
      box.scrollHeight;

  }catch(error){

    console.error(
      "MESSAGE LOAD ERROR:",
      error
    );

    box.innerHTML =
      `<div class="empty">
        Messages load nahi hue.<br>
        <small>${escapeHTML(error.message)}</small>
      </div>`;

  }
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  const input =
    $("chatInput");

  const content =
    input.value.trim();

  if(!content || !currentChatUser)
    return;

  input.value = "";

  try{

    const sb = await initSupabase();

    const result =
      await sb
        .from("messages")
        .insert({
          sender_id:currentUser.id,
          receiver_id:currentChatUser.id,
          content:content
        });

    if(result.error) throw result.error;

    await loadMessages();

  }catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );

    input.value = content;

    showToast(
      error?.message ||
      "Message send nahi hua."
    );

  }
}


/* =========================================================
   REALTIME CHAT
========================================================= */

function subscribeChat(){

  if(chatChannel){
    try{
      chatChannel.unsubscribe();
    }catch{}
  }

  if(!supabaseClient || !currentChatUser)
    return;

  const ids = [
    currentUser.id,
    currentChatUser.id
  ].sort();

  chatChannel =
    supabaseClient
      .channel(
        "chat-"+ids.join("-")
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages"
        },
        payload=>{

          const row =
            payload.new;

          if(!row) return;

          const relevant =
            (
              row.sender_id === currentUser.id &&
              row.receiver_id === currentChatUser.id
            ) ||
            (
              row.sender_id === currentChatUser.id &&
              row.receiver_id === currentUser.id
            );

          if(relevant){
            loadMessages();
          }

        }
      )
      .subscribe();
}

/* =========================================================
   PROFILE PHOTO
========================================================= */

async function uploadProfilePhoto(){

  const file =
    $("photoInput").files[0];

  if(!file){

    setPhotoMessage(
      "Pehle photo select karo."
    );

    return;
  }

  if(!file.type.startsWith("image/")){

    setPhotoMessage(
      "Sirf image select karo."
    );

    return;
  }

  const button =
    $("uploadPhotoButton");

  button.disabled = true;
  button.textContent = "Uploading...";

  try{

    const sb = await initSupabase();

    const extension =
      file.name.split(".").pop()
        .toLowerCase();

    const path =
      currentUser.id +
      "/" +
      Date.now() +
      "." +
      extension;

    const upload =
      await sb.storage
        .from("avatars")
        .upload(
          path,
          file,
          {
            upsert:true,
            contentType:file.type
          }
        );

    if(upload.error)
      throw upload.error;

    const publicUrl =
      sb.storage
        .from("avatars")
        .getPublicUrl(path)
        .data
        .publicUrl;

    const update =
      await sb
        .from("profiles")
        .update({
          avatar_url:publicUrl
        })
        .eq(
          "id",
          currentUser.id
        );

    if(update.error)
      throw update.error;

    currentProfile.avatar_url =
      publicUrl;

    setPhotoMessage(
      "Profile photo updated!"
    );

    showToast(
      "Profile photo updated!"
    );

    setTimeout(()=>{
      $("photoModal")
        .classList.add("hidden");

      loadProfile();
    },600);

  }catch(error){

    console.error(
      "PHOTO ERROR:",
      error
    );

    setPhotoMessage(
      error?.message ||
      "Photo upload failed."
    );

  }finally{

    button.disabled = false;
    button.textContent =
      "Upload photo";

  }
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

async function updateNotificationCount(){

  if(!currentUser) return;

  try{

    const sb = await initSupabase();

    const {count,error} =
      await sb
        .from("notifications")
        .select("id",{
          count:"exact",
          head:true
        })
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "read",
          false
        );

    if(error) throw error;

    const badge =
      $("notificationBadge");

    if(count > 0){

      badge.textContent =
        count > 99 ? "99+" : count;

      badge.classList.remove("hidden");

    }else{

      badge.classList.add("hidden");

    }

  }catch(error){

    console.warn(
      "NOTIFICATION ERROR:",
      error
    );

  }
}


async function showNotifications(){

  try{

    const sb = await initSupabase();

    const {data,error} =
      await sb
        .from("notifications")
        .select("*")
        .eq(
          "user_id",
          currentUser.id
        )
        .order(
          "created_at",
          {ascending:false}
        )
        .limit(30);

    if(error) throw error;

    if(!data?.length){

      showToast("No notifications.");
      return;
    }

    const text =
      data
        .slice(0,5)
        .map(n=>
          n.message ||
          n.content ||
          "New notification"
        )
        .join(" • ");

    showToast(text);

    await sb
      .from("notifications")
      .update({read:true})
      .eq(
        "user_id",
        currentUser.id
      );

    updateNotificationCount();

  }catch(error){

    console.warn(
      "NOTIFICATION LOAD:",
      error
    );

    showToast(
      "Notifications unavailable."
    );

  }
}

async function logoutUser(){

  try{

    const sb = await initSupabase();

    await sb.auth.signOut();

  }catch(error){

    console.error(
      "LOGOUT ERROR:",
      error
    );

  }

  currentUser = null;
  currentProfile = null;

  $("appScreen")
    .classList.add("hidden");

  $("authScreen")
    .classList.remove("hidden");

  $("emailInput").value = "";
  $("passwordInput").value = "";
  $("usernameInput").value = "";

  setAuthMode("login");

  showToast("Logged out.");

}

/* =========================================================
   START APP
========================================================= */

async function startApp(){

  $("authScreen")
    .classList.remove("hidden");

  $("appScreen")
    .classList.add("hidden");

  try{

    await initSupabase();

    await setupAuthListener();

    const result =
      await supabaseClient.auth.getSession();

    if(result.error){
      throw result.error;
    }

    const session =
      result.data?.session;

    if(session?.user){

      currentUser =
        session.user;

      await openApp(
        session.user
      );

    }

  }catch(error){

    console.error(
      "START ERROR:",
      error
    );

    setAuthMessage(
      "Login system start nahi hua. Internet connection check karo.",
      "error"
    );

  }

}

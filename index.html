<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#09090f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Vex Agent</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #09090f;
      --panel: #11111a;
      --panel-2: #171722;
      --border: rgba(255,255,255,.09);
      --text: #f7f7fb;
      --muted: #9898a8;
      --accent: #8b5cf6;
      --accent-2: #6366f1;
      --danger: #ef4444;
      --user: #6847d9;
      --assistant: #15151f;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% -10%, rgba(124,58,237,.22), transparent 35%),
        var(--bg);
    }

    /* AUTH */

    .auth-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(139,92,246,.25), transparent 38%),
        #08080d;
    }

    .auth-card {
      width: min(430px, 100%);
      padding: 30px 22px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(17,17,26,.92);
      box-shadow: 0 25px 80px rgba(0,0,0,.4);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 35px rgba(99,102,241,.3);
    }

    .auth-card h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      letter-spacing: -.8px;
    }

    .auth-subtitle {
      margin: 8px 0 26px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 4px;
      margin-bottom: 18px;
      border-radius: 13px;
      background: #0b0b12;
    }

    .auth-tab {
      padding: 10px;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
    }

    .auth-tab.active {
      color: white;
      background: var(--panel-2);
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #c6c6d2;
      font-size: 13px;
    }

    .field input {
      width: 100%;
      padding: 14px;
      outline: none;
      color: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #0c0c13;
    }

    .field input:focus {
      border-color: rgba(139,92,246,.7);
    }

    .primary-btn {
      width: 100%;
      margin-top: 5px;
      padding: 14px;
      border-radius: 14px;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .primary-btn:disabled {
      opacity: .6;
    }

    .auth-error {
      min-height: 20px;
      margin: 10px 0 0;
      color: #ff7777;
      font-size: 13px;
      text-align: center;
    }

    /* HEADER */

    .topbar {
      height: 68px;
      flex: 0 0 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
      background: rgba(9,9,15,.82);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .brand-text strong {
      display: block;
      font-size: 16px;
    }

    .brand-text span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 1px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: #ddd;
      background: var(--panel);
      font-size: 18px;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 15px 140px;
      scroll-behavior: smooth;
    }

    .welcome {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px 5px;
    }

    .welcome-logo {
      width: 76px;
      height: 76px;
      margin-bottom: 18px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      font-size: 35px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 18px 50px rgba(99,102,241,.25);
    }

    .welcome h2 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -.7px;
    }

    .welcome p {
      max-width: 340px;
      margin: 9px 0 25px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .suggestions {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .suggestion {
      padding: 13px;
      text-align: left;
      color: #ddd;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(17,17,26,.8);
    }

    .suggestion b {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .suggestion span {
      color: var(--muted);
      font-size: 11px;
    }

    .message {
      display: flex;
      margin: 10px 0;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(85%, 600px);
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      color: white;
      border-bottom-right-radius: 6px;
      background: linear-gradient(135deg, #6847d9, #5740b8);
    }

    .message.assistant .bubble {
      border-bottom-left-radius: 6px;
      border: 1px solid var(--border);
      background: var(--assistant);
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .typing i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #aaa;
      animation: blink 1s infinite;
    }

    .typing i:nth-child(2) {
      animation-delay: .15s;
    }

    .typing i:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: .3; }
      40% { opacity: 1; }
    }

    /* INPUT */

    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 25%);
    }

    .composer {
      width: min(700px, 100%);
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 7px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(17,17,26,.94);
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }

    .composer textarea {
      flex: 1;
      min-height: 42px;
      max-height: 130px;
      resize: none;
      padding: 11px 8px;
      outline: none;
      color: white;
      border: 0;
      background: transparent;
      line-height: 1.4;
    }

    .composer textarea::placeholder {
      color: #777787;
    }

    .round-btn {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #ddd;
      background: #22222d;
      font-size: 18px;
    }

    .send-btn {
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .round-btn.recording {
      background: #dc2626;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% { transform: scale(1.06); }
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
      min-height: 15px;
    }

    /* MENU */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(3px);
    }

    .overlay.show {
      display: block;
    }

    .menu {
      position: absolute;
      right: 12px;
      top: 60px;
      width: 220px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: #14141e;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }

    .menu-item {
      width: 100%;
      padding: 12px;
      border-radius: 11px;
      text-align: left;
      color: #ddd;
      background: transparent;
    }

    .menu-item:hover {
      background: #20202b;
    }

    .menu-item.danger {
      color: #ff7777;
    }

    @media (min-width: 700px) {
      .chat {
        padding-left: 20px;
        padding-right: 20px;
      }

      .composer-wrap {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- AUTH -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">

      <div class="logo">V</div>

      <h1>Vex Agent</h1>
      <p class="auth-subtitle">
        Your fast, simple AI assistant.
      </p>

      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active">
          Login
        </button>

        <button id="signupTab" class="auth-tab">
          Sign Up
        </button>
      </div>

      <form id="authForm">

        <div class="field">
          <label>Email</label>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label>Password</label>
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            minlength="6"
            required
          />
        </div>

        <button id="authButton" class="primary-btn" type="submit">
          Login
        </button>

        <div id="authError" class="auth-error"></div>
      </form>

    </div>
  </section>

  <!-- APP -->
  <main id="app" class="app" style="display:none;">

    <header class="topbar">

      <div class="brand">
        <div class="brand-icon">V</div>

        <div class="brand-text">
          <strong>Vex Agent</strong>
          <span>AI ASSISTANT</span>
        </div>
      </div>

      <button id="menuButton" class="icon-btn" aria-label="Menu">
        ⋮
      </button>

    </header>

    <section id="chat" class="chat">

      <div id="welcome" class="welcome">

        <div class="welcome-logo">V</div>

        <h2>How can I help?</h2>

        <p>
          Ask Vex anything. Type your question or use your voice.
        </p>

        <div class="suggestions">

          <button class="suggestion" data-prompt="Explain this topic to me simply">
            <b>📚 Learn</b>
            <span>Explain something</span>
          </button>

          <button class="suggestion" data-prompt="Help me write a professional message">
            <b>✍️ Write</b>
            <span>Create text</span>
          </button>

          <button class="suggestion" data-prompt="Help me build a website">
            <b>💻 Code</b>
            <span>Build something</span>
          </button>

          <button class="suggestion" data-prompt="Give me some useful ideas for today">
            <b>💡 Ideas</b>
            <span>Get suggestions</span>
          </button>

        </div>

      </div>

      <div id="messages"></div>

    </section>

    <div class="composer-wrap">

      <div class="composer">

        <button
          id="micButton"
          class="round-btn"
          type="button"
          aria-label="Voice input"
        >
          🎙️
        </button>

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message Vex..."
          autocomplete="off"
        ></textarea>

        <button
          id="sendButton"
          class="round-btn send-btn"
          type="button"
          aria-label="Send"
        >
          ➤
        </button>

      </div>

      <div id="status" class="status">
        Vex is ready
      </div>

    </div>

  </main>

  <!-- MENU -->
  <div id="overlay" class="overlay">

    <div class="menu">

      <button id="userInfo" class="menu-item">
        👤 Account
      </button>

      <button id="clearChat" class="menu-item">
        🗑️ Clear chat
      </button>

      <button id="logoutButton" class="menu-item danger">
        🚪 Logout
      </button>

    </div>

  </div>

  <script>
    /* =========================================================
       VEX AGENT CONFIG
       ========================================================= */

    const SUPABASE_URL =
      "https://dbpbkvfaxgifjeveijqf.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

    /*
      IMPORTANT:
      This is a publishable client key.
      NEVER put a service_role key here.
    */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false
          }
        }
      );


    /* =========================================================
       STATE
       ========================================================= */

    let authMode = "login";
    let currentUser = null;
    let currentConversationId = null;
    let recognition = null;
    let isRecording = false;


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const authScreen = document.getElementById("authScreen");
    const app = document.getElementById("app");

    const authForm = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const authButton = document.getElementById("authButton");
    const authError = document.getElementById("authError");

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const messages = document.getElementById("messages");

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const micButton = document.getElementById("micButton");
    const status = document.getElementById("status");

    const menuButton = document.getElementById("menuButton");
    const overlay = document.getElementById("overlay");
    const logoutButton = document.getElementById("logoutButton");
    const clearChat = document.getElementById("clearChat");
    const userInfo = document.getElementById("userInfo");


    /* =========================================================
       AUTH UI
       ========================================================= */

    loginTab.addEventListener("click", () => {
      authMode = "login";

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      authButton.textContent = "Login";
      authError.textContent = "";
    });


    signupTab.addEventListener("click", () => {
      authMode = "signup";

      signupTab.classList.add("active");
      loginTab.classList.remove("active");

      authButton.textContent = "Create account";
      authError.textContent = "";
    });


    authForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      authError.textContent = "";
      authButton.disabled = true;

      try {

        if (authMode === "login") {

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if (error) throw error;

          currentUser = data.user;

          showApp();

        } else {

          const { data, error } =
            await supabaseClient.auth.signUp({
              email,
              password
            });

          if (error) throw error;

          if (data.session) {

            currentUser = data.user;
            showApp();

          } else {

            authError.textContent =
              "Account created. Check your email to confirm it.";

          }
        }

      } catch (error) {

        authError.textContent =
          error.message || "Authentication failed.";

      } finally {

        authButton.disabled = false;
      }
    });


    /* =========================================================
       APP
       ========================================================= */

    function showApp() {

      authScreen.style.display = "none";
      app.style.display = "flex";

      setStatus("Vex is ready");

      messageInput.focus();
    }


    function showAuth() {

      app.style.display = "none";
      authScreen.style.display = "flex";

      currentUser = null;
      currentConversationId = null;

      messages.innerHTML = "";
      welcome.style.display = "flex";
    }


    /* =========================================================
       CHAT UI
       ========================================================= */

    function addMessage(role, content) {

      welcome.style.display = "none";

      const wrapper =
        document.createElement("div");

      wrapper.className =
        `message ${role}`;

      const bubble =
        document.createElement("div");

      bubble.className = "bubble";
      bubble.textContent = content;

      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);

      scrollToBottom();

      return wrapper;
    }


    function addTyping() {

      welcome.style.display = "none";

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message assistant";

      wrapper.id =
        "typingMessage";

      const bubble =
        document.createElement("div");

      bubble.className = "bubble";

      bubble.innerHTML = `
        <span class="typing">
          <i></i>
          <i></i>
          <i></i>
        </span>
      `;

      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);

      scrollToBottom();
    }


    function removeTyping() {

      const typing =
        document.getElementById("typingMessage");

      if (typing) typing.remove();
    }


    function scrollToBottom() {

      requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
      });
    }


    function setStatus(text) {
      status.textContent = text;
    }


    /* =========================================================
       SEND MESSAGE
       ========================================================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();

      if (!text) return;

      messageInput.value = "";
      resizeTextarea();

      addMessage("user", text);

      addTyping();

      setStatus("Thinking...");

      sendButton.disabled = true;
      micButton.disabled = true;

      try {

        /*
          BACKEND CONNECTION

          Next step:
          This endpoint will be your Supabase Edge Function:

          /functions/v1/chat

          The AI API key stays on the server.
        */

        const {
          data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
          throw new Error("Your session expired. Please login again.");
        }


        const response =
          await fetch(
            `${SUPABASE_URL}/functions/v1/clever-processor`,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "Authorization":
                  `Bearer ${session.access_token}`
              },

              body: JSON.stringify({
                conversation_id:
                  currentConversationId,

                message: text
              })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "Vex backend is not connected yet."
          );
        }


        if (result.conversation_id) {

          currentConversationId =
            result.conversation_id;
        }


        removeTyping();

        addMessage(
          "assistant",
          result.reply || "I couldn't generate a response."
        );

        setStatus("Vex is ready");


      } catch (error) {

        removeTyping();

        addMessage(
          "assistant",
          "⚠️ " + (
            error.message ||
            "Something went wrong."
          )
        );

        setStatus("Connection error");

      } finally {

        sendButton.disabled = false;
        micButton.disabled = false;

        messageInput.focus();
      }
    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =========================================================
       ENTER TO SEND
       ========================================================= */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }
      }
    );


    /* =========================================================
       AUTO RESIZE
       ========================================================= */

    function resizeTextarea() {

      messageInput.style.height = "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          130
        ) + "px";
    }


    messageInput.addEventListener(
      "input",
      resizeTextarea
    );


    /* =========================================================
       QUICK PROMPTS
       ========================================================= */

    document
      .querySelectorAll(".suggestion")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            messageInput.value =
              button.dataset.prompt;

            resizeTextarea();

            messageInput.focus();

            sendMessage();
          }
        );
      });


    /* =========================================================
       VOICE INPUT
       ========================================================= */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();

      recognition.lang = "en-IN";

      recognition.interimResults = true;
      recognition.continuous = false;


      recognition.onstart = () => {

        isRecording = true;

        micButton.classList.add(
          "recording"
        );

        setStatus("Listening...");
      };


      recognition.onresult =
        (event) => {

          let transcript = "";

          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            transcript +=
              event.results[i][0].transcript;
          }

          messageInput.value =
            transcript;

          resizeTextarea();
        };


      recognition.onerror =
        () => {

          setStatus(
            "Voice input unavailable"
          );
        };


      recognition.onend =
        () => {

          isRecording = false;

          micButton.classList.remove(
            "recording"
          );

          if (
            messageInput.value.trim()
          ) {

            setStatus(
              "Voice captured"
            );
          } else {

            setStatus(
              "Vex is ready"
            );
          }
        };


      micButton.addEventListener(
        "click",
        () => {

          if (isRecording) {

            recognition.stop();

          } else {

            recognition.start();
          }
        }
      );

    } else {

      micButton.addEventListener(
        "click",
        () => {

          setStatus(
            "Voice input isn't supported in this browser."
          );
        }
      );
    }


    /* =========================================================
       MENU
       ========================================================= */

    menuButton.addEventListener(
      "click",
      () => {

        overlay.classList.toggle(
          "show"
        );
      }
    );


    overlay.addEventListener(
      "click",
      (event) => {

        if (event.target === overlay) {

          overlay.classList.remove(
            "show"
          );
        }
      }
    );


    /* =========================================================
       ACCOUNT
       ========================================================= */

    userInfo.addEventListener(
      "click",
      () => {

        overlay.classList.remove(
          "show"
        );

        if (currentUser) {

          alert(
            `Logged in as:\n${currentUser.email}`
          );
        }
      }
    );


    /* =========================================================
       CLEAR CHAT
       ========================================================= */

    clearChat.addEventListener(
      "click",
      () => {

        overlay.classList.remove(
          "show"
        );

        messages.innerHTML = "";

        currentConversationId = null;

        welcome.style.display = "flex";

        setStatus("New chat");
      }
    );


    /* =========================================================
       LOGOUT
       ========================================================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        overlay.classList.remove(
          "show"
        );

        await supabaseClient.auth.signOut();

        showAuth();
      }
    );


    /* =========================================================
       INITIAL SESSION
       ========================================================= */

    async function init() {

      /*
        persistSession:false means
        this app intentionally does not
        store the auth session in localStorage.
      */

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();


      if (session) {

        currentUser =
          session.user;

        showApp();

      } else {

        showAuth();
      }
    }


    init();

  </script>

</body>
</html>

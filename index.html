<style>
/* ================= CHAT ROOT ================= */

#chatPage {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #fff;
  display: none;
  flex-direction: column;
  max-width: 560px;
  margin: auto;
  overflow: hidden;
}

#chatPage.active {
  display: flex;
}

.chat-top {
  height: 62px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid #eee;
  background: #fff;
}

.chat-back {
  width: 40px;
  height: 40px;
  border: 0;
  background: transparent;
  font-size: 25px;
  cursor: pointer;
}

.chat-user-info {
  flex: 1;
  min-width: 0;
}

.chat-user-name {
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-user-status {
  font-size: 12px;
  color: #888;
  margin-top: 2px;
}

.chat-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  background: #eee;
  flex-shrink: 0;
}

.chat-online-dot {
  width: 9px;
  height: 9px;
  background: #19c463;
  border: 2px solid white;
  border-radius: 50%;
  position: absolute;
  right: -1px;
  bottom: 1px;
}

.chat-avatar-wrap {
  position: relative;
}


/* ================= INBOX ================= */

#chatInbox {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: #fff;
}

.chat-inbox-header {
  padding: 18px 16px 10px;
  font-size: 25px;
  font-weight: 800;
}

.chat-search-wrap {
  padding: 6px 14px 12px;
}

#chatSearch {
  width: 100%;
  box-sizing: border-box;
  border: 0;
  outline: 0;
  background: #f1f1f1;
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 14px;
}

#chatUsers {
  flex: 1;
  overflow-y: auto;
}

.chat-user-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 15px;
  cursor: pointer;
  transition: background .15s;
}

.chat-user-row:hover {
  background: #f7f7f7;
}

.chat-row-info {
  flex: 1;
  min-width: 0;
}

.chat-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.chat-row-name {
  font-size: 15px;
  font-weight: 700;
}

.chat-row-time {
  font-size: 11px;
  color: #999;
}

.chat-row-bottom {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 3px;
}

.chat-last-message {
  flex: 1;
  min-width: 0;
  color: #888;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-unread {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 11px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chat-empty {
  padding: 50px 20px;
  text-align: center;
  color: #999;
}


/* ================= CONVERSATION ================= */

#chatConversation {
  display: none;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

#chatConversation.active {
  display: flex;
}

#chatMessages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px 10px;
  background: #fff;
}

.chat-day {
  text-align: center;
  color: #aaa;
  font-size: 11px;
  margin: 14px 0;
}

.chat-message-line {
  display: flex;
  margin: 4px 0;
}

.chat-message-line.mine {
  justify-content: flex-end;
}

.chat-message-line.theirs {
  justify-content: flex-start;
}

.chat-bubble {
  max-width: 76%;
  padding: 9px 12px;
  border-radius: 19px;
  font-size: 14px;
  line-height: 1.4;
  position: relative;
  word-break: break-word;
}

.mine .chat-bubble {
  background: #111;
  color: white;
  border-bottom-right-radius: 5px;
}

.theirs .chat-bubble {
  background: #efefef;
  color: #111;
  border-bottom-left-radius: 5px;
}

.chat-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  opacity: .6;
  margin-top: 4px;
}

.mine .chat-meta {
  justify-content: flex-end;
}

.chat-photo {
  display: block;
  max-width: 240px;
  max-height: 300px;
  object-fit: cover;
  border-radius: 13px;
  margin: -2px;
}

.chat-reply-preview {
  padding: 6px 9px;
  margin-bottom: 6px;
  border-left: 3px solid currentColor;
  background: rgba(127,127,127,.13);
  border-radius: 6px;
  font-size: 11px;
  opacity: .8;
}

.chat-reactions {
  display: flex;
  gap: 3px;
  margin-top: -5px;
  position: relative;
  z-index: 2;
}

.mine .chat-reactions {
  justify-content: flex-end;
}

.chat-reaction {
  background: white;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 3px 7px;
  font-size: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

.chat-image-btn {
  cursor: pointer;
}


/* ================= REPLY BAR ================= */

#chatReplyBar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: #f6f6f6;
  border-top: 1px solid #eee;
}

#chatReplyBar.show {
  display: flex;
}

.chat-reply-text {
  flex: 1;
  min-width: 0;
  font-size: 12px;
}

.chat-reply-title {
  font-weight: 700;
}

#cancelReply {
  border: 0;
  background: transparent;
  font-size: 20px;
  cursor: pointer;
}


/* ================= TYPING ================= */

#chatTyping {
  height: 20px;
  padding: 0 16px;
  font-size: 11px;
  color: #888;
}


/* ================= COMPOSER ================= */

.chat-composer {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid #eee;
  background: #fff;
}

.chat-icon-btn {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: #f2f2f2;
  cursor: pointer;
  font-size: 18px;
}

#chatInput {
  flex: 1;
  min-width: 0;
  resize: none;
  max-height: 110px;
  border: 1px solid #ddd;
  border-radius: 20px;
  outline: none;
  padding: 9px 13px;
  font-family: inherit;
  font-size: 14px;
  line-height: 18px;
}

#sendMessageBtn {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: #111;
  color: white;
  cursor: pointer;
  font-size: 17px;
}

#sendMessageBtn:disabled {
  opacity: .45;
}


/* ================= REACTION MENU ================= */

#reactionMenu {
  position: fixed;
  display: none;
  z-index: 10020;
  background: white;
  border: 1px solid #ddd;
  border-radius: 30px;
  padding: 6px 8px;
  box-shadow: 0 5px 25px rgba(0,0,0,.18);
}

#reactionMenu.show {
  display: flex;
  gap: 4px;
}

.reaction-choice {
  border: 0;
  background: transparent;
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
}


/* ================= MENU ================= */

.chat-message-menu {
  position: absolute;
  display: none;
  background: white;
  border: 1px solid #ddd;
  box-shadow: 0 5px 20px rgba(0,0,0,.15);
  border-radius: 10px;
  overflow: hidden;
  z-index: 20;
}

.chat-message-menu button {
  display: block;
  width: 130px;
  border: 0;
  background: white;
  padding: 10px;
  text-align: left;
  cursor: pointer;
}

.chat-message-menu button:hover {
  background: #f4f4f4;
}


/* ================= MOBILE ================= */

@media (max-width: 560px) {
  #chatPage {
    width: 100%;
  }

  .chat-bubble {
    max-width: 82%;
  }
}
</style>

<script>
/* =========================================================
   POLL PULSE CHAT ENGINE
========================================================= */

(function () {

  if (typeof supabase === "undefined") {
    console.error("Supabase client not found.");
    return;
  }

  /*
    If your existing app already has:
      const sb = supabase.createClient(...)
    this code uses that client.

    Otherwise create one using your existing credentials.
  */

  const chatSB =
    window.sb ||
    window.supabaseClient ||
    supabase.createClient(
      "https://dbpbkvfaxgifjeveijqf.supabase.co",
      "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7"
    );


  let chatCurrentUser = null;
  let chatTargetUser = null;
  let chatMessages = [];
  let chatProfileCache = {};
  let chatReplyTo = null;
  let chatReactionMessage = null;
  let chatChannel = null;
  let chatPresenceChannel = null;
  let typingTimer = null;
  let searchText = "";


  const $ = id => document.getElementById(id);


  /* =======================================================
     UTILITIES
  ======================================================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function timeText(date) {

    if (!date) return "";

    const d = new Date(date);

    return d.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  }


  function dateText(date) {

    const d = new Date(date);
    const now = new Date();

    const a = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

    const b = new Date(
      d.getFullYear(),
      d.getMonth(),
      d.getDate()
    );

    const diff = Math.round(
      (a - b) / 86400000
    );

    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";

    return d.toLocaleDateString([], {
      day: "numeric",
      month: "short",
      year: d.getFullYear() === now.getFullYear()
        ? undefined
        : "numeric"
    });

  }


  function avatarURL(profile) {

    if (profile?.avatar_url) {
      return profile.avatar_url;
    }

    return "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="100"
             height="100"
             viewBox="0 0 100 100">
          <rect width="100" height="100" fill="#eeeeee"/>
          <circle cx="50" cy="38" r="18" fill="#aaaaaa"/>
          <path d="M20 88c4-22 17-31 30-31s26 9 30 31"
                fill="#aaaaaa"/>
        </svg>
      `);

  }


  function displayName(profile) {

    return (
      profile?.display_name ||
      profile?.username ||
      "User"
    );

  }


  async function getCurrentUser() {

    const {
      data,
      error
    } = await chatSB.auth.getUser();

    if (error || !data?.user) {
      return null;
    }

    return data.user;

  }


  async function getProfile(id) {

    if (!id) return null;

    if (chatProfileCache[id]) {
      return chatProfileCache[id];
    }

    const { data } = await chatSB
      .from("profiles")
      .select("id,username,display_name,avatar_url")
      .eq("id", id)
      .maybeSingle();

    if (data) {
      chatProfileCache[id] = data;
    }

    return data;

  }


  /* =======================================================
     OPEN / CLOSE
  ======================================================= */

  async function openChat(userId) {

    chatCurrentUser = chatCurrentUser || await getCurrentUser();

    if (!chatCurrentUser) {
      alert("Please login first.");
      return;
    }

    if (!userId || userId === chatCurrentUser.id) {
      return;
    }

    chatTargetUser = await getProfile(userId);

    if (!chatTargetUser) {
      alert("User profile not found.");
      return;
    }

    $("chatPage").classList.add("active");

    $("chatInbox").style.display = "none";
    $("chatConversation").classList.add("active");

    $("chatHeaderAvatar").src =
      avatarURL(chatTargetUser);

    $("chatHeaderName").textContent =
      displayName(chatTargetUser);

    updateOnlineStatus();

    await loadConversation();

    subscribeConversation();

  }


  function closeChatConversation() {

    if (chatChannel) {

      chatSB.removeChannel(chatChannel);

      chatChannel = null;

    }

    chatTargetUser = null;

    $("chatConversation").classList.remove("active");

    $("chatInbox").style.display = "flex";

    loadInbox();

  }


  function closeChatPage() {

    if (chatChannel) {
      chatSB.removeChannel(chatChannel);
      chatChannel = null;
    }

    $("chatPage").classList.remove("active");

    chatTargetUser = null;

  }


  /* =======================================================
     INBOX
  ======================================================= */

  async function loadInbox() {

    chatCurrentUser =
      chatCurrentUser || await getCurrentUser();

    if (!chatCurrentUser) return;


    const { data: messages } = await chatSB
      .from("messages")
      .select(`
        id,
        sender_id,
        receiver_id,
        message,
        message_type,
        created_at,
        read,
        deleted_at
      `)
      .or(
        `sender_id.eq.${chatCurrentUser.id},receiver_id.eq.${chatCurrentUser.id}`
      )
      .order("created_at", {
        ascending: false
      })
      .limit(500);


    const conversations = {};
    const partnerIds = new Set();


    (messages || []).forEach(message => {

      const partner =
        message.sender_id === chatCurrentUser.id
          ? message.receiver_id
          : message.sender_id;

      if (!partner) return;

      partnerIds.add(partner);

      if (!conversations[partner]) {

        conversations[partner] = {
          latest: message,
          unread: 0
        };

      }

      if (
        message.receiver_id === chatCurrentUser.id &&
        message.read === false
      ) {

        conversations[partner].unread++;

      }

    });


    /*
      Also include followed users if no conversation exists.
    */
    try {

      const { data: follows } = await chatSB
        .from("follows")
        .select("follower_id,following_id")
        .or(
          `follower_id.eq.${chatCurrentUser.id},following_id.eq.${chatCurrentUser.id}`
        )
        .limit(200);

      (follows || []).forEach(f => {

        const id =
          f.follower_id === chatCurrentUser.id
            ? f.following_id
            : f.follower_id;

        if (id) partnerIds.add(id);

      });

    } catch (e) {
      console.warn("Follow lookup skipped", e);
    }


    if (!partnerIds.size) {

      $("chatUsers").innerHTML = `
        <div class="chat-empty">
          No conversations yet
        </div>
      `;

      return;

    }


    const ids = Array.from(partnerIds);

    const { data: profiles } = await chatSB
      .from("profiles")
      .select("id,username,display_name,avatar_url")
      .in("id", ids);


    (profiles || []).forEach(profile => {

      chatProfileCache[profile.id] = profile;

    });


    const rows = ids
      .map(id => {

        const profile = chatProfileCache[id];

        if (!profile) return null;

        return {
          id,
          profile,
          conversation: conversations[id]
        };

      })
      .filter(Boolean)
      .sort((a, b) => {

        const da =
          a.conversation?.latest?.created_at || "";

        const db =
          b.conversation?.latest?.created_at || "";

        return new Date(db) - new Date(da);

      });


    renderInbox(rows);

  }


  function renderInbox(rows) {

    const filtered = rows.filter(row => {

      if (!searchText) return true;

      const p = row.profile;

      const haystack = (
        displayName(p) + " " +
        (p.username || "") + " " +
        (row.conversation?.latest?.message || "")
      ).toLowerCase();

      return haystack.includes(
        searchText.toLowerCase()
      );

    });


    if (!filtered.length) {

      $("chatUsers").innerHTML = `
        <div class="chat-empty">
          No users found
        </div>
      `;

      return;

    }


    $("chatUsers").innerHTML =
      filtered.map(row => {

        const p = row.profile;
        const latest = row.conversation?.latest;

        let preview = "Start a conversation";

        if (latest) {

          if (latest.deleted_at) {

            preview = "Message deleted";

          } else if (
            latest.message_type === "image"
          ) {

            preview = "📷 Photo";

          } else {

            preview =
              latest.message || "Message";

          }

        }


        const unread =
          row.conversation?.unread || 0;


        return `
          <div
            class="chat-user-row"
            data-user-id="${escapeHTML(row.id)}"
          >

            <div class="chat-avatar-wrap">

              <img
                class="chat-avatar"
                src="${avatarURL(p)}"
                alt=""
              >

            </div>

            <div class="chat-row-info">

              <div class="chat-row-top">

                <span class="chat-row-name">
                  ${escapeHTML(displayName(p))}
                </span>

                ${
                  latest
                    ? `<span class="chat-row-time">
                        ${timeText(latest.created_at)}
                       </span>`
                    : ""
                }

              </div>

              <div class="chat-row-bottom">

                <span class="chat-last-message">
                  ${escapeHTML(preview)}
                </span>

                ${
                  unread
                    ? `<span class="chat-unread">
                         ${unread > 99 ? "99+" : unread}
                       </span>`
                    : ""
                }

              </div>

            </div>

          </div>
        `;

      }).join("");


    document
      .querySelectorAll(".chat-user-row")
      .forEach(row => {

        row.addEventListener("click", () => {

          openChat(row.dataset.userId);

        });

      });

  }


  /* =======================================================
     CONVERSATION LOAD
  ======================================================= */

  async function loadConversation() {

    if (!chatTargetUser || !chatCurrentUser) {
      return;
    }


    const { data, error } = await chatSB
      .from("messages")
      .select(`
        id,
        sender_id,
        receiver_id,
        message,
        message_type,
        media_url,
        reply_to,
        deleted_at,
        delivered_at,
        read,
        read_at,
        created_at
      `)
      .or(
        `and(sender_id.eq.${chatCurrentUser.id},receiver_id.eq.${chatTargetUser.id}),and(sender_id.eq.${chatTargetUser.id},receiver_id.eq.${chatCurrentUser.id})`
      )
      .order("created_at", {
        ascending: true
      })
      .limit(500);


    if (error) {

      console.error(error);

      $("chatMessages").innerHTML = `
        <div class="chat-empty">
          Could not load messages.
        </div>
      `;

      return;

    }


    chatMessages = data || [];

    renderMessages();

    await markMessagesRead();

  }


  /* =======================================================
     RENDER MESSAGES
  ======================================================= */

  async function renderMessages() {

    const box = $("chatMessages");

    if (!chatMessages.length) {

      box.innerHTML = `
        <div class="chat-empty">
          Say hello 👋
        </div>
      `;

      return;

    }


    const messageMap = {};

    chatMessages.forEach(m => {

      messageMap[String(m.id)] = m;

    });


    let previousDate = "";

    box.innerHTML = "";


    for (const message of chatMessages) {

      const currentDate =
        dateText(message.created_at);

      if (currentDate !== previousDate) {

        const divider =
          document.createElement("div");

        divider.className = "chat-day";

        divider.textContent = currentDate;

        box.appendChild(divider);

        previousDate = currentDate;

      }


      const mine =
        message.sender_id === chatCurrentUser.id;


      const line =
        document.createElement("div");

      line.className =
        "chat-message-line " +
        (mine ? "mine" : "theirs");


      const bubble =
        document.createElement("div");

      bubble.className = "chat-bubble";

      bubble.dataset.messageId =
        message.id;


      /* Reply */
      if (message.reply_to) {

        const replied =
          messageMap[String(message.reply_to)];

        if (replied) {

          let replyText =
            replied.message || "Photo";

          if (
            replied.message_type === "image"
          ) {
            replyText = "📷 Photo";
          }

          const reply =
            document.createElement("div");

          reply.className =
            "chat-reply-preview";

          reply.innerHTML = `
            ${escapeHTML(replyText)}
          `;

          bubble.appendChild(reply);

        }

      }


      /* Deleted */
      if (message.deleted_at) {

        const deleted =
          document.createElement("div");

        deleted.textContent =
          "Message deleted";

        deleted.style.fontStyle =
          "italic";

        deleted.style.opacity =
          ".55";

        bubble.appendChild(deleted);

      }

      /* Image */
      else if (
        message.message_type === "image" &&
        message.media_url
      ) {

        const img =
          document.createElement("img");

        img.className = "chat-photo";

        img.alt = "Photo";

        img.dataset.mediaPath =
          message.media_url;

        img.src =
          message.media_url.startsWith("http")
            ? message.media_url
            : "";

        bubble.appendChild(img);

      }

      /* Text */
      else {

        const text =
          document.createElement("div");

        text.innerHTML =
          escapeHTML(message.message)
          .replace(/\n/g, "<br>");

        bubble.appendChild(text);

      }


      /* Meta */
      const meta =
        document.createElement("div");

      meta.className = "chat-meta";

      let status = "";

      if (mine) {

        if (message.read) {

          status = "✓✓";

        } else if (message.delivered_at) {

          status = "✓✓";

        } else {

          status = "✓";

        }

      }


      meta.innerHTML = `
        <span>${timeText(message.created_at)}</span>
        ${
          mine
            ? `<span>${status}</span>`
            : ""
        }
      `;

      bubble.appendChild(meta);


      /* Long press / right click */
      bubble.addEventListener(
        "contextmenu",
        e => {

          e.preventDefault();

          showReactionMenu(
            message,
            e.clientX,
            e.clientY
          );

        }
      );


      let pressTimer;

      bubble.addEventListener(
        "touchstart",
        e => {

          pressTimer = setTimeout(() => {

            const touch =
              e.touches[0];

            showReactionMenu(
              message,
              touch.clientX,
              touch.clientY
            );

          }, 500);

        },
        { passive: true }
      );


      bubble.addEventListener(
        "touchend",
        () => clearTimeout(pressTimer)
      );


      line.appendChild(bubble);

      box.appendChild(line);


      /* Load reactions */
      await renderReactions(
        message.id,
        line
      );

    }


    await hydrateImages();

    box.scrollTop = box.scrollHeight;

  }


  /* =======================================================
     IMAGE HYDRATION
  ======================================================= */

  async function hydrateImages() {

    const images =
      document.querySelectorAll(
        "#chatMessages img[data-media-path]"
      );


    for (const img of images) {

      const path =
        img.dataset.mediaPath;

      if (!path || path.startsWith("http")) {
        continue;
      }


      const {
        data,
        error
      } = await chatSB.storage
        .from("chat-media")
        .createSignedUrl(
          path,
          3600
        );


      if (!error && data?.signedUrl) {

        img.src = data.signedUrl;

      }

    }

  }


  /* =======================================================
     REACTIONS
  ======================================================= */

  async function renderReactions(
    messageId,
    line
  ) {

    const { data } =
      await chatSB
        .from("message_reactions")
        .select("reaction,user_id")
        .eq(
          "message_id",
          String(messageId)
        );


    if (!data?.length) return;


    const counts = {};

    data.forEach(row => {

      counts[row.reaction] =
        (counts[row.reaction] || 0) + 1;

    });


    const wrap =
      document.createElement("div");

    wrap.className =
      "chat-reactions";


    Object.entries(counts)
      .forEach(([emoji, count]) => {

        const el =
          document.createElement("span");

        el.className =
          "chat-reaction";

        el.textContent =
          emoji + " " + count;

        wrap.appendChild(el);

      });


    line.appendChild(wrap);

  }


  async function addReaction(
    messageId,
    reaction
  ) {

    if (!chatCurrentUser) return;


    const { data: existing } =
      await chatSB
        .from("message_reactions")
        .select("id,reaction")
        .eq(
          "message_id",
          String(messageId)
        )
        .eq(
          "user_id",
          chatCurrentUser.id
        )
        .maybeSingle();


    if (
      existing &&
      existing.reaction === reaction
    ) {

      await chatSB
        .from("message_reactions")
        .delete()
        .eq("id", existing.id);

    }

    else if (existing) {

      await chatSB
        .from("message_reactions")
        .update({
          reaction
        })
        .eq("id", existing.id);

    }

    else {

      await chatSB
        .from("message_reactions")
        .insert({
          message_id: String(messageId),
          user_id: chatCurrentUser.id,
          reaction
        });

    }


    hideReactionMenu();

    await loadConversation();

  }


  /* =======================================================
     REACTION MENU
  ======================================================= */

  function showReactionMenu(
    message,
    x,
    y
  ) {

    chatReactionMessage =
      message;


    const menu =
      $("reactionMenu");

    menu.classList.add("show");

    const width =
      menu.offsetWidth || 250;

    const maxX =
      window.innerWidth - width - 8;

    menu.style.left =
      Math.max(8, Math.min(x, maxX))
      + "px";

    menu.style.top =
      Math.max(8, y - 55)
      + "px";

  }


  function hideReactionMenu() {

    $("reactionMenu")
      .classList.remove("show");

    chatReactionMessage = null;

  }


  /* =======================================================
     SEND TEXT
  ======================================================= */

  async function sendMessage() {

    if (!chatCurrentUser ||
        !chatTargetUser) {
      return;
    }


    const input =
      $("chatInput");

    const text =
      input.value.trim();


    if (!text) return;


    $("sendMessageBtn").disabled =
      true;


    const payload = {

      sender_id:
        chatCurrentUser.id,

      receiver_id:
        chatTargetUser.id,

      message: text,

      message_type:
        "text",

      reply_to:
        chatReplyTo
          ? String(chatReplyTo.id)
          : null

    };


    const { error } =
      await chatSB
        .from("messages")
        .insert(payload);


    $("sendMessageBtn").disabled =
      false;


    if (error) {

      console.error(error);

      alert(
        "Message send nahi hua. Supabase RLS check karo."
      );

      return;

    }


    input.value = "";

    input.style.height = "auto";

    cancelReply();

    await loadConversation();

  }


  /* =======================================================
     SEND IMAGE
  ======================================================= */

  async function sendImage(file) {

    if (!file ||
        !chatCurrentUser ||
        !chatTargetUser) {
      return;
    }


    if (!file.type.startsWith("image/")) {

      alert("Only image files are allowed.");

      return;

    }


    if (file.size > 8 * 1024 * 1024) {

      alert("Image must be smaller than 8 MB.");

      return;

    }


    const safeName =
      file.name
        .replace(/[^a-zA-Z0-9._-]/g, "_");


    const path =
      chatCurrentUser.id +
      "/" +
      crypto.randomUUID() +
      "-" +
      safeName;


    const { error: uploadError } =
      await chatSB.storage
        .from("chat-media")
        .upload(
          path,
          file,
          {
            contentType: file.type,
            upsert: false
          }
        );


    if (uploadError) {

      console.error(uploadError);

      alert(
        "Image upload failed."
      );

      return;

    }


    const { error } =
      await chatSB
        .from("messages")
        .insert({

          sender_id:
            chatCurrentUser.id,

          receiver_id:
            chatTargetUser.id,

          message:
            "📷 Photo",

          message_type:
            "image",

          media_url:
            path,

          reply_to:
            chatReplyTo
              ? String(chatReplyTo.id)
              : null

        });


    if (error) {

      console.error(error);

      alert(
        "Image message create nahi hua."
      );

      return;

    }


    cancelReply();

    await loadConversation();

  }


  /* =======================================================
     READ RECEIPTS
  ======================================================= */

  async function markMessagesRead() {

    if (!chatCurrentUser ||
        !chatTargetUser) {
      return;
    }


    const unread =
      chatMessages.filter(m =>
        m.receiver_id === chatCurrentUser.id &&
        m.sender_id === chatTargetUser.id &&
        !m.read
      );


    for (const message of unread) {

      await chatSB
        .from("messages")
        .update({

          read: true,

          read_at:
            new Date().toISOString()

        })
        .eq("id", message.id)
        .eq(
          "receiver_id",
          chatCurrentUser.id
        );

    }

  }


  /* =======================================================
     REPLY
  ======================================================= */

  function startReply(message) {

    chatReplyTo = message;


    let text =
      message.message || "Photo";


    if (
      message.message_type === "image"
    ) {

      text = "📷 Photo";

    }


    $("chatReplyContent")
      .textContent =
      text.length > 70
        ? text.slice(0, 70) + "..."
        : text;


    $("chatReplyBar")
      .classList.add("show");


    $("chatInput").focus();

  }


  function cancelReply() {

    chatReplyTo = null;

    $("chatReplyBar")
      .classList.remove("show");

    $("chatReplyContent")
      .textContent = "";

  }


  /* =======================================================
     DELETE
  ======================================================= */

  async function deleteMessage(message) {

    if (!chatCurrentUser) return;

    if (
      message.sender_id !==
      chatCurrentUser.id
    ) {
      return;
    }


    if (!confirm("Delete this message?")) {
      return;
    }


    const { error } =
      await chatSB
        .from("messages")
        .update({
          deleted_at:
            new Date().toISOString()
        })
        .eq("id", message.id)
        .eq(
          "sender_id",
          chatCurrentUser.id
        );


    if (error) {

      console.error(error);

      alert(
        "Message delete nahi hua."
      );

      return;

    }


    await loadConversation();

  }


  /* =======================================================
     CONTEXT ACTION MENU
  ======================================================= */

  function showMessageActions(
    message
  ) {

    const menu =
      document.createElement("div");

    menu.className =
      "chat-message-menu";

    menu.style.position =
      "fixed";

    menu.style.left = "50%";

    menu.style.top = "50%";

    menu.style.transform =
      "translate(-50%, -50%)";


    menu.innerHTML = `

      <button data-action="reply">
        ↩ Reply
      </button>

      <button data-action="heart">
        ❤️ React
      </button>

      ${
        message.sender_id ===
        chatCurrentUser.id
          ? `
            <button data-action="delete">
              🗑 Delete
            </button>
          `
          : ""
      }

    `;


    document.body.appendChild(menu);


    menu.querySelectorAll("button")
      .forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            const action =
              button.dataset.action;


            menu.remove();


            if (action === "reply") {

              startReply(message);

            }

            else if (
              action === "heart"
            ) {

              await addReaction(
                message.id,
                "❤️"
              );

            }

            else if (
              action === "delete"
            ) {

              await deleteMessage(
                message
              );

            }

          }
        );

      });


    setTimeout(() => {

      document.addEventListener(
        "click",
        function close(e) {

          if (!menu.contains(e.target)) {

            menu.remove();

            document.removeEventListener(
              "click",
              close
            );

          }

        }
      );

    }, 50);

  }


  /* =======================================================
     REALTIME
  ======================================================= */

  function subscribeConversation() {

    if (!chatCurrentUser ||
        !chatTargetUser) {
      return;
    }


    if (chatChannel) {

      chatSB.removeChannel(
        chatChannel
      );

    }


    chatChannel =
      chatSB
        .channel(
          "chat-" +
          chatCurrentUser.id +
          "-" +
          chatTargetUser.id
        )


        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "messages"
          },
          payload => {

            const m =
              payload.new ||
              payload.old;


            if (!m) return;


            const relevant =
              (
                m.sender_id ===
                chatCurrentUser.id &&
                m.receiver_id ===
                chatTargetUser.id
              ) ||
              (
                m.sender_id ===
                chatTargetUser.id &&
                m.receiver_id ===
                chatCurrentUser.id
              );


            if (!relevant) return;


            loadConversation();

          }
        )


        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "message_reactions"
          },
          () => {

            loadConversation();

          }
        )


        .on(
          "broadcast",
          {
            event: "typing"
          },
          payload => {

            if (
              payload.payload?.user_id !==
              chatTargetUser.id
            ) {
              return;
            }


            $("chatTyping")
              .textContent =
              displayName(chatTargetUser) +
              " is typing...";


            clearTimeout(typingTimer);


            typingTimer =
              setTimeout(() => {

                $("chatTyping")
                  .textContent = "";

              }, 1800);

          }
        )


        .subscribe();

  }


  /* =======================================================
     TYPING
  ======================================================= */

  function sendTyping() {

    if (!chatChannel ||
        !chatCurrentUser ||
        !chatTargetUser) {
      return;
    }


    chatChannel.send({

      type: "broadcast",

      event: "typing",

      payload: {
        user_id:
          chatCurrentUser.id
      }

    });

  }


  /* =======================================================
     PRESENCE
  ======================================================= */

  async function updatePresence() {

    if (!chatCurrentUser) return;


    await chatSB
      .from("user_presence")
      .upsert({

        user_id:
          chatCurrentUser.id,

        is_online: true,

        last_seen:
          new Date().toISOString()

      });

  }


  async function updateOnlineStatus() {

    if (!chatTargetUser) return;


    const { data } =
      await chatSB
        .from("user_presence")
        .select(
          "is_online,last_seen"
        )
        .eq(
          "user_id",
          chatTargetUser.id
        )
        .maybeSingle();


    const dot =
      $("chatHeaderOnline");

    const status =
      $("chatHeaderStatus");


    if (data?.is_online) {

      dot.style.display =
        "block";

      status.textContent =
        "Active now";

      return;

    }


    dot.style.display =
      "none";


    if (data?.last_seen) {

      status.textContent =
        "Active " +
        timeText(data.last_seen);

    }

    else {

      status.textContent =
        "Message";

    }

  }


  /* =======================================================
     EVENTS
  ======================================================= */

  $("chatBackBtn")
    .addEventListener(
      "click",
      closeChatConversation
    );


  $("cancelReply")
    .addEventListener(
      "click",
      cancelReply
    );


  $("sendMessageBtn")
    .addEventListener(
      "click",
      sendMessage
    );


  $("chatInput")
    .addEventListener(
      "input",
      () => {

        const input =
          $("chatInput");

        input.style.height =
          "auto";

        input.style.height =
          Math.min(
            input.scrollHeight,
            110
          ) + "px";


        sendTyping();

      }
    );


  $("chatInput")
    .addEventListener(
      "keydown",
      e => {

        if (
          e.key === "Enter" &&
          !e.shiftKey
        ) {

          e.preventDefault();

          sendMessage();

        }

      }
    );


  $("chatImageInput")
    .addEventListener(
      "change",
      async e => {

        const file =
          e.target.files?.[0];

        if (file) {

          await sendImage(file);

        }

        e.target.value = "";

      }
    );


  $("chatSearch")
    .addEventListener(
      "input",
      e => {

        searchText =
          e.target.value.trim();

        loadInbox();

      }
    );


  document
    .querySelectorAll(".reaction-choice")
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          if (!chatReactionMessage) {
            return;
          }

          await addReaction(
            chatReactionMessage.id,
            button.dataset.reaction
          );

        }
      );

    });


  document.addEventListener(
    "click",
    e => {

      if (
        !e.target.closest("#reactionMenu")
      ) {

        hideReactionMenu();

      }

    }
  );


  /* =======================================================
     PUBLIC API
     Existing profile/message button can call:
        window.openChat(userId)
  ======================================================= */

  window.openChat = openChat;

  window.closeChat = closeChatPage;

  window.loadChatInbox = loadInbox;


  /* =======================================================
     INITIALIZE
  ======================================================= */

  (async function initChat() {

    chatCurrentUser =
      await getCurrentUser();


    if (!chatCurrentUser) {
      return;
    }


    await updatePresence();

    await loadInbox();


    /*
      Keep online while app is open.
    */
    setInterval(
      updatePresence,
      30000
    );


    /*
      Refresh inbox occasionally.
    */
    setInterval(
      () => {

        if (
          $("chatPage").classList.contains("active") &&
          !chatTargetUser
        ) {

          loadInbox();

        }

      },
      10000
    );


  })();


})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Poll Pulse — Messages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   POLL PULSE — PROFESSIONAL CHAT APP
========================================================= */

:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f1f3f7;
  --text: #111318;
  --muted: #7b8190;
  --border: #e8eaf0;
  --primary: #5b5cf0;
  --primary-dark: #4647d9;
  --mine: #5b5cf0;
  --theirs: #eef0f5;
  --success: #20c878;
  --danger: #e5484d;
  --shadow: 0 12px 40px rgba(20, 24, 40, .08);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: var(--bg);
  color: var(--text);
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

/* =========================================================
   APP
========================================================= */

#app {
  width: 100%;
  min-height: 100%;
  display: flex;
  justify-content: center;
}

.app-shell {
  width: 100%;
  max-width: 1100px;
  height: 100dvh;
  background: var(--surface);
  display: flex;
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
  width: 350px;
  min-width: 350px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--surface);
}

.brand {
  padding: 24px 22px 12px;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-name {
  font-size: 24px;
  font-weight: 850;
  letter-spacing: -.8px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 900;
  background:
    linear-gradient(135deg, #5b5cf0, #9b5cf6);
}

.search-box {
  padding: 12px 16px 16px;
}

.search-inner {
  height: 44px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 13px;
  background: var(--surface-2);
  border-radius: 13px;
  border: 1px solid transparent;
  transition: .2s;
}

.search-inner:focus-within {
  border-color: rgba(91,92,240,.35);
  background: white;
}

.search-icon {
  color: var(--muted);
  font-size: 17px;
}

#chatSearch {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
}

#chatSearch::placeholder {
  color: #9ca1ad;
}

.inbox-title {
  padding: 0 20px 10px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
}

#chatUsers {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 15px;
}

/* =========================================================
   CHAT USER ROW
========================================================= */

.chat-user-row {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 11px 17px;
  margin: 2px 7px;
  border-radius: 15px;
  cursor: pointer;
  transition: background .18s, transform .12s;
}

.chat-user-row:hover {
  background: var(--surface-2);
}

.chat-user-row:active {
  transform: scale(.985);
}

.avatar-wrap {
  width: 52px;
  height: 52px;
  position: relative;
  flex-shrink: 0;
}

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  background: #e9ebf0;
}

.online-dot {
  position: absolute;
  right: 1px;
  bottom: 1px;
  width: 13px;
  height: 13px;
  background: var(--success);
  border: 3px solid white;
  border-radius: 50%;
}

.chat-row-info {
  min-width: 0;
  flex: 1;
}

.chat-row-top {
  display: flex;
  align-items: center;
  gap: 8px;
}

.chat-row-name {
  min-width: 0;
  flex: 1;
  font-size: 14px;
  font-weight: 750;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-row-time {
  color: #9a9eaa;
  font-size: 10px;
  flex-shrink: 0;
}

.chat-row-bottom {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 5px;
}

.chat-last-message {
  flex: 1;
  min-width: 0;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.unread {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  display: grid;
  place-items: center;
  border-radius: 20px;
  color: white;
  background: var(--primary);
  font-size: 10px;
  font-weight: 800;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty {
  padding: 55px 25px;
  text-align: center;
  color: var(--muted);
}

.empty-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 14px;
  border-radius: 22px;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  font-size: 28px;
}

.empty-title {
  color: var(--text);
  font-weight: 800;
  margin-bottom: 5px;
}

.empty-text {
  font-size: 12px;
  line-height: 1.5;
}

.skeleton {
  height: 74px;
  margin: 5px 12px;
  border-radius: 14px;
  background:
    linear-gradient(
      90deg,
      #f0f1f4 25%,
      #fafafa 37%,
      #f0f1f4 63%
    );
  background-size: 400% 100%;
  animation: skeleton 1.4s infinite;
}

@keyframes skeleton {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

/* =========================================================
   CONVERSATION
========================================================= */

.conversation {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #fbfbfd;
}

.conversation.hidden {
  display: flex;
}

.conversation-header {
  height: 72px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 18px;
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}

.back-btn {
  width: 40px;
  height: 40px;
  display: none;
  place-items: center;
  border: 0;
  border-radius: 12px;
  background: transparent;
  font-size: 27px;
  color: var(--text);
}

.header-avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  object-fit: cover;
}

.header-info {
  min-width: 0;
  flex: 1;
}

.header-name {
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-status {
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

.header-actions {
  display: flex;
  gap: 5px;
}

.header-action {
  width: 38px;
  height: 38px;
  border: 0;
  background: transparent;
  border-radius: 12px;
  font-size: 18px;
}

.header-action:hover {
  background: var(--surface-2);
}

/* =========================================================
   MESSAGES
========================================================= */

#chatMessages {
  flex: 1;
  overflow-y: auto;
  padding: 18px 18px 12px;
  scroll-behavior: smooth;
}

.day-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0;
  color: #9b9fab;
  font-size: 10px;
  font-weight: 700;
  justify-content: center;
}

.day-divider::before,
.day-divider::after {
  content: "";
  height: 1px;
  width: 38px;
  background: var(--border);
}

.message-line {
  display: flex;
  margin: 3px 0;
}

.message-line.mine {
  justify-content: flex-end;
}

.message-line.theirs {
  justify-content: flex-start;
}

.message-stack {
  max-width: min(76%, 460px);
}

.bubble {
  padding: 10px 13px;
  border-radius: 19px;
  font-size: 13px;
  line-height: 1.45;
  word-break: break-word;
  box-shadow: 0 1px 1px rgba(0,0,0,.03);
  user-select: text;
}

.mine .bubble {
  color: white;
  background: linear-gradient(
    135deg,
    var(--mine),
    #6e5df5
  );
  border-bottom-right-radius: 5px;
}

.theirs .bubble {
  color: var(--text);
  background: var(--theirs);
  border-bottom-left-radius: 5px;
}

.message-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 4px 5px 0;
  color: #9b9eaa;
  font-size: 9px;
}

.mine .message-meta {
  justify-content: flex-end;
}

.read-status {
  font-weight: 800;
}

.photo {
  display: block;
  width: min(260px, 100%);
  max-height: 330px;
  object-fit: cover;
  border-radius: 14px;
}

.deleted {
  font-style: italic;
  opacity: .55;
}

.reply-preview {
  margin-bottom: 7px;
  padding: 7px 9px;
  border-left: 3px solid currentColor;
  background: rgba(255,255,255,.15);
  border-radius: 7px;
  font-size: 10px;
  opacity: .82;
}

.theirs .reply-preview {
  background: rgba(0,0,0,.06);
}

.reactions {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: -3px;
}

.mine .reactions {
  justify-content: flex-end;
}

.reaction {
  border: 1px solid var(--border);
  background: white;
  padding: 3px 7px;
  border-radius: 20px;
  font-size: 11px;
  box-shadow: 0 2px 6px rgba(0,0,0,.06);
}

/* =========================================================
   TYPING
========================================================= */

#chatTyping {
  height: 22px;
  padding: 0 20px;
  color: #888c99;
  font-size: 10px;
}

.typing-dots {
  display: inline-flex;
  gap: 3px;
  vertical-align: middle;
}

.typing-dots span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #9296a3;
  animation: typing 1s infinite;
}

.typing-dots span:nth-child(2) {
  animation-delay: .15s;
}

.typing-dots span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes typing {
  0%, 60%, 100% {
    transform: translateY(0);
  }

  30% {
    transform: translateY(-3px);
  }
}

/* =========================================================
   REPLY
========================================================= */

#chatReplyBar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 15px;
  background: white;
  border-top: 1px solid var(--border);
}

#chatReplyBar.show {
  display: flex;
}

.reply-bar-icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: #edeefd;
  color: var(--primary);
}

.reply-bar-text {
  min-width: 0;
  flex: 1;
}

.reply-bar-title {
  color: var(--primary);
  font-size: 10px;
  font-weight: 800;
}

#chatReplyContent {
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#cancelReply {
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: var(--surface-2);
  font-size: 18px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  padding: 9px 13px calc(10px + env(safe-area-inset-bottom));
  background: white;
  border-top: 1px solid var(--border);
}

.composer-btn {
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 17px;
  transition: .15s;
}

.composer-btn:hover {
  background: #e7e9ef;
}

#chatInput {
  flex: 1;
  min-width: 0;
  max-height: 120px;
  resize: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 9px 13px;
  outline: 0;
  background: #fafbfc;
  color: var(--text);
  font-size: 13px;
  line-height: 18px;
}

#chatInput:focus {
  background: white;
  border-color: rgba(91,92,240,.35);
}

#sendMessageBtn {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  color: white;
  background: var(--primary);
  display: grid;
  place-items: center;
  font-size: 17px;
  transition: .15s;
}

#sendMessageBtn:hover {
  background: var(--primary-dark);
  transform: translateY(-1px);
}

#sendMessageBtn:disabled {
  opacity: .45;
  transform: none;
}

/* =========================================================
   REACTION POPUP
========================================================= */

#reactionMenu {
  position: fixed;
  display: none;
  z-index: 10000;
  padding: 7px 9px;
  gap: 3px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 30px;
  box-shadow: 0 12px 35px rgba(0,0,0,.16);
}

#reactionMenu.show {
  display: flex;
}

.reaction-choice {
  width: 35px;
  height: 35px;
  border: 0;
  background: transparent;
  border-radius: 50%;
  font-size: 19px;
}

.reaction-choice:hover {
  background: var(--surface-2);
  transform: scale(1.08);
}

/* =========================================================
   ACTION SHEET
========================================================= */

#actionOverlay {
  position: fixed;
  inset: 0;
  z-index: 10001;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: rgba(10,12,20,.28);
  backdrop-filter: blur(4px);
}

#actionOverlay.show {
  display: flex;
}

.action-sheet {
  width: min(430px, 100%);
  background: white;
  border-radius: 22px 22px 0 0;
  padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
  box-shadow: 0 -15px 50px rgba(0,0,0,.15);
}

.action-handle {
  width: 40px;
  height: 4px;
  margin: 4px auto 10px;
  border-radius: 5px;
  background: #dfe1e6;
}

.action-btn {
  width: 100%;
  height: 48px;
  border: 0;
  border-radius: 13px;
  background: transparent;
  text-align: left;
  padding: 0 14px;
  font-size: 14px;
}

.action-btn:hover {
  background: var(--surface-2);
}

.action-btn.danger {
  color: var(--danger);
}

/* =========================================================
   TOAST
========================================================= */

#toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  z-index: 20000;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  padding: 10px 15px;
  color: white;
  background: #171923;
  border-radius: 12px;
  font-size: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  transition: .25s;
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* =========================================================
   WELCOME PANEL
========================================================= */

.welcome {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
}

.welcome-inner {
  max-width: 330px;
}

.welcome-logo {
  width: 82px;
  height: 82px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  border-radius: 27px;
  color: white;
  font-size: 35px;
  font-weight: 900;
  background: linear-gradient(135deg, #5b5cf0, #9b5cf6);
  box-shadow: 0 15px 35px rgba(91,92,240,.25);
}

.welcome h1 {
  margin: 0 0 8px;
  font-size: 25px;
  letter-spacing: -.6px;
}

.welcome p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  body {
    background: white;
  }

  .app-shell {
    height: 100dvh;
    box-shadow: none;
  }

  .sidebar {
    width: 100%;
    min-width: 100%;
  }

  .conversation {
    position: fixed;
    inset: 0;
    z-index: 5000;
    display: none;
  }

  .conversation.mobile-open {
    display: flex;
  }

  .back-btn {
    display: grid;
  }

  .welcome {
    display: none;
  }

  .brand {
    padding-top: calc(18px + env(safe-area-inset-top));
  }

  #chatMessages {
    padding-left: 12px;
    padding-right: 12px;
  }

  .message-stack {
    max-width: 82%;
  }

  .header-actions {
    display: none;
  }
}

/* =========================================================
   SCROLLBAR
========================================================= */

* {
  scrollbar-width: thin;
  scrollbar-color: #d9dce4 transparent;
}

::-webkit-scrollbar {
  width: 5px;
}

::-webkit-scrollbar-thumb {
  background: #d9dce4;
  border-radius: 10px;
}
</style>
</head>

<body>

<div id="app">

  <div class="app-shell">

    <!-- =====================================================
         INBOX
    ====================================================== -->

    <aside class="sidebar">

      <div class="brand">

        <div class="brand-row">

          <div class="brand-name">
            Poll Pulse
          </div>

          <div class="brand-mark">
            P
          </div>

        </div>

      </div>


      <div class="search-box">

        <div class="search-inner">

          <span class="search-icon">⌕</span>

          <input
            id="chatSearch"
            type="search"
            placeholder="Search people or messages..."
            autocomplete="off"
          >

        </div>

      </div>


      <div class="inbox-title">
        Messages
      </div>


      <div id="chatUsers">

        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>

      </div>

    </aside>


    <!-- =====================================================
         WELCOME
    ====================================================== -->

    <main id="welcomePanel" class="welcome">

      <div class="welcome-inner">

        <div class="welcome-logo">
          P
        </div>

        <h1>
          Your messages
        </h1>

        <p>
          Select a conversation to start chatting with people
          from your Poll Pulse community.
        </p>

      </div>

    </main>


    <!-- =====================================================
         CONVERSATION
    ====================================================== -->

    <main
      id="conversation"
      class="conversation"
    >

      <header class="conversation-header">

        <button
          id="backBtn"
          class="back-btn"
          type="button"
        >
          ‹
        </button>


        <div style="position:relative">

          <img
            id="headerAvatar"
            class="header-avatar"
            src=""
            alt=""
          >

          <span
            id="headerOnline"
            class="online-dot"
            style="display:none"
          ></span>

        </div>


        <div class="header-info">

          <div
            id="headerName"
            class="header-name"
          >
            Chat
          </div>

          <div
            id="headerStatus"
            class="header-status"
          >
            Message
          </div>

        </div>


        <div class="header-actions">

          <button
            class="header-action"
            type="button"
            title="Search"
          >
            ⌕
          </button>

          <button
            class="header-action"
            type="button"
            title="More"
          >
            ⋯
          </button>

        </div>

      </header>


      <div id="chatMessages"></div>


      <div id="chatTyping"></div>


      <!-- REPLY -->

      <div id="chatReplyBar">

        <div class="reply-bar-icon">
          ↩
        </div>

        <div class="reply-bar-text">

          <div class="reply-bar-title">
            Replying to message
          </div>

          <div id="chatReplyContent"></div>

        </div>

        <button
          id="cancelReply"
          type="button"
        >
          ×
        </button>

      </div>


      <!-- COMPOSER -->

      <div class="composer">

        <label
          class="composer-btn"
          title="Send image"
        >

          ＋

          <input
            id="chatImageInput"
            type="file"
            accept="image/*"
            hidden
          >

        </label>


        <textarea
          id="chatInput"
          rows="1"
          maxlength="2000"
          placeholder="Message..."
        ></textarea>


        <button
          id="sendMessageBtn"
          type="button"
          disabled
        >
          ➤
        </button>

      </div>

    </main>

  </div>

</div>


<!-- =========================================================
     REACTION MENU
========================================================= -->

<div id="reactionMenu">

  <button
    class="reaction-choice"
    data-reaction="❤️"
  >
    ❤️
  </button>

  <button
    class="reaction-choice"
    data-reaction="😂"
  >
    😂
  </button>

  <button
    class="reaction-choice"
    data-reaction="😍"
  >
    😍
  </button>

  <button
    class="reaction-choice"
    data-reaction="😮"
  >
    😮
  </button>

  <button
    class="reaction-choice"
    data-reaction="👍"
  >
    👍
  </button>

</div>


<!-- =========================================================
     ACTION SHEET
========================================================= -->

<div id="actionOverlay">

  <div class="action-sheet">

    <div class="action-handle"></div>

    <button
      id="actionReply"
      class="action-btn"
      type="button"
    >
      ↩ &nbsp; Reply
    </button>

    <button
      id="actionReact"
      class="action-btn"
      type="button"
    >
      ❤️ &nbsp; React
    </button>

    <button
      id="actionDelete"
      class="action-btn danger"
      type="button"
      style="display:none"
    >
      🗑 &nbsp; Delete message
    </button>

    <button
      id="actionCancel"
      class="action-btn"
      type="button"
    >
      Cancel
    </button>

  </div>

</div>


<div id="toast"></div>


<script>
/* =========================================================
   POLL PULSE CHAT
========================================================= */

(() => {

  "use strict";


  /* =======================================================
     SUPABASE
  ======================================================= */

  if (
    typeof window.supabase === "undefined"
  ) {

    document.body.innerHTML = `
      <div style="
        padding:40px;
        font-family:system-ui;
        text-align:center;
      ">
        <h2>Supabase failed to load</h2>
        <p>Please check your internet connection.</p>
      </div>
    `;

    return;

  }


  const SUPABASE_URL =
    "https://dbpbkvfaxgifjeveijqf.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";


  /*
    If another part of your app already exposes a client,
    use it.
  */

  const sb =
    window.sb ||
    window.supabaseClient ||
    window.pollPulseSupabase ||
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =======================================================
     STATE
  ======================================================= */

  let currentUser = null;
  let targetUser = null;

  let messages = [];

  let profiles = {};

  let replyMessage = null;

  let selectedMessage = null;

  let conversationChannel = null;

  let typingTimeout = null;

  let presenceInterval = null;

  let searchValue = "";


  /* =======================================================
     HELPERS
  ======================================================= */

  const $ = id =>
    document.getElementById(id);


  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function showToast(message) {

    const toast = $("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);

  }


  function fallbackAvatar() {

    return "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100"
          height="100"
          viewBox="0 0 100 100"
        >
          <rect
            width="100"
            height="100"
            fill="#e9ebf0"
          />

          <circle
            cx="50"
            cy="37"
            r="18"
            fill="#a8acb7"
          />

          <path
            d="M19 90c4-23 18-34 31-34s27 11 31 34"
            fill="#a8acb7"
          />
        </svg>
      `);

  }


  function avatarURL(profile) {

    return profile?.avatar_url ||
      fallbackAvatar();

  }


  function nameOf(profile) {

    return (
      profile?.display_name ||
      profile?.username ||
      "User"
    );

  }


  function formatTime(date) {

    if (!date) return "";

    return new Date(date)
      .toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });

  }


  function formatDate(date) {

    const d = new Date(date);
    const now = new Date();

    const today =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

    const msgDay =
      new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
      );

    const diff =
      Math.round(
        (today - msgDay) / 86400000
      );

    if (diff === 0)
      return "Today";

    if (diff === 1)
      return "Yesterday";

    return d.toLocaleDateString([], {
      day: "numeric",
      month: "short",
      year:
        d.getFullYear() ===
        now.getFullYear()
          ? undefined
          : "numeric"
    });

  }


  function scrollBottom() {

    const box =
      $("chatMessages");

    requestAnimationFrame(() => {

      box.scrollTop =
        box.scrollHeight;

    });

  }


  /* =======================================================
     AUTH
  ======================================================= */

  async function getUser() {

    const {
      data,
      error
    } = await sb.auth.getUser();

    if (error) {

      console.error(error);

      return null;

    }

    return data?.user || null;

  }


  /* =======================================================
     PROFILE
  ======================================================= */

  async function getProfile(id) {

    if (!id) return null;

    if (profiles[id])
      return profiles[id];


    const {
      data,
      error
    } = await sb
      .from("profiles")
      .select(
        "id,username,display_name,avatar_url"
      )
      .eq("id", id)
      .maybeSingle();


    if (error) {

      console.warn(
        "Profile error:",
        error
      );

      return null;

    }


    if (data)
      profiles[id] = data;


    return data;

  }


  /* =======================================================
     OPEN CHAT
  ======================================================= */

  async function openChat(userId) {

    if (!currentUser) {

      showToast(
        "Please login first"
      );

      return;

    }


    if (
      !userId ||
      userId === currentUser.id
    ) {
      return;
    }


    const profile =
      await getProfile(userId);


    if (!profile) {

      showToast(
        "Profile not found"
      );

      return;

    }


    targetUser = profile;


    $("welcomePanel")
      .style.display = "none";


    $("conversation")
      .classList.add("mobile-open");


    $("headerAvatar").src =
      avatarURL(profile);


    $("headerName").textContent =
      nameOf(profile);


    await loadConversation();

    updateOnlineStatus();

    subscribeConversation();

  }


  function closeChat() {

    targetUser = null;

    if (conversationChannel) {

      sb.removeChannel(
        conversationChannel
      );

      conversationChannel = null;

    }


    $("conversation")
      .classList.remove("mobile-open");


    $("welcomePanel")
      .style.display = "";


    loadInbox();

  }


  /* =======================================================
     INBOX
  ======================================================= */

  async function loadInbox() {

    if (!currentUser)
      return;


    $("chatUsers").innerHTML = `
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    `;


    const {
      data,
      error
    } = await sb
      .from("messages")
      .select(`
        id,
        sender_id,
        receiver_id,
        message,
        message_type,
        created_at,
        read,
        deleted_at
      `)
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order(
        "created_at",
        { ascending: false }
      )
      .limit(500);


    if (error) {

      console.error(error);

      $("chatUsers").innerHTML = `
        <div class="empty">
          <div class="empty-icon">!</div>
          <div class="empty-title">
            Couldn't load messages
          </div>
          <div class="empty-text">
            Check your messages table and RLS policies.
          </div>
        </div>
      `;

      return;

    }


    const conversations = {};

    const partnerIds =
      new Set();


    (data || []).forEach(message => {

      const partner =
        message.sender_id === currentUser.id
          ? message.receiver_id
          : message.sender_id;


      if (!partner)
        return;


      partnerIds.add(partner);


      if (!conversations[partner]) {

        conversations[partner] = {
          latest: message,
          unread: 0
        };

      }


      if (
        message.receiver_id ===
          currentUser.id &&
        !message.read
      ) {

        conversations[partner].unread++;

      }

    });


    /* Add people from follows */

    try {

      const {
        data: follows
      } = await sb
        .from("follows")
        .select(
          "follower_id,following_id"
        )
        .or(
          `follower_id.eq.${currentUser.id},following_id.eq.${currentUser.id}`
        )
        .limit(200);


      (follows || [])
        .forEach(f => {

          const id =
            f.follower_id === currentUser.id
              ? f.following_id
              : f.follower_id;

          if (id)
            partnerIds.add(id);

        });

    } catch (e) {

      console.warn(
        "Could not load follows",
        e
      );

    }


    if (!partnerIds.size) {

      $("chatUsers").innerHTML = `
        <div class="empty">
          <div class="empty-icon">💬</div>

          <div class="empty-title">
            No conversations yet
          </div>

          <div class="empty-text">
            Follow people and start a conversation.
          </div>
        </div>
      `;

      return;

    }


    const ids =
      Array.from(partnerIds);


    const {
      data: people,
      error: profileError
    } = await sb
      .from("profiles")
      .select(
        "id,username,display_name,avatar_url"
      )
      .in("id", ids);


    if (profileError) {

      console.error(
        profileError
      );

    }


    (people || [])
      .forEach(profile => {

        profiles[profile.id] =
          profile;

      });


    let rows =
      ids.map(id => ({

        id,

        profile:
          profiles[id],

        conversation:
          conversations[id]

      }))
      .filter(row => row.profile);


    /* Search */

    if (searchValue) {

      const q =
        searchValue.toLowerCase();


      rows =
        rows.filter(row => {

          const p =
            row.profile;

          const latest =
            row.conversation?.latest;


          return (
            nameOf(p)
              .toLowerCase()
              .includes(q) ||

            String(
              p.username || ""
            )
              .toLowerCase()
              .includes(q) ||

            String(
              latest?.message || ""
            )
              .toLowerCase()
              .includes(q)
          );

        });

    }


    /* Latest first */

    rows.sort((a, b) => {

      const da =
        a.conversation?.latest?.created_at ||
        0;

      const db =
        b.conversation?.latest?.created_at ||
        0;

      return (
        new Date(db) -
        new Date(da)
      );

    });


    renderInbox(rows);

  }


  function renderInbox(rows) {

    if (!rows.length) {

      $("chatUsers").innerHTML = `
        <div class="empty">
          <div class="empty-icon">⌕</div>

          <div class="empty-title">
            No results
          </div>

          <div class="empty-text">
            Try another name or username.
          </div>
        </div>
      `;

      return;

    }


    $("chatUsers").innerHTML =
      rows.map(row => {

        const profile =
          row.profile;

        const latest =
          row.conversation?.latest;

        const unread =
          row.conversation?.unread || 0;


        let preview =
          "Start a conversation";


        if (latest) {

          if (latest.deleted_at) {

            preview =
              "Message deleted";

          }

          else if (
            latest.message_type ===
            "image"
          ) {

            preview =
              "📷 Photo";

          }

          else {

            preview =
              latest.message ||
              "Message";

          }

        }


        return `
          <div
            class="chat-user-row"
            data-user-id="${escapeHTML(row.id)}"
          >

            <div class="avatar-wrap">

              <img
                class="avatar"
                src="${avatarURL(profile)}"
                alt=""
              >

            </div>


            <div class="chat-row-info">

              <div class="chat-row-top">

                <div class="chat-row-name">
                  ${escapeHTML(nameOf(profile))}
                </div>

                ${
                  latest
                    ? `
                      <div class="chat-row-time">
                        ${formatTime(
                          latest.created_at
                        )}
                      </div>
                    `
                    : ""
                }

              </div>


              <div class="chat-row-bottom">

                <div class="chat-last-message">
                  ${escapeHTML(preview)}
                </div>

                ${
                  unread
                    ? `
                      <div class="unread">
                        ${
                          unread > 99
                            ? "99+"
                            : unread
                        }
                      </div>
                    `
                    : ""
                }

              </div>

            </div>

          </div>
        `;

      }).join("");


    document
      .querySelectorAll(".chat-user-row")
      .forEach(row => {

        row.addEventListener(
          "click",
          () => {

            openChat(
              row.dataset.userId
            );

          }
        );

      });

  }


  /* =======================================================
     LOAD CONVERSATION
  ======================================================= */

  async function loadConversation() {

    if (
      !currentUser ||
      !targetUser
    ) {
      return;
    }


    $("chatMessages").innerHTML = `
      <div class="empty">
        Loading conversation...
      </div>
    `;


    const {
      data,
      error
    } = await sb
      .from("messages")
      .select(`
        id,
        sender_id,
        receiver_id,
        message,
        message_type,
        media_url,
        reply_to,
        deleted_at,
        delivered_at,
        read,
        read_at,
        created_at
      `)
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${targetUser.id}),and(sender_id.eq.${targetUser.id},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        { ascending: true }
      )
      .limit(500);


    if (error) {

      console.error(error);

      $("chatMessages").innerHTML = `
        <div class="empty">
          <div class="empty-icon">!</div>

          <div class="empty-title">
            Couldn't load chat
          </div>

          <div class="empty-text">
            ${escapeHTML(error.message)}
          </div>
        </div>
      `;

      return;

    }


    messages =
      data || [];


    await renderMessages();

    await markMessagesRead();

  }


  /* =======================================================
     RENDER MESSAGES
  ======================================================= */

  async function renderMessages() {

    const box =
      $("chatMessages");


    if (!messages.length) {

      box.innerHTML = `
        <div class="empty">
          <div class="empty-icon">👋</div>

          <div class="empty-title">
            Say hello
          </div>

          <div class="empty-text">
            Start the conversation with
            ${escapeHTML(nameOf(targetUser))}.
          </div>
        </div>
      `;

      return;

    }


    const messageMap = {};

    messages.forEach(m => {

      messageMap[
        String(m.id)
      ] = m;

    });


    let html = "";

    let lastDate = "";


    messages.forEach(message => {

      const date =
        formatDate(
          message.created_at
        );


      if (date !== lastDate) {

        html += `
          <div class="day-divider">
            ${escapeHTML(date)}
          </div>
        `;

        lastDate = date;

      }


      const mine =
        message.sender_id ===
        currentUser.id;


      let content = "";


      /* Reply preview */

      if (message.reply_to) {

        const original =
          messageMap[
            String(message.reply_to)
          ];


        if (original) {

          const replyText =
            original.message_type === "image"
              ? "📷 Photo"
              : (
                  original.message ||
                  "Message"
                );


          content += `
            <div class="reply-preview">
              ${escapeHTML(
                replyText.length > 90
                  ? replyText.slice(0, 90) + "..."
                  : replyText
              )}
            </div>
          `;

        }

      }


      /* Message content */

      if (message.deleted_at) {

        content += `
          <div class="deleted">
            Message deleted
          </div>
        `;

      }

      else if (
        message.message_type ===
          "image" &&
        message.media_url
      ) {

        const src =
          message.media_url
            .startsWith("http")
            ? message.media_url
            : "";


        content += `
          <img
            class="photo"
            data-media-path="${escapeHTML(
              message.media_url
            )}"
            src="${src}"
            alt="Photo"
          >
        `;

      }

      else {

        content += `
          <div>
            ${escapeHTML(
              message.message || ""
            ).replace(
              /\n/g,
              "<br>"
            )}
          </div>
        `;

      }


      let status = "";


      if (mine) {

        if (message.read) {

          status =
            `<span class="read-status">✓✓</span>`;

        }

        else if (message.delivered_at) {

          status =
            `<span>✓✓</span>`;

        }

        else {

          status =
            `<span>✓</span>`;

        }

      }


      html += `
        <div
          class="message-line ${
            mine ? "mine" : "theirs"
          }"
          data-message-id="${escapeHTML(
            String(message.id)
          )}"
        >

          <div class="message-stack">

            <div
              class="bubble"
              data-id="${escapeHTML(
                String(message.id)
              )}"
            >

              ${content}

            </div>


            <div class="message-meta">

              <span>
                ${formatTime(
                  message.created_at
                )}
              </span>

              ${status}

            </div>


            <div
              class="reactions"
              data-reactions-for="${escapeHTML(
                String(message.id)
              )}"
            ></div>

          </div>

        </div>
      `;

    });


    box.innerHTML = html;


    /* Add interactions */

    box
      .querySelectorAll(".bubble")
      .forEach(bubble => {

        const id =
          bubble.dataset.id;


        const message =
          messages.find(
            m =>
              String(m.id) ===
              String(id)
          );


        if (!message)
          return;


        /* Desktop right click */

        bubble.addEventListener(
          "contextmenu",
          e => {

            e.preventDefault();

            openActionSheet(
              message
            );

          }
        );


        /* Mobile long press */

        let timer = null;


        bubble.addEventListener(
          "touchstart",
          e => {

            timer =
              setTimeout(() => {

                const touch =
                  e.touches[0];


                openActionSheet(
                  message
                );

              }, 500);

          },
          { passive: true }
        );


        bubble.addEventListener(
          "touchend",
          () => {

            clearTimeout(timer);

          }
        );


        bubble.addEventListener(
          "touchmove",
          () => {

            clearTimeout(timer);

          },
          { passive: true }
        );

      });


    await hydrateImages();

    await loadAllReactions();

    scrollBottom();

  }


  /* =======================================================
     IMAGE URL
  ======================================================= */

  async function hydrateImages() {

    const images =
      document.querySelectorAll(
        "img[data-media-path]"
      );


    for (
      const image of images
    ) {

      const path =
        image.dataset.mediaPath;


      if (
        !path ||
        path.startsWith("http")
      ) {
        continue;
      }


      try {

        const {
          data,
          error
        } = await sb.storage
          .from("chat-media")
          .createSignedUrl(
            path,
            3600
          );


        if (
          !error &&
          data?.signedUrl
        ) {

          image.src =
            data.signedUrl;

        }

      } catch (e) {

        console.warn(
          "Image URL error",
          e
        );

      }

    }

  }


  /* =======================================================
     REACTIONS
  ======================================================= */

  async function loadAllReactions() {

    const ids =
      messages.map(
        m => String(m.id)
      );


    if (!ids.length)
      return;


    try {

      const {
        data,
        error
      } = await sb
        .from("message_reactions")
        .select(
          "message_id,reaction,user_id"
        )
        .in(
          "message_id",
          ids
        );


      if (error) {

        /*
          Reaction table may not exist yet.
          Chat still works without it.
        */

        console.warn(
          "Reactions unavailable:",
          error.message
        );

        return;

      }


      const grouped = {};


      (data || []).forEach(row => {

        const id =
          String(row.message_id);


        if (!grouped[id])
          grouped[id] = {};


        grouped[id][row.reaction] =
          (grouped[id][row.reaction] || 0) + 1;

      });


      Object.entries(grouped)
        .forEach(
          ([messageId, reactions]) => {

            const wrap =
              document.querySelector(
                `[data-reactions-for="${CSS.escape(
                  messageId
                )}"]`
              );


            if (!wrap)
              return;


            wrap.innerHTML =
              Object.entries(reactions)
                .map(
                  ([emoji, count]) => `
                    <span class="reaction">
                      ${escapeHTML(emoji)}
                      ${count}
                    </span>
                  `
                )
                .join("");

          }
        );

    } catch (e) {

      console.warn(
        "Reaction rendering skipped",
        e
      );

    }

  }


  async function addReaction(
    messageId,
    emoji
  ) {

    if (!currentUser)
      return;


    try {

      const {
        data: existing
      } = await sb
        .from("message_reactions")
        .select(
          "id,reaction"
        )
        .eq(
          "message_id",
          String(messageId)
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();


      if (
        existing &&
        existing.reaction === emoji
      ) {

        await sb
          .from("message_reactions")
          .delete()
          .eq(
            "id",
            existing.id
          );

      }

      else if (existing) {

        await sb
          .from("message_reactions")
          .update({
            reaction: emoji
          })
          .eq(
            "id",
            existing.id
          );

      }

      else {

        await sb
          .from("message_reactions")
          .insert({

            message_id:
              String(messageId),

            user_id:
              currentUser.id,

            reaction:
              emoji

          });

      }


      hideReactionMenu();

      closeActionSheet();

      await loadConversation();

    } catch (e) {

      console.warn(
        "Reaction failed:",
        e
      );

      showToast(
        "Reactions table is not configured"
      );

    }

  }


  /* =======================================================
     ACTION SHEET
  ======================================================= */

  function openActionSheet(message) {

    selectedMessage =
      message;


    $("actionDelete").style.display =
      message.sender_id ===
      currentUser.id
        ? "block"
        : "none";


    $("actionOverlay")
      .classList.add("show");

  }


  function closeActionSheet() {

    $("actionOverlay")
      .classList.remove("show");

    selectedMessage = null;

  }


  /* =======================================================
     REPLY
  ======================================================= */

  function startReply(message) {

    replyMessage =
      message;


    let text =
      message.message ||
      "Message";


    if (
      message.message_type ===
      "image"
    ) {

      text =
        "📷 Photo";

    }


    $("chatReplyContent")
      .textContent =
      text.length > 100
        ? text.slice(0, 100) + "..."
        : text;


    $("chatReplyBar")
      .classList.add("show");


    $("chatInput")
      .focus();


    closeActionSheet();

  }


  function cancelReply() {

    replyMessage = null;

    $("chatReplyBar")
      .classList.remove("show");

    $("chatReplyContent")
      .textContent = "";

  }


  /* =======================================================
     SEND TEXT
  ======================================================= */

  async function sendMessage() {

    if (
      !currentUser ||
      !targetUser
    ) {
      return;
    }


    const input =
      $("chatInput");


    const text =
      input.value.trim();


    if (!text)
      return;


    const button =
      $("sendMessageBtn");


    button.disabled = true;


    const payload = {

      sender_id:
        currentUser.id,

      receiver_id:
        targetUser.id,

      message:
        text,

      message_type:
        "text",

      reply_to:
        replyMessage
          ? String(replyMessage.id)
          : null

    };


    const {
      error
    } = await sb
      .from("messages")
      .insert(payload);


    button.disabled = false;


    if (error) {

      console.error(error);

      showToast(
        "Message send nahi hua"
      );

      return;

    }


    input.value = "";

    input.style.height =
      "auto";


    updateSendButton();

    cancelReply();

    await loadConversation();

    await loadInbox();

  }


  /* =======================================================
     SEND IMAGE
  ======================================================= */

  async function sendImage(file) {

    if (
      !file ||
      !currentUser ||
      !targetUser
    ) {
      return;
    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      showToast(
        "Only images are allowed"
      );

      return;

    }


    if (
      file.size >
      8 * 1024 * 1024
    ) {

      showToast(
        "Image must be under 8 MB"
      );

      return;

    }


    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const path =
      currentUser.id +
      "/" +
      crypto.randomUUID() +
      "-" +
      safeName;


    showToast(
      "Uploading photo..."
    );


    const {
      error: uploadError
    } = await sb.storage
      .from("chat-media")
      .upload(
        path,
        file,
        {
          contentType:
            file.type,

          upsert:
            false
        }
      );


    if (uploadError) {

      console.error(
        uploadError
      );

      showToast(
        "Photo upload failed"
      );

      return;

    }


    const {
      error
    } = await sb
      .from("messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          targetUser.id,

        message:
          "📷 Photo",

        message_type:
          "image",

        media_url:
          path,

        reply_to:
          replyMessage
            ? String(
                replyMessage.id
              )
            : null

      });


    if (error) {

      console.error(error);

      showToast(
        "Photo message failed"
      );

      return;

    }


    cancelReply();

    await loadConversation();

    await loadInbox();

  }


  /* =======================================================
     READ RECEIPTS
  ======================================================= */

  async function markMessagesRead() {

    if (
      !currentUser ||
      !targetUser
    ) {
      return;
    }


    const unread =
      messages.filter(m =>

        m.receiver_id ===
          currentUser.id &&

        m.sender_id ===
          targetUser.id &&

        !m.read

      );


    if (!unread.length)
      return;


    const ids =
      unread.map(
        m => m.id
      );


    const {
      error
    } = await sb
      .from("messages")
      .update({

        read:
          true,

        read_at:
          new Date()
            .toISOString()

      })
      .in(
        "id",
        ids
      )
      .eq(
        "receiver_id",
        currentUser.id
      );


    if (error) {

      console.warn(
        "Read update failed:",
        error
      );

      return;

    }


    unread.forEach(m => {

      m.read = true;

    });

  }


  /* =======================================================
     DELETE MESSAGE
  ======================================================= */

  async function deleteMessage() {

    const message =
      selectedMessage;


    if (!message)
      return;


    if (
      message.sender_id !==
      currentUser.id
    ) {

      return;

    }


    closeActionSheet();


    const okay =
      window.confirm(
        "Delete this message?"
      );


    if (!okay)
      return;


    const {
      error
    } = await sb
      .from("messages")
      .update({

        deleted_at:
          new Date()
            .toISOString()

      })
      .eq(
        "id",
        message.id
      )
      .eq(
        "sender_id",
        currentUser.id
      );


    if (error) {

      console.error(error);

      showToast(
        "Could not delete message"
      );

      return;

    }


    await loadConversation();

    await loadInbox();

  }


  /* =======================================================
     REALTIME
  ======================================================= */

  function subscribeConversation() {

    if (
      !currentUser ||
      !targetUser
    ) {
      return;
    }


    if (conversationChannel) {

      sb.removeChannel(
        conversationChannel
      );

    }


    const channelName =
      "poll-pulse-chat-" +
      currentUser.id +
      "-" +
      targetUser.id;


    conversationChannel =
      sb.channel(
        channelName
      );


    conversationChannel

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "messages"
        },
        payload => {

          const message =
            payload.new ||
            payload.old;


          if (!message)
            return;


          const relevant =
            (
              message.sender_id ===
                currentUser.id &&
              message.receiver_id ===
                targetUser.id
            ) ||
            (
              message.sender_id ===
                targetUser.id &&
              message.receiver_id ===
                currentUser.id
            );


          if (!relevant)
            return;


          loadConversation();

          loadInbox();

        }
      )


      .on(
        "broadcast",
        {
          event: "typing"
        },
        payload => {

          if (
            payload.payload?.user_id !==
            targetUser.id
          ) {
            return;
          }


          $("chatTyping").innerHTML = `
            ${escapeHTML(
              nameOf(targetUser)
            )}
            is typing
            <span class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </span>
          `;


          clearTimeout(
            typingTimeout
          );


          typingTimeout =
            setTimeout(() => {

              $("chatTyping")
                .textContent = "";

            }, 1800);

        }
      )


      .subscribe();

  }


  /* =======================================================
     TYPING
  ======================================================= */

  function sendTyping() {

    if (
      !conversationChannel ||
      !currentUser ||
      !targetUser
    ) {
      return;
    }


    conversationChannel.send({

      type:
        "broadcast",

      event:
        "typing",

      payload: {

        user_id:
          currentUser.id

      }

    });

  }


  /* =======================================================
     PRESENCE
  ======================================================= */

  async function updatePresence() {

    if (!currentUser)
      return;


    try {

      await sb
        .from("user_presence")
        .upsert({

          user_id:
            currentUser.id,

          is_online:
            true,

          last_seen:
            new Date()
              .toISOString()

        });

    } catch (e) {

      /*
        Presence is optional.
      */

      console.warn(
        "Presence unavailable"
      );

    }

  }


  async function updateOnlineStatus() {

    if (!targetUser)
      return;


    try {

      const {
        data
      } = await sb
        .from("user_presence")
        .select(
          "is_online,last_seen"
        )
        .eq(
          "user_id",
          targetUser.id
        )
        .maybeSingle();


      const dot =
        $("headerOnline");

      const status =
        $("headerStatus");


      if (data?.is_online) {

        dot.style.display =
          "block";

        status.textContent =
          "Active now";

      }

      else if (
        data?.last_seen
      ) {

        dot.style.display =
          "none";

        status.textContent =
          "Active " +
          formatTime(
            data.last_seen
          );

      }

      else {

        dot.style.display =
          "none";

        status.textContent =
          "Message";

      }

    } catch (e) {

      $("headerOnline")
        .style.display =
        "none";

      $("headerStatus")
        .textContent =
        "Message";

    }

  }


  /* =======================================================
     COMPOSER
  ======================================================= */

  function updateSendButton() {

    const hasText =
      $("chatInput")
        .value
        .trim()
        .length > 0;


    $("sendMessageBtn")
      .disabled =
      !hasText;

  }


  /* =======================================================
     EVENTS
  ======================================================= */

  $("backBtn")
    .addEventListener(
      "click",
      closeChat
    );


  $("cancelReply")
    .addEventListener(
      "click",
      cancelReply
    );


  $("sendMessageBtn")
    .addEventListener(
      "click",
      sendMessage
    );


  $("chatInput")
    .addEventListener(
      "input",
      () => {

        const input =
          $("chatInput");


        input.style.height =
          "auto";


        input.style.height =
          Math.min(
            input.scrollHeight,
            120
          ) + "px";


        updateSendButton();

        sendTyping();

      }
    );


  $("chatInput")
    .addEventListener(
      "keydown",
      e => {

        if (
          e.key === "Enter" &&
          !e.shiftKey
        ) {

          e.preventDefault();

          sendMessage();

        }

      }
    );


  $("chatImageInput")
    .addEventListener(
      "change",
      async e => {

        const file =
          e.target.files?.[0];


        if (file) {

          await sendImage(
            file
          );

        }


        e.target.value = "";

      }
    );


  $("chatSearch")
    .addEventListener(
      "input",
      e => {

        searchValue =
          e.target.value.trim();

        loadInbox();

      }
    );


  /* Reaction buttons */

  document
    .querySelectorAll(
      ".reaction-choice"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          if (!selectedMessage)
            return;


          await addReaction(
            selectedMessage.id,
            button.dataset.reaction
          );

        }
      );

    });


  /* Action sheet */

  $("actionReply")
    .addEventListener(
      "click",
      () => {

        if (
          selectedMessage
        ) {

          startReply(
            selectedMessage
          );

        }

      }
    );


  $("actionReact")
    .addEventListener(
      "click",
      () => {

        if (
          selectedMessage
        ) {

          closeActionSheet();

          showReactionMenu();

        }

      }
    );


  $("actionDelete")
    .addEventListener(
      "click",
      deleteMessage
    );


  $("actionCancel")
    .addEventListener(
      "click",
      closeActionSheet
    );


  $("actionOverlay")
    .addEventListener(
      "click",
      e => {

        if (
          e.target ===
          $("actionOverlay")
        ) {

          closeActionSheet();

        }

      }
    );


  /* =======================================================
     REACTION MENU
  ======================================================= */

  function showReactionMenu() {

    const menu =
      $("reactionMenu");


    menu.classList.add(
      "show"
    );


    const width =
      menu.offsetWidth || 230;


    menu.style.left =
      Math.max(
        8,
        (window.innerWidth -
          width) / 2
      ) + "px";


    menu.style.top =
      "90px";

  }


  function hideReactionMenu() {

    $("reactionMenu")
      .classList.remove(
        "show"
      );

  }


  document.addEventListener(
    "click",
    e => {

      if (
        !e.target.closest(
          "#reactionMenu"
        ) &&
        !e.target.closest(
          ".bubble"
        )
      ) {

        hideReactionMenu();

      }

    }
  );


  /* =======================================================
     PUBLIC API
  ======================================================= */

  window.openChat =
    openChat;

  window.closeChat =
    closeChat;

  window.loadChatInbox =
    loadInbox;


  /* =======================================================
     INITIALIZE
  ======================================================= */

  async function init() {

    currentUser =
      await getUser();


    if (!currentUser) {

      $("chatUsers").innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            🔐
          </div>

          <div class="empty-title">
            Login required
          </div>

          <div class="empty-text">
            Please login to use Poll Pulse messages.
          </div>

        </div>
      `;

      $("welcomePanel")
        .innerHTML = `
          <div class="welcome-inner">

            <div class="welcome-logo">
              P
            </div>

            <h1>
              Welcome to Poll Pulse
            </h1>

            <p>
              Login to start using messages.
            </p>

          </div>
        `;

      return;

    }


    await updatePresence();

    await loadInbox();


    presenceInterval =
      setInterval(
        updatePresence,
        30000
      );


    setInterval(
      () => {

        if (
          !targetUser
        ) {

          loadInbox();

        }

        else {

          updateOnlineStatus();

        }

      },
      15000
    );

  }


  init();


  /* =======================================================
     CLEANUP
  ======================================================= */

  window.addEventListener(
    "beforeunload",
    () => {

      if (
        conversationChannel
      ) {

        sb.removeChannel(
          conversationChannel
        );

      }

    }
  );


})();
</script>

</body>
</html>

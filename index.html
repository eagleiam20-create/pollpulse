<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Poll Pulse</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authScreen{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
}

.authBox{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:28px;
  padding:28px;
  box-shadow:0 20px 60px rgba(15,23,42,.12);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:8px;
  background:linear-gradient(90deg,#6366f1,#8b5cf6);
  -webkit-background-clip:text;
  color:transparent;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:24px;
}

.authTabs{
  display:flex;
  background:#f1f5f9;
  border-radius:14px;
  padding:4px;
  margin-bottom:18px;
}

.authTabs button{
  flex:1;
  border:0;
  padding:11px;
  border-radius:11px;
  background:transparent;
  font-weight:700;
}

.authTabs button.active{
  background:white;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field textarea,
.searchInput{
  width:100%;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:13px 14px;
  outline:none;
  background:#f8fafc;
}

.field input:focus,
.field textarea:focus,
.searchInput:focus{
  border-color:#6366f1;
  background:white;
}

.primary{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
}

.secondary{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  background:#eef2ff;
  color:#4f46e5;
  font-weight:700;
}

.smallLink{
  margin-top:14px;
  text-align:center;
  color:#6366f1;
  font-size:14px;
  cursor:pointer;
}

/* APP */

#app{
  min-height:100vh;
  min-height:100dvh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  height:64px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.brand{
  font-size:21px;
  font-weight:900;
  color:#4f46e5;
}

.topActions{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#f1f5f9;
  font-size:18px;
}

#main{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:16px 14px 100px;
}

.pageTitle{
  font-size:26px;
  font-weight:900;
  margin:8px 0 16px;
}

.card{
  background:white;
  border:1px solid #e8edf4;
  border-radius:22px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:0 5px 20px rgba(15,23,42,.045);
}

.hero{
  padding:22px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  border:0;
}

.hero h2{
  margin:0 0 7px;
  font-size:25px;
}

.hero p{
  margin:0;
  opacity:.9;
}

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 2px 10px;
}

.sectionTitle h3{
  margin:0;
  font-size:17px;
}

/* USER */

.userRow{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  background:#e0e7ff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#4f46e5;
  font-weight:900;
  flex:none;
}

.avatar.big{
  width:82px;
  height:82px;
  font-size:27px;
}

.userInfo{
  min-width:0;
  flex:1;
}

.userName{
  font-weight:800;
}

.muted{
  color:#64748b;
  font-size:13px;
}

.followBtn{
  border:0;
  border-radius:12px;
  padding:9px 13px;
  background:#4f46e5;
  color:white;
  font-weight:800;
}

.followBtn.following{
  background:#eef2ff;
  color:#4f46e5;
}

/* POLL */

.pollQuestion{
  font-size:18px;
  font-weight:800;
  margin:15px 0;
}

.pollOption{
  width:100%;
  text-align:left;
  border:1px solid #e2e8f0;
  background:#f8fafc;
  border-radius:13px;
  padding:12px;
  margin-top:8px;
  position:relative;
  overflow:hidden;
}

.pollOption:hover{
  border-color:#818cf8;
}

.pollBar{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  background:#e0e7ff;
  opacity:.7;
}

.pollText{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.pollMeta{
  display:flex;
  justify-content:space-between;
  margin-top:13px;
  font-size:12px;
  color:#64748b;
}

/* SEARCH */

.searchBox{
  position:sticky;
  top:70px;
  z-index:5;
  margin-bottom:14px;
}

/* CHAT */

.chatList{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.chatItem{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 8px;
  border-radius:15px;
  cursor:pointer;
}

.chatItem:hover{
  background:#f8fafc;
}

.chatPreview{
  flex:1;
  min-width:0;
}

.chatPreview .last{
  color:#64748b;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chatTime{
  color:#94a3b8;
  font-size:11px;
}

.chatHeader{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.backBtn{
  border:0;
  background:#f1f5f9;
  border-radius:10px;
  padding:8px 12px;
}

.messages{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:58vh;
  overflow-y:auto;
  padding:5px 2px;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:17px;
  line-height:1.35;
}

.message.mine{
  align-self:flex-end;
  color:white;
  background:#4f46e5;
  border-bottom-right-radius:5px;
}

.message.theirs{
  align-self:flex-start;
  background:#eef2f7;
  border-bottom-left-radius:5px;
}

.messageTime{
  font-size:9px;
  opacity:.65;
  margin-top:4px;
}

.chatComposer{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.chatComposer input{
  flex:1;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:12px;
  outline:none;
}

.sendBtn{
  border:0;
  border-radius:14px;
  width:50px;
  background:#4f46e5;
  color:white;
}

/* PROFILE */

.profileTop{
  text-align:center;
  padding:25px 10px;
}

.profileName{
  font-size:22px;
  font-weight:900;
  margin-top:10px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-top:18px;
}

.stat strong{
  display:block;
  font-size:19px;
}

.stat span{
  font-size:12px;
  color:#64748b;
}

.profileActions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.profileActions button{
  flex:1;
}

/* BOTTOM NAV */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  height:70px;
  padding:7px 10px max(7px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(16px);
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:center;
}

.navInner{
  width:100%;
  max-width:600px;
  display:flex;
  justify-content:space-around;
}

.navBtn{
  flex:1;
  border:0;
  background:transparent;
  color:#64748b;
  font-size:11px;
  font-weight:700;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.navBtn span:first-child{
  font-size:21px;
}

.navBtn.active{
  color:#4f46e5;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  z-index:100;
  max-width:90%;
  padding:12px 17px;
  border-radius:14px;
  color:white;
  background:#111827;
  display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.loading{
  padding:30px;
  text-align:center;
  color:#64748b;
}

/* MOBILE */

@media(max-width:480px){
  .authBox{
    padding:22px;
    border-radius:22px;
  }

  #main{
    padding-left:11px;
    padding-right:11px;
  }

  .card{
    border-radius:19px;
  }
}
</style>
</head>

<body>

<!-- AUTH -->
<section id="authScreen">

  <div class="authBox">

    <div class="logo">Poll Pulse</div>
    <div class="subtitle">Ask. Vote. Connect.</div>

    <div class="authTabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="signupTab" type="button">Sign up</button>
    </div>

    <div id="loginForm">

      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password">
      </div>

      <button id="loginBtn" class="primary" type="button">
        Login
      </button>

      <div class="smallLink" id="forgotBtn">
        Forgot password?
      </div>

    </div>

    <div id="signupForm" class="hidden">

      <div class="field">
        <label>Username</label>
        <input id="signupUsername" type="text" autocomplete="username">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="signupEmail" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="signupPassword" type="password" autocomplete="new-password">
      </div>

      <button id="signupBtn" class="primary" type="button">
        Create account
      </button>

    </div>

  </div>
</section>


<!-- APP -->
<section id="app" class="hidden">

  <header class="topbar">

    <div class="brand">Poll Pulse</div>

    <div class="topActions">

      <button class="iconBtn" id="refreshBtn" type="button">
        ↻
      </button>

      <button class="iconBtn" id="notifBtn" type="button">
        🔔
      </button>

    </div>

  </header>

  <main id="main"></main>

  <nav class="bottomNav">

    <div class="navInner">

      <button class="navBtn active" data-page="home" type="button">
        <span>⌂</span>
        <span>Home</span>
      </button>

      <button class="navBtn" data-page="search" type="button">
        <span>⌕</span>
        <span>Search</span>
      </button>

      <button class="navBtn" data-page="create" type="button">
        <span>＋</span>
        <span>Create</span>
      </button>

      <button class="navBtn" data-page="chat" type="button">
        <span>💬</span>
        <span>Chat</span>
      </button>

      <button class="navBtn" data-page="profile" type="button">
        <span>👤</span>
        <span>Profile</span>
      </button>

    </div>

  </nav>

</section>

<div id="toast"></div>

<script>
"use strict";

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://dbpbkvfaxgifjeveijqf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

let supabaseClient = null;
let currentUser = null;
let currentProfile = null;
let currentChatUser = null;
let realtimeChannel = null;

function initSupabase(){

  if(supabaseClient) return Promise.resolve(supabaseClient);

  if(!window.supabase){
    return Promise.reject(
      new Error("Supabase library load nahi hui.")
    );
  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );

  return Promise.resolve(supabaseClient);
}


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function toast(message){

  const box = $("toast");

  box.textContent = message;
  box.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      box.style.display = "none";
    },3000);
}

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){

  return String(name || "U")
    .trim()
    .slice(0,1)
    .toUpperCase();
}

function avatarHTML(profile, big=false){

  const cls = big ? "avatar big" : "avatar";

  if(profile?.avatar_url){

    return `
      <img class="${cls}"
           src="${escapeHTML(profile.avatar_url)}"
           onerror="this.outerHTML='<div class=&quot;${cls}&quot;>${initials(profile.username)}</div>'">
    `;

  }

  return `
    <div class="${cls}">
      ${initials(profile?.username || profile?.full_name)}
    </div>
  `;
}

function formatDate(date){

  if(!date) return "";

  const d = new Date(date);

  return d.toLocaleString([],{
    day:"numeric",
    month:"short",
    hour:"numeric",
    minute:"2-digit"
  });
}


/* =========================
   AUTH UI
========================= */

function showLogin(){

  $("loginForm").classList.remove("hidden");
  $("signupForm").classList.add("hidden");

  $("loginTab").classList.add("active");
  $("signupTab").classList.remove("active");
}

function showSignup(){

  $("loginForm").classList.add("hidden");
  $("signupForm").classList.remove("hidden");

  $("loginTab").classList.remove("active");
  $("signupTab").classList.add("active");
}


/* =========================
   LOGIN
========================= */

async function loginUser(){

  try{

    await initSupabase();

    const email =
      $("loginEmail").value.trim();

    const password =
      $("loginPassword").value;

    if(!email || !password){

      toast("Email aur password bhar bhai.");
      return;
    }

    $("loginBtn").disabled = true;
    $("loginBtn").textContent = "Logging in...";

    const {data,error} =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if(error) throw error;

    if(!data.user){

      toast("Login nahi hua.");
      return;
    }

    currentUser = data.user;

    await openApp();

  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Login mein problem aa gayi."
    );

  }finally{

    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "Login";
  }
}


/* =========================
   SIGNUP
========================= */

async function signupUser(){

  try{

    await initSupabase();

    const username =
      $("signupUsername").value.trim();

    const email =
      $("signupEmail").value.trim();

    const password =
      $("signupPassword").value;

    if(!username || !email || !password){

      toast("Saari details bhar bhai.");
      return;
    }

    if(password.length < 6){

      toast("Password kam se kam 6 characters ka rakho.");
      return;
    }

    $("signupBtn").disabled = true;
    $("signupBtn").textContent = "Creating...";

    const {data,error} =
      await supabaseClient.auth.signUp({

        email,
        password,

        options:{
          data:{
            username
          }
        }

      });

    if(error) throw error;

    if(data.session){

      currentUser = data.user;

      await ensureProfile();

      await openApp();

    }else{

      toast(
        "Account ban gaya. Agar email confirmation ON hai to email verify karo."
      );

      showLogin();

    }

  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Signup failed."
    );

  }finally{

    $("signupBtn").disabled = false;
    $("signupBtn").textContent = "Create account";
  }
}


/* =========================
   PROFILE
========================= */

async function ensureProfile(){

  if(!currentUser) return null;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){

    console.error("Profile:",error);

    return null;
  }

  if(data){

    currentProfile = data;

    return data;
  }

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "user";

  const newProfile = {

    id:currentUser.id,
    username,
    full_name:username

  };

  const result =
    await supabaseClient
      .from("profiles")
      .insert(newProfile)
      .select()
      .single();

  if(result.error){

    console.error(result.error);
    return null;
  }

  currentProfile = result.data;

  return result.data;
}


/* =========================
   OPEN APP
========================= */

async function openApp(){

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  await ensureProfile();

  await loadHome();

  updateNotificationCount();
}


/* =========================
   NAVIGATION
========================= */

async function navigate(page){

  document
    .querySelectorAll(".navBtn")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );
    });

  try{

    if(page === "home")
      await loadHome();

    if(page === "search")
      loadSearch();

    if(page === "create")
      loadCreate();

    if(page === "chat")
      await loadChat();

    if(page === "profile")
      await loadProfile();

  }catch(error){

    console.error(error);
    toast("Page load nahi ho paya.");

  }
}


/* =========================
   HOME
========================= */

async function loadHome(){

  $("main").innerHTML = `
    <div class="loading">Loading...</div>
  `;

  let suggestions = [];
  let polls = [];

  const profilesResult =
    await supabaseClient
      .from("profiles")
      .select("*")
      .neq("id",currentUser.id)
      .limit(12);

  if(!profilesResult.error){

    suggestions =
      profilesResult.data || [];
  }

  const pollsResult =
    await supabaseClient
      .from("polls")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(30);

  if(!pollsResult.error){

    polls =
      pollsResult.data || [];
  }

  $("main").innerHTML = `

    <div class="card hero">
      <h2>What's on your mind?</h2>
      <p>Create a poll, vote and see what people think.</p>
    </div>

    <div class="sectionTitle">
      <h3>People you may know</h3>
    </div>

    <div id="suggestions"></div>

    <div class="sectionTitle">
      <h3>Latest polls</h3>
    </div>

    <div id="polls"></div>
  `;

  renderSuggestions(suggestions);

  renderPolls(polls);
}


/* =========================
   SUGGESTIONS
========================= */

function renderSuggestions(users){

  const box = $("suggestions");

  if(!users.length){

    box.innerHTML = `
      <div class="card">
        <div class="muted">
          Abhi koi suggestions nahi hain.
        </div>
      </div>
    `;

    return;
  }

  box.innerHTML = `
    <div class="card">

      ${users.map(user=>`

        <div class="userRow" style="margin-bottom:13px">

          ${avatarHTML(user)}

          <div class="userInfo">

            <div class="userName">
              ${escapeHTML(
                user.username ||
                user.full_name ||
                "User"
              )}
            </div>

            <div class="muted">
              ${escapeHTML(user.full_name || "")}
            </div>

          </div>

          <button
            type="button"
            class="followBtn"
            data-follow-id="${user.id}">
            Follow
          </button>

        </div>

      `).join("")}

    </div>
  `;

  updateFollowButtons();
}


/* =========================
   FOLLOW
========================= */

async function updateFollowButtons(){

  const buttons =
    document.querySelectorAll(
      "[data-follow-id]"
    );

  for(const button of buttons){

    const id =
      button.dataset.followId;

    const {data} =
      await supabaseClient
        .from("follows")
        .select("id")
        .eq("follower_id",currentUser.id)
        .eq("following_id",id)
        .maybeSingle();

    if(data){

      button.textContent = "Following";
      button.classList.add("following");

async function toggleFollow(userId,button){

  try{

    const {data,error} =
      await supabaseClient
        .from("follows")
        .select("id")
        .eq("follower_id",currentUser.id)
        .eq("following_id",userId)
        .maybeSingle();

    if(error) throw error;

    if(data){

      const result =
        await supabaseClient
          .from("follows")
          .delete()
          .eq("id",data.id);

      if(result.error) throw result.error;

      button.textContent = "Follow";
      button.classList.remove("following");

      toast("Unfollowed");

    }else{

      const result =
        await supabaseClient
          .from("follows")
          .insert({
            follower_id:currentUser.id,
            following_id:userId
          });

      if(result.error) throw result.error;

      button.textContent = "Following";
      button.classList.add("following");

      toast("Followed");

      /* notification */
      await supabaseClient
        .from("notifications")
        .insert({
          user_id:userId,
          message:
            `${currentProfile?.username || "Someone"} started following you`,
          read:false
        })
        .then(()=>{})
        .catch(()=>{});
    }

  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Follow update failed."
    );
  }
}

/* =========================
   VOTE
========================= */

async function votePoll(
  pollId,
  optionIndex,
  button
){

  try{

    const existing =
      await supabaseClient
        .from("poll_votes")
        .select("id")
        .eq("poll_id",pollId)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    if(existing.error) throw existing.error;

    if(existing.data){

      const result =
        await supabaseClient
          .from("poll_votes")
          .update({
            option_index:optionIndex
          })
          .eq("id",existing.data.id);

      if(result.error) throw result.error;

      toast("Vote updated");

    }else{

      const result =
        await supabaseClient
          .from("poll_votes")
          .insert({
            poll_id:pollId,
            user_id:currentUser.id,
            option_index:optionIndex
          });

      if(result.error) throw result.error;

      toast("Vote recorded");
    }

    /* show basic results */
    await showPollResults(pollId);

  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Vote nahi ho paya."
    );
  }
}

async function showPollResults(pollId){

  const pollResult =
    await supabaseClient
      .from("polls")
      .select("*")
      .eq("id",pollId)
      .single();

  if(pollResult.error) return;

  let options = pollResult.data.options;

  if(typeof options === "string"){

    try{
      options = JSON.parse(options);
    }catch{
      options =
        options.split(",").map(x=>x.trim());
    }
  }

  if(!Array.isArray(options)) return;

  const votesResult =
    await supabaseClient
      .from("poll_votes")
      .select("option_index")
      .eq("poll_id",pollId);

  if(votesResult.error) return;

  const votes =
    votesResult.data || [];

  const total = votes.length;

  const counts =
    options.map((_,index)=>
      votes.filter(
        v=>Number(v.option_index) === index
      ).length
    );

  document
    .querySelectorAll(
      `[data-poll-id="${pollId}"]`
    )
    .forEach((button,index)=>{

      const count = counts[index] || 0;

      const percent =
        total
        ? Math.round(count * 100 / total)
        : 0;

      const bar =
        button.querySelector(".pollBar");

      const text =
        button.querySelector(".pollText span:last-child");

      if(bar)
        bar.style.width =
          percent + "%";

      if(text)
        text.textContent =
          percent + "%";
    });
}

async function loadChat(){

  $("main").innerHTML = `
    <div class="pageTitle">Messages</div>
    <div class="card">
      <div class="loading">
        Loading chats...
      </div>
    </div>
  `;

  const result =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order("created_at",{ascending:false});

  if(result.error){

    console.error(result.error);

    $("main").innerHTML = `
      <div class="card">
        Chat load nahi hua.
      </div>
    `;

    return;
  }

  const messages =
    result.data || [];

  const map = new Map();

  for(const message of messages){

    const other =
      message.sender_id === currentUser.id
      ? message.receiver_id
      : message.sender_id;

    if(!map.has(other)){
      map.set(other,message);
    }
  }

  const ids =
    [...map.keys()];

  let profiles = [];

  if(ids.length){

    const profileResult =
      await supabaseClient
        .from("profiles")
        .select("*")
        .in("id",ids);

    profiles =
      profileResult.data || [];
  }

  const profileMap =
    new Map(
      profiles.map(p=>[p.id,p])
    );

  $("main").innerHTML = `

    <div class="pageTitle">
      Messages
    </div>

    <div class="card">

      ${
        ids.length
        ? ids.map(id=>{

            const message =
              map.get(id);

            const profile =
              profileMap.get(id) || {
                id,
                username:"User"
              };

            return `

              <div
                class="chatItem"
                data-chat-id="${id}">

                ${avatarHTML(profile)}

                <div class="chatPreview">

                  <div class="userName">
                    ${escapeHTML(
                      profile.username ||
                      profile.full_name ||
                      "User"
                    )}
                  </div>

                  <div class="last">
                    ${escapeHTML(message.content)}
                  </div>

                </div>

                <div class="chatTime">
                  ${formatDate(message.created_at)}
                </div>

              </div>
            `;

          }).join("")
        : `
          <div class="muted">
            Abhi koi chat nahi hai.<br>
            Search se kisi user ko choose karke chat start karo.
          </div>
        `
      }

    </div>
  `;

  document
    .querySelectorAll("[data-chat-id]")
    .forEach(item=>{

      item.onclick = async()=>{

        const profile =
          profileMap.get(
            item.dataset.chatId
          );

        if(profile){

          currentChatUser = profile;

          await loadChatWindow();
        }
      };
    });
}

========================= */

async function sendMessage(){

  const input =
    $("messageInput");

  if(!input || !currentChatUser)
    return;

  const content =
    input.value.trim();

  if(!content)
    return;

  input.disabled = true;

  try{

    const result =
      await supabaseClient
        .from("messages")
        .insert({
          sender_id:currentUser.id,
          receiver_id:currentChatUser.id,
          content
        });

    if(result.error)
      throw result.error;

    input.value = "";

    await loadMessages();

    await supabaseClient
      .from("notifications")
      .insert({
        user_id:currentChatUser.id,
        message:
          `${currentProfile?.username || "Someone"} sent you a message`,
        read:false
      })
      .then(()=>{})
      .catch(()=>{});

  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Message send nahi hua."
    );

  }finally{

    input.disabled = false;
    input.focus();
  }
}


/* =========================
   REALTIME CHAT
========================= */

function subscribeChat(){

  if(!currentChatUser)
    return;

  if(realtimeChannel){

    try{
      supabaseClient
        .removeChannel(realtimeChannel);
    }catch{}
  }

  realtimeChannel =
    supabaseClient
      .channel(
        "chat-" +
        currentUser.id +
        "-" +
        currentChatUser.id +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        payload=>{

          const m =
            payload.new;

          const relevant =
            (
              m.sender_id === currentUser.id &&
              m.receiver_id === currentChatUser.id
            ) ||
            (
              m.sender_id === currentChatUser.id &&
              m.receiver_id === currentUser.id
            );

          if(relevant)
            loadMessages();

        }
      )
      .subscribe();
}

/* =========================
   PHOTO UPLOAD
========================= */

async function uploadProfilePhoto(){

  const file =
    $("photoInput").files?.[0];

  if(!file)
    return;

  try{

    toast("Photo upload ho rahi hai...");

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    const path =
      `${currentUser.id}/${Date.now()}.${extension}`;

    const upload =
      await supabaseClient
        .storage
        .from("avatars")
        .upload(
          path,
          file,
          {
            upsert:true,
            contentType:file.type
          }
        );

    if(upload.error)
      throw upload.error;

    const publicUrl =
      supabaseClient
        .storage
        .from("avatars")
        .getPublicUrl(path)
        .data
        .publicUrl;

    const update =
      await supabaseClient
        .from("profiles")
        .update({
          avatar_url:publicUrl
        })
        .eq("id",currentUser.id);

    if(update.error)
      throw update.error;

    currentProfile.avatar_url =
      publicUrl;

    toast("Profile photo updated!");

    await loadProfile();

  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Photo upload failed. Supabase Storage check karo."
    );
  }
}

      $("loginTab").onclick =
        showLogin;

      $("signupTab").onclick =
        showSignup;

      $("loginBtn").onclick =
        loginUser;

      $("signupBtn").onclick =
        signupUser;

      $("forgotBtn").onclick =
        async()=>{

          const email =
            $("loginEmail").value.trim();

          if(!email){

            toast("Pehle email enter karo.");
            return;
          }

          try{

            const result =
              await supabaseClient.auth
                .resetPasswordForEmail(
                  email,
                  {
                    redirectTo:
                      window.location.origin +
                      window.location.pathname
                  }
                );

            if(result.error)
              throw result.error;

            toast(
              "Password reset email bhej di."
            );

          }catch(error){

            console.error(error);

            toast(
              error?.message ||
              "Reset failed."
            );
          }
        };

      document
        .querySelectorAll(".navBtn")
        .forEach(button=>{

          button.onclick =
            ()=>navigate(
              button.dataset.page
            );

        });

      $("refreshBtn").onclick =
        ()=>{

          const active =
            document
              .querySelector(".navBtn.active")
              ?.dataset.page ||
            "home";

          navigate(active);
        };

      $("notifBtn").onclick =
        showNotifications;

      const session =
        await supabaseClient.auth.getSession();

      if(session.data.session){

        currentUser =
          session.data.session.user;

        await openApp();
      }

    }catch(error){

      console.error(
        "START ERROR:",
        error
      );

      toast(
        "App start nahi ho paya. Internet check karo."
      );
    }
  }
);


/* =========================
   GLOBAL ERROR LOG
========================= */

window.addEventListener(
  "error",
  event=>{
    console.error(
      "Global JS Error:",
      event.error || event.message
    );
  }
);

window.addEventListener(
  "unhandledrejection",
  event=>{
    console.error(
      "Promise Error:",
      event.reason
    );
  }
);


/* expose */
window.loginUser = loginUser;
window.signupUser = signupUser;
window.logoutUser = logoutUser;
window.createPoll = createPoll;
window.searchAll = searchAll;
window.sendMessage = sendMessage;

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PollPulse</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 9px;
      font-size: 15px;
    }

    input,
    textarea {
      border: 1px solid #d1d5db;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: 600;
    }

    button.secondary {
      background: #64748b;
    }

    button.danger {
      background: #dc2626;
    }

    .hidden {
      display: none !important;
    }

    .status {
      padding: 12px;
      border-radius: 9px;
      background: #eef2ff;
      margin-bottom: 15px;
    }

    .option {
      display: block;
      padding: 13px;
      margin-top: 9px;
      border: 1px solid #dbe1ea;
      border-radius: 9px;
      cursor: pointer;
      background: #fafafa;
    }

    .option:hover {
      background: #f1f5f9;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #e2e8f0;
    }

    .small {
      color: #64748b;
      font-size: 14px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row button {
      flex: 1;
    }

    @media (max-width: 600px) {
      main {
        margin-top: 18px;
      }

      .row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">PollPulse</div>
    <button
      id="logoutBtn"
      class="secondary hidden"
      style="width:auto;margin:0;padding:8px 14px;"
      onclick="logout()">
      Logout
    </button>
  </div>
</header>

<main>

  <!-- STATUS -->
  <div id="status" class="status">
    Starting PollPulse...
  </div>

  <!-- AUTH -->
  <section id="authSection" class="card">

    <h2 id="authTitle">Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Email">

    <input
      id="password"
      type="password"
      placeholder="Password">

    <button onclick="handleAuth()">
      <span id="authButtonText">Login</span>
    </button>

    <button
      class="secondary"
      onclick="toggleAuthMode()">
      <span id="authSwitchText">
        Create an account
      </span>
    </button>

  </section>

  <!-- APP -->
  <section id="appSection" class="hidden">

    <!-- PROFILE -->
    <div class="card">
      <h2>My Profile</h2>

      <div id="profileBox">
        Loading profile...
      </div>

      <input
        id="avatarInput"
        type="file"
        accept="image/png,image/jpeg,image/webp">

      <button onclick="uploadMyAvatar()">
        Upload Avatar
      </button>
    </div>

    <!-- CREATE POLL -->
    <div class="card">
      <h2>Create Poll</h2>

      <textarea
        id="pollQuestion"
        placeholder="Ask your question..."></textarea>

      <input
        id="option1"
        placeholder="Option 1">

      <input
        id="option2"
        placeholder="Option 2">

      <input
        id="option3"
        placeholder="Option 3 (optional)">

      <input
        id="option4"
        placeholder="Option 4 (optional)">

      <button onclick="createMyPoll()">
        Create Poll
      </button>
    </div>

    <!-- POLLS -->
    <div class="card">
      <h2>Polls</h2>

      <div id="polls">
        Loading polls...
      </div>
    </div>

  </section>

</main>

<script>
  const SUPABASE_URL =
    "https://dbpbkvfaxgifjeveijqf.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

  let supabaseClient = null;
  let currentUser = null;
  let loginMode = true;

  const statusBox =
    document.getElementById("status");

  function setStatus(message) {
    statusBox.textContent = message;
  }

  function initSupabase() {
    if (!window.supabase) {
      setStatus("Supabase library failed to load.");
      return false;
    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    return true;
  }

  function toggleAuthMode() {
    loginMode = !loginMode;

    document.getElementById("authTitle").textContent =
      loginMode ? "Login" : "Create Account";

    document.getElementById("authButtonText").textContent =
      loginMode ? "Login" : "Sign Up";

    document.getElementById("authSwitchText").textContent =
      loginMode
        ? "Create an account"
        : "Back to login";
  }

  async function handleAuth() {
    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      setStatus("Enter email and password.");
      return;
    }

    setStatus(
      loginMode
        ? "Logging in..."
        : "Creating account..."
    );

    let result;

    if (loginMode) {
      result =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });
    } else {
      result =
        await supabaseClient.auth.signUp({
          email,
          password
        });
    }

    if (result.error) {
      setStatus(result.error.message);
      return;
    }

    currentUser = result.data.user;

    if (!currentUser) {
      setStatus(
        "Account created. Check your email if confirmation is required."
      );
      return;
    }

    await showApp();
  }

  async function checkSession() {
    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      setStatus(error.message);
      return;
    }

    currentUser =
      data.session
        ? data.session.user
        : null;

    if (currentUser) {
      await showApp();
    } else {
      setStatus("Welcome to PollPulse.");
    }
  }

  async function showApp() {
    document
      .getElementById("authSection")
      .classList.add("hidden");

    document
      .getElementById("appSection")
      .classList.remove("hidden");

    document
      .getElementById("logoutBtn")
      .classList.remove("hidden");

    setStatus("PollPulse is ready.");

    await loadProfile();
    await loadPolls();
  }

  async function logout() {
    const { error } =
      await supabaseClient.auth.signOut();

    if (error) {
      setStatus(error.message);
      return;
    }

    currentUser = null;

    location.reload();
  }

  async function loadProfile() {
    if (!currentUser) return;

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (error) {
      document.getElementById("profileBox").textContent =
        "Profile error: " + error.message;
      return;
    }

    if (!data) {
      document.getElementById("profileBox").innerHTML =
        "<p>No profile found yet.</p>";
      return;
    }

    const avatar =
      data.avatar_url
        ? `<img class="avatar" src="${escapeHtml(data.avatar_url)}">`
        : `<div class="avatar"></div>`;

    const name =
      data.username ||
      data.full_name ||
      currentUser.email;

    document.getElementById("profileBox").innerHTML = `
      <div class="user-info">
        ${avatar}
        <div>
          <strong>${escapeHtml(name)}</strong>
          <div class="small">${escapeHtml(currentUser.email)}</div>
        </div>
      </div>
    `;
  }

  async function uploadMyAvatar() {
    const file =
      document.getElementById("avatarInput").files[0];

    if (!file || !currentUser) {
      setStatus("Select an image first.");
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      setStatus("Image must be under 5 MB.");
      return;
    }

    const extension =
      file.name.split(".").pop().toLowerCase();

    const path =
      currentUser.id +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;

    setStatus("Uploading avatar...");

    const { error: uploadError } =
      await supabaseClient.storage
        .from("avatars")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false
        });

    if (uploadError) {
      setStatus(uploadError.message);
      return;
    }

    const { data } =
      supabaseClient.storage
        .from("avatars")
        .getPublicUrl(path);

    const { error: updateError } =
      await supabaseClient
        .from("profiles")
        .update({
          avatar_url: data.publicUrl
        })
        .eq("id", currentUser.id);

    if (updateError) {
      setStatus(updateError.message);
      return;
    }

    setStatus("Avatar updated.");
    await loadProfile();
  }

  async function createMyPoll() {
    if (!currentUser) return;

    const question =
      document.getElementById("pollQuestion")
        .value.trim();

    const options = [
      document.getElementById("option1").value.trim(),
      document.getElementById("option2").value.trim(),
      document.getElementById("option3").value.trim(),
      document.getElementById("option4").value.trim()
    ].filter(Boolean);

    if (!question || options.length < 2) {
      setStatus(
        "Poll needs a question and at least 2 options."
      );
      return;
    }

    const { error } =
      await supabaseClient
        .from("polls")
        .insert({
          user_id: currentUser.id,
          question,
          options
        });

    if (error) {
      setStatus(error.message);
      return;
    }

    document.getElementById("pollQuestion").value = "";
    document.getElementById("option1").value = "";
    document.getElementById("option2").value = "";
    document.getElementById("option3").value = "";
    document.getElementById("option4").value = "";

    setStatus("Poll created.");
    await loadPolls();
  }

  async function loadPolls() {
    const box =
      document.getElementById("polls");

    const { data, error } =
      await supabaseClient
        .from("polls")
        .select("*")
        .order("created_at", {
          ascending: false
        })
        .limit(20);

    if (error) {
      box.textContent =
        "Poll error: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      box.textContent = "No polls yet.";
      return;
    }

    box.innerHTML = data.map(poll => {
      const options =
        Array.isArray(poll.options)
          ? poll.options
          : [];

      return `
        <div class="card">
          <h3>${escapeHtml(poll.question)}</h3>
          ${options.map((option, index) => `
            <button
              class="option"
              onclick="vote('${poll.id}', ${index})">
              ${escapeHtml(String(option))}
            </button>
          `).join("")}
        </div>
      `;
    }).join("");
  }

  async function vote(pollId, optionIndex) {
    if (!currentUser) {
      setStatus("Please login first.");
      return;
    }

    const { error } =
      await supabaseClient
        .from("poll_votes")
        .insert({
          poll_id: pollId,
          user_id: currentUser.id,
          option_index: optionIndex
        });

    if (error) {
      setStatus(error.message);
      return;
    }

    setStatus("Vote submitted.");
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async function startPollPulse() {
    if (!initSupabase()) return;

    setStatus("Connecting to PollPulse...");

    await checkSession();
  }

  startPollPulse();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">
<meta name="description" content="PollPulse - Create, vote and discover opinions.">
<title>PollPulse</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --primary:#635bff;
  --primary2:#5148e5;
  --danger:#ef4444;
  --success:#16a34a;
  --shadow:0 8px 30px rgba(15,23,42,.07);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app-header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  min-height:68px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--primary);
  color:#fff;
  font-weight:900;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  padding:0;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
}

.primary{
  border:0;
  border-radius:12px;
  background:var(--primary);
  color:white;
  font-weight:700;
  padding:12px 16px;
}

.primary:hover{
  background:var(--primary2);
}

.secondary{
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  color:var(--text);
  font-weight:700;
  padding:12px 16px;
}

.danger{
  background:var(--danger);
  color:white;
  border:0;
  border-radius:12px;
  padding:11px 15px;
  font-weight:700;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:24px 18px 50px;
}

.auth-wrap{
  max-width:430px;
  margin:60px auto;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.auth-card{
  padding:28px;
}

.auth-title{
  font-size:30px;
  margin:0 0 8px;
}

.subtitle{
  color:var(--muted);
  margin:0 0 24px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:700;
}

.field input,
.field textarea,
.search{
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px 14px;
  background:#fff;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.search:focus{
  border-color:var(--primary);
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.full{
  width:100%;
}

.auth-switch{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
}

.link{
  border:0;
  background:none;
  color:var(--primary);
  font-weight:700;
  padding:0;
}

.status{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:100;
  max-width:90%;
  padding:12px 17px;
  border-radius:12px;
  background:#111827;
  color:white;
  box-shadow:var(--shadow);
  font-size:14px;
}

.hero{
  padding:28px;
  margin-bottom:20px;
  background:linear-gradient(135deg,#635bff,#8b5cf6);
  color:white;
  border-radius:22px;
}

.hero h1{
  margin:0 0 8px;
  font-size:34px;
}

.hero p{
  margin:0;
  opacity:.9;
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search{
  flex:1;
}

.layout{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:20px;
}

.feed{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.poll-card{
  padding:20px;
}

.poll-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.author{
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#e5e7eb;
}

.avatar.small{
  width:34px;
  height:34px;
}

.author-name{
  font-weight:800;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.poll-question{
  font-size:20px;
  line-height:1.35;
  margin:18px 0 14px;
  font-weight:800;
}

.option{
  position:relative;
  width:100%;
  overflow:hidden;
  text-align:left;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  border-radius:13px;
  padding:13px;
  margin-top:9px;
}

.option:hover{
  border-color:var(--primary);
}

.option-bar{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  background:rgba(99,91,255,.10);
  z-index:0;
}

.option-content{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.poll-footer{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:13px;
  margin-top:15px;
}

.sidebar{
  padding:20px;
  height:max-content;
  position:sticky;
  top:88px;
}

.profile-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile-large{
  width:64px;
  height:64px;
  border-radius:50%;
  object-fit:cover;
  background:#e5e7eb;
}

.profile-name{
  font-size:18px;
  font-weight:800;
}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.stat{
  padding:14px;
  border:1px solid var(--border);
  border-radius:13px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:20px;
}

.create-card{
  padding:20px;
  margin-bottom:20px;
}

.create-title{
  margin:0 0 15px;
}

.option-input{
  display:flex;
  gap:8px;
  margin-top:9px;
}

.option-input input{
  flex:1;
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px;
}

.remove-option{
  width:42px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:11px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:90;
  display:grid;
  place-items:center;
  padding:18px;
}

.modal-card{
  width:min(520px,100%);
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  border:0;
  background:none;
  font-size:24px;
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

.loading{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:static;
  }
}

@media(max-width:600px){
  .container{
    padding:15px 12px 35px;
  }

  .header-inner{
    padding:0 12px;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:27px;
  }

  .auth-wrap{
    margin:25px auto;
  }

  .auth-card{
    padding:22px;
  }

  .toolbar{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header class="app-header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">P</div>
      <span>PollPulse</span>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" title="Theme">🌙</button>
      <button id="logoutBtn" class="secondary hidden" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<div id="status" class="status hidden"></div>

<!-- AUTH -->
<section id="authSection" class="container">
  <div class="auth-wrap">
    <div class="card auth-card">

      <h1 id="authTitle" class="auth-title">Welcome back</h1>
      <p id="authSubtitle" class="subtitle">
        Login to continue to PollPulse.
      </p>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" autocomplete="email"
               placeholder="you@example.com">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password"
               autocomplete="current-password"
               placeholder="••••••••">
      </div>

      <button id="authButton" class="primary full"
              onclick="handleAuth()">
        Login
      </button>

      <div class="auth-switch">
        <span id="authSwitchLabel">Don't have an account?</span>
        <button class="link" onclick="toggleAuthMode()">
          <span id="authSwitchButton">Sign up</span>
        </button>
      </div>

    </div>
  </div>
</section>


<!-- APP -->
<section id="appSection" class="container hidden">

  <div class="hero">
    <h1>What's your opinion?</h1>
    <p>Create a poll, vote on interesting questions and discover what people think.</p>
  </div>

  <div class="toolbar">
    <input id="searchInput" class="search"
           placeholder="Search polls..."
           oninput="renderPolls()">

    <button class="primary" onclick="openCreateModal()">
      + Create Poll
    </button>
  </div>

  <div class="layout">

    <main>
      <div id="pollFeed" class="feed">
        <div class="loading">Loading polls...</div>
      </div>
    </main>

    <aside class="card sidebar">

      <div id="profileArea">
        <div class="loading">Loading profile...</div>
      </div>

      <hr style="border:0;border-top:1px solid var(--border);margin:20px 0;">

      <button class="secondary full" onclick="openProfileModal()">
        Edit Profile
      </button>

      <button class="danger full" style="margin-top:10px;"
              onclick="logout()">
        Logout
      </button>

    </aside>

  </div>

</section>


<!-- CREATE MODAL -->
<div id="createModal" class="modal hidden">
  <div class="card modal-card">

    <div class="modal-head">
      <h2>Create Poll</h2>
      <button class="close" onclick="closeCreateModal()">×</button>
    </div>

    <div class="field">
      <label>Question</label>
      <textarea id="pollQuestion"
        placeholder="What do you want to ask?"></textarea>
    </div>

    <div id="optionInputs"></div>

    <button class="secondary full"
            onclick="addOptionInput()">
      + Add option
    </button>

    <button class="primary full"
            style="margin-top:10px;"
            onclick="createPoll()">
      Publish Poll
    </button>

  </div>
</div>


<!-- PROFILE MODAL -->
<div id="profileModal" class="modal hidden">
  <div class="card modal-card">

    <div class="modal-head">
      <h2>Edit Profile</h2>
      <button class="close" onclick="closeProfileModal()">×</button>
    </div>

    <div class="field">
      <label>Username</label>
      <input id="profileUsername"
             maxlength="40"
             placeholder="Your username">
    </div>

    <div class="field">
      <label>Full name</label>
      <input id="profileFullName"
             maxlength="80"
             placeholder="Your name">
    </div>

    <div class="field">
      <label>Avatar</label>
      <input id="avatarInput"
             type="file"
             accept="image/png,image/jpeg,image/webp">
    </div>

    <button class="primary full"
            onclick="saveProfile()">
      Save Profile
    </button>

  </div>
</div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://dbpbkvfaxgifjeveijqf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let profile = null;
let polls = [];
let myVotes = new Set();
let loginMode = true;
let optionCount = 0;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function showStatus(message, duration=3500){
  const box = $("status");

  box.textContent = message;
  box.classList.remove("hidden");

  clearTimeout(window.statusTimer);

  window.statusTimer =
    setTimeout(() => {
      box.classList.add("hidden");
    }, duration);
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(date){
  if(!date) return "";

  const d = new Date(date);

  if(Number.isNaN(d.getTime())) return "";

  return d.toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );
}

function getAvatarUrl(){
  return profile?.avatar_url || "";
}

function getDisplayName(){
  return (
    profile?.username ||
    profile?.full_name ||
    currentUser?.email?.split("@")[0] ||
    "PollPulse User"
  );
}


/* =========================================================
   AUTH MODE
========================================================= */

function toggleAuthMode(){

  loginMode = !loginMode;

  $("authTitle").textContent =
    loginMode
      ? "Welcome back"
      : "Create your account";

  $("authSubtitle").textContent =
    loginMode
      ? "Login to continue to PollPulse."
      : "Join PollPulse and share your opinions.";

  $("authButton").textContent =
    loginMode
      ? "Login"
      : "Create account";

  $("authSwitchLabel").textContent =
    loginMode
      ? "Don't have an account?"
      : "Already have an account?";

  $("authSwitchButton").textContent =
    loginMode
      ? "Sign up"
      : "Login";
}


/* =========================================================
   AUTH
========================================================= */

async function handleAuth(){

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if(!email || !password){
    showStatus("Please enter email and password.");
    return;
  }

  if(password.length < 6){
    showStatus("Password must be at least 6 characters.");
    return;
  }

  $("authButton").disabled = true;

  let result;

  try{

    if(loginMode){

      result =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });

    }else{

      result =
        await supabaseClient.auth
          .signUp({
            email,
            password
          });
    }

  }catch(error){

    showStatus(error.message || "Authentication failed.");

    $("authButton").disabled = false;
    return;
  }

  $("authButton").disabled = false;

  if(result.error){
    showStatus(result.error.message);
    return;
  }

  if(!result.data.user){

    showStatus(
      "Account created. Check your email if confirmation is required."
    );

    return;
  }

  currentUser =
    result.data.user;

  await initializeApp();
}


/* =========================================================
   SESSION
========================================================= */

async function checkSession(){

  const {data,error} =
    await supabaseClient.auth.getSession();

  if(error){
    showStatus(error.message);
    return;
  }

  currentUser =
    data.session?.user || null;

  if(currentUser){

    await initializeApp();

  }else{

    $("authSection").classList.remove("hidden");
    $("appSection").classList.add("hidden");
  }
}


supabaseClient.auth.onAuthStateChange(
  async (_event,session)=>{

    currentUser =
      session?.user || null;

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeApp(){

  $("authSection").classList.add("hidden");
  $("appSection").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");

  await loadProfile();
  await loadPolls();
  await loadMyVotes();
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  const {error} =
    await supabaseClient.auth.signOut();

  if(error){
    showStatus(error.message);
    return;
  }

  currentUser = null;
  profile = null;

  location.reload();
}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){

    $("profileArea").innerHTML = `
      <div class="empty">
        Profile couldn't be loaded.<br>
        <small>${escapeHtml(error.message)}</small>
      </div>
    `;

    return;
  }

  profile = data || {};

  renderProfile();
}


function renderProfile(){

  const avatar =
    getAvatarUrl();

  $("profileArea").innerHTML = `

    <div class="profile-row">

      ${
        avatar
        ? `<img class="profile-large"
                src="${escapeHtml(avatar)}"
                alt="Avatar">`
        : `<div class="profile-large"></div>`
      }

      <div>
        <div class="profile-name">
          ${escapeHtml(getDisplayName())}
        </div>

        <div class="meta">
          ${escapeHtml(currentUser.email)}
        </div>
      </div>

    </div>

    <div class="stat-grid">

      <div class="stat">
        <strong>${polls.filter(p=>p.user_id===currentUser.id).length}</strong>
        <span class="meta">Polls</span>
      </div>

      <div class="stat">
        <strong>${myVotes.size}</strong>
        <span class="meta">Votes</span>
      </div>

    </div>
  `;
}


function openProfileModal(){

  $("profileUsername").value =
    profile?.username || "";

  $("profileFullName").value =
    profile?.full_name || "";

  $("profileModal").classList.remove("hidden");
}


function closeProfileModal(){
  $("profileModal").classList.add("hidden");
}


async function saveProfile(){

  if(!currentUser) return;

  const username =
    $("profileUsername").value.trim();

  const fullName =
    $("profileFullName").value.trim();

  if(username.length > 40){
    showStatus("Username is too long.");
    return;
  }

  const {error} =
    await supabaseClient
      .from("profiles")
      .upsert(
        {
          id:currentUser.id,
          username:username || null,
          full_name:fullName || null
        },
        {
          onConflict:"id"
        }
      );

  if(error){

    showStatus(error.message);
    return;
  }

  const file =
    $("avatarInput").files[0];

  if(file){

    if(file.size > 5*1024*1024){

      showStatus("Avatar must be under 5 MB.");
      return;
    }

    const ext =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    const path =
      currentUser.id +
      "/" +
      crypto.randomUUID() +
      "." +
      ext;

    const upload =
      await supabaseClient.storage
        .from("avatars")
        .upload(
          path,
          file,
          {
            upsert:false,
            cacheControl:"3600"
          }
        );

    if(upload.error){

      showStatus(upload.error.message);
      return;
    }

    const publicUrl =
      supabaseClient.storage
        .from("avatars")
        .getPublicUrl(path)
        .data.publicUrl;

    const update =
      await supabaseClient
        .from("profiles")
        .update({
          avatar_url:publicUrl
        })
        .eq("id",currentUser.id);

    if(update.error){

      showStatus(update.error.message);
      return;
    }
  }

  closeProfileModal();

  await loadProfile();

  showStatus("Profile updated successfully.");
}


/* =========================================================
   CREATE POLL
========================================================= */

function openCreateModal(){

  $("createModal").classList.remove("hidden");

  $("pollQuestion").value = "";

  $("optionInputs").innerHTML = "";

  optionCount = 0;

  addOptionInput();
  addOptionInput();
}


function closeCreateModal(){
  $("createModal").classList.add("hidden");
}


function addOptionInput(){

  if(optionCount >= 6){

    showStatus("Maximum 6 options allowed.");
    return;
  }

  optionCount++;

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "option-input";

  wrapper.innerHTML = `
    <input
      class="poll-option"
      placeholder="Option ${optionCount}"
      maxlength="120">

    ${
      optionCount > 2
      ? `<button class="remove-option"
                 onclick="this.parentElement.remove()">
           ×
         </button>`
      : ""
    }
  `;

  $("optionInputs").appendChild(wrapper);
}


async function createPoll(){

  if(!currentUser){
    showStatus("Please login first.");
    return;
  }

  const question =
    $("pollQuestion").value.trim();

  const options =
    [...document.querySelectorAll(".poll-option")]
      .map(input=>input.value.trim())
      .filter(Boolean);

  if(!question){

    showStatus("Enter a poll question.");
    return;
  }

  if(options.length < 2){

    showStatus("Add at least 2 options.");
    return;
  }

  if(options.length > 6){

    showStatus("Maximum 6 options allowed.");
    return;
  }

  const {error} =
    await supabaseClient
      .from("polls")
      .insert({
        user_id:currentUser.id,
        question,
        options
      });

  if(error){

    showStatus(error.message);
    return;
  }

  closeCreateModal();

  showStatus("Poll published!");

  await loadPolls();
  renderProfile();
}


/* =========================================================
   LOAD POLLS
========================================================= */

async function loadPolls(){

  $("pollFeed").innerHTML =
    `<div class="loading">Loading polls...</div>`;

  const {data,error} =
    await supabaseClient
      .from("polls")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(100);

  if(error){

    $("pollFeed").innerHTML = `
      <div class="card empty">
        <strong>Couldn't load polls.</strong>
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }

  polls = data || [];

  await loadVoteCounts();

  renderPolls();
}


let voteCounts = {};


async function loadVoteCounts(){

  voteCounts = {};

  if(!polls.length) return;

  const ids =
    polls.map(p=>p.id);

  const {data,error} =
    await supabaseClient
      .from("poll_votes")
      .select("poll_id,option_index")
      .in("poll_id",ids);

  if(error) return;

  for(const vote of data || []){

    if(!voteCounts[vote.poll_id]){
      voteCounts[vote.poll_id] = {};
    }

    const index =
      String(vote.option_index);

    voteCounts[vote.poll_id][index] =
      (voteCounts[vote.poll_id][index] || 0) + 1;
  }
}


/* =========================================================
   MY VOTES
========================================================= */

async function loadMyVotes(){

  myVotes = new Set();

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("poll_votes")
      .select("poll_id")
      .eq("user_id",currentUser.id);

  if(error) return;

  for(const vote of data || []){
    myVotes.add(vote.poll_id);
  }

  renderProfile();
}


/* =========================================================
   RENDER POLLS
========================================================= */

function renderPolls(){

  const search =
    $("searchInput")?.value
      ?.trim()
      .toLowerCase() || "";

  const filtered =
    polls.filter(poll=>
      !search ||
      String(poll.question)
        .toLowerCase()
        .includes(search)
    );

  if(!filtered.length){

    $("pollFeed").innerHTML = `
      <div class="card empty">
        No polls found.
      </div>
    `;

    return;
  }

  $("pollFeed").innerHTML =
    filtered.map(renderPoll).join("");
}


function renderPoll(poll){

  const options =
    Array.isArray(poll.options)
      ? poll.options
      : [];

  const counts =
    voteCounts[poll.id] || {};

  const total =
    Object.values(counts)
      .reduce((sum,n)=>sum+n,0);

  const author =
    poll.user_id === currentUser?.id
      ? getDisplayName()
      : "PollPulse User";

  const avatar =
    poll.user_id === currentUser?.id
      ? getAvatarUrl()
      : "";

  return `
    <article class="card poll-card">

      <div class="poll-head">

        <div class="author">

          ${
            avatar
            ? `<img class="avatar"
                    src="${escapeHtml(avatar)}"
                    alt="">`
            : `<div class="avatar"></div>`
          }

          <div>
            <div class="author-name">
              ${escapeHtml(author)}
            </div>

            <div class="meta">
              ${formatDate(poll.created_at)}
            </div>
          </div>

        </div>

      </div>

      <div class="poll-question">
        ${escapeHtml(poll.question)}
      </div>

      <div>
        ${
          options.map((option,index)=>{

            const count =
              counts[String(index)] || 0;

            const percent =
              total
                ? Math.round((count/total)*100)
                : 0;

            return `
              <button
                class="option"
                onclick="vote('${escapeHtml(poll.id)}',${index})">

                <span
                  class="option-bar"
                  style="width:${percent}%">
                </span>

                <span class="option-content">

                  <span>
                    ${escapeHtml(String(option))}
                  </span>

                  <strong>
                    ${percent}%
                  </strong>

                </span>

              </button>
            `;

          }).join("")
        }
      </div>

      <div class="poll-footer">

        <span>
          ${total} vote${total===1?"":"s"}
        </span>

        <span>
          ${
            myVotes.has(poll.id)
              ? "✓ Voted"
              : "Tap an option to vote"
          }
        </span>

      </div>

    </article>
  `;
}


/* =========================================================
   VOTE
========================================================= */

async function vote(pollId,optionIndex){

  if(!currentUser){

    showStatus("Please login first.");
    return;
  }

  if(myVotes.has(pollId)){

    showStatus("You have already voted on this poll.");
    return;
  }

  const {error} =
    await supabaseClient
      .from("poll_votes")
      .insert({
        poll_id:pollId,
        user_id:currentUser.id,
        option_index:optionIndex
      });

  if(error){

    showStatus(error.message);
    return;
  }

  myVotes.add(pollId);

  showStatus("Vote submitted!");

  await loadPolls();
  renderProfile();
}


/* =========================================================
   THEME
========================================================= */

function toggleTheme(){

  const dark =
    document.body.dataset.theme === "dark";

  if(dark){

    document.body.dataset.theme = "";

    document.documentElement.style
      .setProperty("--bg","#f6f7fb");

    document.documentElement.style
      .setProperty("--card","#ffffff");

    document.documentElement.style
      .setProperty("--text","#111827");

    document.documentElement.style
      .setProperty("--border","#e5e7eb");

  }else{

    document.body.dataset.theme = "dark";

    document.documentElement.style
      .setProperty("--bg","#0f172a");

    document.documentElement.style
      .setProperty("--card","#111827");

    document.documentElement.style
      .setProperty("--text","#f8fafc");

    document.documentElement.style
      .setProperty("--border","#263244");
  }
}


/* =========================================================
   START
========================================================= */

async function start(){

  if(!window.supabase){

    showStatus(
      "Supabase library failed to load."
    );

    return;
  }

  await checkSession();
}

start();

</script>

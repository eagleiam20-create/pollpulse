<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Poll Pulse — Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #635bff;
      --primary-dark: #5147e8;
      --bubble: #635bff;
      --bubble-text: #fff;
      --other-bubble: #f0f2f5;
      --other-text: #111827;
      --green: #22c55e;
      --danger: #ef4444;
      --shadow: 0 12px 35px rgba(17, 24, 39, .08);
    }

    body.dark {
      --bg: #0b0d12;
      --card: #12151c;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #252a34;
      --other-bubble: #20252f;
      --other-text: #f3f4f6;
      --shadow: 0 12px 35px rgba(0,0,0,.3);
    }

    body {
      font-family:
        Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* LOGIN */

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: linear-gradient(135deg, #635bff, #8b5cf6);
      color: white;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 900;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 900;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .auth-title {
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .auth-text {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 13px;
      padding: 13px 14px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--primary);
    }

    .primary-btn {
      width: 100%;
      border: 0;
      background: var(--primary);
      color: white;
      border-radius: 13px;
      padding: 13px;
      font-weight: 800;
      margin-top: 4px;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 13px;
      padding: 12px;
      font-weight: 700;
      margin-top: 10px;
    }

    .auth-error {
      color: var(--danger);
      background: rgba(239,68,68,.08);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    /* APP */

    .chat-app {
      width: min(1180px, 100%);
      height: min(820px, calc(100vh - 40px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 360px 1fr;
    }

    /* SIDEBAR */

    .sidebar {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .sidebar-brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mini-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #635bff, #8b5cf6);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .sidebar-title {
      font-size: 19px;
      font-weight: 900;
    }

    .top-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .icon-btn:hover {
      background: var(--bg);
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: var(--bg);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px 12px 38px;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 10px;
      color: var(--muted);
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
    }

    .conversation {
      padding: 13px 16px;
      display: flex;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(229,231,235,.55);
    }

    body.dark .conversation {
      border-bottom-color: rgba(255,255,255,.04);
    }

    .conversation:hover,
    .conversation.active {
      background: var(--bg);
    }

    .avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg,#ddd,#aaa);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #555;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .conversation-info {
      min-width: 0;
      flex: 1;
    }

    .conversation-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .conversation-name {
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-time {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .conversation-preview {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-list {
      padding: 45px 25px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* CHAT */

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .chat-empty-icon {
      width: 80px;
      height: 80px;
      border-radius: 25px;
      background: rgba(99,91,255,.1);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 36px;
      margin-bottom: 18px;
    }

    .chat-empty h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .chat-empty p {
      color: var(--muted);
      max-width: 350px;
      line-height: 1.6;
    }

    .chat-header {
      min-height: 72px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: none;
    }

    .chat-user {
      min-width: 0;
      flex: 1;
    }

    .chat-user-name {
      font-weight: 850;
      font-size: 15px;
    }

    .chat-status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      background:
        radial-gradient(circle at top left, rgba(99,91,255,.04), transparent 35%),
        var(--card);
    }

    .date-divider {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin: 10px 0 18px;
    }

    .message-row {
      display: flex;
      margin-bottom: 8px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-wrap {
      max-width: min(75%, 480px);
    }

    .message-bubble {
      padding: 10px 13px;
      border-radius: 17px;
      background: var(--other-bubble);
      color: var(--other-text);
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }

    .mine .message-bubble {
      background: var(--bubble);
      color: var(--bubble-text);
      border-bottom-right-radius: 5px;
    }

    .message-row:not(.mine) .message-bubble {
      border-bottom-left-radius: 5px;
    }

    .message-meta {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      align-items: center;
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      padding: 0 4px;
    }

    .mine .message-meta {
      color: var(--muted);
    }

    .deleted {
      font-style: italic;
      opacity: .7;
    }

    .reply-preview {
      border-left: 3px solid currentColor;
      opacity: .75;
      padding-left: 8px;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .typing {
      min-height: 23px;
      padding: 0 22px;
      color: var(--muted);
      font-size: 12px;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }

    .composer textarea {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 15px;
      padding: 12px 13px;
      outline: none;
    }

    .composer textarea:focus {
      border-color: var(--primary);
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      font-size: 18px;
    }

    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .reply-bar {
      padding: 8px 14px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: none;
      align-items: center;
      gap: 10px;
    }

    .reply-bar.show {
      display: flex;
    }

    .reply-content {
      flex: 1;
      min-width: 0;
    }

    .reply-label {
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
    }

    .reply-text {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      background: #111827;
      color: white;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* MOBILE */

    @media (max-width: 720px) {
      #app {
        padding: 0;
      }

      .chat-app {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: flex;
      }

      .chat-panel {
        display: none;
      }

      .chat-app.mobile-chat .sidebar {
        display: none;
      }

      .chat-app.mobile-chat .chat-panel {
        display: flex;
      }

      .back-btn {
        display: grid;
      }

      .message-wrap {
        max-width: 82%;
      }

      .auth-card {
        border: 0;
        box-shadow: none;
        border-radius: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   POLL PULSE CHAT
   Standalone version
   ========================================================= */

const SUPABASE_URL = "https://dbpbkvfaxgifjeveijqf.supabase.co";
const SUPABASE_KEY = "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let selectedUser = null;
let messagesChannel = null;
let typingTimer = null;
let replyMessage = null;

const app = document.getElementById("app");
const toastBox = document.getElementById("toast");

function toast(message) {
  toastBox.textContent = message;
  toastBox.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toastBox.classList.remove("show");
  }, 2500);
}

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function initials(name) {
  return String(name || "?")
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function avatarHTML(profile, sizeClass = "") {
  const name =
    profile?.full_name ||
    profile?.username ||
    profile?.name ||
    "User";

  const avatar =
    profile?.avatar_url ||
    profile?.avatar ||
    profile?.profile_image;

  if (avatar) {
    return `
      <div class="avatar ${sizeClass}">
        <img src="${escapeHTML(avatar)}" alt="">
      </div>
    `;
  }

  return `
    <div class="avatar ${sizeClass}">
      ${escapeHTML(initials(name))}
    </div>
  `;
}

function displayName(profile) {
  return (
    profile?.full_name ||
    profile?.username ||
    profile?.name ||
    "Poll Pulse User"
  );
}

function timeAgo(date) {
  if (!date) return "";

  const d = new Date(date);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);

  if (diff < 60) return "now";
  if (diff < 3600) return Math.floor(diff / 60) + "m";
  if (diff < 86400) return Math.floor(diff / 3600) + "h";
  if (diff < 604800) return Math.floor(diff / 86400) + "d";

  return d.toLocaleDateString([], {
    day: "numeric",
    month: "short"
  });
}

function messageTime(date) {
  if (!date) return "";

  return new Date(date).toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

/* =========================================================
   AUTH SCREEN
   ========================================================= */

function showAuth() {
  app.innerHTML = `
    <div class="auth-card">

      <div class="brand">
        <div class="brand-logo">P</div>
        <div>
          <div class="brand-name">Poll Pulse</div>
          <div class="brand-sub">Messages</div>
        </div>
      </div>

      <div class="auth-title">Welcome back</div>

      <div class="auth-text">
        Sign in to your Poll Pulse account to open your messages.
      </div>

      <div id="authError" class="auth-error"></div>

      <div class="field">
        <label>Email</label>
        <input
          id="emailInput"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="passwordInput"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
        >
      </div>

      <button class="primary-btn" id="loginBtn">
        Sign in
      </button>

      <button class="secondary-btn" id="signupBtn">
        Create account
      </button>

    </div>
  `;

  document.getElementById("loginBtn").onclick = login;
  document.getElementById("signupBtn").onclick = signup;
}

async function login() {
  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;

  if (!email || !password) {
    showAuthError("Please enter email and password.");
    return;
  }

  const btn = document.getElementById("loginBtn");

  btn.disabled = true;
  btn.textContent = "Signing in...";

  const { error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showAuthError(error.message);
    btn.disabled = false;
    btn.textContent = "Sign in";
    return;
  }

  await boot();
}

async function signup() {
  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;

  if (!email || !password) {
    showAuthError("Please enter email and password.");
    return;
  }

  if (password.length < 6) {
    showAuthError("Password should be at least 6 characters.");
    return;
  }

  const btn = document.getElementById("signupBtn");

  btn.disabled = true;
  btn.textContent = "Creating...";

  const { error } = await sb.auth.signUp({
    email,
    password
  });

  if (error) {
    showAuthError(error.message);
  } else {
    toast("Account created. Check your email if confirmation is enabled.");
  }

  btn.disabled = false;
  btn.textContent = "Create account";
}

function showAuthError(message) {
  const box = document.getElementById("authError");

  if (!box) return;

  box.textContent = message;
  box.style.display = "block";
}

/* =========================================================
   MAIN APP
   ========================================================= */

function renderApp() {
  app.innerHTML = `
    <div class="chat-app" id="chatApp">

      <aside class="sidebar">

        <div class="sidebar-top">

          <div class="sidebar-brand">

            <div class="sidebar-brand-left">
              <div class="mini-logo">P</div>

              <div>
                <div class="sidebar-title">Messages</div>
              </div>
            </div>

            <div class="top-actions">
              <button
                class="icon-btn"
                id="themeBtn"
                title="Theme"
              >◐</button>

              <button
                class="icon-btn"
                id="refreshBtn"
                title="Refresh"
              >↻</button>

              <button
                class="icon-btn"
                id="logoutBtn"
                title="Logout"
              >⇥</button>
            </div>

          </div>

          <div class="search">
            <span class="search-icon">⌕</span>
            <input
              id="searchInput"
              type="search"
              placeholder="Search people..."
            >
          </div>

        </div>

        <div id="conversationList" class="conversation-list">
          <div class="empty-list">
            Loading conversations...
          </div>
        </div>

      </aside>


      <main class="chat-panel">

        <div id="chatEmpty" class="chat-empty">

          <div class="chat-empty-icon">✉</div>

          <h2>Your messages</h2>

          <p>
            Select someone from your conversations to start chatting.
          </p>

        </div>


        <div id="chatContent" style="display:none; height:100%; flex-direction:column;">

          <header class="chat-header">

            <button
              class="icon-btn back-btn"
              id="backBtn"
            >←</button>

            <div id="chatAvatar"></div>

            <div class="chat-user">
              <div id="chatUserName" class="chat-user-name">
                User
              </div>

              <div id="chatStatus" class="chat-status">
                Messages
              </div>
            </div>

            <button
              class="icon-btn"
              id="clearChatBtn"
              title="Refresh messages"
            >↻</button>

          </header>


          <div id="messages" class="messages">

          <div id="typingIndicator" class="typing">
          </div>


          <div id="replyBar" class="reply-bar">

            <div class="reply-content">

              id="chatInput"
              placeholder="Write a message..."
              rows="1"

            <button

              id="sendBtn"
              disabled
              title="Send"
            >➤</button>

          </div>

        </div>

      </main>

    </div>
  `;

  bindMainEvents();
}

function bindMainEvents() {

  document.getElementById("themeBtn").onclick = () => {
    document.body.classList.toggle("dark");

    localStorage.setItem(
      "pollPulseDark",
      document.body.classList.contains("dark")
    );
  };

  if (localStorage.getItem("pollPulseDark") === "true") {
    document.body.classList.add("dark");
  }

  document.getElementById("refreshBtn").onclick = loadConversations;

  document.getElementById("logoutBtn").onclick = async () => {
    await sb.auth.signOut();
    selectedUser = null;
    showAuth();
  };

  document.getElementById("backBtn").onclick = () => {
    document.getElementById("chatApp")
      .classList.remove("mobile-chat");

    selectedUser = null;
    disconnectMessages();
  };

  document.getElementById("clearChatBtn").onclick = () => {
    if (selectedUser) {
      loadMessages();
    }
  };

  document.getElementById("cancelReply").onclick = clearReply;

  const input = document.getElementById("chatInput");

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height =
      Math.min(input.scrollHeight, 120) + "px";

    document.getElementById("sendBtn").disabled =
      !input.value.trim();

    handleTyping();
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();

      if (input.value.trim()) {
        sendMessage();
      }
    }
  });

  document.getElementById("sendBtn").onclick = sendMessage;

  document.getElementById("searchInput").addEventListener(
    "input",
    e => searchUsers(e.target.value)
  );
}

/* =========================================================
   LOAD CONVERSATIONS
   ========================================================= */

async function loadConversations() {

  const list = document.getElementById("conversationList");

  if (!list) return;

  list.innerHTML = `
    <div class="empty-list">
      Loading...
    </div>
  `;

  try {

    const { data, error } = await sb
      .from("messages")
      .select(`
        sender_id,
        receiver_id,
        message,
        created_at
      `)
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order("created_at", {
        ascending: false
      })
      .limit(300);

    if (error) throw error;

    const userIds = [];

    for (const row of data || []) {
      const other =
        row.sender_id === currentUser.id
          ? row.receiver_id
          : row.sender_id;

      if (other && !userIds.includes(other)) {
        userIds.push(other);
      }
    }

    if (!userIds.length) {
      list.innerHTML = `
        <div class="empty-list">
          <strong>No conversations yet.</strong>
          <br><br>
          Search for a user above and open a conversation.
        </div>
      `;

      return;
    }

    const { data: profiles, error: profileError } =
      await sb
        .from("profiles")
        .select("*")
        .in("id", userIds);

    if (profileError) throw profileError;

    const profileMap = {};

    for (const profile of profiles || []) {
      profileMap[profile.id] = profile;
    }

    const latest = {};

    for (const row of data || []) {

      const other =
        row.sender_id === currentUser.id
          ? row.receiver_id
          : row.sender_id;

      if (!latest[other]) {
        latest[other] = row;
      }
    }

    list.innerHTML = userIds.map(id => {

      const profile = profileMap[id] || {
        id,
        full_name: "Poll Pulse User"
      };

      const row = latest[id];

      return `
        <div
          class="conversation"
          data-user-id="${escapeHTML(id)}"
        >

          ${avatarHTML(profile)}

          <div class="conversation-info">

            <div class="conversation-line">

              <div class="conversation-name">
                ${escapeHTML(displayName(profile))}
              </div>

              <div class="conversation-time">
                ${timeAgo(row?.created_at)}
              </div>

            </div>

            <div class="conversation-preview">
              ${escapeHTML(row?.message || "No message")}
            </div>

          </div>

        </div>
      `;

    }).join("");

    document.querySelectorAll(".conversation")
      .forEach(el => {

        el.onclick = () => {
          const id = el.dataset.userId;
          openConversation(id);
        };

      });

  } catch (error) {

    console.error(error);

    list.innerHTML = `
      <div class="empty-list">
        Could not load conversations.
        <br><br>
        <small>${escapeHTML(error.message)}</small>
      </div>
    `;
  }
}

/* =========================================================
   SEARCH
   ========================================================= */

let searchTimeout = null;

function searchUsers(query) {

  clearTimeout(searchTimeout);

  const value = query.trim();

  if (!value) {
    loadConversations();
    return;
  }

  searchTimeout = setTimeout(async () => {

    const list = document.getElementById("conversationList");

    list.innerHTML = `
      <div class="empty-list">
        Searching...
      </div>
    `;

    try {

      const { data, error } = await sb
        .from("profiles")
        .select("*")
        .or(
          `username.ilike.%${value}%,full_name.ilike.%${value}%,name.ilike.%${value}%`
        )
        .neq("id", currentUser.id)
        .limit(30);

      if (error) throw error;

      if (!data?.length) {

        list.innerHTML = `
          <div class="empty-list">
            No users found for
            <strong>${escapeHTML(value)}</strong>
          </div>
        `;

        return;
      }

      list.innerHTML = data.map(profile => `
        <div
          class="conversation"
          data-user-id="${escapeHTML(profile.id)}"
        >

          ${avatarHTML(profile)}

          <div class="conversation-info">

            <div class="conversation-name">
              ${escapeHTML(displayName(profile))}
            </div>

            <div class="conversation-preview">
              @${escapeHTML(profile.username || "")}
            </div>

          </div>

        </div>
      `).join("");

      document.querySelectorAll(".conversation")
        .forEach(el => {
          el.onclick = () => {
            openConversation(el.dataset.userId);
          };
        });

    } catch (error) {

      console.error(error);

      list.innerHTML = `
        <div class="empty-list">
          Search failed.
          <br><br>
          <small>${escapeHTML(error.message)}</small>
        </div>
      `;

    }

  }, 350);
}

/* =========================================================
   OPEN CHAT
   ========================================================= */

async function openConversation(userId) {

  if (!userId || userId === currentUser.id) return;

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("id", userId)
    .maybeSingle();

  if (error) {
    toast(error.message);
    return;
  }

  if (!data) {
    toast("User profile not found.");
    return;
  }

  selectedUser = data;

  document.querySelectorAll(".conversation")
    .forEach(el => {
      el.classList.toggle(
        "active",
        el.dataset.userId === userId
      );
    });

  document.getElementById("chatEmpty").style.display = "none";

  document.getElementById("chatContent").style.display = "flex";

  document.getElementById("chatAvatar").innerHTML =
    avatarHTML(selectedUser);

  document.getElementById("chatUserName").textContent =
    displayName(selectedUser);

  document.getElementById("chatStatus").textContent =
    selectedUser.username
      ? "@" + selectedUser.username
      : "Poll Pulse";

  document.getElementById("chatApp")
    .classList.add("mobile-chat");

  clearReply();

  await loadMessages();
  subscribeToMessages();
}

/* =========================================================
   LOAD MESSAGES
   ========================================================= */

async function loadMessages() {

  if (!selectedUser) return;

  const box = document.getElementById("messages");

  box.innerHTML = `
    <div class="empty-list">
      Loading messages...
    </div>
  `;

  const { data, error } = await sb
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at", {
      ascending: true
    });

  if (error) {

    console.error(error);

    box.innerHTML = `
      <div class="empty-list">
        Could not load messages.
        <br><br>
        <small>${escapeHTML(error.message)}</small>
      </div>
    `;

    return;
  }

  renderMessages(data || []);

  await markMessagesRead();
}

function renderMessages(rows) {

  const box = document.getElementById("messages");

  if (!rows.length) {

    box.innerHTML = `
      <div class="chat-empty">
        <div class="chat-empty-icon">♡</div>

        <h2>Start a conversation</h2>

        <p>
          Send the first message to ${escapeHTML(
            displayName(selectedUser)
          )}.
        </p>
      </div>
    `;

    return;
  }

  box.innerHTML = rows.map(message => {

    const mine =
      message.sender_id === currentUser.id;

    const deleted =
      !!message.deleted_at;

    let content = "";

    if (deleted) {

      content = `
        <div class="deleted">
          This message was deleted
        </div>
      `;

    } else {

      content = escapeHTML(
        message.message || ""
      ).replace(/\n/g, "<br>");
    }

    let reply = "";

    if (message.reply_to) {

      const original = rows.find(
        x => String(x.id) === String(message.reply_to)
      );

      if (original) {

        reply = `
          <div class="reply-preview">
            ${escapeHTML(
              original.message || "Message"
            )}
          </div>
        `;

      }
    }

    return `
      <div
        class="message-row ${mine ? "mine" : ""}"
        data-message-id="${escapeHTML(message.id)}"
        data-message-text="${escapeHTML(message.message || "")}"
      >

        <div class="message-wrap">

          <div class="message-bubble">

            ${reply}

            ${content}

          </div>

          <div class="message-meta">

            <span>
              ${messageTime(message.created_at)}
            </span>

            ${
              mine
                ? `<span>${message.read ? "✓✓" : "✓"}</span>`
                : ""
            }

          </div>

        </div>

      </div>
    `;

  }).join("");

  box.scrollTop = box.scrollHeight;

  addMessageInteractions();
}

function addMessageInteractions() {

  document.querySelectorAll(".message-row")
    .forEach(row => {

      row.addEventListener("contextmenu", e => {

        e.preventDefault();

        const id = row.dataset.messageId;
        const text = row.dataset.messageText;

        if (!id) return;

        if (
          confirm(
            "Reply to this message?\n\n" +
            text
          )
        ) {
          setReply({
            id,
            message: text
          });
        }

      });

    });
}

/* =========================================================
   SEND
   ========================================================= */

async function sendMessage() {

  if (!selectedUser) return;

  const input = document.getElementById("chatInput");

  const text = input.value.trim();

  if (!text) return;

  const sendBtn = document.getElementById("sendBtn");

  sendBtn.disabled = true;

  const payload = {
    sender_id: currentUser.id,
    receiver_id: selectedUser.id,
    message: text
  };

  if (replyMessage) {
    payload.reply_to = replyMessage.id;
  }

  const { error } = await sb
    .from("messages")
    .insert(payload);

  if (error) {

    console.error(error);

    toast(error.message);

    sendBtn.disabled = false;

    return;
  }

  input.value = "";
  input.style.height = "auto";

  clearReply();

  sendBtn.disabled = true;

  await loadMessages();
  await loadConversations();
}

/* =========================================================
   READ RECEIPTS
   ========================================================= */

async function markMessagesRead() {

  if (!selectedUser || !currentUser) return;

  const { error } = await sb
    .from("messages")
    .update({
      read: true,
      read_at: new Date().toISOString()
    })
    .eq("sender_id", selectedUser.id)
    .eq("receiver_id", currentUser.id)
    .eq("read", false);

  if (error) {
    console.warn("Read receipt unavailable:", error.message);
  }
}

/* =========================================================
   REPLY
   ========================================================= */

function setReply(message) {

  replyMessage = message;

  document.getElementById("replyText").textContent =
    message.message || "Message";

  document.getElementById("replyBar")
    .classList.add("show");

  document.getElementById("chatInput")
    .focus();
}

function clearReply() {

  replyMessage = null;

  const bar = document.getElementById("replyBar");

  if (bar) {
    bar.classList.remove("show");
  }
}

/* =========================================================
   TYPING
   ========================================================= */

function handleTyping() {

  clearTimeout(typingTimer);

  /*
    Basic local typing UX.
    Realtime presence can be added later without
    breaking the chat.
  */

  const indicator =
    document.getElementById("typingIndicator");

  if (!indicator) return;

  indicator.textContent = "Typing...";

  typingTimer = setTimeout(() => {
    indicator.textContent = "";
  }, 700);
}

/* =========================================================
   REALTIME
   ========================================================= */

function disconnectMessages() {

  if (messagesChannel) {

    sb.removeChannel(messagesChannel);

    messagesChannel = null;
  }
}

function subscribeToMessages() {

  disconnectMessages();

  if (!selectedUser) return;

  messagesChannel = sb
    .channel(
      "chat-" +
      currentUser.id +
      "-" +
      selectedUser.id
    )
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "messages"
      },
      payload => {

        const row =
          payload.new || payload.old;

        if (!row) return;

        const related =
          (
            row.sender_id === currentUser.id &&
            row.receiver_id === selectedUser.id
          ) ||
          (
            row.sender_id === selectedUser.id &&
            row.receiver_id === currentUser.id
          );

        if (!related) return;

        loadMessages();
        loadConversations();

      }
    )
    .subscribe(status => {
      console.log("Realtime:", status);
    });
}

/* =========================================================
   PROFILE
   ========================================================= */

async function loadCurrentProfile() {

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.warn("Profile error:", error.message);
    return;
  }

  currentProfile = data;
}

/* =========================================================
   BOOT
   ========================================================= */

async function boot() {

  const {
    data: {
      session
    }
  } = await sb.auth.getSession();

  if (!session?.user) {

    currentUser = null;
    currentProfile = null;

    showAuth();

    return;
  }

  currentUser = session.user;

  await loadCurrentProfile();

  renderApp();

  await loadConversations();
}

/* =========================================================
   AUTH STATE
   ========================================================= */

sb.auth.onAuthStateChange((event, session) => {

  if (session?.user) {

    currentUser = session.user;

    if (!document.querySelector(".chat-app")) {
      boot();
    }

  } else {

    currentUser = null;
    selectedUser = null;

    disconnectMessages();

    showAuth();
  }

});

/* =========================================================
   START
   ========================================================= */

boot();

</script>

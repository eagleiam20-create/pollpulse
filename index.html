<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Poll Pulse • Messages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

body.dark{
  background:#080808;
  color:#fff;
}

#app{
  width:100%;
  height:100dvh;
  display:flex;
  justify-content:center;
}

#shell{
  width:100%;
  max-width:560px;
  height:100dvh;
  background:#fff;
  position:relative;
  overflow:hidden;
}

body.dark #shell{
  background:#000;
}

/* ================= AUTH ================= */

#authScreen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.auth-box{
  width:100%;
  max-width:390px;
}

.logo{
  font-size:34px;
  font-weight:900;
  letter-spacing:-1.5px;
  margin-bottom:8px;
}

.auth-sub{
  color:#888;
  margin-bottom:28px;
}

.auth-input{
  width:100%;
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  outline:none;
  background:#fff;
}

.auth-input:focus{
  border-color:#111;
}

.auth-btn{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  border-radius:14px;
  padding:14px;
  font-weight:700;
  margin-top:4px;
}

.auth-switch{
  border:0;
  background:none;
  color:#666;
  width:100%;
  padding:15px;
}

/* ================= APP ================= */

#mainApp{
  display:none;
  width:100%;
  height:100%;
}

#mainApp.active{
  display:flex;
  flex-direction:column;
}

/* ================= TOP BAR ================= */

.app-top{
  height:62px;
  flex-shrink:0;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

body.dark .app-top{
  border-color:#222;
}

.app-title{
  font-size:22px;
  font-weight:900;
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:0;
  background:#f2f2f2;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

body.dark .icon-btn{
  background:#191919;
  color:#fff;
}

/* ================= CONTENT ================= */

#content{
  flex:1;
  min-height:0;
  overflow:hidden;
  position:relative;
}

.page{
  display:none;
  width:100%;
  height:100%;
}

.page.active{
  display:flex;
  flex-direction:column;
}

/* ================= HOME ================= */

.home-scroll{
  overflow-y:auto;
  height:100%;
  padding-bottom:80px;
}

.feed-empty{
  padding:70px 25px;
  text-align:center;
  color:#999;
}

.poll-card{
  border-bottom:1px solid #eee;
  padding:16px;
}

body.dark .poll-card{
  border-color:#222;
}

.poll-author{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
}

.author-name{
  font-weight:750;
  font-size:14px;
}

.author-user{
  color:#999;
  font-size:12px;
}

.poll-question{
  font-size:18px;
  font-weight:750;
  line-height:1.35;
  margin-bottom:13px;
}

.poll-option{
  width:100%;
  position:relative;
  border:1px solid #ddd;
  background:#fff;
  border-radius:13px;
  padding:12px;
  margin:7px 0;
  text-align:left;
  overflow:hidden;
}

body.dark .poll-option{
  background:#111;
  border-color:#333;
  color:#fff;
}

.poll-option-bar{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  background:rgba(0,0,0,.07);
}

body.dark .poll-option-bar{
  background:rgba(255,255,255,.07);
}

.poll-option-content{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.poll-percent{
  font-size:12px;
  color:#888;
}

.poll-actions{
  display:flex;
  align-items:center;
  gap:16px;
  margin-top:12px;
  color:#666;
}

.poll-action{
  border:0;
  background:none;
  padding:3px 0;
  font-size:14px;
}

body.dark .poll-action{
  color:#aaa;
}

/* ================= CHAT ================= */

#chatPage{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#fff;
}

body.dark #chatPage{
  background:#000;
}

.chat-inbox-header{
  padding:17px 16px 9px;
  font-size:25px;
  font-weight:850;
}

.chat-search-wrap{
  padding:5px 14px 12px;
}

#chatSearch{
  width:100%;
  border:0;
  outline:0;
  background:#f1f1f1;
  border-radius:13px;
  padding:11px 14px;
}

body.dark #chatSearch{
  background:#181818;
  color:#fff;
}

#chatUsers{
  flex:1;
  overflow-y:auto;
}

.chat-user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 15px;
  cursor:pointer;
}

.chat-user-row:active{
  background:#f1f1f1;
}

.chat-row-info{
  flex:1;
  min-width:0;
}

.chat-row-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.chat-row-name{
  font-weight:700;
  font-size:15px;
}

.chat-row-time{
  font-size:11px;
  color:#999;
}

.chat-row-bottom{
  display:flex;
  gap:7px;
  margin-top:4px;
}

.chat-last-message{
  flex:1;
  min-width:0;
  color:#888;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-unread{
  min-width:20px;
  height:20px;
  border-radius:10px;
  padding:0 6px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:#fff;
  font-size:11px;
}

.chat-empty{
  padding:60px 20px;
  text-align:center;
  color:#999;
}

/* conversation */

#chatConversation{
  display:none;
  flex-direction:column;
  width:100%;
  height:100%;
}

#chatConversation.active{
  display:flex;
}

.chat-top{
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 12px;
  border-bottom:1px solid #eee;
}

body.dark .chat-top{
  border-color:#222;
}

.chat-back{
  width:38px;
  height:38px;
  border:0;
  background:none;
  font-size:28px;
}

body.dark .chat-back{
  color:#fff;
}

.chat-user-info{
  flex:1;
  min-width:0;
}

.chat-user-name{
  font-size:16px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-user-status{
  font-size:11px;
  color:#888;
  margin-top:2px;
}

.chat-avatar-wrap{
  position:relative;
}

.chat-online-dot{
  width:10px;
  height:10px;
  background:#18c463;
  border:2px solid #fff;
  border-radius:50%;
  position:absolute;
  right:-1px;
  bottom:1px;
}

#chatMessages{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

.chat-day{
  text-align:center;
  color:#aaa;
  font-size:11px;
  margin:14px 0;
}

.chat-message-line{
  display:flex;
  margin:4px 0;
}

.chat-message-line.mine{
  justify-content:flex-end;
}

.chat-message-line.theirs{
  justify-content:flex-start;
}

.chat-bubble{
  max-width:78%;
  padding:9px 12px;
  border-radius:18px;
  font-size:14px;
  line-height:1.4;
  word-break:break-word;
}

.mine .chat-bubble{
  background:#111;
  color:#fff;
  border-bottom-right-radius:5px;
}

.theirs .chat-bubble{
  background:#eee;
  color:#111;
  border-bottom-left-radius:5px;
}

body.dark .theirs .chat-bubble{
  background:#202020;
  color:#fff;
}

.chat-meta{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  font-size:10px;
  opacity:.6;
  margin-top:4px;
}

.chat-photo{
  max-width:240px;
  max-height:300px;
  border-radius:13px;
  display:block;
}

.chat-reply-preview{
  border-left:3px solid currentColor;
  background:rgba(127,127,127,.13);
  border-radius:6px;
  padding:6px 8px;
  margin-bottom:6px;
  font-size:11px;
  opacity:.8;
}

.chat-reactions{
  display:flex;
  gap:3px;
  margin-top:-4px;
}

.chat-reaction{
  background:#fff;
  border:1px solid #ddd;
  border-radius:20px;
  padding:3px 7px;
  font-size:12px;
}

/* typing */

#chatTyping{
  min-height:19px;
  padding:0 15px;
  color:#888;
  font-size:11px;
}

/* reply */

#chatReplyBar{
  display:none;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:#f5f5f5;
  border-top:1px solid #eee;
}

#chatReplyBar.show{
  display:flex;
}

.chat-reply-text{
  flex:1;
  min-width:0;
  font-size:12px;
}

.chat-reply-title{
  font-weight:750;
}

#cancelReply{
  border:0;
  background:none;
  font-size:21px;
}

/* composer */

.chat-composer{
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid #eee;
}

body.dark .chat-composer{
  border-color:#222;
}

.chat-icon-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  background:#f2f2f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

body.dark .chat-icon-btn{
  background:#1a1a1a;
  color:#fff;
}

#chatInput{
  flex:1;
  min-width:0;
  resize:none;
  max-height:110px;
  border:1px solid #ddd;
  border-radius:20px;
  outline:none;
  padding:9px 13px;
  font-size:14px;
  line-height:18px;
  background:#fff;
  color:#111;
}

body.dark #chatInput{
  background:#111;
  border-color:#333;
  color:#fff;
}

#sendMessageBtn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#111;
  color:#fff;
  font-size:17px;
}

#sendMessageBtn:disabled{
  opacity:.45;
}

/* reaction menu */

#reactionMenu{
  position:fixed;
  display:none;
  z-index:10000;
  background:#fff;
  border:1px solid #ddd;
  border-radius:30px;
  padding:5px 8px;
  box-shadow:0 6px 25px rgba(0,0,0,.2);
}

#reactionMenu.show{
  display:flex;
  gap:4px;
}

.reaction-choice{
  border:0;
  background:none;
  font-size:20px;
  padding:4px;
}

/* ================= CREATE ================= */

.create-box{
  padding:20px 16px;
  overflow-y:auto;
}

.create-title{
  font-size:26px;
  font-weight:850;
  margin-bottom:20px;
}

.create-input{
  width:100%;
  border:1px solid #ddd;
  border-radius:14px;
  padding:13px;
  outline:none;
  margin-bottom:10px;
  background:#fff;
}

body.dark .create-input{
  background:#111;
  border-color:#333;
  color:#fff;
}

.option-row{
  display:flex;
  gap:7px;
}

.option-row input{
  flex:1;
}

.remove-option{
  width:40px;
  border:0;
  border-radius:12px;
  background:#eee;
}

.add-option{
  width:100%;
  border:1px dashed #aaa;
  background:none;
  padding:12px;
  border-radius:12px;
  margin:3px 0 12px;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:14px;
  background:#111;
  color:#fff;
  padding:14px;
  font-weight:750;
}

/* ================= PROFILE ================= */

.profile-page{
  overflow-y:auto;
  padding-bottom:80px;
}

.profile-head{
  padding:25px 16px;
  display:flex;
  gap:17px;
  align-items:center;
}

.profile-big-avatar{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
}

.profile-name{
  font-size:20px;
  font-weight:850;
}

.profile-username{
  color:#888;
  margin-top:3px;
}

.profile-stats{
  display:flex;
  gap:25px;
  margin-top:10px;
}

.stat b{
  display:block;
  font-size:16px;
}

.stat span{
  color:#888;
  font-size:11px;
}

.profile-bio{
  padding:0 16px 20px;
  color:#555;
}

body.dark .profile-bio{
  color:#aaa;
}

.logout-btn{
  margin:10px 16px;
  width:calc(100% - 32px);
  border:1px solid #ddd;
  background:none;
  padding:12px;
  border-radius:13px;
}

/* ================= NAV ================= */

#bottomNav{
  height:62px;
  flex-shrink:0;
  border-top:1px solid #eee;
  display:flex;
  background:#fff;
  padding-bottom:env(safe-area-inset-bottom);
}

body.dark #bottomNav{
  background:#000;
  border-color:#222;
}

.nav-btn{
  flex:1;
  border:0;
  background:none;
  color:#888;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:19px;
}

.nav-btn span{
  font-size:10px;
}

.nav-btn.active{
  color:#111;
  font-weight:700;
}

body.dark .nav-btn.active{
  color:#fff;
}

/* ================= TOAST ================= */

#toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%) translateY(15px);
  background:#111;
  color:#fff;
  padding:11px 16px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:20000;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div id="app">

<div id="shell">

<!-- ================= AUTH ================= -->

<section id="authScreen">

  <div class="auth-box">

    <div class="logo">Poll Pulse</div>
    <div class="auth-sub">Connect. Vote. Talk.</div>

    <input
      id="authEmail"
      class="auth-input"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="authPassword"
      class="auth-input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <input
      id="authUsername"
      class="auth-input"
      type="text"
      placeholder="Username"
      style="display:none"
    >

    <button id="authBtn" class="auth-btn">
      Login
    </button>

    <button id="authSwitch" class="auth-switch">
      Create new account
    </button>

  </div>

</section>


<!-- ================= MAIN APP ================= -->

<section id="mainApp">

  <header class="app-top">

    <div class="app-title" id="pageTitle">
      Poll Pulse
    </div>

    <div class="top-actions">

      <button
        class="icon-btn"
        id="themeBtn"
        title="Theme"
      >☾</button>

    </div>

  </header>


  <main id="content">

    <!-- HOME -->

    <section
      id="homePage"
      class="page active"
    >

      <div
        id="homeFeed"
        class="home-scroll"
      >

        <div class="feed-empty">
          Loading polls...
        </div>

      </div>

    </section>


    <!-- CREATE -->

    <section
      id="createPage"
      class="page"
    >

      <div class="create-box">

        <div class="create-title">
          Create Poll
        </div>

        <input
          id="pollQuestion"
          class="create-input"
          maxlength="300"
          placeholder="Ask something..."
        >

        <div id="pollOptions">

          <div class="option-row">
            <input
              class="create-input poll-option-input"
              placeholder="Option 1"
            >
          </div>

          <div class="option-row">
            <input
              class="create-input poll-option-input"
              placeholder="Option 2"
            >
          </div>

        </div>

        <button
          id="addOptionBtn"
          class="add-option"
        >
          + Add option
        </button>

        <button
          id="createPollBtn"
          class="primary-btn"
        >
          Publish Poll
        </button>

      </div>

    </section>


    <!-- CHAT -->

    <section
      id="chatPage"
      class="page"
    >

      <!-- INBOX -->

      <section
        id="chatInbox"
        style="display:flex;flex-direction:column;height:100%"
      >

        <div class="chat-inbox-header">
          Messages
        </div>

        <div class="chat-search-wrap">

          <input
            id="chatSearch"
            type="search"
            placeholder="Search messages..."
            autocomplete="off"
          >

        </div>

        <div id="chatUsers">

          <div class="chat-empty">
            No conversations yet
          </div>

        </div>

      </section>


      <!-- CONVERSATION -->

      <section id="chatConversation">

        <header class="chat-top">

          <button
            id="chatBackBtn"
            class="chat-back"
          >‹</button>

          <div class="chat-avatar-wrap">

            <img
              id="chatHeaderAvatar"
              class="avatar"
              alt=""
            >

            <span
              id="chatHeaderOnline"
              class="chat-online-dot"
              style="display:none"
            ></span>

          </div>

          <div class="chat-user-info">

            <div
              id="chatHeaderName"
              class="chat-user-name"
            >
              Chat
            </div>

            <div
              id="chatHeaderStatus"
              class="chat-user-status"
            >
              Message
            </div>

          </div>

        </header>


        <div id="chatMessages"></div>

        <div id="chatTyping"></div>


        <div id="chatReplyBar">

          <div class="chat-reply-text">

            <div class="chat-reply-title">
              Replying
            </div>

            <div id="chatReplyContent"></div>

          </div>

          <button id="cancelReply">
            ×
          </button>

        </div>


        <div class="chat-composer">

          <label
            class="chat-icon-btn"
            title="Send photo"
          >
            ＋

            <input
              id="chatImageInput"
              type="file"
              accept="image/*"
              hidden
            >

          </label>

          <textarea
            id="chatInput"
            rows="1"
            maxlength="2000"
            placeholder="Message..."
          ></textarea>

          <button id="sendMessageBtn">
            ➤
          </button>

        </div>

      </section>


      <!-- REACTION -->

      <div id="reactionMenu">

        <button
          class="reaction-choice"
          data-reaction="❤️"
        >❤️</button>

        <button
          class="reaction-choice"
          data-reaction="😂"
        >😂</button>

        <button
          class="reaction-choice"
          data-reaction="😍"
        >😍</button>

        <button
          class="reaction-choice"
          data-reaction="😮"
        >😮</button>

        <button
          class="reaction-choice"
          data-reaction="👍"
        >👍</button>

      </div>

    </section>


    <!-- PROFILE -->

    <section
      id="profilePage"
      class="page"
    >

      <div class="profile-page">

        <div class="profile-head">

          <img
            id="myAvatar"
            class="profile-big-avatar"
            alt=""
          >

          <div>

            <div
              id="myName"
              class="profile-name"
            >
              User
            </div>

            <div
              id="myUsername"
              class="profile-username"
            >
              @user
            </div>

            <div class="profile-stats">

              <div class="stat">
                <b id="myPollCount">0</b>
                <span>Polls</span>
              </div>

              <div class="stat">
                <b id="myFollowerCount">0</b>
                <span>Followers</span>
              </div>

              <div class="stat">
                <b id="myFollowingCount">0</b>
                <span>Following</span>
              </div>

            </div>

          </div>

        </div>

        <div
          id="myBio"
          class="profile-bio"
        ></div>

        <button
          id="logoutBtn"
          class="logout-btn"
        >
          Log out
        </button>

      </div>

    </section>

  </main>


  <!-- NAV -->

  <nav id="bottomNav">

    <button
      class="nav-btn active"
      data-page="homePage"
      data-title="Poll Pulse"
    >
      🏠
      <span>Home</span>
    </button>

    <button
      class="nav-btn"

function timeText(date){

  if(!date) return "";

  return new Date(date)
    .toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit"
    });

}


function dateText(date){

  if(!date) return "";

  const d = new Date(date);
  const now = new Date();

  const a = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  const b = new Date(
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
  );

  const diff =
    Math.round((a-b)/86400000);

  if(diff === 0) return "Today";
  if(diff === 1) return "Yesterday";

  return d.toLocaleDateString([],{
    day:"numeric",
    month:"short"
  });

}

function parseOptions(value){

  if(Array.isArray(value))
    return value;

  if(typeof value === "string"){

    try{

      const parsed =
        JSON.parse(value);

      if(Array.isArray(parsed))
        return parsed;

    }catch(e){}

    return value
      .split(",")
      .map(x => x.trim())
      .filter(Boolean);

  }

  return [];

}


function getPollOptions(row){

  let options =
    row.options ||
    row.choices ||
    row.answers ||

  const parsed =
    parseOptions(options);

  if(parsed.length)
    return parsed;


  const oldStyle = [
    row.option1,
    row.option2,
    row.option3,
    row.option4
  ].filter(Boolean);

  return oldStyle;

async function loadChatInbox(){

  if(!currentUser)
    return;


  let result =
    await sb
      .from("messages")
      .select(`
        id,
        sender_id,
        receiver_id,
        message,
        message_type,
        created_at,
        read,
        deleted_at
      `)
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order("created_at",{
        ascending:false
      })
      .limit(500);


  if(result.error){

    console.error(result.error);

    $("chatUsers").innerHTML =
      `<div class="chat-empty">
        Unable to load messages.
       </div>`;

    return;

  }


  const messages =
    result.data || [];


  const conversations = {};
  const ids = new Set();


  messages.forEach(message => {

    const partner =
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id;

    if(!partner)
      return;


    ids.add(partner);


    if(!conversations[partner]){

      conversations[partner] = {
        latest:message,
        unread:0
      };

    }


    if(
      message.receiver_id === currentUser.id &&
      message.read === false
    ){

      conversations[partner].unread++;

    }

  });


  /*
    Add followed users to inbox too.
  */

  try{

    const {data:follows} =
      await sb
        .from("follows")
        .select("*")
        .or(
          `follower_id.eq.${currentUser.id},following_id.eq.${currentUser.id}`
        )
        .limit(200);


    (follows || []).forEach(f => {

      const id =
        f.follower_id === currentUser.id
          ? f.following_id
          : f.follower_id;

      if(id)
        ids.add(id);

    });

  }catch(e){}


  if(!ids.size){

    $("chatUsers").innerHTML =
      `<div class="chat-empty">
        No conversations yet
       </div>`;

    return;

  }


  const idArray =
    [...ids];


  const {data:profiles} =
    await sb
      .from("profiles")
      .select("*")
      .in("id",idArray);


  (profiles || []).forEach(p => {

    chatProfileCache[p.id] =
      p;

  });


  const rows =
    idArray
      .map(id => {

        if(!chatProfileCache[id])
          return null;

        return {
          id,
          profile:chatProfileCache[id],
          conversation:conversations[id]
        };

      })
      .filter(Boolean)
      .sort((a,b) => {

        const aa =
          a.conversation?.latest?.created_at || 0;

        const bb =
          b.conversation?.latest?.created_at || 0;

        return new Date(bb)-new Date(aa);

      });


  renderChatInbox(rows);

}


function renderChatInbox(rows){

  const filtered =
    rows.filter(row => {

      if(!searchText)
        return true;

      const p =
        row.profile;

      const latest =
        row.conversation?.latest;


      const hay =
        (
          displayName(p) +
          " " +
          (p.username || "") +
          " " +
          (latest?.message || "")
        ).toLowerCase();


      return hay.includes(
        searchText.toLowerCase()
      );

    });


  if(!filtered.length){

    $("chatUsers").innerHTML =
      `<div class="chat-empty">
        No users found
       </div>`;

    return;

  }


  $("chatUsers").innerHTML =
    filtered
      .map(row => {

        const p =
          row.profile;

        const latest =
          row.conversation?.latest;


        let preview =
          "Start a conversation";


        if(latest){

          if(latest.deleted_at){

            preview =
              "Message deleted";

          }else if(
            latest.message_type === "image"
          ){

            preview =
              "📷 Photo";

          }else{

            preview =
              latest.message ||
              "Message";

          }

        }


        const unread =
          row.conversation?.unread || 0;


        return `
          <div
            class="chat-user-row"
            data-user-id="${escapeHTML(row.id)}"
          >

            <img
              class="avatar"
              src="${avatarURL(p)}"
              alt=""
            >

            <div class="chat-row-info">

              <div class="chat-row-top">

                <span class="chat-row-name">
                  ${escapeHTML(
                    displayName(p)
                  )}
                </span>

                ${
                  latest
                    ? `<span class="chat-row-time">
                        ${timeText(
                          latest.created_at
                        )}
                       </span>`
                    : ""
                }

              </div>

              <div class="chat-row-bottom">

                <span class="chat-last-message">
                  ${escapeHTML(preview)}
                </span>

                ${
                  unread
                    ? `<span class="chat-unread">
                        ${
                          unread > 99
                            ? "99+"
                            : unread
                        }
                       </span>`
                    : ""
                }

              </div>

            </div>

          </div>
        `;

      })
      .join("");


  document
    .querySelectorAll(".chat-user-row")
    .forEach(row => {

      row.onclick =
        () =>
          openChat(
            row.dataset.userId
          );

    });

}


$("chatSearch").oninput =
  e => {

    searchText =
      e.target.value.trim();

    loadChatInbox();

  };


/* =========================================================
   LOAD CONVERSATION
========================================================= */

async function loadConversation(){

  if(!chatCurrentUser ||
     !chatTargetUser)
    return;


  const {data,error} =
    await sb
      .from("messages")
      .select(`
        id,
        sender_id,
        receiver_id,
        message,
        message_type,
        media_url,
        reply_to,
        deleted_at,
        delivered_at,
        read,
        read_at,
        created_at
      `)
      .or(
        `and(sender_id.eq.${chatCurrentUser.id},receiver_id.eq.${chatTargetUser.id}),and(sender_id.eq.${chatTargetUser.id},receiver_id.eq.${chatCurrentUser.id})`
      )
      .order("created_at",{
        ascending:true
      })
      .limit(500);


  if(error){

    console.error(error);

    $("chatMessages").innerHTML =
      `<div class="chat-empty">
        Could not load messages.
       </div>`;

    return;

  }


  chatMessages =
    data || [];


  renderMessages();

  await markMessagesRead();

}


let chatCurrentUser = null;


/* =========================================================
   RENDER MESSAGES
========================================================= */

async function renderMessages(){

  const box =
    $("chatMessages");


  if(!chatMessages.length){

    box.innerHTML =
      `<div class="chat-empty">
        Say hello 👋
       </div>`;

    return;

  }


  const map = {};

  chatMessages.forEach(m =>
    map[String(m.id)] = m
  );


  box.innerHTML = "";

  let previousDate = "";


  for(const message of chatMessages){

    const currentDate =
      dateText(message.created_at);


    if(currentDate !== previousDate){

      const day =
        document.createElement("div");

      day.className =
        "chat-day";

      day.textContent =
        currentDate;

      box.appendChild(day);

      previousDate =
        currentDate;

    }


    const mine =
      message.sender_id ===
      currentUser.id;


    const line =
      document.createElement("div");

    line.className =
      "chat-message-line " +
      (mine ? "mine" : "theirs");


    const bubble =
      document.createElement("div");

    bubble.className =
      "chat-bubble";


    /*
      Reply preview
    */

    if(message.reply_to){

      const replied =
        map[String(message.reply_to)];


      if(replied){

        const reply =
          document.createElement("div");

        reply.className =
          "chat-reply-preview";


        reply.textContent =
          replied.message ||
          "📷 Photo";


        bubble.appendChild(reply);

      }

    }


    /*
      Deleted
    */

    if(message.deleted_at){

      const deleted =
        document.createElement("div");

      deleted.textContent =
        "Message deleted";

      deleted.style.fontStyle =
        "italic";

      deleted.style.opacity =
        ".5";

      bubble.appendChild(deleted);

    }


    /*
      Image
    */

    else if(
      message.message_type === "image" &&
      message.media_url
    ){

      const img =
        document.createElement("img");

      img.className =
        "chat-photo";

      img.dataset.path =
        message.media_url;

      img.alt =
        "Photo";

      if(
        message.media_url.startsWith(
          "http"
        )
      ){

        img.src =
          message.media_url;

      }else{

        const {data} =
          await sb.storage
            .from("chat-media")
            .createSignedUrl(
              message.media_url,
              3600
            );

        if(data?.signedUrl)
          img.src =
            data.signedUrl;

      }


      bubble.appendChild(img);

    }


    /*
      Text
    */

    else{

      const text =
        document.createElement("div");

      text.innerHTML =
        escapeHTML(
          message.message
        ).replace(
          /\n/g,
          "<br>"
        );

      bubble.appendChild(text);

    }


    /*
      Meta
    */

    const meta =
      document.createElement("div");

    meta.className =
      "chat-meta";


    let status = "";

    if(mine){

      if(message.read)
        status = "✓✓";

      else if(message.delivered_at)
        status = "✓✓";

      else
        status = "✓";

    }


    meta.innerHTML = `
      <span>
        ${timeText(message.created_at)}
      </span>

      ${
        mine
          ? `<span>${status}</span>`
          : ""
      }
    `;


    bubble.appendChild(meta);


    /*
      Long press / right click
    */

    bubble.oncontextmenu =
      e => {

        e.preventDefault();

        showReactionMenu(
          message,
          e.clientX,
          e.clientY
        );

      };


    let pressTimer = null;


    bubble.ontouchstart =
      e => {

        pressTimer =
          setTimeout(() => {

            const touch =
              e.touches[0];

            showReactionMenu(
              message,
              touch.clientX,
              touch.clientY
            );

          },500);

      };


    bubble.ontouchend =
      () =>
        clearTimeout(
          pressTimer
        );


    line.appendChild(bubble);

    box.appendChild(line);


    await renderReactions(
      message.id,
      line
    );

  }


  box.scrollTop =
    box.scrollHeight;

}


/* =========================================================
   REACTIONS
========================================================= */

async function renderReactions(
  messageId,
  line
){

  try{

    const {data,error} =
      await sb
        .from("message_reactions")
        .select("reaction,user_id")
        .eq(
          "message_id",
          String(messageId)
        );


    if(error || !data?.length)
      return;


    const counts = {};


    data.forEach(row => {

      counts[row.reaction] =
        (counts[row.reaction] || 0) + 1;

    });


    const wrap =
      document.createElement("div");

    wrap.className =
      "chat-reactions";


    Object.entries(counts)
      .forEach(([emoji,count]) => {

        const el =
          document.createElement("span");

        el.className =
          "chat-reaction";

        el.textContent =
          emoji + " " + count;

        wrap.appendChild(el);

      });


    line.appendChild(wrap);

  }catch(e){}

}


async function addReaction(
  messageId,
  reaction
){

  if(!currentUser)
    return;


  try{

    const {data:existing} =
      await sb
        .from("message_reactions")
        .select("id,reaction")
        .eq(
          "message_id",
          String(messageId)
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();


    if(
      existing &&
      existing.reaction === reaction
    ){

      await sb
        .from("message_reactions")
        .delete()
        .eq(
          "id",
          existing.id
        );

    }else if(existing){

      await sb
        .from("message_reactions")
        .update({
          reaction
        })
        .eq(
          "id",
          existing.id
        );

    }else{

      const {error} =
        await sb
          .from("message_reactions")
          .insert({
            message_id:String(messageId),
            user_id:currentUser.id,
            reaction
          });

      if(error)
        throw error;

    }


    hideReactionMenu();

    await loadConversation();

  }catch(error){

    console.error(error);

    toast(
      "Reactions table not configured."
    );

    hideReactionMenu();

  }

}


/* =========================================================
   REACTION MENU
========================================================= */

function showReactionMenu(
  message,
  x,
  y
){

  reactionMessage =
    message;


  const menu =
    $("reactionMenu");

  menu.classList.add("show");


  const width =
    menu.offsetWidth || 250;


  const left =
    Math.max(
      8,
      Math.min(
        x,
        window.innerWidth-width-8
      )
    );


  menu.style.left =
    left + "px";


  menu.style.top =
    Math.max(
      8,
      y-55
    ) + "px";

}


function hideReactionMenu(){

  $("reactionMenu")
    .classList.remove("show");

  reactionMessage =
    null;

}


document
  .querySelectorAll(".reaction-choice")
  .forEach(btn => {

    btn.onclick =
      async () => {

        if(!reactionMessage)
          return;

        await addReaction(
          reactionMessage.id,
          btn.dataset.reaction
        );

      };

  });


document.onclick =
  e => {

    if(
      !e.target.closest(
        "#reactionMenu"
      )
    ){

      hideReactionMenu();

    }

  };


/* =========================================================
   REPLY
========================================================= */

function startReply(message){

  replyMessage =
    message;


  let text =
    message.message ||
    "📷 Photo";


  if(
    message.message_type === "image"
  ){

    text =
      "📷 Photo";

  }


  $("chatReplyContent")
    .textContent =
      text.length > 70
        ? text.slice(0,70)+"..."
        : text;


  $("chatReplyBar")
    .classList.add("show");


  $("chatInput").focus();

}


function cancelReply(){

  replyMessage =
    null;

  $("chatReplyBar")
    .classList.remove("show");

  $("chatReplyContent")
    .textContent = "";

}


$("cancelReply").onclick =
  cancelReply;


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(!currentUser ||
     !chatTargetUser)
    return;


  const input =
    $("chatInput");


  const text =
    input.value.trim();


  if(!text)
    return;


  $("sendMessageBtn")
    .disabled = true;


  const payload = {

    sender_id:
      currentUser.id,

    receiver_id:
      chatTargetUser.id,

    message:text,

    message_type:"text",

    reply_to:
      replyMessage
        ? String(replyMessage.id)
        : null

  };


  const {error} =
    await sb
      .from("messages")
      .insert(payload);


  $("sendMessageBtn")
    .disabled = false;


  if(error){

    console.error(error);

    toast(
      "Message send nahi hua."
    );

    return;

  }


  input.value = "";
  input.style.height = "auto";

  cancelReply();

  await loadConversation();

}


$("sendMessageBtn").onclick =
  sendMessage;


$("chatInput").onkeydown =
  e => {

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();

    }

  };


$("chatInput").oninput =
  () => {

    const input =
      $("chatInput");


    input.style.height =
      "auto";


    input.style.height =
      Math.min(
        input.scrollHeight,
        110
      ) + "px";


    sendTyping();

  };


/* =========================================================
   IMAGE
========================================================= */

async function sendImage(file){

  if(!file ||
     !currentUser ||
     !chatTargetUser)
    return;


  if(!file.type.startsWith("image/")){

    toast("Only images allowed.");
    return;

  }


  if(file.size > 8*1024*1024){

    toast("Image must be under 8 MB.");
    return;

  }


  const safeName =
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


  const path =
    currentUser.id +
    "/" +
    crypto.randomUUID() +
    "-" +
    safeName;


  const {error:uploadError} =
    await sb.storage
      .from("chat-media")
      .upload(
        path,
        file,
        {
          contentType:file.type,
          upsert:false
        }
      );


  if(uploadError){

    console.error(uploadError);

    toast(
      "Upload failed. Check chat-media bucket."
    );

    return;

  }


  const {error} =
    await sb
      .from("messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          chatTargetUser.id,

        message:"📷 Photo",

        message_type:"image",

        media_url:path,

        reply_to:
          replyMessage
            ? String(replyMessage.id)
            : null

      });


  if(error){

    console.error(error);

    toast("Image message failed.");
    return;

  }


  cancelReply();

  await loadConversation();

}


$("chatImageInput").onchange =
  async e => {

    const file =
      e.target.files?.[0];

    if(file)
      await sendImage(file);

    e.target.value = "";

  };


/* =========================================================
   READ RECEIPTS
========================================================= */

async function markMessagesRead(){

  if(!currentUser ||
     !chatTargetUser)
    return;


  const unread =
    chatMessages.filter(m =>
      m.receiver_id === currentUser.id &&
      m.sender_id === chatTargetUser.id &&
      !m.read
    );


  for(const message of unread){

    await sb
      .from("messages")
      .update({

        read:true,

        read_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        message.id
      )
      .eq(
        "receiver_id",
        currentUser.id
      );

  }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteMessage(message){

  if(
    message.sender_id !==
    currentUser.id
  )
    return;


  if(!confirm("Delete this message?"))
    return;


  const {error} =
    await sb
      .from("messages")
      .update({
        deleted_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        message.id
      )
      .eq(
        "sender_id",
        currentUser.id
      );


  if(error){

    toast("Delete failed.");
    return;

  }


  await loadConversation();

}


/* =========================================================
   MESSAGE ACTIONS
========================================================= */

function showMessageActions(message){

  const menu =
    document.createElement("div");


  menu.style.position =
    "fixed";

  menu.style.left =
    "50%";

  menu.style.top =
    "50%";

  menu.style.transform =
    "translate(-50%,-50%)";

  menu.style.background =
    document.body.classList.contains("dark")
      ? "#181818"
      : "#fff";

  menu.style.color =
    document.body.classList.contains("dark")
      ? "#fff"
      : "#111";

  menu.style.padding =
    "6px";

  menu.style.borderRadius =
    "14px";

  menu.style.zIndex =
    "30000";

  menu.style.boxShadow =
    "0 8px 30px rgba(0,0,0,.25)";


  menu.innerHTML = `

    <button
      data-action="reply"
      style="display:block;width:160px;border:0;background:none;padding:12px;text-align:left"
    >
      ↩ Reply
    </button>

    <button
      data-action="heart"
      style="display:block;width:160px;border:0;background:none;padding:12px;text-align:left"
    >
      ❤️ React
    </button>

    ${
      message.sender_id === currentUser.id
        ? `
          <button
            data-action="delete"
            style="display:block;width:160px;border:0;background:none;padding:12px;text-align:left"
          >
            🗑 Delete
          </button>
        `
        : ""
    }

  `;


  document.body.appendChild(menu);


  menu
    .querySelectorAll("button")
    .forEach(btn => {

      btn.onclick =
        async () => {

          const action =
            btn.dataset.action;

          menu.remove();


          if(action === "reply")
            startReply(message);

          if(action === "heart")
            addReaction(
              message.id,
              "❤️"
            );

          if(action === "delete")
            deleteMessage(message);

        };

    });


  setTimeout(() => {

    const close = e => {

      if(!menu.contains(e.target)){

        menu.remove();

        document.removeEventListener(
          "click",
          close
        );

      }

    };

    document.addEventListener(
      "click",
      close
    );

  },50);

}


/* =========================================================
   REALTIME CHAT
========================================================= */

function subscribeChat(){

  if(!currentUser ||
     !chatTargetUser)
    return;


  if(chatChannel){

    sb.removeChannel(
      chatChannel
    );

  }


  chatChannel =
    sb
      .channel(
        "chat-" +
        currentUser.id +
        "-" +
        chatTargetUser.id
      )


      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages"
        },
        payload => {

          const m =
            payload.new ||
            payload.old;

          if(!m)
            return;


          const relevant =
            (
              m.sender_id === currentUser.id &&
              m.receiver_id === chatTargetUser.id
            ) ||
            (
              m.sender_id === chatTargetUser.id &&
              m.receiver_id === currentUser.id
            );


          if(relevant)
            loadConversation();

        }
      )


      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"message_reactions"
        },
        () => {

          loadConversation();

        }
      )


      .on(
        "broadcast",
        {
          event:"typing"
        },
        payload => {

          if(
            payload.payload?.user_id !==
            chatTargetUser.id
          )
            return;


          $("chatTyping").textContent =
            displayName(
              chatTargetUser
            ) +
            " is typing...";


          clearTimeout(
            typingTimeout
          );


          typingTimeout =
            setTimeout(
              () =>
                $("chatTyping")
                  .textContent = "",
              1800
            );

        }
      )


      .subscribe();

}


function sendTyping(){

  if(!chatChannel ||
     !currentUser)
    return;


  chatChannel.send({

    type:"broadcast",

    event:"typing",

    payload:{
      user_id:currentUser.id
    }

  });

}


/* =========================================================
   PRESENCE
========================================================= */

async function updatePresence(){

  if(!currentUser)
    return;


  try{

    await sb
      .from("user_presence")
      .upsert({
        user_id:currentUser.id,
        is_online:true,
        last_seen:new Date().toISOString()
      });

  }catch(e){}

}


async function updateOnlineStatus(){

  if(!chatTargetUser)
    return;


  try{

    const {data} =
      await sb
        .from("user_presence")
        .select(
          "is_online,last_seen"
        )
        .eq(
          "user_id",
          chatTargetUser.id
        )
        .maybeSingle();


    if(data?.is_online){

      $("chatHeaderOnline")
        .style.display =
        "block";

      $("chatHeaderStatus")
        .textContent =
        "Active now";

    }else{

      $("chatHeaderOnline")
        .style.display =
        "none";


      if(data?.last_seen){

        $("chatHeaderStatus")
          .textContent =
          "Active " +
          timeText(
            data.last_seen
          );

      }else{

        $("chatHeaderStatus")
          .textContent =
          "Message";

      }

    }

  }catch(e){

    $("chatHeaderOnline")
      .style.display =
      "none";

  }

}


/* =========================================================
   PROFILE -> CHAT API
========================================================= */

window.openUserChat =
  openChat;


/* =========================================================
   INITIALIZE
========================================================= */

(async function(){

  chatCurrentUser =
    await getUser();

  currentUser =
    chatCurrentUser;

  await boot();

})();


/* Keep presence alive */

setInterval(
  updatePresence,
  30000
);


/* Refresh inbox */

setInterval(
  () => {

    if(
      currentUser &&
      $("chatPage").classList.contains("active") &&
      !chatTargetUser
    ){

      loadChatInbox();

    }

  },
  10000
);


/* Refresh online state */

setInterval(
  () => {

    if(
      chatTargetUser &&
      $("chatConversation").classList.contains("active")
    ){

      updateOnlineStatus();

    }

  },
  15000
);

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,
minimum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#6c5ce7">

<title>Poll Pulse</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
 box-sizing:border-box;
 font-family:Arial,sans-serif;
 -webkit-tap-highlight-color:transparent;
 overflow-wrap:break-word;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-width:0;
 max-width:100%;
 min-height:100%;
 overflow-x:hidden;
 background:#f5f3ff;
 color:#181824;
}

body{
 min-height:100vh;
 min-height:100dvh;
}

button,input,textarea{
 max-width:100%;
}

button{
 cursor:pointer;
}

button:disabled{
 opacity:.6;
 cursor:not-allowed;
}

.hidden{
 display:none!important;
}

.app{
 width:100%;
 max-width:520px;
 min-height:100vh;
 min-height:100dvh;
 margin:0 auto;
 padding-bottom:calc(86px + env(safe-area-inset-bottom));
 overflow-x:hidden;
}

.auth{
 width:100%;
 min-height:100vh;
 min-height:100dvh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
}

.box{
 width:100%;
 max-width:480px;
 background:#fff;
 padding:26px;
 border-radius:26px;
 box-shadow:0 15px 40px #0001;
}

.logo{
 text-align:center;
 font-size:34px;
 font-weight:800;
 color:#6c5ce7;
}

.sub{
 text-align:center;
 color:#777;
 margin:8px 0 25px;
}

input,textarea{
 display:block;
 width:100%;
 min-width:0;
 padding:14px;
 margin:7px 0;
 border:1px solid #ddd;
 border-radius:14px;
 outline:none;
 font-size:16px;
 background:#fff;
}

textarea{
 resize:vertical;
}

.btn{
 border:0;
 border-radius:14px;
 padding:12px 15px;
 background:#6c5ce7;
 color:white;
 font-weight:bold;
 min-width:0;
}

.wide{
 width:100%;
 margin-top:8px;
}

.link{
 width:100%;
 border:0;
 background:none;
 color:#6c5ce7;
 font-weight:bold;
 margin-top:13px;
}

.msg{
 text-align:center;
 min-height:20px;
 margin-top:12px;
 color:#e74c3c;
 font-size:14px;
}

header{
 width:100%;
 padding:calc(18px + env(safe-area-inset-top)) 18px 20px;
 color:white;
 background:linear-gradient(135deg,#6c5ce7,#ff4f8b);
 border-radius:0 0 26px 26px;
}

header h1{
 margin:0;
 font-size:27px;
 line-height:1.2;
}

header p{
 margin:6px 0 0;
}

.content{
 width:100%;
 max-width:100%;
 padding:14px;
 overflow-x:hidden;
}

section{
 width:100%;
 max-width:100%;
 min-width:0;
}

.card{
 width:100%;
 background:#fff;
 padding:16px;
 margin-bottom:13px;
 border-radius:20px;
 box-shadow:0 6px 20px #0001;
 overflow:hidden;
}

.row{
 display:flex;
 align-items:center;
 gap:9px;
 min-width:0;
 max-width:100%;
}

.grow{
 flex:1 1 auto;
 min-width:0;
 overflow:hidden;
}

.avatar{
 width:44px;
 min-width:44px;
 height:44px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,#6c5ce7,#ff4f8b);
 color:white;
 font-weight:bold;
 flex:none;
}

.small{
 color:#777;
 font-size:12px;
}

.tiny{
 color:#888;
 font-size:11px;
 word-break:break-all;
}

.creator{
 display:flex;
 align-items:center;
 gap:8px;
 margin-bottom:11px;
 min-width:0;
}

.creator-avatar{
 width:34px;
 min-width:34px;
 height:34px;
 border-radius:50%;
 background:#6c5ce7;
 color:white;
 display:grid;
 place-items:center;
 font-size:13px;
 font-weight:bold;
}

.poll-title{
 font-size:18px;
 font-weight:800;
 margin-bottom:11px;
}

.option{
 display:block;
 width:100%;
 padding:13px;
 margin:5px 0;
 border:0;
 border-radius:13px;
 background:#eeeafe;
 color:#5145b5;
 font-weight:bold;
 text-align:left;
}

.option.selected{
 background:#6c5ce7;
 color:white;
}

.result{
 width:100%;
 margin:7px 0 10px;
}

.result-top{
 display:flex;
 justify-content:space-between;
 font-size:12px;
 margin-bottom:4px;
}

.resultbar{
 height:8px;
 background:#eee;
 border-radius:8px;
 overflow:hidden;
}

.resultbar i{
 display:block;
 height:100%;
 background:linear-gradient(90deg,#6c5ce7,#ff4f8b);
}

.poll-actions{
 display:flex;
 gap:7px;
 margin-top:11px;
 flex-wrap:wrap;
}

.poll-action{
 border:0;
 background:#f0edff;
 color:#5145b5;
 padding:8px 12px;
 border-radius:12px;
 font-weight:bold;
}

.delete-poll{
 background:#ffe9e9;
 color:#e74c3c;
}

.suggestion{
 width:100%;
 background:linear-gradient(135deg,#f0edff,#fff);
 border:1px solid #e2ddff;
 padding:14px;
 border-radius:18px;
 margin-bottom:14px;
}

.suggestion h3{
 margin:0 0 4px;
}

.user{
 padding:11px 0;
 border-bottom:1px solid #eee;
}

.user:last-child{
 border-bottom:0;
}

.follow{
 background:#6c5ce7;
 padding:8px 11px;
 white-space:nowrap;
}

.following{
 background:#19a974;
}

.view-btn{
 background:#eeeafe;
 color:#5145b5;
 padding:8px 11px;
 white-space:nowrap;
}

.profile-stat{
 text-align:center;
 flex:1;
 min-width:0;
}

.profile-stat strong{
 display:block;
 font-size:20px;
}

.profile-stat span{
 font-size:11px;
 color:#777;
}

.tabs{
 display:flex;
 gap:6px;
 overflow-x:auto;
 margin:14px 0;
 padding-bottom:3px;
}

.tabs button{
 flex:none;
 border:0;
 border-radius:18px;
 padding:9px 13px;
 background:#eee;
 white-space:nowrap;
}

.tabs button.active{
 background:#6c5ce7;
 color:white;
}

.public-profile{
 width:100%;
 background:linear-gradient(135deg,#6c5ce7,#ff4f8b);
 color:white;
 padding:20px;
 border-radius:21px;
 margin-bottom:14px;
}

.profile-name{
 font-size:21px;
 font-weight:800;
}

.profile-actions{
 display:flex;
 gap:8px;
 margin-top:15px;
}

.profile-actions button{
 flex:1;
}

.notice{
 width:100%;
 padding:12px;
 background:#f6f5ff;
 border-radius:14px;
 margin:7px 0;
}

.chat-header{
 display:flex;
 align-items:center;
 gap:9px;
 padding:6px 0 12px;
 border-bottom:1px solid #eee;
 margin-bottom:10px;
}

.chat-header-info{
 flex:1;
 min-width:0;
}

.chat-header-name{
 font-size:16px;
 font-weight:800;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}

.chat-header-status{
 font-size:11px;
 color:#777;
}

.chat-user{
 padding:12px 4px;
 border-bottom:1px solid #eee;
 cursor:pointer;
}

.chat-preview{
 font-size:12px;
 color:#777;
 margin-top:3px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.chatbox{
 width:100%;
 height:330px;
 max-height:50vh;
 overflow:auto;
 background:#f5f3ff;
 border-radius:15px;
 padding:10px;
}

.bubble{
 max-width:78%;
 padding:10px 13px;
 background:white;
 border-radius:15px;
 margin:7px 0;
 word-break:break-word;
 box-shadow:0 1px 4px #0001;
}

.mine{
 margin-left:auto;
 background:#6c5ce7;
 color:white;
}

.toast{
 display:none;
 position:fixed;
 top:calc(10px + env(safe-area-inset-top));
 left:50%;
 transform:translateX(-50%);
 width:min(450px,92vw);
 background:#181824;
 color:white;
 padding:13px;
 border-radius:15px;
 z-index:1000;
 text-align:center;
}

.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(520px,100%);
 height:calc(72px + env(safe-area-inset-bottom));
 padding:4px 5px env(safe-area-inset-bottom);
 background:white;
 display:flex;
 justify-content:space-around;
 align-items:center;
 box-shadow:0 -5px 20px #0002;
 z-index:100;
 border-radius:20px 20px 0 0;
}

.nav{
 flex:1;
 min-width:0;
 height:58px;
 border:0;
 background:none;
 color:#777;
 font-size:20px;
 position:relative;
}

.nav b{
 display:block;
 font-size:10px;
 margin-top:2px;
}

.nav.active{
 color:#6c5ce7;
}

.create{
 font-size:28px;
 color:#6c5ce7;
}

.badge{
 position:absolute;
 top:0;
 right:18%;
 background:#e74c3c;
 color:white;
 border-radius:20px;
 padding:2px 6px;
 font-size:9px;
}

@media(max-width:380px){
 .box{padding:20px}
 .content{padding:10px}
 .card{padding:14px}
 header{padding-left:14px;padding-right:14px}
 header h1{font-size:25px}
 .avatar{width:41px;min-width:41px;height:41px}
 .bottom{height:calc(68px + env(safe-area-inset-bottom))}
 .nav{height:55px;font-size:19px}
}
</style>
</head>

<body>

<div id="authScreen" class="app">
<div class="auth">
<div class="box">

<div class="logo">Poll Pulse</div>
<div class="sub">Everyone has an opinion.</div>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="username" class="hidden" placeholder="Username">

<button id="loginBtn" class="btn wide" onclick="login()">Login</button>

<button id="signupBtn" class="btn wide hidden" onclick="signup()">
Create Account
</button>

<button id="authToggleBtn" class="link" onclick="toggleAuth()">
Create new account
</button>

<button class="link" onclick="resetPassword()">
Forgot password?
</button>

<div id="authMsg" class="msg"></div>

</div>
</div>
</div>


<div id="homeScreen" class="app hidden">

<header>
<h1>Poll Pulse</h1>
<p id="hello">Welcome 👋</p>
</header>

<main class="content">

<section id="homePage">

<div class="card">
<h2 style="margin-top:0">🔥 Poll Feed</h2>
<p>Vote, discover people and follow interesting users.</p>
</div>

<div id="polls">Loading polls...</div>

</section>


<section id="searchPage" class="hidden">

<div class="card">

<h2>🔎 Search</h2>

<input
id="searchInput"
placeholder="Search username or poll..."
oninput="searchAll()"
>

<div id="searchResults">Search something...</div>

</div>
</section>


<section id="createPage" class="hidden">

<div class="card">

<h2>➕ Create Poll</h2>

<input id="question" placeholder="Ask your question...">
<input id="option1" placeholder="Option 1">
<input id="option2" placeholder="Option 2">
<input id="option3" placeholder="Option 3 (optional)">
<input id="option4" placeholder="Option 4 (optional)">

<button class="btn wide" onclick="createPoll()">
Publish Poll
</button>

</div>
</section>


<section id="chatPage" class="hidden">

<div class="card">

<h2>💬 Chats</h2>

<input
id="chatSearch"
placeholder="Search anyone to chat..."
oninput="searchChatUsers()"
>

<div id="chatUsers"></div>

<div id="chatArea" class="hidden">

<div class="chat-header">

<button class="btn" onclick="closeChat()">←</button>

<div id="chatAvatar" class="avatar">U</div>

<div class="chat-header-info">
<div id="chatTitle" class="chat-header-name">User</div>
<div id="chatStatus" class="chat-header-status">Chat</div>
</div>

</div>

<div id="messages" class="chatbox"></div>

<div class="row">

<input
id="chatInput"
class="grow"
placeholder="Message..."
onkeydown="handleChatEnter(event)"
>

<button class="btn" onclick="sendMessage()">Send</button>

</div>
</div>

</div>
</section>


<section id="profilePage" class="hidden">

<div class="card">

<div class="row">

<div id="avatar" class="avatar">U</div>

<div class="grow">

<h2 id="profileName" style="margin:0">User</h2>
<div id="profileUsername" class="small"></div>

</div>
</div>

<br>

<div class="row">

<div class="profile-stat">
<strong id="followersCount">0</strong>
<span>Followers</span>
</div>

<div class="profile-stat">
<strong id="followingCount">0</strong>
<span>Following</span>
</div>

<div class="profile-stat">
<strong id="myPollCount">0</strong>
<span>Polls</span>
</div>

</div>

<br>

<div class="notice">
<b>🆔 My User ID</b>
<div id="profileId" class="tiny"></div>
</div>

<div class="tabs">

<button class="active" onclick="profileTab('polls',this)">
My Polls
</button>

<button onclick="profileTab('votes',this)">
My Votes
</button>

<button onclick="profileTab('followers',this)">
Followers
</button>

<button onclick="profileTab('following',this)">
Following
</button>

</div>

<div id="profileContent"></div>

</div>


<div class="card">

<h3>🔔 Notifications</h3>

<div id="notifications">Loading...</div>

</div>

<button
class="btn wide"
style="background:#e74c3c"
onclick="logout()">
Logout
</button>

</section>

</main>


<nav class="bottom">

<button id="navHome" class="nav active" onclick="showPage('home')">
🏠<b>Home</b>
</button>

<button id="navSearch" class="nav" onclick="showPage('search')">
🔎<b>Search</b>
</button>

<button class="nav create" onclick="showPage('create')">
＋
</button>

<button id="navChat" class="nav" onclick="showPage('chat')">
💬<b>Chat</b>
<span id="chatBadge" class="badge hidden">0</span>
</button>

<button id="navProfile" class="nav" onclick="showPage('profile')">
👤<b>Profile</b>
<span id="notificationBadge" class="badge hidden">0</span>
</button>

</nav>

</div>

<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL=
"https://dbpbkvfaxgifjeveijqf.supabase.co";

const SUPABASE_KEY=
"sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

let sb=null;
let currentUser=null;
let currentChatUser=null;
let viewedProfileUser=null;

let searchTimer=null;
let chatTimer=null;
let messageChannel=null;
let notificationChannel=null;

let suggestionUsers=[];


/* =========================
HELPERS
========================= */

function authMessage(text){
 const el=document.getElementById("authMsg");
 if(el)el.textContent=text||"";
}

function toast(text){
 const t=document.getElementById("toast");
 if(!t)return;
 t.textContent=text;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>{
  t.style.display="none";
 },3000);
}

function esc(text){
 return String(text??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function getInitial(name){
 return String(name||"U").charAt(0).toUpperCase();
}


/* =========================
SUPABASE
========================= */

function initSupabase(){

 if(!window.supabase){
  authMessage("Supabase load nahi hua. Internet check karo.");
  return false;
 }

 try{
  sb=window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_KEY
  );
  return true;
 }catch(error){
  console.error(error);
  authMessage("Supabase start nahi ho saka.");
  return false;
 }
}


/* =========================
AUTH
========================= */

function toggleAuth(){

 const username=document.getElementById("username");
 const loginBtn=document.getElementById("loginBtn");
 const signupBtn=document.getElementById("signupBtn");
 const toggleBtn=document.getElementById("authToggleBtn");

 const signupMode=!username.classList.contains("hidden");

 username.classList.toggle("hidden");
 loginBtn.classList.toggle("hidden");
 signupBtn.classList.toggle("hidden");

 toggleBtn.textContent=
 signupMode
 ?"Create new account"
 :"Already have an account? Login";

 authMessage("");
}


async function signup(){

 if(!sb)return authMessage("Supabase ready nahi hai.");

 const email=document.getElementById("email").value.trim().toLowerCase();
 const password=document.getElementById("password").value;
 const username=document.getElementById("username").value.trim().toLowerCase();

 if(!email||!password||!username)
  return authMessage("Email, password aur username required hai.");

 if(password.length<6)
  return authMessage("Password minimum 6 characters.");

 if(!/^[a-z0-9_]{3,25}$/.test(username))
  return authMessage("Username 3-25 characters ka ho.");

 const button=document.getElementById("signupBtn");
 button.disabled=true;
 authMessage("Creating account...");

 try{

  const {data,error}=await sb.auth.signUp({
   email,
   password,
   options:{
    data:{
     username,
     display_name:username
    }
   }
  });

  if(error)throw error;

  if(!data?.user)
   throw new Error("Account create nahi hua.");

  if(data.session){

   await createProfile(data.user,email,username);
   await openApp(data.user);

  }else{

   authMessage(
    "Account ban gaya. Email verify karo, phir Login karo."
   );

  }

 }catch(error){

  console.error(error);
  authMessage(error.message||"Signup failed.");

 }finally{

  button.disabled=false;

 }
}


async function createProfile(user,email,username){

 if(!sb||!user)return;

 const {error}=await sb
 .from("profiles")
 .upsert({
  id:user.id,
  email:email,
  username:username,
  display_name:username
 });

 if(error)console.error("PROFILE ERROR",error);
}


async function login(){

 if(!sb)return authMessage("Supabase ready nahi hai.");

 const email=document.getElementById("email").value.trim().toLowerCase();
 const password=document.getElementById("password").value;

 if(!email)return authMessage("Email enter karo.");
 if(!password)return authMessage("Password enter karo.");

 const button=document.getElementById("loginBtn");
 button.disabled=true;
 authMessage("Logging in...");

 try{

  const {data,error}=await sb.auth.signInWithPassword({
   email,password
  });

  if(error)throw error;

  await openApp(data.user);

 }catch(error){

  authMessage(error.message||"Login failed.");

 }finally{

  button.disabled=false;

 }
}


async function resetPassword(){

 if(!sb)return;

 const email=document.getElementById("email").value.trim().toLowerCase();

 if(!email)
  return authMessage("Password reset ke liye email enter karo.");

 const {error}=await sb.auth.resetPasswordForEmail(
  email,
  {
   redirectTo:window.location.origin+window.location.pathname
  }
 );

 if(error)return authMessage(error.message);

 authMessage("Reset email bhej diya. Inbox/Spam check karo.");
}


/* =========================
PROFILE
========================= */

async function getProfile(id){

 if(!sb||!id)return null;

 const {data,error}=await sb
 .from("profiles")
 .select("id,username,display_name")
 .eq("id",id)
 .maybeSingle();

 if(error){
  console.error(error);
  return null;
 }

 return data||null;
}


async function ensureProfile(user){

 let profile=await getProfile(user.id);

 if(profile)return profile;

 let username=
 user.user_metadata?.username||
 user.email?.split("@")[0]||
 "user";

 username=username
 .replace(/[^a-zA-Z0-9_]/g,"")
 .slice(0,25);

 if(username.length<3)
  username="user"+user.id.replace(/-/g,"").slice(0,8);

 await createProfile(
  user,
  user.email||"",
  username
 );

 return await getProfile(user.id);
}


async function openApp(user){

 if(!user)return;

 currentUser=user;

 /* new suggestions every app opening */
 suggestionUsers=[];

 document.getElementById("authScreen").classList.add("hidden");
 document.getElementById("homeScreen").classList.remove("hidden");

 const profile=await ensureProfile(user);

 const username=profile?.username||
 user.user_metadata?.username||
 "user";

 const displayName=profile?.display_name||username;

 document.getElementById("hello").textContent="@"+username;
 document.getElementById("profileName").textContent=displayName;
 document.getElementById("profileUsername").textContent="@"+username;
 document.getElementById("profileId").textContent=user.id;
 document.getElementById("avatar").textContent=getInitial(username);

 await requestNotificationPermission();

 await updateProfileStats();
 await loadPolls();
 await loadNotifications();
 await loadChatList();
 await updateChatBadge();

 subscribeRealtime();

}


async function updateProfileStats(){

 if(!currentUser||!sb)return;

 const followers=await sb
 .from("follows")
 .select("id",{count:"exact",head:true})
 .eq("following_id",currentUser.id);

 const following=await sb
 .from("follows")
 .select("id",{count:"exact",head:true})
 .eq("follower_id",currentUser.id);

 const polls=await sb
 .from("polls")
 .select("id",{count:"exact",head:true})
 .eq("user_id",currentUser.id);

 document.getElementById("followersCount").textContent=
 followers.count||0;

 document.getElementById("followingCount").textContent=
 following.count||0;

 document.getElementById("myPollCount").textContent=
 polls.count||0;
}


/* =========================
NAVIGATION
========================= */

function showPage(page){

 [
  "homePage",
  "searchPage",
  "createPage",
  "chatPage",
  "profilePage"
 ].forEach(id=>{
  document.getElementById(id)?.classList.add("hidden");
 });

 [
  "navHome",
  "navSearch",
  "navChat",
  "navProfile"
 ].forEach(id=>{
  document.getElementById(id)?.classList.remove("active");
 });

 if(page==="home"){
  document.getElementById("homePage").classList.remove("hidden");
  document.getElementById("navHome").classList.add("active");
  loadPolls();
 }

 if(page==="search"){
  document.getElementById("searchPage").classList.remove("hidden");
  document.getElementById("navSearch").classList.add("active");
 }

 if(page==="create"){
  document.getElementById("createPage").classList.remove("hidden");
 }

 if(page==="chat"){
  document.getElementById("chatPage").classList.remove("hidden");
  document.getElementById("navChat").classList.add("active");
  loadChatList();
  updateChatBadge();
 }

 if(page==="profile"){
  document.getElementById("profilePage").classList.remove("hidden");
  document.getElementById("navProfile").classList.add("active");
  updateProfileStats();
  loadNotifications();
  profileTab(
   "polls",
   document.querySelector(".tabs button")
  );
 }

========================= */

async function isFollowing(userId){

 if(!currentUser||!sb)return false;

 const {data,error}=await sb
 .from("follows")
 .select("id")
 .eq("follower_id",currentUser.id)
 .eq("following_id",userId)
 .limit(1);

 if(error)return false;

 return !!data?.length;
}


async function followUser(userId,button){

 if(!currentUser||!sb)return null;

 if(userId===currentUser.id){
  toast("You cannot follow yourself.");
  return null;
 }

 if(button){
  button.disabled=true;
  button.textContent="Loading...";
 }

 try{

  const {data:existing,error}=await sb
  .from("follows")
  .select("id")
  .eq("follower_id",currentUser.id)
  .eq("following_id",userId)
  .limit(1);

  if(error)throw error;

  let following=false;

  if(existing?.length){

   const {error}=await sb
   .from("follows")
   .delete()
   .eq("id",existing[0].id);

   if(error)throw error;

   toast("Unfollowed");

  }else{

   const {error}=await sb
   .from("follows")
   .insert({
    follower_id:currentUser.id,
    following_id:userId
   });

   if(error)throw error;

   following=true;

   await createNotification(
    userId,
    "started following you"
   );

   toast("✅ Following!");

  }

  if(button){
   button.disabled=false;
   button.textContent=following?"Following":"Follow";
   button.classList.toggle("following",following);
  }

  await updateProfileStats();

  return following;

 }catch(error){

  console.error(error);
  toast("Follow error: "+error.message);

  if(button)button.disabled=false;

  return null;
 }
}


/* =========================
SUGGESTIONS
========================= */

async function loadSuggestions(forceNew=false){

 if(!currentUser||!sb)return null;

 try{

  if(forceNew||!suggestionUsers.length){

   const {data,error}=await sb
   .from("profiles")
   .select("id,username,display_name")
   .neq("id",currentUser.id)
   .limit(200);

   if(error)throw error;

   let users=[...(data||[])];

   for(let i=users.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [users[i],users[j]]=
    [users[j],users[i]];

   }

   suggestionUsers=users.slice(0,5);
  }

  if(!suggestionUsers.length)return null;

  const box=document.createElement("div");
  box.className="suggestion";

  box.innerHTML=`
  <h3>👥 Follow Suggestions</h3>
  <div class="small">New people you may know</div>
  `;

  for(const user of suggestionUsers){

   const row=document.createElement("div");
   row.className="row user";

   row.innerHTML=`
   <div class="avatar">
   ${esc(getInitial(user.username))}
   </div>

   <div class="grow">
   <b>@${esc(user.username)}</b>
   <div class="small">
   ${esc(user.display_name||"")}
   </div>
   </div>
   `;

   const actions=document.createElement("div");
   actions.style.display="flex";
   actions.style.gap="5px";

   const view=document.createElement("button");
   view.className="btn view-btn";
   view.textContent="View";
   view.onclick=()=>viewProfile(user.id);

   const follow=document.createElement("button");
   follow.className="btn follow";

   const following=await isFollowing(user.id);

   follow.textContent=
   following?"Following":"Follow";

   if(following)follow.classList.add("following");

   follow.onclick=async()=>{
    await followUser(user.id,follow);
   };

   actions.append(view,follow);
   row.appendChild(actions);
   box.appendChild(row);
  }

  return box;

 }catch(error){

  console.error(error);
  return null;

 }
}


/* =========================
POLLS
========================= */

async function loadPolls(){

 const box=document.getElementById("polls");

 if(!box||!currentUser||!sb)return;

 box.innerHTML="<div class='notice'>Loading polls...</div>";

 try{

  const {data:polls,error}=await sb
  .from("polls")
  .select("*")
  .order("created_at",{ascending:false})
  .limit(100);

  if(error)throw error;

  box.innerHTML="";

  const ids=(polls||[]).map(p=>p.id);

  let votes=[];
  let likes=[];

  if(ids.length){

   const v=await sb
   .from("votes")
   .select("poll_id,user_id,option")
   .in("poll_id",ids);

   const l=await sb
   .from("likes")
   .select("poll_id,user_id")
   .in("poll_id",ids);

   votes=v.data||[];
   likes=l.data||[];
  }

  if(!polls?.length){

   box.innerHTML=
   "<div class='notice'>Abhi koi poll nahi hai. Pehla poll banao! 🗳️</div>";

  }else{

   for(const poll of polls){

    const profile=await getProfile(poll.user_id);

    const username=profile?.username||"user";
    const displayName=profile?.display_name||username;

    let options=poll.options;

    if(typeof options==="string"){
     try{
      options=JSON.parse(options);
     }catch{
      options=options.split(",").map(x=>x.trim()).filter(Boolean);
     }
    }

    if(!Array.isArray(options))options=[];

    const pv=votes.filter(v=>v.poll_id===poll.id);
    const total=pv.length;
    const mine=pv.find(v=>v.user_id===currentUser.id);

    const pl=likes.filter(l=>l.poll_id===poll.id);
    const liked=pl.some(l=>l.user_id===currentUser.id);

    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
    <div class="creator">
     <div class="creator-avatar">
      ${esc(getInitial(username))}
     </div>

     <div class="grow">
      <b>@${esc(username)}</b>
      <div class="small">
       ${esc(displayName)} •
       ${poll.created_at?
       new Date(poll.created_at).toLocaleString():""}
      </div>
     </div>
    </div>

    <div class="poll-title">
     ${esc(poll.question||"Poll")}
    </div>

    <div class="poll-options"></div>

    <div class="small">
     ${total} ${total===1?"vote":"votes"}
    </div>

    <div class="poll-actions">

     <button class="poll-action like-btn">
      ${liked?"❤️ Liked":"🤍 Like"} ${pl.length}
     </button>

     ${poll.user_id===currentUser.id?
     `<button class="poll-action delete-poll">🗑️ Delete</button>`:""}

    </div>
    `;

    card.querySelector(".creator").onclick=()=>{
     viewProfile(poll.user_id);
    };

    card.querySelector(".creator").style.cursor="pointer";

    const optionsBox=card.querySelector(".poll-options");

    options.forEach(option=>{

     const count=pv.filter(v=>v.option===option).length;
     const percent=total?Math.round(count/total*100):0;

     const button=document.createElement("button");
     button.className="option";

     if(mine?.option===option){
      button.classList.add("selected");
      button.textContent="✓ "+option;
     }else{
      button.textContent=option;
     }

     button.onclick=()=>vote(poll.id,option);

     optionsBox.appendChild(button);

     if(mine){

      const result=document.createElement("div");
      result.className="result";

      result.innerHTML=`
      <div class="result-top">
       <span>${esc(option)}</span>
       <b>${percent}%</b>
      </div>
      <div class="resultbar">
       <i style="width:${percent}%"></i>
      </div>
      `;

      optionsBox.appendChild(result);
     }
    });

    card.querySelector(".like-btn").onclick=async()=>{
     await likePoll(poll.id);
     await loadPolls();
    };

    const del=card.querySelector(".delete-poll");

    if(del){
     del.onclick=()=>deletePoll(poll.id);
    }

    box.appendChild(card);
   }
  }

  const suggestions=await loadSuggestions();

  if(suggestions)box.appendChild(suggestions);

 }catch(error){

  console.error(error);

  box.innerHTML=
  "<div class='notice'>Home error: "+
  esc(error.message||error)+
  "</div>";
 }
}

 });

 toast("🎉 Poll published!");

 await updateProfileStats();

 const text=input.value.trim();

 if(!text)return;

 const {error}=await sb
 .from("messages")
 .insert({
  sender_id:currentUser.id,
  receiver_id:currentChatUser.id,
  message:text
 });

 if(error)
  return toast("Message error: "+error.message);

 input.value="";

 await createNotification(
  currentChatUser.id,
  "sent you a message",
  "message"
 );

 await loadMessages();
 await updateChatBadge();
}


async function markChatRead(){

 /* Works if your messages table has read/read_at.
   If it doesn't, this safely skips. */

 try{

  await sb
  .from("messages")
  .update({read:true})
  .eq("receiver_id",currentUser.id)
  .eq("sender_id",currentChatUser.id);

 }catch(e){
  console.log("read state skipped");
 }
}


async function updateChatBadge(){

 if(!currentUser||!sb)return;

 const {count,error}=await sb
 .from("messages")
 .select("id",{count:"exact",head:true})
 .eq("receiver_id",currentUser.id)
 .eq("read",false);

 const badge=document.getElementById("chatBadge");

 if(error){

  /* If read column doesn't exist, fall back to total */
  const fallback=await sb
  .from("messages")
  .select("id",{count:"exact",head:true})
  .eq("receiver_id",currentUser.id);

  const n=fallback.count||0;

  badge.textContent=n;
  badge.classList.toggle("hidden",n===0);

  return;
 }

 const n=count||0;

 badge.textContent=n;
 badge.classList.toggle("hidden",n===0);
}


/* =========================
REALTIME
========================= */

function subscribeChatRealtime(){

 if(!sb||!currentUser||!currentChatUser)return;

 if(messageChannel)
  sb.removeChannel(messageChannel);

 messageChannel=sb
 .channel(
  "chat-"+currentUser.id+"-"+currentChatUser.id
 )
 .on(
  "postgres_changes",
  {
   event:"INSERT",
   schema:"public",
   table:"messages"
  },
  payload=>{

   const m=payload.new;

   if(
    (m.sender_id===currentUser.id &&
     m.receiver_id===currentChatUser.id)||
    (m.sender_id===currentChatUser.id &&
     m.receiver_id===currentUser.id)
   ){

    loadMessages();

    if(m.sender_id===currentChatUser.id)
     markChatRead();
   }

   updateChatBadge();

  }
 )
 .subscribe();
}


function subscribeRealtime(){

 if(!sb||!currentUser)return;

 if(notificationChannel)
  sb.removeChannel(notificationChannel);

 notificationChannel=sb
 .channel("notifications-"+currentUser.id)
 .on(
  "postgres_changes",
  {
   event:"INSERT",
   schema:"public",
   table:"notifications",
   filter:"user_id=eq."+currentUser.id
  },
  async payload=>{

   const n=payload.new;

   toast("🔔 "+(n.message||"New notification"));

   showSystemNotification(
    "Poll Pulse",
    n.message||"New notification"
   );

   await loadNotifications();
  }
 )
 .subscribe();
}


/* =========================
SYSTEM NOTIFICATION
========================= */

async function requestNotificationPermission(){

 try{

  if(!("Notification" in window))return;

  if(Notification.permission==="default"){

   await Notification.requestPermission();

  }

 }catch(error){

  console.log("Notification permission skipped",error);

 }
}


function showSystemNotification(title,message){

 try{

  if(
   "Notification" in window&&
   Notification.permission==="granted"
  ){

   new Notification(
    title,
    {
     body:message,
     icon:"https://eagleiam20-create.github.io/pollpulse/favicon.ico"
    }
   );
  }

 }catch(error){

  console.log("System notification unavailable",error);

 }
}


/* =========================
PROFILE TABS
========================= */

async function profileTab(tab,button){

 document
 .querySelectorAll(".tabs button")
 .forEach(b=>b.classList.remove("active"));

 button?.classList.add("active");

 const box=document.getElementById("profileContent");

 box.innerHTML="Loading...";

 if(tab==="polls"){

  const {data,error}=await sb
  .from("polls")
  .select("id,question,created_at")
  .eq("user_id",currentUser.id)
  .order("created_at",{ascending:false});

  if(error)
   return box.innerHTML=
   "<div class='notice'>"+esc(error.message)+"</div>";

  box.innerHTML="";

  (data||[]).forEach(p=>{

   const div=document.createElement("div");
   div.className="notice";
   div.textContent=p.question;

   box.appendChild(div);
  });

  if(!data?.length)box.textContent="No polls yet.";
 }


 if(tab==="votes"){

  const {data,error}=await sb
  .from("votes")
  .select("option,polls(question)")
  .eq("user_id",currentUser.id);

  if(error)
   return box.innerHTML=
   "<div class='notice'>"+esc(error.message)+"</div>";

  box.innerHTML="";

  (data||[]).forEach(v=>{

   const div=document.createElement("div");
   div.className="notice";

   div.innerHTML=
   "<b>"+esc(v.polls?.question||"Poll")+
   "</b><br>✓ "+esc(v.option);

   box.appendChild(div);
  });

  if(!data?.length)box.textContent="No votes yet.";
 }


 if(tab==="followers"||tab==="following"){

  const column=
  tab==="followers"?"follower_id":"following_id";

  const filter=
  tab==="followers"?"following_id":"follower_id";

  const {data,error}=await sb
  .from("follows")
  .select(column)
  .eq(filter,currentUser.id);

  if(error)
   return box.innerHTML=
   "<div class='notice'>"+esc(error.message)+"</div>";

  box.innerHTML="";

  for(const item of data||[]){

   const user=await getProfile(item[column]);

   if(!user)continue;

   const row=document.createElement("div");
   row.className="row user";

   row.innerHTML=`
   <div class="avatar">
   ${esc(getInitial(user.username))}
   </div>

   <div class="grow">
   <b>@${esc(user.username)}</b>
   </div>
   `;

   const view=document.createElement("button");

   view.className="btn view-btn";
   view.textContent="View";
   view.onclick=()=>viewProfile(user.id);

   row.appendChild(view);
   box.appendChild(row);
  }

  if(!data?.length)
   box.textContent=
   tab==="followers"
   ?"No followers yet."
   :"Not following anyone yet.";
 }
}


/* =========================
LOGOUT
========================= */

async function logout(){

 try{

  if(notificationChannel)
   sb.removeChannel(notificationChannel);

  if(messageChannel)
   sb.removeChannel(messageChannel);

  await sb.auth.signOut();

 }catch(error){
  console.error(error);
 }

 currentUser=null;
 currentChatUser=null;
 viewedProfileUser=null;
 suggestionUsers=[];

 document.getElementById("homeScreen").classList.add("hidden");
 document.getElementById("authScreen").classList.remove("hidden");

 document.getElementById("password").value="";

 authMessage("Logged out.");
}


/* =========================
START
========================= */

async function initAuth(){

 if(!sb)return;

 try{

  const {data,error}=await sb.auth.getSession();

  if(error)return authMessage(error.message);

  if(data?.session?.user)
   await openApp(data.session.user);

 }catch(error){

  authMessage(error.message||"Session load nahi hui.");
 }
}


function startApp(){

 if(!initSupabase())return;

 sb.auth.onAuthStateChange(
  async(event,session)=>{

   if(
    event==="SIGNED_IN"&&
    session?.user&&
    !currentUser
   ){
    await openApp(session.user);
   }

   if(event==="SIGNED_OUT"){
    currentUser=null;
   }
  }
 );

 initAuth();
}


if(document.readyState==="loading"){

 document.addEventListener(
  "DOMContentLoaded",
  startApp
 );

}else{

 startApp();

}

</script>

<!-- =========================================================
     POLL PULSE — PROFESSIONAL INSTAGRAM-STYLE CHAT V2
     Replace your old CHAT code with this entire block.
========================================================= -->

<style>
:root{
  --chat-bg:#f7f7f8;
  --chat-surface:#ffffff;
  --chat-soft:#f1f1f3;
  --chat-border:#e7e7ea;
  --chat-text:#111111;
  --chat-muted:#8b8b91;
  --chat-primary:#111111;
  --chat-green:#22c55e;
  --chat-danger:#ef4444;
  --chat-shadow:0 10px 35px rgba(0,0,0,.08);
}

/* =========================================================
   ROOT
========================================================= */

#chatPage{
  position:fixed;
  inset:0;

  z-index:9999;

  width:100%;
  max-width:560px;

  margin:0 auto;

  display:none;
  flex-direction:column;

  overflow:hidden;

  background:var(--chat-bg);

  color:var(--chat-text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

#chatPage.active{
  display:flex;
}

/* =========================================================
   INBOX
========================================================= */

#chatInbox{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  background:var(--chat-bg);
}

.chat-inbox-header{
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    calc(18px + env(safe-area-inset-top))
    17px
    12px;

  background:rgba(255,255,255,.94);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:1px solid var(--chat-border);

  font-size:25px;
  font-weight:850;

  letter-spacing:-.7px;
}

.chat-header-subtitle{
  margin-top:3px;

  color:var(--chat-muted);

  font-size:11px;
  font-weight:500;
  letter-spacing:0;
}

/* =========================================================
   SEARCH
========================================================= */

.chat-search-wrap{
  padding:12px 14px 9px;

  background:var(--chat-bg);
}

.chat-search-box{
  position:relative;
}

#chatSearch{
  width:100%;
  height:44px;

  box-sizing:border-box;

  border:1px solid transparent;

  outline:none;

  border-radius:14px;

  padding:0 14px 0 42px;

  background:#eaeaec;

  color:var(--chat-text);

  font-size:14px;

  transition:
    .18s background,
    .18s border-color;
}

#chatSearch:focus{
  background:#fff;
  border-color:#d8d8dc;
}

.chat-search-icon{
  position:absolute;

  left:15px;
  top:50%;

  transform:translateY(-50%);

  color:#888;

  font-size:18px;

  pointer-events:none;
}

/* =========================================================
   USER LIST
========================================================= */

#chatUsers{
  flex:1;

  overflow-y:auto;

  overscroll-behavior:contain;

  padding:4px 7px 20px;
}

#chatUsers::-webkit-scrollbar,
#chatMessages::-webkit-scrollbar{
  width:4px;
}

#chatUsers::-webkit-scrollbar-thumb,
#chatMessages::-webkit-scrollbar-thumb{
  background:#d4d4d7;
  border-radius:10px;
}

.chat-user-row{
  position:relative;

  display:flex;
  align-items:center;

  gap:12px;

  padding:11px 9px;

  border-radius:16px;

  cursor:pointer;

  transition:
    background .16s,
    transform .12s;
}

.chat-user-row:hover{
  background:#eeeeef;
}

.chat-user-row:active{
  transform:scale(.985);
}

.chat-row-avatar{
  position:relative;

  width:51px;
  height:51px;

  flex-shrink:0;
}

.chat-avatar{
  width:100%;
  height:100%;

  display:block;

  border-radius:50%;

  object-fit:cover;

  background:#e4e4e6;

  border:1px solid rgba(0,0,0,.05);
}

.chat-online-dot{
  position:absolute;

  right:0;
  bottom:1px;

  width:12px;
  height:12px;

  border-radius:50%;

  background:var(--chat-green);

  border:2px solid #fff;

  box-shadow:0 1px 3px rgba(0,0,0,.15);
}

.chat-row-info{
  flex:1;
  min-width:0;
}

.chat-row-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}

.chat-row-name{
  min-width:0;

  font-size:14px;
  font-weight:750;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-row-time{
  flex-shrink:0;

  color:#999;

  font-size:10px;
}

.chat-row-bottom{
  display:flex;
  align-items:center;

  gap:6px;

  margin-top:5px;
}

.chat-last-message{
  flex:1;
  min-width:0;

  color:#8a8a90;

  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-unread{
  min-width:19px;
  height:19px;

  padding:0 5px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:#111;

  color:#fff;

  font-size:9px;
  font-weight:800;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.chat-empty{
  min-height:250px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:35px 25px;

  text-align:center;

  color:#999;
}

.chat-empty-icon{
  width:58px;
  height:58px;

  margin-bottom:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:20px;

  background:#e9e9eb;

  font-size:24px;
}

.chat-empty-title{
  color:#333;

  font-size:15px;
  font-weight:750;

  margin-bottom:5px;
}

.chat-empty-text{
  max-width:280px;

  font-size:12px;
  line-height:1.45;
}

/* =========================================================
   CONVERSATION
========================================================= */

#chatConversation{
  display:none;

  flex-direction:column;

  width:100%;
  height:100%;

  min-height:0;

  background:var(--chat-surface);
}

#chatConversation.active{
  display:flex;
}

/* =========================================================
   CHAT HEADER
========================================================= */

.chat-top{
  position:relative;

  height:62px;

  flex-shrink:0;

  display:flex;
  align-items:center;

  gap:10px;

  padding:
    calc(7px + env(safe-area-inset-top))
    11px
    7px;

  background:rgba(255,255,255,.95);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:1px solid var(--chat-border);

  z-index:10;
}

.chat-back{
  width:40px;
  height:40px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;

  background:transparent;

  border-radius:50%;

  color:#111;

  font-size:30px;
  line-height:1;

  cursor:pointer;

  transition:background .15s;
}

.chat-back:hover{
  background:#f0f0f1;
}

.chat-user-info{
  flex:1;
  min-width:0;
}

.chat-user-name{
  font-size:15px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-user-status{
  margin-top:2px;

  color:#8b8b90;

  font-size:10px;
}

.chat-avatar-wrap{
  position:relative;

  width:40px;
  height:40px;

  flex-shrink:0;
}

.chat-avatar-wrap .chat-avatar{
  width:40px;
  height:40px;
}

/* =========================================================
   MESSAGE AREA
========================================================= */

#chatMessages{
  flex:1;

  min-height:0;

  overflow-y:auto;

  overscroll-behavior:contain;

  padding:13px 11px 8px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(0,0,0,.025),
      transparent 45%
    ),
    #fff;
}

.chat-day{
  width:max-content;

  margin:15px auto 11px;

  padding:5px 10px;

  border-radius:20px;

  background:#f0f0f2;

  color:#999;

  font-size:9px;
  font-weight:650;
}

/* =========================================================
   MESSAGE ROW
========================================================= */

.chat-message-line{
  display:flex;

  margin:3px 0 1px;

  position:relative;
}

.chat-message-line.mine{
  justify-content:flex-end;
}

.chat-message-line.theirs{
  justify-content:flex-start;
}

/* =========================================================
   BUBBLE
========================================================= */

.chat-bubble{
  position:relative;

  max-width:78%;

  padding:9px 12px;

  border-radius:19px;

  font-size:14px;
  line-height:1.42;

  word-break:break-word;

  box-shadow:
    0 1px 1px rgba(0,0,0,.035);

  user-select:text;
}

.mine .chat-bubble{
  background:#111;

  color:#fff;

  border-bottom-right-radius:6px;
}

.theirs .chat-bubble{
  background:#eeeeef;

  color:#111;

  border-bottom-left-radius:6px;
}

/* =========================================================
   META
========================================================= */

.chat-meta{
  display:flex;

  align-items:center;
  justify-content:flex-end;

  gap:5px;

  margin-top:4px;

  font-size:9px;

  opacity:.52;
}

.theirs .chat-meta{
  color:#666;
}

/* =========================================================
   PHOTO
========================================================= */

.chat-photo{
  display:block;

  width:auto;
  max-width:245px;
  max-height:330px;

  object-fit:cover;

  border-radius:14px;

  margin:-2px;
}

/* =========================================================
   REPLY PREVIEW
========================================================= */

.chat-reply-preview{
  padding:6px 9px;

  margin-bottom:7px;

  border-left:3px solid currentColor;

  background:rgba(127,127,127,.12);

  border-radius:7px;

  font-size:10px;

  opacity:.78;

  max-width:100%;
}

/* =========================================================
   REACTIONS
========================================================= */

.chat-reactions{
  display:flex;

  flex-wrap:wrap;

  gap:3px;

  margin-top:-4px;

  position:relative;

  z-index:2;
}

.mine .chat-reactions{
  justify-content:flex-end;
}

.chat-reaction{
  background:#fff;

  border:1px solid #dedee1;

  border-radius:20px;

  padding:3px 7px;

  font-size:11px;

  box-shadow:
    0 2px 5px rgba(0,0,0,.08);
}

/* =========================================================
   TYPING
========================================================= */

#chatTyping{
  min-height:19px;

  padding:0 16px;

  color:#929297;

  font-size:10px;

  line-height:19px;
}

/* =========================================================
   REPLY BAR
========================================================= */

#chatReplyBar{
  display:none;

  align-items:center;

  gap:10px;

  padding:8px 12px;

  background:#f6f6f7;

  border-top:1px solid var(--chat-border);
}

#chatReplyBar.show{
  display:flex;
}

.chat-reply-text{
  flex:1;
  min-width:0;
}

.chat-reply-title{
  color:#777;

  font-size:10px;
  font-weight:800;

  margin-bottom:2px;
}

#chatReplyContent{
  overflow:hidden;

  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:11px;
}

#cancelReply{
  width:30px;
  height:30px;

  border:0;
  border-radius:50%;

  background:#e8e8ea;

  cursor:pointer;

  font-size:18px;
}

/* =========================================================
   COMPOSER
========================================================= */

.chat-composer{
  display:flex;
  align-items:flex-end;

  gap:7px;

  padding:
    8px 10px
    calc(8px + env(safe-area-inset-bottom));

  background:rgba(255,255,255,.97);

  border-top:1px solid var(--chat-border);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.chat-icon-btn{
  width:39px;
  height:39px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;

  border-radius:50%;

  background:#ededef;

  color:#222;

  cursor:pointer;

  font-size:18px;

  transition:
    transform .15s,
    background .15s;
}

.chat-icon-btn:hover{
  background:#e4e4e6;
}

.chat-icon-btn:active{
  transform:scale(.91);
}

#chatInput{
  flex:1;
  min-width:0;

  max-height:110px;

  resize:none;

  border:1px solid #dcdcdf;

  border-radius:20px;

  outline:none;

  padding:9px 13px;

  background:#fff;

  color:#111;

  font-family:inherit;

  font-size:14px;

  line-height:18px;

  transition:border-color .18s;
}

#chatInput:focus{
  border-color:#111;
}

#sendMessageBtn{
  width:40px;
  height:40px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;

  border-radius:50%;

  background:#111;

  color:#fff;

  cursor:pointer;

  font-size:16px;

  transition:
    transform .15s,
    opacity .15s;
}

#sendMessageBtn:active{
  transform:scale(.9);
}

#sendMessageBtn:disabled{
  opacity:.4;
}

/* =========================================================
   REACTION MENU
========================================================= */

#reactionMenu{
  position:fixed;

  display:none;

  align-items:center;

  gap:3px;

  z-index:10020;

  padding:6px 8px;

  background:#fff;

  border:1px solid #ddd;

  border-radius:30px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.2);
}

#reactionMenu.show{
  display:flex;
}

.reaction-choice{
  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;

  background:transparent;

  border-radius:50%;

  font-size:20px;

  cursor:pointer;

  transition:
    background .15s,
    transform .15s;
}

.reaction-choice:hover{
  background:#f0f0f1;

  transform:scale(1.12);
}

/* =========================================================
   MESSAGE ACTION MENU
========================================================= */

.chat-message-menu{
  position:fixed;

  z-index:10030;

  min-width:150px;

  overflow:hidden;

  background:#fff;

  border:1px solid #ddd;

  border-radius:15px;

  box-shadow:
    0 10px 35px rgba(0,0,0,.18);
}

.chat-message-menu button{
  width:100%;

  display:block;

  border:0;

  background:#fff;

  padding:12px 14px;

  color:#222;

  text-align:left;

  cursor:pointer;

  font-size:13px;
}

.chat-message-menu button:hover{
  background:#f5f5f6;
}

.chat-message-menu button.danger{
  color:#e33;
}

/* =========================================================
   LOADING
========================================================= */

.chat-loading{
  padding:15px;
}

.chat-skeleton{
  display:flex;

  align-items:center;

  gap:12px;

  padding:11px 5px;
}

.chat-skeleton-avatar{
  width:51px;
  height:51px;

  border-radius:50%;

  background:
    linear-gradient(
      90deg,
      #ededed,
      #f7f7f7,
      #ededed
    );

  background-size:200% 100%;

  animation:chatShimmer 1.2s infinite;
}

.chat-skeleton-lines{
  flex:1;
}

.chat-skeleton-line{
  width:70%;
  height:10px;

  margin:6px 0;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #ededed,
      #f7f7f7,
      #ededed
    );

  background-size:200% 100%;

  animation:chatShimmer 1.2s infinite;
}

.chat-skeleton-line.small{
  width:45%;
}

@keyframes chatShimmer{
  to{
    background-position:-200% 0;
  }
}

/* =========================================================
   TOAST
========================================================= */

#chatToast{
  position:fixed;

  left:50%;

  bottom:
    calc(75px + env(safe-area-inset-bottom));

  transform:translateX(-50%) translateY(10px);

  z-index:11000;

  max-width:calc(100% - 30px);

  padding:11px 15px;

  border-radius:13px;

  background:#111;

  color:#fff;

  font-size:12px;
  font-weight:650;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .2s,
    transform .2s;
}

#chatToast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:560px){

  #chatPage{
    max-width:none;
  }

  .chat-bubble{
    max-width:83%;
  }

}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:561px){

  #chatPage{
    border-radius:24px;

    top:20px;
    bottom:20px;

    height:calc(100vh - 40px);

    box-shadow:
      0 20px 70px rgba(0,0,0,.12);
  }

}

/* =========================================================
   DARK MODE
========================================================= */

body.dark #chatPage,
body.dark-mode #chatPage,
#chatPage.chat-dark{

  --chat-bg:#0d0d0f;
  --chat-surface:#151517;
  --chat-soft:#222225;
  --chat-border:#2b2b2f;
  --chat-text:#f5f5f5;
  --chat-muted:#99999f;
}

body.dark #chatPage .chat-inbox-header,
body.dark-mode #chatPage .chat-inbox-header,
#chatPage.chat-dark .chat-inbox-header,

body.dark #chatPage .chat-top,
body.dark-mode #chatPage .chat-top,
#chatPage.chat-dark .chat-top,

body.dark #chatPage .chat-composer,
body.dark-mode #chatPage .chat-composer,
#chatPage.chat-dark .chat-composer{

  background:rgba(20,20,22,.96);
}

body.dark #chatPage #chatMessages,
body.dark-mode #chatPage #chatMessages,
#chatPage.chat-dark #chatMessages{
  background:#151517;
}

body.dark #chatPage #chatSearch,
body.dark-mode #chatPage #chatSearch,
#chatPage.chat-dark #chatSearch{

  background:#242428;

  color:#fff;
}

body.dark #chatPage #chatSearch:focus,
body.dark-mode #chatPage #chatSearch:focus,
#chatPage.chat-dark #chatSearch:focus{

  background:#1b1b1e;
}

body.dark #chatPage .theirs .chat-bubble,
body.dark-mode #chatPage .theirs .chat-bubble,
#chatPage.chat-dark .theirs .chat-bubble{

  background:#29292d;

  color:#fff;
}

body.dark #chatPage #chatInput,
body.dark-mode #chatPage #chatInput,
#chatPage.chat-dark #chatInput{

  background:#1e1e21;

  color:#fff;

  border-color:#36363a;
}

body.dark #chatPage .chat-user-row:hover,
body.dark-mode #chatPage .chat-user-row:hover,
#chatPage.chat-dark .chat-user-row:hover{

  background:#202023;
}

body.dark #chatPage .chat-icon-btn,
body.dark-mode #chatPage .chat-icon-btn,
#chatPage.chat-dark .chat-icon-btn{

  background:#29292d;

  color:#fff;
}

body.dark #chatPage .chat-reaction,
body.dark-mode #chatPage .chat-reaction,
#chatPage.chat-dark .chat-reaction{

  background:#222225;

  border-color:#3b3b40;
}

body.dark #chatPage #reactionMenu,
body.dark-mode #chatPage #reactionMenu,
#chatPage.chat-dark #reactionMenu,

body.dark #chatPage .chat-message-menu,
body.dark-mode #chatPage .chat-message-menu,
#chatPage.chat-dark .chat-message-menu{

  background:#202023;

  border-color:#3b3b40;
}

body.dark #chatPage .chat-message-menu button,
body.dark-mode #chatPage .chat-message-menu button,
#chatPage.chat-dark .chat-message-menu button{

  background:#202023;

  color:#fff;
}
</style>


<!-- =========================================================
     CHAT PAGE
========================================================= -->

<div id="chatPage">

  <!-- ================= INBOX ================= -->

  <section id="chatInbox">

    <div class="chat-inbox-header">

      <div>
        <div>Messages</div>

        <div class="chat-header-subtitle">
          Your conversations
        </div>
      </div>

    </div>


    <div class="chat-search-wrap">

      <div class="chat-search-box">

        <span class="chat-search-icon">
          ⌕
        </span>

        <input
          id="chatSearch"
          type="search"
          placeholder="Search people or messages"
          autocomplete="off"
          enterkeyhint="search"
        >

      </div>

    </div>


    <div id="chatUsers">

      <div class="chat-loading">

        <div class="chat-skeleton">
          <div class="chat-skeleton-avatar"></div>

          <div class="chat-skeleton-lines">
            <div class="chat-skeleton-line"></div>
            <div class="chat-skeleton-line small"></div>
          </div>
        </div>

        <div class="chat-skeleton">
          <div class="chat-skeleton-avatar"></div>

          <div class="chat-skeleton-lines">
            <div class="chat-skeleton-line"></div>
            <div class="chat-skeleton-line small"></div>
          </div>
        </div>

      </div>

    </div>

  </section>


  <!-- ================= CONVERSATION ================= -->

  <section id="chatConversation">

    <header class="chat-top">

      <button
        id="chatBackBtn"
        class="chat-back"
        type="button"
        aria-label="Back"
      >
        ‹
      </button>


      <div class="chat-avatar-wrap">

        <img
          id="chatHeaderAvatar"
          class="chat-avatar"
          src=""
          alt=""
        >

        <span
          id="chatHeaderOnline"
          class="chat-online-dot"
          style="display:none"
        ></span>

      </div>


      <div class="chat-user-info">

        <div
          id="chatHeaderName"
          class="chat-user-name"
        >
          Chat
        </div>

        <div
          id="chatHeaderStatus"
          class="chat-user-status"
        >
          Message
        </div>

      </div>

    </header>


    <div id="chatMessages"></div>


    <div id="chatTyping"></div>


    <div id="chatReplyBar">

      <div class="chat-reply-text">

        <div class="chat-reply-title">
          Replying to message
        </div>

        <div id="chatReplyContent"></div>

      </div>

      <button
        id="cancelReply"
        type="button"
        aria-label="Cancel reply"
      >
        ×
      </button>

    </div>


    <div class="chat-composer">

<script>
/* =========================================================
   POLL PULSE CHAT ENGINE V2
========================================================= */

(function(){

  "use strict";


  /* =======================================================
     SUPABASE
  ======================================================= */

  if(typeof supabase === "undefined"){

    console.error(
      "Supabase JS library not found."
    );

    return;

  }


  const chatSB =
    window.sb ||
    window.supabaseClient ||
    window.supabaseClientInstance ||
    supabase.createClient(
      "https://dbpbkvfaxgifjeveijqf.supabase.co",
      "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7"
    );


  /* =======================================================
     STATE
  ======================================================= */

  let chatCurrentUser = null;

  let chatTargetUser = null;

  let chatMessages = [];

  let chatProfileCache = {};

  let chatReplyTo = null;

  let chatReactionMessage = null;

  let chatChannel = null;

  let presenceTimer = null;

  let inboxTimer = null;

  let typingClearTimer = null;

  let searchText = "";


  const $ = id =>
    document.getElementById(id);


  /* =======================================================
     TOAST
  ======================================================= */

  function toast(message){

    const el = $("chatToast");

    if(!el) return;

    el.textContent = message;

    el.classList.add("show");

    clearTimeout(
      toast.timer
    );

    toast.timer =
      setTimeout(
        () => {

          el.classList.remove(
            "show"
          );

        },
        2200
      );

  }


  /* =======================================================
     HTML ESCAPE
  ======================================================= */

  function escapeHTML(value){

    return String(
      value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

  }


  /* =======================================================
     TIME
  ======================================================= */

  function timeText(date){

    if(!date) return "";

    const d =
      new Date(date);

    return d.toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }


  function dateText(date){

    if(!date) return "";

    const d =
      new Date(date);

    const now =
      new Date();

    const today =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

    const target =
      new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
      );

    const diff =
      Math.round(
        (today - target) /
        86400000
      );


    if(diff === 0)
      return "Today";

    if(diff === 1)
      return "Yesterday";


    return d.toLocaleDateString(
      [],
      {
        day:"numeric",
        month:"short",
        year:
          d.getFullYear() !==
          now.getFullYear()
            ? "numeric"
            : undefined
      }
    );

  }


  /* =======================================================
     DEFAULT AVATAR
  ======================================================= */

  function defaultAvatar(){

    return "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100"
          height="100"
          viewBox="0 0 100 100"
        >

          <rect
            width="100"
            height="100"
            fill="#e9e9eb"
          />

          <circle
            cx="50"
            cy="37"
            r="18"
            fill="#aaa"
          />

          <path
            d="M19 91c4-22 17-32 31-32s27 10 31 32"
            fill="#aaa"
          />

        </svg>
      `);

  }


  function avatarURL(profile){

    return (
      profile?.avatar_url ||
      defaultAvatar()
    );

  }


  function displayName(profile){

    return (
      profile?.display_name ||
      profile?.username ||
      "User"
    );

  }


  /* =======================================================
     CURRENT USER
  ======================================================= */

  async function getCurrentUser(){

    const {
      data,
      error
    } =
      await chatSB.auth.getUser();


    if(error){

      console.error(
        "Auth error:",
        error
      );

      return null;

    }


    return data?.user || null;

  }


  /* =======================================================
     PROFILE
  ======================================================= */

  async function getProfile(id){

    if(!id)
      return null;


    if(chatProfileCache[id])
      return chatProfileCache[id];


    const {
      data,
      error
    } =
      await chatSB
        .from("profiles")
        .select(
          "id,username,display_name,avatar_url"
        )
        .eq("id",id)
        .maybeSingle();


    if(error){

      console.error(
        "Profile error:",
        error
      );

      return null;

    }


    if(data)
      chatProfileCache[id] = data;


    return data;

  }


  /* =======================================================
     OPEN CHAT
  ======================================================= */

  async function openChat(userId){

    chatCurrentUser =
      chatCurrentUser ||
      await getCurrentUser();


    if(!chatCurrentUser){

      toast(
        "Please login first."
      );

      return;

    }


    if(
      !userId ||
      userId === chatCurrentUser.id
    ){

      return;

    }


    chatTargetUser =
      await getProfile(userId);


    if(!chatTargetUser){

      toast(
        "User profile not found."
      );

      return;

    }


    $("chatPage")
      .classList.add("active");


    $("chatInbox")
      .style.display = "none";


    $("chatConversation")
      .classList.add("active");


    $("chatHeaderAvatar")
      .src =
      avatarURL(
        chatTargetUser
      );


    $("chatHeaderName")
      .textContent =
      displayName(
        chatTargetUser
      );


    $("chatHeaderStatus")
      .textContent =
      "Loading...";


    await loadConversation();

    await updateOnlineStatus();

    subscribeConversation();

  }


  /* =======================================================
     CLOSE CONVERSATION
  ======================================================= */

  function closeChatConversation(){

    if(chatChannel){

      chatSB.removeChannel(
        chatChannel
      );

      chatChannel = null;

    }


    chatTargetUser = null;

    chatReplyTo = null;

    $("chatConversation")
      .classList.remove("active");


    $("chatInbox")
      .style.display = "flex";


    loadInbox();

  }


  /* =======================================================
     CLOSE CHAT
  ======================================================= */

  function closeChatPage(){

    if(chatChannel){

      chatSB.removeChannel(
        chatChannel
      );

      chatChannel = null;

    }


    $("chatPage")
      .classList.remove("active");


    $("chatConversation")
      .classList.remove("active");


    $("chatInbox")
      .style.display = "flex";


    chatTargetUser = null;

    chatReplyTo = null;

  }


  /* =======================================================
     INBOX LOADING
  ======================================================= */

  async function loadInbox(){

    chatCurrentUser =
      chatCurrentUser ||
      await getCurrentUser();


    if(!chatCurrentUser)
      return;


    const {
      data:messages,
      error
    } =
      await chatSB
        .from("messages")
        .select(`
          id,
          sender_id,
          receiver_id,
          message,
          message_type,
          created_at,
          read,
          deleted_at
        `)
        .or(
          `sender_id.eq.${chatCurrentUser.id},receiver_id.eq.${chatCurrentUser.id}`
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(500);


    if(error){

      console.error(
        "Inbox error:",
        error
      );

      return;

    }


    const conversations = {};

    const partnerIds =
      new Set();


    (messages || [])
      .forEach(message => {

        const partner =
          message.sender_id ===
          chatCurrentUser.id
            ? message.receiver_id
            : message.sender_id;


        if(!partner)
          return;


        partnerIds.add(
          partner
        );


        if(!conversations[partner]){

          conversations[partner] = {

            latest:message,

            unread:0

          };

        }


        if(
          message.receiver_id ===
          chatCurrentUser.id &&
          message.read === false
        ){

          conversations[
            partner
          ].unread++;

        }

      });


    /* Include followers/following */

    try{

      const {
        data:follows
      } =
        await chatSB
          .from("follows")
          .select(
            "follower_id,following_id"
          )
          .or(
            `follower_id.eq.${chatCurrentUser.id},following_id.eq.${chatCurrentUser.id}`
          )
          .limit(300);


      (follows || [])
        .forEach(f => {

          const id =
            f.follower_id ===
            chatCurrentUser.id
              ? f.following_id
              : f.follower_id;


          if(id)
            partnerIds.add(id);

        });

    }catch(error){

      console.warn(
        "Follow lookup skipped:",
        error
      );

    }


    if(!partnerIds.size){

      renderEmptyInbox();

      return;

    }


    const ids =
      Array.from(partnerIds);


    const {
      data:profiles
    } =
      await chatSB
        .from("profiles")
        .select(
          "id,username,display_name,avatar_url"
        )
        .in("id",ids);


    (profiles || [])
      .forEach(profile => {

        chatProfileCache[
          profile.id
        ] = profile;

      });


    const rows =
      ids
        .map(id => {

          const profile =
            chatProfileCache[id];


          if(!profile)
            return null;


          return {

            id,

            profile,

            conversation:
              conversations[id]

          };

        })
        .filter(Boolean)
        .sort((a,b) => {

          const aDate =
            a.conversation
              ?.latest
              ?.created_at;


          const bDate =
            b.conversation
              ?.latest
              ?.created_at;


          if(!aDate && !bDate)
            return displayName(a.profile)
              .localeCompare(
                displayName(b.profile)
              );


          if(!aDate)
            return 1;


          if(!bDate)
            return -1;


          return (
            new Date(bDate) -
            new Date(aDate)
          );

        });


    renderInbox(rows);

  }


  /* =======================================================
     EMPTY INBOX
  ======================================================= */

  function renderEmptyInbox(){

    $("chatUsers").innerHTML = `

      <div class="chat-empty">

        <div class="chat-empty-icon">
          💬
        </div>

        <div class="chat-empty-title">
          No conversations yet
        </div>

        <div class="chat-empty-text">
          Start a conversation with someone
          you follow.
        </div>

      </div>

    `;

  }


  /* =======================================================
     INBOX RENDER
  ======================================================= */

  function renderInbox(rows){

    const filtered =
      rows.filter(row => {

        if(!searchText)
          return true;


        const profile =
          row.profile;


        const latest =
          row.conversation?.latest;


        const haystack = (

          displayName(profile) +
          " " +
          (profile.username || "") +
          " " +
          (latest?.message || "")

        ).toLowerCase();


        return haystack.includes(
          searchText.toLowerCase()
        );

      });


    if(!filtered.length){

      $("chatUsers").innerHTML = `

        <div class="chat-empty">

          <div class="chat-empty-icon">
            🔎
          </div>

          <div class="chat-empty-title">
            No results
          </div>

          <div class="chat-empty-text">
            Try another name or message.
          </div>

        </div>

      `;

      return;

    }


    $("chatUsers").innerHTML =
      filtered.map(row => {

        const profile =
          row.profile;

        const latest =
          row.conversation?.latest;

        const unread =
          row.conversation?.unread || 0;


        let preview =
          "Start a conversation";


        if(latest){

          if(latest.deleted_at){

            preview =
              "Message deleted";

          }

          else if(
            latest.message_type ===
            "image"
          ){

            preview =
              "📷 Photo";

          }

          else{

            preview =
              latest.message ||
              "Message";

          }

        }


        return `

          <div
            class="chat-user-row"
            data-user-id="${escapeHTML(row.id)}"
          >

            <div class="chat-row-avatar">

              <img
                class="chat-avatar"
                src="${avatarURL(profile)}"
                alt=""
              >

            </div>


            <div class="chat-row-info">

              <div class="chat-row-top">

                <span class="chat-row-name">
                  ${escapeHTML(
                    displayName(profile)
                  )}
                </span>


                ${
                  latest
                    ? `
                      <span class="chat-row-time">
                        ${timeText(
                          latest.created_at
                        )}
                      </span>
                    `
                    : ""
                }

              </div>


              <div class="chat-row-bottom">

                <span class="chat-last-message">

                  ${
                    latest &&
                    latest.sender_id ===
                    chatCurrentUser.id
                      ? "You: "
                      : ""
                  }

                  ${escapeHTML(preview)}

                </span>


                ${
                  unread
                    ? `
                      <span class="chat-unread">
                        ${
                          unread > 99
                            ? "99+"
                            : unread
                        }
                      </span>
                    `
                    : ""
                }

              </div>

            </div>

          </div>

        `;

      }).join("");


    document
      .querySelectorAll(
        ".chat-user-row"
      )
      .forEach(row => {

        row.addEventListener(
          "click",
          () => {

            openChat(
              row.dataset.userId
            );

          }
        );

      });

  }


  /* =======================================================
     LOAD CONVERSATION
  ======================================================= */

  async function loadConversation(){

    if(
      !chatTargetUser ||
      !chatCurrentUser
    )
      return;


    const {
      data,
      error
    } =
      await chatSB
        .from("messages")
        .select(`
          id,
          sender_id,
          receiver_id,
          message,
          message_type,
          media_url,
          reply_to,
          deleted_at,
          delivered_at,
          read,
          read_at,
          created_at
        `)
        .or(
          `and(sender_id.eq.${chatCurrentUser.id},receiver_id.eq.${chatTargetUser.id}),and(sender_id.eq.${chatTargetUser.id},receiver_id.eq.${chatCurrentUser.id})`
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        )
        .limit(500);


    if(error){

      console.error(
        "Conversation error:",
        error
      );


      $("chatMessages").innerHTML = `

        <div class="chat-empty">

          <div class="chat-empty-icon">
            ⚠️
          </div>

          <div class="chat-empty-title">
            Couldn't load messages
          </div>

          <div class="chat-empty-text">
            Please try again.
          </div>

        </div>

      `;

      return;

    }


    chatMessages =
      data || [];


    renderMessages();

    await markMessagesRead();

  }


  /* =======================================================
     RENDER MESSAGES
  ======================================================= */

  async function renderMessages(){

    const box =
      $("chatMessages");


    if(!chatMessages.length){

      box.innerHTML = `

        <div class="chat-empty">

          <div class="chat-empty-icon">
            👋
          </div>

          <div class="chat-empty-title">
            Say hello
          </div>

          <div class="chat-empty-text">
            Send a message and start the conversation.
          </div>

        </div>

      `;

      return;

    }


    const messageMap = {};


    chatMessages.forEach(message => {

      messageMap[
        String(message.id)
      ] = message;

    });


    box.innerHTML = "";


    let previousDate = "";


    for(
      const message of chatMessages
    ){

      const currentDate =
        dateText(
          message.created_at
        );


      if(
        currentDate !==
        previousDate
      ){

        const day =
          document.createElement(
            "div"
          );

        day.className =
          "chat-day";

        day.textContent =
          currentDate;

        box.appendChild(day);

        previousDate =
          currentDate;

      }


      const mine =
        message.sender_id ===
        chatCurrentUser.id;


      const line =
        document.createElement(
          "div"
        );

      line.className =
        "chat-message-line " +
        (
          mine
            ? "mine"
            : "theirs"
        );


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "chat-bubble";

      bubble.dataset.messageId =
        message.id;


      /* ================= REPLY ================= */

      if(message.reply_to){

        const replied =
          messageMap[
            String(message.reply_to)
          ];


        if(replied){

          let replyText =
            replied.message ||
            "Photo";


          if(
            replied.message_type ===
            "image"
          ){

            replyText =
              "📷 Photo";

          }


          const reply =
            document.createElement(
              "div"
            );

          reply.className =
            "chat-reply-preview";

          reply.textContent =
            replyText;


          bubble.appendChild(
            reply
          );

        }

      }


      /* ================= DELETED ================= */

      if(message.deleted_at){

        const deleted =
          document.createElement(
            "div"
          );

        deleted.textContent =
          "Message deleted";

        deleted.style.fontStyle =
          "italic";

        deleted.style.opacity =
          ".5";


        bubble.appendChild(
          deleted
        );

      }


      /* ================= IMAGE ================= */

      else if(
        message.message_type ===
        "image" &&
        message.media_url
      ){

        const img =
          document.createElement(
            "img"
          );

        img.className =
          "chat-photo";

        img.alt =
          "Photo";

        img.loading =
          "lazy";

        img.dataset.mediaPath =
          message.media_url;


        if(
          message.media_url
            .startsWith("http")
        ){

          img.src =
            message.media_url;

        }


        bubble.appendChild(
          img
        );

      }


      /* ================= TEXT ================= */

      else{

        const text =
          document.createElement(
            "div"
          );

        text.innerHTML =
          escapeHTML(
            message.message
          ).replace(
            /\n/g,
            "<br>"
          );


        bubble.appendChild(
          text
        );

      }


      /* ================= META ================= */

      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "chat-meta";


      let status = "";


      if(mine){

        if(message.read){

          status = "✓✓";

        }

        else if(
          message.delivered_at
        ){

          status = "✓✓";

        }

        else{

          status = "✓";

        }

      }


      meta.innerHTML = `

        <span>
          ${timeText(
            message.created_at
          )}
        </span>

        ${
          mine
            ? `<span>${status}</span>`
            : ""
        }

      `;


      bubble.appendChild(
        meta
      );


      /* ================= LONG PRESS ================= */

      let pressTimer = null;


      bubble.addEventListener(
        "contextmenu",
        event => {

          event.preventDefault();


          showMessageActions(
            message,
            event.clientX,
            event.clientY
          );

        }
      );


      bubble.addEventListener(
        "touchstart",
        event => {

          pressTimer =
            setTimeout(
              () => {

                const touch =
                  event.touches[0];


                showMessageActions(
                  message,
                  touch.clientX,
                  touch.clientY
                );

              },
              500
            );

        },
        {
          passive:true
        }
      );


      bubble.addEventListener(
        "touchend",
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      bubble.addEventListener(
        "touchmove",
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      line.appendChild(
        bubble
      );


      box.appendChild(
        line
      );


      /* ================= REACTIONS ================= */

      await renderReactions(
        message.id,
        line
      );

    }


    await hydrateImages();


    requestAnimationFrame(
      () => {

        box.scrollTop =
          box.scrollHeight;

      }
    );

  }


  /* =======================================================
     IMAGE URL
  ======================================================= */

  async function hydrateImages(){

    const images =
      document.querySelectorAll(
        "#chatMessages img[data-media-path]"
      );


    for(
      const img of images
    ){

      const path =
        img.dataset.mediaPath;


      if(
        !path ||
        path.startsWith("http")
      )
        continue;


      const {
        data,
        error
      } =
        await chatSB.storage
          .from("chat-media")
          .createSignedUrl(
            path,
            3600
          );


      if(
        !error &&
        data?.signedUrl
      ){

        img.src =
          data.signedUrl;

      }

    }

  }


  /* =======================================================
     REACTIONS RENDER
  ======================================================= */

  async function renderReactions(
    messageId,
    line
  ){

    const {
      data,
      error
    } =
      await chatSB
        .from("message_reactions")
        .select(
          "reaction,user_id"
        )
        .eq(
          "message_id",
          String(messageId)
        );


    if(error){

      return;

    }


    if(!data?.length)
      return;


    const counts = {};


    data.forEach(row => {

      counts[row.reaction] =
        (
          counts[row.reaction] ||
          0
        ) + 1;

    });


    const wrap =
      document.createElement(
        "div"
      );

    wrap.className =
      "chat-reactions";


    Object.entries(counts)
      .forEach(
        ([emoji,count]) => {

          const item =
            document.createElement(
              "span"
            );

          item.className =
            "chat-reaction";

          item.textContent =
            emoji +
            " " +
            count;

          wrap.appendChild(
            item
          );

        }
      );


    line.appendChild(
      wrap
    );

  }


  /* =======================================================
     ADD REACTION
  ======================================================= */

  async function addReaction(
    messageId,
    reaction
  ){

    if(!chatCurrentUser)
      return;


    const {
      data:existing
    } =
      await chatSB
        .from("message_reactions")
        .select(
          "id,reaction"
        )
        .eq(
          "message_id",
          String(messageId)
        )
        .eq(
          "user_id",
          chatCurrentUser.id
        )
        .maybeSingle();


    if(
      existing &&
      existing.reaction === reaction
    ){

      await chatSB
        .from("message_reactions")
        .delete()
        .eq(
          "id",
          existing.id
        );

    }

    else if(existing){

      await chatSB
        .from("message_reactions")
        .update({
          reaction
        })
        .eq(
          "id",
          existing.id
        );

    }

    else{

      const {
        error
      } =
        await chatSB
          .from("message_reactions")
          .insert({

            message_id:
              String(messageId),

            user_id:
              chatCurrentUser.id,

            reaction

          });


      if(error){

        console.error(
          "Reaction error:",
          error
        );

        toast(
          "Reaction failed."
        );

        return;

      }

    }


    hideReactionMenu();

    await loadConversation();

  }


  /* =======================================================
     REACTION MENU
  ======================================================= */

  function showReactionMenu(
    message,
    x,
    y
  ){

    chatReactionMessage =
      message;


    const menu =
      $("reactionMenu");


    menu.classList.add(
      "show"
    );


    const width =
      menu.offsetWidth ||
      250;


    const maxX =
      window.innerWidth -
      width -
      8;


    menu.style.left =
      Math.max(
        8,
        Math.min(
          x,
          maxX
        )
      ) + "px";


    menu.style.top =
      Math.max(
        8,
        y - 55
      ) + "px";

  }


  function hideReactionMenu(){

    $("reactionMenu")
      .classList.remove(
        "show"
      );


    chatReactionMessage =
      null;

  }


  /* =======================================================
     MESSAGE ACTIONS
  ======================================================= */

  function showMessageActions(
    message,
    x,
    y
  ){

    document
      .querySelectorAll(
        ".chat-message-menu"
      )
      .forEach(
        el => el.remove()
      );


    const menu =
      document.createElement(
        "div"
      );


    menu.className =
      "chat-message-menu";


    menu.innerHTML = `

      <button
        data-action="reply"
      >
        ↩ Reply
      </button>

      <button
        data-action="react"
      >
        ❤️ React
      </button>

      ${
        message.sender_id ===
        chatCurrentUser.id
          ? `
            <button
              class="danger"
              data-action="delete"
            >
              🗑 Delete
            </button>
          `
          : ""
      }

    `;


    document.body.appendChild(
      menu
    );


    const rect =
      menu.getBoundingClientRect();


    const left =
      Math.min(
        Math.max(
          8,
          x - rect.width / 2
        ),
        window.innerWidth -
          rect.width -
          8
      );


    const top =
      Math.min(
        Math.max(
          8,
          y - rect.height - 10
        ),
        window.innerHeight -
          rect.height -
          8
      );


    menu.style.left =
      left + "px";


    menu.style.top =
      top + "px";


    menu
      .querySelectorAll("button")
      .forEach(button => {

        button.addEventListener(
          "click",
          async event => {

            event.stopPropagation();


            const action =
              button.dataset.action;


            menu.remove();


            if(action === "reply"){

              startReply(
                message
              );

            }


            else if(
              action === "react"
            ){

              showReactionMenu(
                message,
                x,
                y
              );

            }


            else if(
              action === "delete"
            ){

              await deleteMessage(
                message
              );

            }

          }
        );

      });


    setTimeout(
      () => {

        function closeMenu(event){

          if(
            !menu.contains(
              event.target
            )
          ){

            menu.remove();

            document.removeEventListener(
              "click",
              closeMenu
            );

          }

        }


        document.addEventListener(
          "click",
          closeMenu
        );

      },
      30
    );

  }


  /* =======================================================
     SEND TEXT
  ======================================================= */

  async function sendMessage(){

    if(
      !chatCurrentUser ||
      !chatTargetUser
    )
      return;


    const input =
      $("chatInput");


    const text =
      input.value.trim();


    if(!text)
      return;


    const button =
      $("sendMessageBtn");


    button.disabled =
      true;


    const payload = {

      sender_id:
        chatCurrentUser.id,

      receiver_id:
        chatTargetUser.id,

      message:
        text,

      message_type:
        "text",

      reply_to:
        chatReplyTo
          ? String(
              chatReplyTo.id
            )
          : null

    };


    const {
      error
    } =
      await chatSB
        .from("messages")
        .insert(
          payload
        );


    button.disabled =
      false;


    if(error){

      console.error(
        "Send message error:",
        error
      );


      toast(
        "Message send nahi hua."
      );

      return;

    }


    input.value =
      "";

    input.style.height =
      "auto";


    cancelReply();


    await loadConversation();

  }


  /* =======================================================
     SEND IMAGE
  ======================================================= */

  async function sendImage(file){

    if(
      !file ||
      !chatCurrentUser ||
      !chatTargetUser
    )
      return;


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      toast(
        "Only images are allowed."
      );

      return;

    }


    if(
      file.size >
      8 * 1024 * 1024
    ){

      toast(
        "Image must be smaller than 8 MB."
      );

      return;

    }


    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const randomId =
      window.crypto?.randomUUID
        ? crypto.randomUUID()
        : Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .slice(2);


    const path =
      chatCurrentUser.id +
      "/" +
      randomId +
      "-" +
      safeName;


    toast(
      "Uploading photo..."
    );


    const {
      error:uploadError
    } =
      await chatSB.storage
        .from("chat-media")
        .upload(
          path,
          file,
          {
            contentType:
              file.type,

            upsert:false
          }
        );


    if(uploadError){

      console.error(
        "Upload error:",
        uploadError
      );


      toast(
        "Photo upload failed."
      );

      return;

    }


    const {
      error
    } =
      await chatSB
        .from("messages")
        .insert({

          sender_id:
            chatCurrentUser.id,

          receiver_id:
            chatTargetUser.id,

          message:
            "📷 Photo",

          message_type:
            "image",

          media_url:
            path,

          reply_to:
            chatReplyTo
              ? String(
                  chatReplyTo.id
                )
              : null

        });


    if(error){

      console.error(
        "Image message error:",
        error
      );


      toast(
        "Photo message failed."
      );

      return;

    }


    cancelReply();

    await loadConversation();

  }


  /* =======================================================
     READ RECEIPTS
  ======================================================= */

  async function markMessagesRead(){

    if(
      !chatCurrentUser ||
      !chatTargetUser
    )
      return;


    const unread =
      chatMessages.filter(
        message =>
          message.receiver_id ===
            chatCurrentUser.id &&

          message.sender_id ===
            chatTargetUser.id &&

          message.read === false
      );


    if(!unread.length)
      return;


    const ids =
      unread.map(
        message =>
          message.id
      );


    const {
      error
    } =
      await chatSB
        .from("messages")
        .update({

          read:true,

          read_at:
            new Date()
              .toISOString()

        })
        .in(
          "id",
          ids
        )
        .eq(
          "receiver_id",
          chatCurrentUser.id
        );


    if(error){

      console.warn(
        "Read receipt error:",
        error
      );

    }

  }


  /* =======================================================
     REPLY
  ======================================================= */

  function startReply(message){

    chatReplyTo =
      message;


    let text =
      message.message ||
      "Photo";


    if(
      message.message_type ===
      "image"
    ){

      text =
        "📷 Photo";

    }


    $("chatReplyContent")
      .textContent =
      text.length > 80
        ? text.slice(0,80) +
          "..."
        : text;


    $("chatReplyBar")
      .classList.add(
        "show"
      );


    $("chatInput")
      .focus();

  }


  function cancelReply(){

    chatReplyTo =
      null;


    $("chatReplyBar")
      .classList.remove(
        "show"
      );


    $("chatReplyContent")
      .textContent =
      "";

  }


  /* =======================================================
     DELETE MESSAGE
  ======================================================= */

  async function deleteMessage(
    message
  ){

    if(!chatCurrentUser)
      return;


    if(
      message.sender_id !==
      chatCurrentUser.id
    ){

      toast(
        "You can only delete your own message."
      );

      return;

    }


    if(
      !confirm(
        "Delete this message?"
      )
    )
      return;


    const {
      error
    } =
      await chatSB
        .from("messages")
        .update({

          deleted_at:
            new Date()
              .toISOString()

        })
        .eq(
          "id",
          message.id
        )
        .eq(
          "sender_id",
          chatCurrentUser.id
        );


    if(error){

      console.error(
        "Delete error:",
        error
      );


      toast(
        "Message delete nahi hua."
      );

      return;

    }


    toast(
      "Message deleted"
    );


    await loadConversation();

  }


  /* =======================================================
     REALTIME
  ======================================================= */

  function subscribeConversation(){

    if(
      !chatCurrentUser ||
      !chatTargetUser
    )
      return;


    if(chatChannel){

      chatSB.removeChannel(
        chatChannel
      );

      chatChannel =
        null;

    }


    const channelName =
      "chat-" +
      chatCurrentUser.id +
      "-" +
      chatTargetUser.id;


    chatChannel =
      chatSB
        .channel(
          channelName
        )


        /* ================= MESSAGES ================= */

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"messages"
          },
          payload => {

            const message =
              payload.new ||
              payload.old;


            if(!message)
              return;


            const relevant =
              (
                message.sender_id ===
                  chatCurrentUser.id &&
                message.receiver_id ===
                  chatTargetUser.id
              ) ||
              (
                message.sender_id ===
                  chatTargetUser.id &&
                message.receiver_id ===
                  chatCurrentUser.id
              );


            if(!relevant)
              return;


            loadConversation();

          }
        )


        /* ================= REACTIONS ================= */

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"message_reactions"
          },
          () => {

            loadConversation();

          }
        )


        /* ================= TYPING ================= */

        .on(
          "broadcast",
          {
            event:"typing"
          },
          payload => {

            if(
              payload.payload
                ?.user_id !==
              chatTargetUser.id
            )
              return;


            $("chatTyping")
              .textContent =
              displayName(
                chatTargetUser
              ) +
              " is typing...";


            clearTimeout(
              typingClearTimer
            );


            typingClearTimer =
              setTimeout(
                () => {

                  $("chatTyping")
                    .textContent =
                    "";

                },
                1800
              );

          }
        )


        .subscribe();

  }


  /* =======================================================
     TYPING
  ======================================================= */

  function sendTyping(){

    if(
      !chatChannel ||
      !chatCurrentUser ||
      !chatTargetUser
    )
      return;


    chatChannel.send({

      type:"broadcast",

      event:"typing",

      payload:{

        user_id:
          chatCurrentUser.id

      }

    });

  }


  /* =======================================================
     PRESENCE
  ======================================================= */

  async function updatePresence(){

    if(!chatCurrentUser)
      return;


    const {
      error
    } =
      await chatSB
        .from("user_presence")
        .upsert({

          user_id:
            chatCurrentUser.id,

          is_online:true,

          last_seen:
            new Date()
              .toISOString()

        });


    if(error){

      console.warn(
        "Presence error:",
        error
      );

    }

  }


  async function updateOnlineStatus(){

    if(!chatTargetUser)
      return;


    const {
      data,
      error
    } =
      await chatSB
        .from("user_presence")
        .select(
          "is_online,last_seen"
        )
        .eq(
          "user_id",
          chatTargetUser.id
        )
        .maybeSingle();


    if(error){

      $("chatHeaderStatus")
        .textContent =
        "Message";

      return;

    }


    const dot =
      $("chatHeaderOnline");


    const status =
      $("chatHeaderStatus");


    if(data?.is_online){

      dot.style.display =
        "block";

      status.textContent =
        "Active now";

      return;

    }


    dot.style.display =
      "none";


    if(data?.last_seen){

      const lastSeen =
        new Date(
          data.last_seen
        );


      const diff =
        Date.now() -
        lastSeen.getTime();


      if(
        diff <
        86400000
      ){

        status.textContent =
          "Active " +
          timeText(
            data.last_seen
          );

      }

      else{

        status.textContent =
          "Active recently";

      }

    }

    else{

      status.textContent =
        "Message";

    }

  }


  /* =======================================================
     EVENT LISTENERS
  ======================================================= */

  $("chatBackBtn")
    .addEventListener(
      "click",
      closeChatConversation
    );


  $("cancelReply")
    .addEventListener(
      "click",
      cancelReply
    );


  $("sendMessageBtn")
    .addEventListener(
      "click",
      sendMessage
    );


  $("chatInput")
    .addEventListener(
      "input",
      () => {

        const input =
          $("chatInput");


        input.style.height =
          "auto";


        input.style.height =
          Math.min(
            input.scrollHeight,
            110
          ) + "px";


        sendTyping();

      }
    );


  $("chatInput")
    .addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Enter" &&
          !event.shiftKey
        ){

          event.preventDefault();

          sendMessage();

        }

      }
    );


  $("chatImageInput")
    .addEventListener(
      "change",
      async event => {

        const file =
          event.target.files?.[0];


        if(file){

          await sendImage(
            file
          );

        }


        event.target.value =
          "";

      }
    );


  $("chatSearch")
    .addEventListener(
      "input",
      event => {

        searchText =
          event.target.value.trim();


        loadInbox();

      }
    );


  document
    .querySelectorAll(
      ".reaction-choice"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          if(
            !chatReactionMessage
          )
            return;


          await addReaction(
            chatReactionMessage.id,
            button.dataset.reaction
          );

        }
      );

    });


  document.addEventListener(
    "click",
    event => {

      if(
        !event.target.closest(
          "#reactionMenu"
        )
      ){

        hideReactionMenu();

      }

    }
  );


  /* =======================================================
     ONLINE / OFFLINE
  ======================================================= */

  window.addEventListener(
    "beforeunload",
    () => {

      /*
        Keep last_seen accurate.
        We don't mark offline here because
        mobile browsers may kill the page
        before the request completes.
      */

      if(
        chatCurrentUser
      ){

        chatSB
          .from("user_presence")
          .update({

            is_online:false,

            last_seen:
              new Date()
                .toISOString()

          })
          .eq(
            "user_id",
            chatCurrentUser.id
          );

      }

    }
  );


  /* =======================================================
     PUBLIC API
  ======================================================= */

  window.openChat =
    openChat;


  window.closeChat =
    closeChatPage;


  window.loadChatInbox =
    loadInbox;


  window.closeChatConversation =
    closeChatConversation;


  window.ppChatToast =
    toast;


  /* =======================================================
     INITIALIZE
  ======================================================= */

  async function initChat(){

    chatCurrentUser =
      await getCurrentUser();


    if(!chatCurrentUser)
      return;


    await updatePresence();

    await loadInbox();


    /* Presence heartbeat */

    presenceTimer =
      setInterval(
        updatePresence,
        30000
      );


    /* Inbox refresh */

    inboxTimer =
      setInterval(
        () => {

          if(
            $("chatPage")
              .classList
              .contains("active") &&
            !chatTargetUser
          ){

            loadInbox();

          }

        },
        15000
      );

  }


  initChat();


})();
</script>

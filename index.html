
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090912">
  <title>Vex Agent</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090912;
      --panel: #131321;
      --panel2: #1b1a2b;
      --accent: #8d6cff;
      --text: #f6f3ff;
      --muted: #a9a4bf;
      --border: rgba(255,255,255,.09);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body { overflow: hidden; }

    button, input { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }

    .app {
      width: 100%;
      max-width: 760px;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(ellipse at top, #7955ff1c, transparent 45%),
        var(--bg);
      padding-top: env(safe-area-inset-top);
    }

    .topbar {
      min-height: 58px;
      padding: 8px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: #090912f5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .logo {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #775bff, #ce78ff);
      font-size: 21px;
      font-weight: 900;
    }

    .brand-name { font-size: 16px; font-weight: 800; }
    .status { margin-top: 2px; color: #91e5b1; font-size: 10px; }

    .small-btn {
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--panel2);
      font-size: 11px;
    }

    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .welcome {
      padding: 19px 12px 11px;
      text-align: center;
      flex-shrink: 0;
    }

    .orb {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      margin: 0 auto 9px;
      border-radius: 16px;
      background: linear-gradient(145deg, #7658f6, #c471ee);
      box-shadow: 0 8px 28px #8d6cff30;
      font-size: 23px;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(21px, 5vw, 28px);
      letter-spacing: -.5px;
    }

    .welcome p {
      max-width: 320px;
      margin: 6px auto 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      padding: 0 11px 9px;
      flex-shrink: 0;
    }

    .suggestion {
      min-width: 0;
      min-height: 40px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff08;
      color: #eee8ff;
      text-align: left;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .suggestion:active, .small-btn:active {
      background: #322749;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      width: fit-content;
      max-width: 90%;
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #7052e8, #9858d9);
      border-bottom-right-radius: 5px;
    }

    .composer-wrap {
      flex-shrink: 0;
      padding: 8px 10px calc(9px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: #090912;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px;
      border: 1px solid #373047;
      border-radius: 17px;
      background: #151421;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 7px;
      border: none;
      outline: none;
      color: white;
      background: transparent;
      font-size: 16px;
    }

    .composer input::placeholder { color: #88839e; }

    .icon-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 12px;
      color: white;
      background: #29263b;
      font-size: 18px;
    }

    .send-btn {
      background: linear-gradient(135deg, #8064ff, #ad63e9);
    }

    .hint {
      margin-top: 7px;
      text-align: center;
      color: #77728e;
      font-size: 10px;
    }

    .auth-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
      background: var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
      padding: 22px 19px;
      border: 1px solid var(--border);
      border-radius: 21px;
      background: var(--panel);
    }

    .auth-card h2 { margin: 0 0 7px; font-size: 24px; }
    .auth-card p { margin: 0 0 15px; color: var(--muted); font-size: 13px; }

    .auth-card input {
      width: 100%;
      height: 46px;
      margin: 6px 0;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      color: white;
      background: #0c0c16;
      font-size: 16px;
    }

    .primary-btn {
      width: 100%;
      min-height: 45px;
      margin-top: 9px;
      border: none;
      border-radius: 11px;
      color: white;
      background: linear-gradient(135deg, #8064ff, #ad63e9);
      font-weight: 700;
    }

    .auth-links { display: flex; gap: 8px; margin-top: 11px; }

    .auth-links button {
      flex: 1;
      min-height: 41px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      background: var(--panel2);
      font-size: 12px;
    }

    #authStatus {
      margin-top: 12px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (min-width: 600px) {
      .app {
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }

      .welcome { padding-top: 30px; }
      .messages { padding-left: 22px; padding-right: 22px; }
      .suggestions { padding-left: 22px; padding-right: 22px; }
      .composer-wrap { padding-left: 18px; padding-right: 18px; }
    }

    @media (max-height: 620px) {
      .welcome { padding-top: 7px; padding-bottom: 6px; }
      .orb { width: 38px; height: 38px; font-size: 19px; margin-bottom: 5px; }
      .welcome p { margin-top: 3px; }
      .suggestions { gap: 5px; padding-bottom: 5px; }
      .suggestion { min-height: 34px; padding: 5px 7px; }
    }
  </style>
</head>

<body>
  <section class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="logo" style="margin-bottom:15px">V</div>
      <h2 id="authTitle">Welcome to Vex</h2>
      <p>Your personal command assistant.</p>

      <input id="email" type="email" placeholder="Email address" autocomplete="email">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">

      <button class="primary-btn" id="authSubmit" onclick="authenticate()">Login</button>

      <div class="auth-links">
        <button onclick="setAuthMode('login')">Login</button>
        <button onclick="setAuthMode('signup')">Create account</button>
      </div>

      <div id="authStatus" role="status"></div>
    </div>
  </section>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">V</div>
        <div>
          <div class="brand-name">Vex Agent</div>
          <div class="status">● Command engine ready</div>
        </div>
      </div>

      <div style="display:flex;gap:6px">
        <button class="small-btn" onclick="clearChat()">New chat</button>
        <button class="small-btn" onclick="showAuth()">Account</button>
      </div>
    </header>

    <main class="main">
      <section class="welcome" id="welcome">
        <div class="orb">✦</div>
        <h1>What can I do for you?</h1>
        <p>Type or speak a supported command to get started.</p>
      </section>

      <section class="suggestions" id="suggestions">
        <button class="suggestion" onclick="runCommand('camera kholo')">📷 Open camera</button>
        <button class="suggestion" onclick="runCommand('settings kholo')">⚙️ Open settings</button>
        <button class="suggestion" onclick="runCommand('calculator kholo')">🧮 Open calculator</button>
        <button class="suggestion" onclick="runCommand('help')">✦ What can you do?</button>
      </section>

      <section class="messages" id="messages" aria-live="polite"></section>

      <section class="composer-wrap">
        <form class="composer" id="chatForm">
          <button class="icon-btn" type="button" id="micBtn" aria-label="Voice input">🎙</button>
          <input id="messageInput" type="text" placeholder="Ask Vex or type a command..." autocomplete="off" enterkeyhint="send">
          <button class="icon-btn send-btn" type="submit" aria-label="Send">➤</button>
        </form>
        <div class="hint">Rule-based commands • Android actions not connected</div>
      </section>
    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://dbpbkvfaxgifjeveijqf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false
        }
      }
    );

    let authMode = "login";
    let recognition = null;
    let isListening = false;

    function understandCommand(input) {
      const text = input.toLowerCase().trim()
        .replace(/[.,!?।]/g, "")
        .replace(/\s+/g, " ");

      const commands = [
        {
          patterns: ["open settings", "settings kholo", "setting kholo",
            "सेटिंग्स खोलो", "सेटिंग खोलो"],
          action: "open_settings",
          message: "Settings kholne ki request samajh gaya. Actual action abhi connect nahi hai."
        },
        {
          patterns: ["open camera", "camera kholo", "कैमरा खोलो",
            "camera open karo"],
          action: "open_camera",
          message: "Camera kholne ki request samajh gaya. Actual action abhi connect nahi hai."
        },
        {
          patterns: ["open calculator", "calculator kholo",
            "कैलकुलेटर खोलो", "calculator open karo"],
          action: "open_calculator",
          message: "Calculator kholne ki request samajh gaya. Actual action abhi connect nahi hai."
        },
        {
          patterns: ["help", "madad karo", "what can you do",
            "tum kya kar sakte ho", "मदद करो"],
          action: "show_help",
          message: "Abhi main camera, settings aur calculator commands pehchan sakta hoon. Actual phone control ke liye Android integration chahiye."
        }
      ];

      const match = commands.find(command => command.patterns.includes(text));

      if (!match) {
        return {
          success: false,
          action: "unknown",
          message: "Ye command abhi supported nahi hai. Supported commands dekhne ke liye 'help' likho."
        };
      }

      return {
        success: true,
        action: match.action,
        message: match.message
      };
    }

    function addMessage(text, sender) {
      const messages = document.getElementById("messages");
      const bubble = document.createElement("div");
      bubble.className = "message " + sender;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
    }

    function runCommand(text) {
      document.getElementById("messageInput").value = text;
      sendMessage(text);
    }

    function sendMessage(forcedText) {
      const input = document.getElementById("messageInput");
      const text = (forcedText ?? input.value).trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      document.getElementById("welcome").style.display = "none";
      document.getElementById("suggestions").style.display = "none";

      const result = understandCommand(text);
      window.setTimeout(() => addMessage(result.message, "bot"), 100);
    }

    document.getElementById("chatForm").addEventListener("submit", event => {
      event.preventDefault();
      sendMessage();
    });

    function clearChat() {
      document.getElementById("messages").replaceChildren();
      document.getElementById("welcome").style.display = "";
      document.getElementById("suggestions").style.display = "";
      document.getElementById("messageInput").focus();
    }

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById("authTitle").textContent =
        mode === "signup" ? "Create your Vex account" : "Welcome to Vex";
      document.getElementById("authSubmit").textContent =
        mode === "signup" ? "Create account" : "Login";
      document.getElementById("authStatus").textContent = "";
      document.getElementById("authStatus").style.color = "#ffb8c1";
    }

    function showAuth() {
      document.getElementById("authScreen").style.display = "flex";
    }

    async function authenticate() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const status = document.getElementById("authStatus");
      const button = document.getElementById("authSubmit");

      if (!email || !password) {
        status.textContent = "Email aur password dono enter karo.";
        return;
      }

      button.disabled = true;
      button.textContent = "Please wait...";
      status.textContent = "";

      try {
        let result;

        if (authMode === "signup") {
          result = await supabaseClient.auth.signUp({ email, password });
        } else {
          result = await supabaseClient.auth.signInWithPassword({ email, password });
        }

        if (result.error) throw result.error;

        if (authMode === "signup" && !result.data.session) {
          status.style.color = "#9ee7bb";
          status.textContent = "Account bana. Email verification check karo.";
        } else {
          document.getElementById("authScreen").style.display = "none";
          addMessage("Welcome! Vex Agent ready hai.", "bot");
        }
      } catch (error) {
        status.textContent = error.message || "Authentication failed.";
      } finally {
        button.disabled = false;
        button.textContent = authMode === "signup" ? "Create account" : "Login";
      }
    }

    async function checkSession() {
      try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (!data.session) showAuth();
      } catch (error) {
        console.error("Session check failed:", error);
        showAuth();
      }
    }

    document.getElementById("micBtn").addEventListener("click", () => {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        addMessage("Voice input is browser mein supported nahi hai. Command type karo.", "bot");
        return;
      }

      if (isListening && recognition) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "hi-IN";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById("micBtn").textContent = "⏹";
      };

      recognition.onresult = event => {
        document.getElementById("messageInput").value =
          event.results[0][0].transcript;
      };

      recognition.onerror = () => {
        addMessage("Voice input nahi chala. Command type karke try karo.", "bot");
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById("micBtn").textContent = "🎙";
      };

      try {
        recognition.start();
      } catch (error) {
        addMessage("Mic start nahi hua. Dobara try karo.", "bot");
      }
    });

    checkSession();
  </script>
</body>
</html>

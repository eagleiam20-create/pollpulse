<!-- =========================================================
     POLL PULSE — PROFESSIONAL CHAT MODULE
     Replace your old Chat module with this entire block.
========================================================= -->

<style>
/* =========================================================
   ROOT
========================================================= */

#chatPage,
#chatPage * {
  box-sizing: border-box;
}

#chatPage {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  flex-direction: column;
  width: 100%;
  max-width: 560px;
  margin: auto;
  overflow: hidden;
  background: #fff;
  color: #111;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

#chatPage.active {
  display: flex;
}

/* =========================================================
   INBOX
========================================================= */

#chatInbox {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  background: #fff;
}

.chat-inbox-head {
  padding: 18px 18px 12px;
  background: #fff;
}

.chat-inbox-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.chat-inbox-title {
  font-size: 26px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -0.7px;
}

.chat-inbox-subtitle {
  margin-top: 6px;
  color: #8b8b8b;
  font-size: 12px;
}

.chat-new-btn {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: #111;
  color: #fff;
  cursor: pointer;
  font-size: 19px;
  transition: transform .18s ease, opacity .18s ease;
}

.chat-new-btn:active {
  transform: scale(.92);
}

.chat-search-wrap {
  padding: 4px 14px 12px;
}

.chat-search-box {
  position: relative;
}

.chat-search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: #888;
  font-size: 14px;
  pointer-events: none;
}

#chatSearch {
  width: 100%;
  height: 42px;
  border: 1px solid transparent;
  outline: 0;
  border-radius: 13px;
  padding: 0 13px 0 37px;
  background: #f3f3f4;
  color: #111;
  font: inherit;
  font-size: 14px;
  transition: .18s ease;
}

#chatSearch:focus {
  border-color: #d7d7d7;
  background: #fff;
}

#chatUsers {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.chat-user-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  min-height: 72px;
  cursor: pointer;
  transition: background .15s ease;
}

.chat-user-row:hover {
  background: #f7f7f7;
}

.chat-user-row:active {
  background: #eeeeee;
}

.chat-avatar-wrap {
  position: relative;
  width: 50px;
  height: 50px;
  flex: 0 0 50px;
}

.chat-avatar {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  object-fit: cover;
  background: #ededed;
}

.chat-online-dot {
  position: absolute;
  right: 0;
  bottom: 1px;
  width: 12px;
  height: 12px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: #22c55e;
  display: none;
}

.chat-row-info {
  min-width: 0;
  flex: 1;
}

.chat-row-top {
  display: flex;
  align-items: center;
  gap: 8px;
}

.chat-row-name {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 14px;
  font-weight: 700;
}

.chat-row-time {
  flex: 0 0 auto;
  color: #999;
  font-size: 10px;
}

.chat-row-bottom {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 4px;
}

.chat-last-message {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: #8b8b8b;
  font-size: 13px;
}

.chat-unread {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50px;
  background: #111;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.chat-empty {
  padding: 70px 25px;
  text-align: center;
  color: #999;
  font-size: 13px;
}

.chat-empty-icon {
  width: 58px;
  height: 58px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #f2f2f2;
  font-size: 24px;
}

.chat-empty-title {
  color: #222;
  font-size: 15px;
  font-weight: 700;
}

.chat-empty-text {
  margin-top: 5px;
  color: #999;
  font-size: 12px;
}

.chat-skeleton {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
}

.chat-skeleton-avatar,
.chat-skeleton-line {
  background:
    linear-gradient(
      90deg,
      #eeeeee 25%,
      #f7f7f7 50%,
      #eeeeee 75%
    );
  background-size: 200% 100%;
  animation: chatShimmer 1.2s infinite;
}

.chat-skeleton-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
}

.chat-skeleton-content {
  flex: 1;
}

.chat-skeleton-line {
  height: 10px;
  width: 65%;
  margin-bottom: 9px;
  border-radius: 10px;
}

.chat-skeleton-line.small {
  width: 42%;
}

@keyframes chatShimmer {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}

/* =========================================================
   CONVERSATION
========================================================= */

#chatConversation {
  display: none;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  background: #fff;
}

#chatConversation.active {
  display: flex;
}

.chat-top {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 64px;
  padding: 8px 12px;
  border-bottom: 1px solid #ededed;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(15px);
}

.chat-back {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #111;
  cursor: pointer;
  font-size: 30px;
  line-height: 1;
}

.chat-back:hover {
  background: #f3f3f3;
}

.chat-header-avatar-wrap {
  position: relative;
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
}

.chat-header-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  background: #eee;
}

.chat-header-info {
  min-width: 0;
  flex: 1;
}

.chat-header-name {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 15px;
  font-weight: 750;
}

.chat-header-status {
  margin-top: 2px;
  color: #888;
  font-size: 11px;
}

.chat-header-action {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  font-size: 19px;
}

/* =========================================================
   MESSAGES
========================================================= */

#chatMessages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 12px 8px;
  background:
    radial-gradient(
      circle at top,
      rgba(0,0,0,.025),
      transparent 35%
    ),
    #fff;
  overscroll-behavior: contain;
  scroll-behavior: smooth;
}

.chat-day {
  width: fit-content;
  margin: 15px auto;
  padding: 5px 10px;
  border-radius: 20px;
  background: #f2f2f2;
  color: #999;
  font-size: 10px;
  font-weight: 600;
}

.chat-message-line {
  display: flex;
  margin: 3px 0;
}

.chat-message-line.mine {
  justify-content: flex-end;
}

.chat-message-line.theirs {
  justify-content: flex-start;
}

.chat-bubble {
  position: relative;
  max-width: 78%;
  padding: 9px 12px;
  border-radius: 19px;
  font-size: 14px;
  line-height: 1.45;
  word-break: break-word;
  animation: chatMessageIn .16s ease-out;
}

@keyframes chatMessageIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.mine .chat-bubble {
  border-bottom-right-radius: 5px;
  background: #111;
  color: #fff;
}

.theirs .chat-bubble {
  border-bottom-left-radius: 5px;
  background: #eeeeef;
  color: #111;
}

.chat-text {
  white-space: normal;
}

.chat-deleted {
  font-style: italic;
  opacity: .55;
}

.chat-photo {
  display: block;
  width: auto;
  max-width: 245px;
  max-height: 320px;
  border-radius: 14px;
  object-fit: cover;
  cursor: pointer;
}

.chat-reply-preview {
  margin: -2px -2px 7px;
  padding: 7px 9px;
  border-left: 3px solid currentColor;
  border-radius: 7px;
  background: rgba(127,127,127,.13);
  font-size: 11px;
  opacity: .78;
}

.chat-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 4px;
  font-size: 9px;
  opacity: .58;
}

.chat-status-read {
  letter-spacing: -2px;
}

.chat-reactions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: -1px;
}

.mine .chat-reactions {
  justify-content: flex-end;
}

.chat-reaction {
  padding: 3px 7px;
  border: 1px solid #dedede;
  border-radius: 20px;
  background: #fff;
  color: #222;
  box-shadow: 0 2px 5px rgba(0,0,0,.06);
  font-size: 11px;
}

/* =========================================================
   TYPING
========================================================= */

#chatTyping {
  min-height: 19px;
  padding: 0 16px;
  color: #888;
  font-size: 10px;
}

.chat-typing-dots {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.chat-typing-dots span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #999;
  animation: typingDot 1s infinite;
}

.chat-typing-dots span:nth-child(2) {
  animation-delay: .15s;
}

.chat-typing-dots span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes typingDot {
  0%, 60%, 100% {
    transform: translateY(0);
  }
  30% {
    transform: translateY(-3px);
  }
}

/* =========================================================
   REPLY BAR
========================================================= */

#chatReplyBar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-top: 1px solid #ededed;
  background: #f7f7f7;
}

#chatReplyBar.show {
  display: flex;
}

.chat-reply-accent {
  width: 3px;
  height: 34px;
  flex: 0 0 3px;
  border-radius: 5px;
  background: #111;
}

.chat-reply-text {
  min-width: 0;
  flex: 1;
}

.chat-reply-title {
  font-size: 10px;
  font-weight: 800;
}

#chatReplyContent {
  margin-top: 2px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: #777;
  font-size: 11px;
}

#cancelReply {
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  font-size: 20px;
}

/* =========================================================
   COMPOSER
========================================================= */

.chat-composer {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid #ededed;
  background: #fff;
}

.chat-icon-btn {
  width: 39px;
  height: 39px;
  flex: 0 0 39px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 50%;
  background: #f1f1f2;
  color: #222;
  cursor: pointer;
  font-size: 18px;
}

.chat-icon-btn:active {
  transform: scale(.94);
}

#chatInput {
  width: 100%;
  min-width: 0;
  min-height: 40px;
  max-height: 115px;
  resize: none;
  outline: 0;
  border: 1px solid #dedede;
  border-radius: 21px;
  padding: 10px 13px;
  background: #fff;
  color: #111;
  font: inherit;
  font-size: 14px;
  line-height: 18px;
  overflow-y: auto;
}

#chatInput:focus {
  border-color: #bdbdbd;
}

#sendMessageBtn {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  border: 0;
  border-radius: 50%;
  background: #111;
  color: #fff;
  cursor: pointer;
  font-size: 17px;
  transition: transform .15s ease, opacity .15s ease;
}

#sendMessageBtn:active {
  transform: scale(.92);
}

#sendMessageBtn:disabled {
  opacity: .4;
  cursor: default;
}

/* =========================================================
   REACTION MENU
========================================================= */

#reactionMenu {
  position: fixed;
  z-index: 10020;
  display: none;
  align-items: center;
  gap: 2px;
  padding: 5px 7px;
  border: 1px solid #e3e3e3;
  border-radius: 30px;
  background: rgba(255,255,255,.98);
  box-shadow: 0 10px 35px rgba(0,0,0,.17);
  backdrop-filter: blur(12px);
}

#reactionMenu.show {
  display: flex;
}

.reaction-choice {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  font-size: 19px;
  transition: transform .15s ease, background .15s ease;
}

.reaction-choice:hover {
  background: #f1f1f1;
  transform: scale(1.12);
}

/* =========================================================
   ACTION SHEET
========================================================= */

#chatActionOverlay {
  position: fixed;
  inset: 0;
  z-index: 10030;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0,0,0,.35);
}

#chatActionOverlay.show {
  display: flex;
}

.chat-action-sheet {
  width: min(100%, 560px);
  padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
  border-radius: 22px 22px 0 0;
  background: #fff;
  box-shadow: 0 -10px 40px rgba(0,0,0,.16);
  animation: actionUp .18s ease-out;
}

@keyframes actionUp {
  from {
    transform: translateY(20px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.chat-action-handle {
  width: 38px;
  height: 4px;
  margin: 3px auto 10px;
  border-radius: 10px;
  background: #ddd;
}

.chat-action-btn {
  width: 100%;
  height: 46px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  text-align: left;
  padding: 0 14px;
  color: #222;
  cursor: pointer;
  font: inherit;
  font-size: 14px;
}

.chat-action-btn:hover {
  background: #f4f4f4;
}

.chat-action-btn.danger {
  color: #d22;
}

/* =========================================================
   TOAST
========================================================= */

#chatToast {
  position: fixed;
  left: 50%;
  bottom: calc(75px + env(safe-area-inset-bottom));
  z-index: 10050;
  transform: translate(-50%, 15px);
  max-width: calc(100vw - 30px);
  padding: 10px 14px;
  border-radius: 12px;
  background: #111;
  color: #fff;
  opacity: 0;
  pointer-events: none;
  font-size: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,.2);
  transition: .2s ease;
}

#chatToast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 700px) {
  #chatPage {
    max-width: 900px;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    border-left: 1px solid #e8e8e8;
    border-right: 1px solid #e8e8e8;
    box-shadow: 0 0 40px rgba(0,0,0,.08);
  }

  .chat-bubble {
    max-width: 65%;
  }

  .chat-action-sheet {
    border-radius: 18px;
    margin-bottom: 20px;
  }
}

/* =========================================================
   DARK MODE SUPPORT
========================================================= */

@media (prefers-color-scheme: dark) {
  #chatPage {
    background: #0f0f10;
    color: #f5f5f5;
  }

  #chatInbox,
  .chat-inbox-head,
  .chat-top,
  .chat-composer {
    background: #0f0f10;
  }

  #chatSearch {
    background: #1c1c1e;
    color: #fff;
  }

  .chat-user-row:hover {
    background: #19191b;
  }

  .chat-user-row:active {
    background: #202023;
  }

  .chat-last-message,
  .chat-row-time,
  .chat-header-status,
  #chatTyping {
    color: #888;
  }

  #chatMessages {
    background: #0f0f10;
  }

  .theirs .chat-bubble {
    background: #252527;
    color: #f5f5f5;
  }

  .chat-day {
    background: #202023;
  }

  #chatInput {
    background: #171719;
    border-color: #333;
    color: #fff;
  }

  .chat-icon-btn {
    background: #222225;
    color: #fff;
  }

  .chat-reaction {
    background: #1c1c1e;
    border-color: #333;
    color: #fff;
  }

  #chatReplyBar {
    background: #19191b;
    border-color: #29292c;
  }

  #reactionMenu,
  .chat-action-sheet {
    background: #1b1b1d;
    border-color: #333;
    color: #fff;
  }

  .chat-action-btn {
    color: #fff;
  }

  .chat-action-btn:hover {
    background: #252527;
  }

  .chat-header-action,
  .chat-back {
    color: #fff;
  }
}
</style>


<!-- =========================================================
     CHAT HTML
========================================================= -->

<div id="chatPage">

  <!-- ================= INBOX ================= -->

  <section id="chatInbox">

    <div class="chat-inbox-head">

      <div class="chat-inbox-title-row">

        <div>
          <div class="chat-inbox-title">
            Messages
          </div>

          <div class="chat-inbox-subtitle">
            Stay connected with the Poll Pulse community
          </div>
        </div>

        <button
          id="chatRefreshBtn"
          class="chat-new-btn"
          type="button"
          title="Refresh"
        >↻</button>

      </div>

    </div>


    <div class="chat-search-wrap">

      <div class="chat-search-box">

        <span class="chat-search-icon">⌕</span>

        <input
          id="chatSearch"
          type="search"
          placeholder="Search conversations..."
          autocomplete="off"
        >

      </div>

    </div>


    <div id="chatUsers">

      <div class="chat-skeleton">
        <div class="chat-skeleton-avatar"></div>
        <div class="chat-skeleton-content">
          <div class="chat-skeleton-line"></div>
          <div class="chat-skeleton-line small"></div>
        </div>
      </div>

      <div class="chat-skeleton">
        <div class="chat-skeleton-avatar"></div>
        <div class="chat-skeleton-content">
          <div class="chat-skeleton-line"></div>
          <div class="chat-skeleton-line small"></div>
        </div>
      </div>

    </div>

  </section>


  <!-- ================= CONVERSATION ================= -->

  <section id="chatConversation">

    <header class="chat-top">

      <button
        id="chatBackBtn"
        class="chat-back"
        type="button"
        aria-label="Back"
      >‹</button>


      <div class="chat-header-avatar-wrap">

        <img
          id="chatHeaderAvatar"
          class="chat-header-avatar"
          src=""
          alt=""
        >

        <span
          id="chatHeaderOnline"
          class="chat-online-dot"
        ></span>

      </div>


      <div class="chat-header-info">

        <div
          id="chatHeaderName"
          class="chat-header-name"
        >
          Chat
        </div>

        <div
          id="chatHeaderStatus"
          class="chat-header-status"
        >
          Message
        </div>

      </div>


      <button
        id="chatHeaderMore"
        class="chat-header-action"
        type="button"
        aria-label="More"
      >•••</button>

    </header>


    <div id="chatMessages"></div>


    <div id="chatTyping"></div>


    <!-- REPLY -->

    <div id="chatReplyBar">

      <div class="chat-reply-accent"></div>

      <div class="chat-reply-text">

        <div class="chat-reply-title">
          Replying
        </div>

        <div id="chatReplyContent"></div>

      </div>

      <button
        id="cancelReply"
        type="button"
      >×</button>

    </div>


    <!-- COMPOSER -->

    <div class="chat-composer">

      <label
        class="chat-icon-btn"
        title="Send photo"
      >
        ＋

        <input
          id="chatImageInput"
          type="file"
          accept="image/*"
          hidden
        >

      </label>


      <textarea
        id="chatInput"
        rows="1"
        maxlength="2000"
        placeholder="Message..."
      ></textarea>


      <button
        id="sendMessageBtn"
        type="button"
        disabled
        aria-label="Send"
      >➤</button>

    </div>

  </section>


  <!-- ================= REACTION MENU ================= -->

  <div id="reactionMenu">

    <button
      class="reaction-choice"
      data-reaction="❤️"
    >❤️</button>

    <button
      class="reaction-choice"
      data-reaction="😂"
    >😂</button>

    <button
      class="reaction-choice"
      data-reaction="😍"
    >😍</button>

    <button
      class="reaction-choice"
      data-reaction="😮"
    >😮</button>

    <button
      class="reaction-choice"
      data-reaction="👍"
    >👍</button>

  </div>


  <!-- ================= ACTION SHEET ================= -->

  <div id="chatActionOverlay">

    <div class="chat-action-sheet">

      <div class="chat-action-handle"></div>

      <button
        class="chat-action-btn"
        data-chat-action="reply"
      >
        ↩️ &nbsp; Reply
      </button>

      <button
        class="chat-action-btn"
        data-chat-action="react"
      >
        ❤️ &nbsp; React
      </button>

      <button
        class="chat-action-btn danger"
        data-chat-action="delete"
        style="display:none"
      >

      </button>

    </div>

  </div>


  <div id="chatToast"></div>

</div>


<!-- =========================================================
     CHAT ENGINE
========================================================= -->

<script>
(function () {

  "use strict";

  /* =======================================================
     SUPABASE CLIENT
  ======================================================= */

  if (typeof supabase === "undefined") {
    console.error("Poll Pulse Chat: Supabase library not found.");
    return;
  }

  const chatSB =
    window.sb ||
    window.supabaseClient ||
    supabase.createClient(
      "https://dbpbkvfaxgifjeveijqf.supabase.co",
      "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7"
    );


  /* =======================================================
     STATE
  ======================================================= */

  let chatCurrentUser = null;
  let chatTargetUser = null;

  let chatMessages = [];
  let chatProfileCache = {};

  let chatReplyTo = null;
  let chatReactionMessage = null;
  let chatActionMessage = null;

  let chatChannel = null;
  let inboxChannel = null;

  let typingTimeout = null;
  let presenceTimer = null;
  let inboxTimer = null;

  let searchText = "";
  let inboxRows = [];


  const $ = id =>
    document.getElementById(id);


  /* =======================================================
     UTILITIES
  ======================================================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function timeText(date) {

    if (!date) return "";

    return new Date(date).toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  }


  function dateText(date) {

    if (!date) return "";

    const d = new Date(date);
    const now = new Date();

    const startToday =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

    const startDate =
      new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
      );

    const diff =
      Math.round(
        (startToday - startDate) / 86400000
      );

    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";

    return d.toLocaleDateString([], {
      day: "numeric",
      month: "short",
      year:
        d.getFullYear() !== now.getFullYear()
          ? "numeric"
          : undefined
    });

  }


  function avatarURL(profile) {

    if (profile?.avatar_url) {
      return profile.avatar_url;
    }

    return "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="100"
             height="100"
             viewBox="0 0 100 100">
          <rect width="100" height="100" rx="50"
                fill="#eeeeee"/>
          <circle cx="50" cy="38" r="18"
                  fill="#aaaaaa"/>
          <path
            d="M20 88c4-22 17-31 30-31s26 9 30 31"
            fill="#aaaaaa"/>
        </svg>
      `);

  }


  function displayName(profile) {

    return (
      profile?.display_name ||
      profile?.username ||
      "User"
    );

  }


  function showToast(message) {

    const toast = $("chatToast");

    if (!toast) return;

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);

  }


  function scrollMessages(force = false) {

    const box = $("chatMessages");

    if (!box) return;

    if (force) {
      requestAnimationFrame(() => {
        box.scrollTop = box.scrollHeight;
      });
      return;
    }

    const distance =
      box.scrollHeight -
      box.scrollTop -
      box.clientHeight;

    if (distance < 220) {
      requestAnimationFrame(() => {
        box.scrollTop = box.scrollHeight;
      });
    }

  }


  /* =======================================================
     USER / PROFILE
  ======================================================= */

  async function getCurrentUser() {

    const {
      data,
      error
    } = await chatSB.auth.getUser();

    if (error || !data?.user) {
      return null;
    }

    return data.user;

  }


  async function getProfile(id) {

    if (!id) return null;

    if (chatProfileCache[id]) {
      return chatProfileCache[id];
    }

    const {
      data,
      error
    } = await chatSB
      .from("profiles")
      .select(
        "id,username,display_name,avatar_url"
      )
      .eq("id", id)
      .maybeSingle();

    if (!error && data) {
      chatProfileCache[id] = data;
    }

    return data || null;

  }


  /* =======================================================
     OPEN CHAT
  ======================================================= */

  async function openChat(userId) {

    chatCurrentUser =
      chatCurrentUser ||
      await getCurrentUser();

    if (!chatCurrentUser) {

      showToast("Please login first.");

      return;

    }

    if (
      !userId ||
      userId === chatCurrentUser.id
    ) {
      return;
    }

    chatTargetUser =
      await getProfile(userId);

    if (!chatTargetUser) {

      showToast("User profile not found.");

      return;

    }


    $("chatPage")
      .classList.add("active");

    $("chatInbox")
      .style.display = "none";

    $("chatConversation")
      .classList.add("active");


    $("chatHeaderAvatar").src =
      avatarURL(chatTargetUser);

    $("chatHeaderName").textContent =
      displayName(chatTargetUser);

    $("chatHeaderStatus").textContent =
      "Loading...";


    cancelReply();
    hideReactionMenu();
    hideActionSheet();


    await loadConversation();

    subscribeConversation();

    updateOnlineStatus();

  }


  function closeChatConversation() {

    destroyConversationChannel();

    chatTargetUser = null;
    chatMessages = [];

    $("chatConversation")
      .classList.remove("active");

    $("chatInbox")
      .style.display = "flex";

    loadInbox();

  }


  function closeChatPage() {

    destroyConversationChannel();

    $("chatPage")
      .classList.remove("active");

    $("chatInbox")
      .style.display = "flex";

    $("chatConversation")
      .classList.remove("active");

    chatTargetUser = null;

    hideReactionMenu();
    hideActionSheet();

  }


  /* =======================================================
     INBOX
  ======================================================= */

  async function loadInbox() {

    chatCurrentUser =
      chatCurrentUser ||
      await getCurrentUser();

    if (!chatCurrentUser) return;


    const {
      data: messages,
      error
    } = await chatSB
      .from("messages")
      .select(`
        id,
        sender_id,
        receiver_id,
        message,
        message_type,
        created_at,
        read,
        deleted_at
      `)
      .or(
        `sender_id.eq.${chatCurrentUser.id},receiver_id.eq.${chatCurrentUser.id}`
      )
      .order("created_at", {
        ascending: false
      })
      .limit(500);


    if (error) {

      console.error(
        "Inbox error:",
        error
      );

      $("chatUsers").innerHTML = `
        <div class="chat-empty">
          <div class="chat-empty-icon">⚠️</div>
          <div class="chat-empty-title">
            Couldn't load messages
          </div>
          <div class="chat-empty-text">
            Please try again.
          </div>
        </div>
      `;

      return;

    }


    const conversations = {};
    const partnerIds = new Set();


    (messages || []).forEach(message => {

      const partner =
        message.sender_id ===
        chatCurrentUser.id
          ? message.receiver_id
          : message.sender_id;

      if (!partner) return;

      partnerIds.add(partner);


      if (!conversations[partner]) {

        conversations[partner] = {
          latest: message,
          unread: 0
        };

      }


      if (
        message.receiver_id ===
        chatCurrentUser.id &&
        message.read === false
      ) {

        conversations[partner].unread++;

      }

    });


    /* Include followers/following */

    try {

      const {
        data: follows
      } = await chatSB
        .from("follows")
        .select(
          "follower_id,following_id"
        )
        .or(
          `follower_id.eq.${chatCurrentUser.id},following_id.eq.${chatCurrentUser.id}`
        )
        .limit(200);


      (follows || []).forEach(follow => {

        const id =
          follow.follower_id ===
          chatCurrentUser.id
            ? follow.following_id
            : follow.follower_id;

        if (id) {
          partnerIds.add(id);
        }

      });

    } catch (error) {

      console.warn(
        "Follow lookup skipped:",
        error
      );

    }


    if (!partnerIds.size) {

      renderInbox([]);

      return;

    }


    const ids =
      Array.from(partnerIds);


    const {
      data: profiles
    } = await chatSB
      .from("profiles")
      .select(
        "id,username,display_name,avatar_url"
      )
      .in("id", ids);


    (profiles || []).forEach(profile => {

      chatProfileCache[profile.id] =
        profile;

    });


    inboxRows =
      ids
        .map(id => {

          const profile =
            chatProfileCache[id];

          if (!profile) return null;

          return {
            id,
            profile,
            conversation:
              conversations[id] || null
          };

        })
        .filter(Boolean)
        .sort((a, b) => {

          const dateA =
            a.conversation?.latest?.created_at;

          const dateB =
            b.conversation?.latest?.created_at;

          if (!dateA && !dateB) return 0;
          if (!dateA) return 1;
          if (!dateB) return -1;

          return (
            new Date(dateB) -
            new Date(dateA)
          );

        });


    renderInbox(inboxRows);

  }


  function renderInbox(rows) {

    const filtered =
      rows.filter(row => {

        if (!searchText) {
          return true;
        }

        const p = row.profile;

        const latest =
          row.conversation?.latest;

        const search =
          (
            displayName(p) +
            " " +
            (p.username || "") +
            " " +
            (latest?.message || "")
          ).toLowerCase();

        return search.includes(
          searchText.toLowerCase()
        );

      });


    if (!filtered.length) {

      $("chatUsers").innerHTML = `
        <div class="chat-empty">

          <div class="chat-empty-icon">
            ${searchText ? "⌕" : "💬"}
          </div>

          <div class="chat-empty-title">
            ${
              searchText
                ? "No users found"
                : "No conversations yet"
            }
          </div>

          <div class="chat-empty-text">
            ${
              searchText
                ? "Try another name or username."
                : "Follow someone and start a conversation."
            }
          </div>

        </div>
      `;

      return;

    }


    $("chatUsers").innerHTML =
      filtered.map(row => {

        const p = row.profile;
        const latest =
          row.conversation?.latest;

        let preview =
          "Start a conversation";

        if (latest) {

          if (latest.deleted_at) {

            preview =
              "Message deleted";

          } else if (
            latest.message_type === "image"
          ) {

            preview =
              "📷 Photo";

          } else {

            preview =
              latest.message ||
              "Message";

          }

        }


        const unread =
          row.conversation?.unread || 0;


        return `
          <div
            class="chat-user-row"
            data-user-id="${escapeHTML(row.id)}"
          >

            <div class="chat-avatar-wrap">

              <img
                class="chat-avatar"
                src="${avatarURL(p)}"
                alt=""
              >

            </div>


            <div class="chat-row-info">

              <div class="chat-row-top">

                <span class="chat-row-name">
                  ${escapeHTML(displayName(p))}
                </span>

                ${
                  latest
                    ? `
                      <span class="chat-row-time">
                        ${timeText(latest.created_at)}
                      </span>
                    `
                    : ""
                }

              </div>


              <div class="chat-row-bottom">

                <span class="chat-last-message">
                  ${escapeHTML(preview)}
                </span>

                ${
                  unread
                    ? `
                      <span class="chat-unread">
                        ${
                          unread > 99
                            ? "99+"
                            : unread
                        }
                      </span>
                    `
                    : ""
                }

              </div>

            </div>

          </div>
        `;

      }).join("");


    document
      .querySelectorAll(".chat-user-row")
      .forEach(row => {

        row.addEventListener(
          "click",
          () => {
            openChat(
              row.dataset.userId
            );
          }
        );

      });

  }


  /* =======================================================
     CONVERSATION
  ======================================================= */

  async function loadConversation() {

    if (
      !chatTargetUser ||
      !chatCurrentUser
    ) {
      return;
    }


    $("chatMessages").innerHTML = `
      <div class="chat-empty">
        Loading messages...
      </div>
    `;


    const {
      data,
      error
    } = await chatSB
      .from("messages")
      .select(`
        id,
        sender_id,
        receiver_id,
        message,
        message_type,
        media_url,
        reply_to,
        deleted_at,
        delivered_at,
        read,
        read_at,
        created_at
      `)
      .or(
        `and(sender_id.eq.${chatCurrentUser.id},receiver_id.eq.${chatTargetUser.id}),and(sender_id.eq.${chatTargetUser.id},receiver_id.eq.${chatCurrentUser.id})`
      )
      .order("created_at", {
        ascending: true
      })
      .limit(500);


    if (error) {

      console.error(
        "Conversation error:",
        error
      );

      $("chatMessages").innerHTML = `
        <div class="chat-empty">

          <div class="chat-empty-icon">
            ⚠️
          </div>

          <div class="chat-empty-title">
            Couldn't load chat
          </div>

          <div class="chat-empty-text">
            Check your Supabase permissions.
          </div>

        </div>
      `;

      return;

    }


    chatMessages =
      data || [];


    await renderMessages();

    await markMessagesRead();

  }


  /* =======================================================
     RENDER MESSAGES
  ======================================================= */

  async function renderMessages() {

    const box =
      $("chatMessages");


    if (!chatMessages.length) {

      box.innerHTML = `
        <div class="chat-empty">

          <div class="chat-empty-icon">
            👋
          </div>

          <div class="chat-empty-title">
            Start the conversation
          </div>

          <div class="chat-empty-text">
            Send a message to ${escapeHTML(
              displayName(chatTargetUser)
            )}.
          </div>

        </div>
      `;

      return;

    }


    const messageMap = {};

    chatMessages.forEach(message => {
      messageMap[
        String(message.id)
      ] = message;
    });


    box.innerHTML = "";

    let previousDate = "";


    for (
      const message of chatMessages
    ) {

      const currentDate =
        dateText(message.created_at);


      if (
        currentDate !==
        previousDate
      ) {

        const day =
          document.createElement("div");

        day.className =
          "chat-day";

        day.textContent =
          currentDate;

        box.appendChild(day);

        previousDate =
          currentDate;

      }


      const mine =
        message.sender_id ===
        chatCurrentUser.id;


      const line =
        document.createElement("div");

      line.className =
        "chat-message-line " +
        (
          mine
            ? "mine"
            : "theirs"
        );


      const bubble =
        document.createElement("div");

      bubble.className =
        "chat-bubble";

      bubble.dataset.messageId =
        message.id;


      /* ================= REPLY PREVIEW ================= */

      if (message.reply_to) {

        const replied =
          messageMap[
            String(message.reply_to)
          ];


        if (replied) {

          let replyText =
            replied.message ||
            "Photo";


          if (
            replied.message_type ===
            "image"
          ) {
            replyText = "📷 Photo";
          }


          const reply =
            document.createElement("div");

          reply.className =
            "chat-reply-preview";

          reply.textContent =
            replyText.length > 100
              ? replyText.slice(0, 100) + "..."
              : replyText;

          bubble.appendChild(reply);

        }

      }


      /* ================= CONTENT ================= */

      if (message.deleted_at) {

        const deleted =
          document.createElement("div");

        deleted.className =
          "chat-deleted";

        deleted.textContent =
          "Message deleted";

        bubble.appendChild(deleted);

      }

      else if (
        message.message_type ===
          "image" &&
        message.media_url
      ) {

        const image =
          document.createElement("img");

        image.className =
          "chat-photo";

        image.alt =
          "Photo";

        image.dataset.mediaPath =
          message.media_url;

        if (
          message.media_url
            .startsWith("http")
        ) {

          image.src =
            message.media_url;

        }


        image.addEventListener(
          "click",
          () => {

            if (image.src) {
              window.open(
                image.src,
                "_blank"
              );
            }

          }
        );


        bubble.appendChild(image);

      }

      else {

        const text =
          document.createElement("div");

        text.className =
          "chat-text";

        text.innerHTML =
          escapeHTML(
            message.message
          ).replace(
            /\n/g,
            "<br>"
          );

        bubble.appendChild(text);

      }


      /* ================= META ================= */

      const meta =
        document.createElement("div");

      meta.className =
        "chat-meta";


      let status = "";


      if (mine) {

        if (message.read) {

          status =
            '<span class="chat-status-read">✓✓</span>';

        }

        else if (
          message.delivered_at
        ) {

          status = "✓✓";

        }

        else {

          status = "✓";

        }

      }


      meta.innerHTML = `
        <span>
          ${timeText(message.created_at)}
        </span>

        ${
          mine
            ? `<span>${status}</span>`
            : ""
        }
      `;


      bubble.appendChild(meta);


      /* ================= ACTIONS ================= */

      let pressTimer = null;


      bubble.addEventListener(
        "contextmenu",
        event => {

          event.preventDefault();

          showActionSheet(
            message
          );

        }
      );


      bubble.addEventListener(
        "touchstart",
        event => {

          pressTimer =
            setTimeout(() => {

              showActionSheet(
                message
              );

            }, 500);

        },
        {
          passive: true
        }
      );


      bubble.addEventListener(
        "touchend",
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      bubble.addEventListener(
        "touchmove",
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      line.appendChild(bubble);

      box.appendChild(line);

    }


    await hydrateImages();

    await renderAllReactions();

    scrollMessages(true);

  }


  /* =======================================================
     IMAGE HYDRATION
  ======================================================= */

  async function hydrateImages() {

    const images =
      document.querySelectorAll(
        "#chatMessages img[data-media-path]"
      );


    for (
      const image of images
    ) {

      const path =
        image.dataset.mediaPath;


      if (
        !path ||
        path.startsWith("http")
      ) {
        continue;
      }


      try {

        const {
          data,
          error
        } = await chatSB.storage
          .from("chat-media")
          .createSignedUrl(
            path,
            3600
          );


        if (
          !error &&
          data?.signedUrl
        ) {

          image.src =
            data.signedUrl;

        }

      } catch (error) {

        console.warn(
          "Image hydration failed:",
          error
        );

      }

    }

  }


  /* =======================================================
     REACTIONS
  ======================================================= */

  async function renderAllReactions() {

    if (!chatMessages.length) {
      return;
    }


    const ids =
      chatMessages.map(
        message =>
          String(message.id)
      );


    let data = null;


    try {

      const result =
        await chatSB
          .from("message_reactions")
          .select(
            "message_id,reaction,user_id"
          )
          .in(
            "message_id",
            ids
          );

      data =
        result.data || [];

    } catch (error) {

      return;

    }


    if (!data.length) {
      return;
    }


    const grouped = {};


    data.forEach(row => {

      const id =
        String(row.message_id);

      if (!grouped[id]) {
        grouped[id] = {};
      }

      grouped[id][row.reaction] =
        (
          grouped[id][row.reaction] ||
          0
        ) + 1;

    });


    Object.entries(grouped)
      .forEach(([messageId, reactions]) => {

        const bubble =
          document.querySelector(
            `.chat-bubble[data-message-id="${CSS.escape(messageId)}"]`
          );


        if (!bubble) return;


        const line =
          bubble.parentElement;


        const wrap =
          document.createElement("div");

        wrap.className =
          "chat-reactions";


        Object.entries(reactions)
          .forEach(
            ([emoji, count]) => {

              const el =
                document.createElement("span");

              el.className =
                "chat-reaction";

              el.textContent =
                emoji +
                " " +
                count;

              wrap.appendChild(el);

            }
          );


        line.appendChild(wrap);

      });

  }


  async function addReaction(
    messageId,
    reaction
  ) {

    if (!chatCurrentUser) {
      return;
    }


    try {

      const {
        data: existing
      } = await chatSB
        .from("message_reactions")
        .select(
          "id,reaction"
        )
        .eq(
          "message_id",
          String(messageId)
        )
        .eq(
          "user_id",
          chatCurrentUser.id
        )
        .maybeSingle();


      if (
        existing &&
        existing.reaction ===
          reaction
      ) {

        await chatSB
          .from("message_reactions")
          .delete()
          .eq(
            "id",
            existing.id
          );

      }

      else if (existing) {

        await chatSB
          .from("message_reactions")
          .update({
            reaction
          })
          .eq(
            "id",
            existing.id
          );

      }

      else {

        await chatSB
          .from("message_reactions")
          .insert({
            message_id:
              String(messageId),
            user_id:
              chatCurrentUser.id,
            reaction
          });

      }


      hideReactionMenu();
      hideActionSheet();

      await loadConversation();

    } catch (error) {

      console.error(
        "Reaction error:",
        error
      );

      showToast(
        "Reactions table/RLS check karo."
      );

    }

  }


  /* =======================================================
     REACTION MENU
  ======================================================= */

  function showReactionMenu(
    message,
    x,
    y
  ) {

    chatReactionMessage =
      message;


    const menu =
      $("reactionMenu");


    menu.classList.add("show");


    const width =
      menu.offsetWidth || 230;

    const height =
      menu.offsetHeight || 50;


    const left =
      Math.max(
        8,
        Math.min(
          x,
          window.innerWidth -
            width -
            8
        )
      );


    const top =
      Math.max(
        8,
        Math.min(
          y - height - 8,
          window.innerHeight -
            height -
            8
        )
      );


    menu.style.left =
      left + "px";

    menu.style.top =
      top + "px";

  }


  function hideReactionMenu() {

    $("reactionMenu")
      .classList.remove("show");

    chatReactionMessage =
      null;

  }


  /* =======================================================
     ACTION SHEET
  ======================================================= */

  function showActionSheet(
    message
  ) {

    chatActionMessage =
      message;


    const deleteButton =
      document.querySelector(
        '[data-chat-action="delete"]'
      );


    if (deleteButton) {

      deleteButton.style.display =
        message.sender_id ===
        chatCurrentUser.id
          ? "block"
          : "none";

    }


    hideReactionMenu();


    $("chatActionOverlay")
      .classList.add("show");

  }


  function hideActionSheet() {

    $("chatActionOverlay")
      .classList.remove("show");

    chatActionMessage =
      null;

  }


  /* =======================================================
     SEND TEXT
  ======================================================= */

  async function sendMessage() {

    if (
      !chatCurrentUser ||
      !chatTargetUser
    ) {
      return;
    }


    const input =
      $("chatInput");

    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    const button =
      $("sendMessageBtn");

    button.disabled =
      true;


    try {

      const payload = {

        sender_id:
          chatCurrentUser.id,

        receiver_id:
          chatTargetUser.id,

        message:
          text,

        message_type:
          "text",

        reply_to:
          chatReplyTo
            ? String(
                chatReplyTo.id
              )
            : null

      };


      const {
        error
      } = await chatSB
        .from("messages")
        .insert(payload);


      if (error) {
        throw error;
      }


      input.value = "";

      input.style.height =
        "auto";

      updateSendButton();

      cancelReply();

      await loadConversation();


    } catch (error) {

      console.error(
        "Send message error:",
        error
      );

      showToast(
        "Message send nahi hua."
      );

    } finally {

      button.disabled =
        !input.value.trim();

    }

  }


  /* =======================================================
     SEND IMAGE
  ======================================================= */

  async function sendImage(file) {

    if (
      !file ||
      !chatCurrentUser ||
      !chatTargetUser
    ) {
      return;
    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      showToast(
        "Only images are allowed."
      );

      return;

    }


    if (
      file.size >
      8 * 1024 * 1024
    ) {

      showToast(
        "Image must be smaller than 8 MB."
      );

      return;

    }


    showToast(
      "Uploading photo..."
    );


    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const randomId =
      typeof crypto !==
        "undefined" &&
      crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now();


    const path =
      chatCurrentUser.id +
      "/" +
      randomId +
      "-" +
      safeName;


    try {

      const {
        error: uploadError
      } = await chatSB.storage
        .from("chat-media")
        .upload(
          path,
          file,
          {
            contentType:
              file.type,
            upsert:
              false
          }
        );


      if (uploadError) {
        throw uploadError;
      }


      const {
        error
      } = await chatSB
        .from("messages")
        .insert({

          sender_id:
            chatCurrentUser.id,

          receiver_id:
            chatTargetUser.id,

          message:
            "📷 Photo",

          message_type:
            "image",

          media_url:
            path,

          reply_to:
            chatReplyTo
              ? String(
                  chatReplyTo.id
                )
              : null

        });


      if (error) {
        throw error;
      }


      cancelReply();

      await loadConversation();


    } catch (error) {

      console.error(
        "Image send error:",
        error
      );

      showToast(
        "Photo upload failed."
      );

    }

  }


  /* =======================================================
     READ RECEIPTS
  ======================================================= */

  async function markMessagesRead() {

    if (
      !chatCurrentUser ||
      !chatTargetUser
    ) {
      return;
    }


    const unread =
      chatMessages.filter(
        message =>
          message.receiver_id ===
            chatCurrentUser.id &&
          message.sender_id ===
            chatTargetUser.id &&
          !message.read
      );


    if (!unread.length) {
      return;
    }


    const ids =
      unread.map(
        message =>
          message.id
      );


    const now =
      new Date().toISOString();


    try {

      await chatSB
        .from("messages")
        .update({
          read: true,
          read_at: now
        })
        .in("id", ids)
        .eq(
          "receiver_id",
          chatCurrentUser.id
        );


      unread.forEach(message => {
        message.read = true;
        message.read_at = now;
      });

    } catch (error) {

      console.warn(
        "Read receipt failed:",
        error
      );

    }

  }


  /* =======================================================
     REPLY
  ======================================================= */

  function startReply(
    message
  ) {

    chatReplyTo =
      message;


    let text =
      message.message ||
      "Photo";


    if (
      message.message_type ===
      "image"
    ) {

      text =
        "📷 Photo";

    }


    $("chatReplyContent")
      .textContent =
      text.length > 90
        ? text.slice(0, 90) +
          "..."
        : text;


    $("chatReplyBar")
      .classList.add("show");


    $("chatInput")
      .focus();


    hideActionSheet();

  }


  function cancelReply() {

    chatReplyTo =
      null;


    $("chatReplyBar")
      .classList.remove("show");


    $("chatReplyContent")
      .textContent =
      "";

  }


  /* =======================================================
     DELETE
  ======================================================= */

  async function deleteMessage(
    message
  ) {

    if (
      !chatCurrentUser ||
      !message
    ) {
      return;
    }


    if (
      message.sender_id !==
      chatCurrentUser.id
    ) {

      showToast(
        "You can only delete your own messages."
      );

      return;

    }


    hideActionSheet();


    if (
      !window.confirm(
        "Delete this message?"
      )
    ) {
      return;
    }


    try {

      const {
        error
      } = await chatSB
        .from("messages")
        .update({
          deleted_at:
            new Date()
              .toISOString()
        })
        .eq(
          "id",
          message.id
        )
        .eq(
          "sender_id",
          chatCurrentUser.id
        );


      if (error) {
        throw error;
      }


      showToast(
        "Message deleted"
      );


      await loadConversation();


    } catch (error) {

      console.error(
        "Delete error:",
        error
      );

      showToast(
        "Message delete nahi hua."
      );

    }

  }


  /* =======================================================
     REALTIME
  ======================================================= */

  function subscribeConversation() {

    if (
      !chatCurrentUser ||
      !chatTargetUser
    ) {
      return;
    }


    destroyConversationChannel();


    const channelName =
      "poll-pulse-chat-" +
      chatCurrentUser.id +
      "-" +
      chatTargetUser.id;


    chatChannel =
      chatSB.channel(
        channelName
      );


    chatChannel
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "messages"
        },
        payload => {

          const message =
            payload.new ||
            payload.old;


          if (!message) return;


          const relevant =
            (
              message.sender_id ===
                chatCurrentUser.id &&
              message.receiver_id ===
                chatTargetUser.id
            ) ||
            (
              message.sender_id ===
                chatTargetUser.id &&
              message.receiver_id ===
                chatCurrentUser.id
            );


          if (!relevant) {
            return;
          }


          loadConversation();

        }
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "message_reactions"
        },
        () => {

          loadConversation();

        }
      )
      .on(
        "broadcast",
        {
          event: "typing"
        },
        payload => {

          if (
            payload.payload?.user_id !==
            chatTargetUser.id
          ) {
            return;
          }


          $("chatTyping").innerHTML = `
            <span class="chat-typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </span>
            &nbsp;
            ${escapeHTML(
              displayName(
                chatTargetUser
              )
            )} is typing...
          `;


          clearTimeout(
            typingTimeout
          );


          typingTimeout =
            setTimeout(() => {

              $("chatTyping")
                .innerHTML =
                "";

            }, 1800);

        }
      )
      .subscribe();

  }


  function destroyConversationChannel() {

    if (chatChannel) {

      chatSB.removeChannel(
        chatChannel
      );

      chatChannel = null;

    }

  }


  /* =======================================================
     INBOX REALTIME
  ======================================================= */

  function subscribeInbox() {

    if (
      !chatCurrentUser ||
      inboxChannel
    ) {
      return;
    }


    inboxChannel =
      chatSB.channel(
        "poll-pulse-inbox-" +
        chatCurrentUser.id
      );


    inboxChannel
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "messages"
        },
        () => {

          loadInbox();

        }
      )
      .subscribe();

  }


  /* =======================================================
     TYPING
  ======================================================= */

  function sendTyping() {

    if (
      !chatChannel ||
      !chatCurrentUser ||
      !chatTargetUser
    ) {
      return;
    }


    chatChannel.send({

      type:
        "broadcast",

      event:
        "typing",

      payload: {
        user_id:
          chatCurrentUser.id
      }

    });

  }


  /* =======================================================
     PRESENCE
  ======================================================= */

  async function updatePresence() {

    if (!chatCurrentUser) {
      return;
    }


    try {

      await chatSB
        .from("user_presence")
        .upsert({

          user_id:
            chatCurrentUser.id,

          is_online:
            true,

          last_seen:
            new Date()
              .toISOString()

        });

    } catch (error) {

      /*
        Presence is optional.
        Chat continues even if
        this table doesn't exist.
      */

    }

  }


  async function updateOnlineStatus() {

    if (!chatTargetUser) {
      return;
    }


    try {

      const {
        data
      } = await chatSB
        .from("user_presence")
        .select(
          "is_online,last_seen"
        )
        .eq(
          "user_id",
          chatTargetUser.id
        )
        .maybeSingle();


      const dot =
        $("chatHeaderOnline");

      const status =
        $("chatHeaderStatus");


      if (
        data?.is_online
      ) {

        dot.style.display =
          "block";

        status.textContent =
          "Active now";

        return;

      }


      dot.style.display =
        "none";


      if (
        data?.last_seen
      ) {

        status.textContent =
          "Last seen " +
          timeText(
            data.last_seen
          );

      }

      else {

        status.textContent =
          "Message";

      }

    } catch (error) {

      $("chatHeaderOnline")
        .style.display =
        "none";

      $("chatHeaderStatus")
        .textContent =
        "Message";

    }

  }


  /* =======================================================
     SEND BUTTON STATE
  ======================================================= */

  function updateSendButton() {

    const input =
      $("chatInput");

    const button =
      $("sendMessageBtn");


    button.disabled =
      !input.value.trim();

  }


  /* =======================================================
     EVENTS
  ======================================================= */

  $("chatBackBtn")
    .addEventListener(
      "click",
      closeChatConversation
    );


  $("cancelReply")
    .addEventListener(
      "click",
      cancelReply
    );


  $("sendMessageBtn")
    .addEventListener(
      "click",
      sendMessage
    );


  $("chatInput")
    .addEventListener(
      "input",
      () => {

        const input =
          $("chatInput");


        input.style.height =
          "auto";


        input.style.height =
          Math.min(
            input.scrollHeight,
            115
          ) + "px";


        updateSendButton();

        sendTyping();

      }
    );


  $("chatInput")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
            "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


  $("chatImageInput")
    .addEventListener(
      "change",
      async event => {

        const file =
          event.target.files?.[0];


        if (file) {

          await sendImage(
            file
          );

        }


        event.target.value =
          "";

      }
    );


  $("chatSearch")
    .addEventListener(
      "input",
      event => {

        searchText =
          event.target.value.trim();

        renderInbox(
          inboxRows
        );

      }
    );


  $("chatRefreshBtn")
    .addEventListener(
      "click",
      async () => {

        showToast(
          "Refreshing..."
        );

        await loadInbox();

      }
    );


  /* ================= REACTION BUTTONS ================= */

  document
    .querySelectorAll(
      ".reaction-choice"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          if (
            !chatReactionMessage
          ) {
            return;
          }


          await addReaction(
            chatReactionMessage.id,
            button.dataset.reaction
          );

        }
      );

    });


  /* ================= ACTION SHEET ================= */

  document
    .querySelectorAll(
      ".chat-action-btn"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const action =
            button.dataset.chatAction;

          const message =
            chatActionMessage;


          if (!message) {
            return;
          }


          if (
            action === "reply"
          ) {

            startReply(
              message
            );

          }

          else if (
            action === "react"
          ) {

            hideActionSheet();

            showReactionMenu(
              message,
              window.innerWidth / 2,
              window.innerHeight / 2
            );

          }

          else if (
            action === "delete"
          ) {

            await deleteMessage(
              message
            );

          }

        }
      );

    });


  $("chatActionOverlay")
    .addEventListener(
      "click",
      event => {

        if (
          event.target ===
          $("chatActionOverlay")
        ) {

          hideActionSheet();

        }

      }
    );


  document.addEventListener(
    "click",
    event => {

      if (
        !event.target.closest(
          "#reactionMenu"
        )
      ) {

        hideReactionMenu();

      }

    }
  );


  /* =======================================================
     PAGE VISIBILITY
  ======================================================= */

  document.addEventListener(
    "visibilitychange",
    () => {

      if (
        !document.hidden
      ) {

        updatePresence();

        if (
          chatTargetUser
        ) {

          updateOnlineStatus();

        }

      }

    }
  );


  /* =======================================================
     PUBLIC API
  ======================================================= */

  window.openChat =
    openChat;

  window.closeChat =
    closeChatPage;

  window.loadChatInbox =
    loadInbox;


  /* =======================================================
     INITIALIZE
  ======================================================= */

  (async function initChat() {

    chatCurrentUser =
      await getCurrentUser();


    if (!chatCurrentUser) {

      $("chatUsers").innerHTML = `
        <div class="chat-empty">

          <div class="chat-empty-icon">
            🔐
          </div>

          <div class="chat-empty-title">
            Login required
          </div>

          <div class="chat-empty-text">
            Login to use messages.
          </div>

        </div>
      `;

      return;

    }


    await updatePresence();

    await loadInbox();

    subscribeInbox();


    presenceTimer =
      setInterval(
        updatePresence,
        30000
      );


    inboxTimer =
      setInterval(
        () => {

          if (
            $("chatPage")
              .classList
              .contains("active") &&
            !chatTargetUser
          ) {

            loadInbox();

          }

        },
        15000
      );

  })();


})();
</script>

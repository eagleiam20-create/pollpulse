<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Poll Pulse</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#090b10;
  --card:#11141c;
  --card2:#171b25;
  --border:#252a36;
  --text:#f7f8fb;
  --muted:#8d95a7;
  --primary:#6c63ff;
  --primary2:#8b7cff;
  --green:#35d07f;
  --red:#ff5d72;
  --shadow:0 12px 35px rgba(0,0,0,.28);
}

html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at 20% 10%,rgba(108,99,255,.24),transparent 32%),
    radial-gradient(circle at 90% 90%,rgba(53,208,127,.10),transparent 28%),
    var(--bg);
}

.authBox{
  width:100%;
  max-width:420px;
  padding:30px 22px;
  border:1px solid var(--border);
  border-radius:28px;
  background:rgba(17,20,28,.92);
  box-shadow:var(--shadow);
}

.logo{
  text-align:center;
  margin-bottom:28px;
}

.logoMark{
  width:68px;
  height:68px;
  border-radius:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 14px;
  font-size:32px;
  background:linear-gradient(135deg,var(--primary),#a08cff);
  box-shadow:0 12px 35px rgba(108,99,255,.35);
}

.logo h1{
  font-size:30px;
  letter-spacing:-1px;
}

.logo p{
  color:var(--muted);
  margin-top:6px;
}

.tabs{
  display:flex;
  gap:6px;
  background:#0d1016;
  padding:5px;
  border-radius:14px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  padding:11px;
  border-radius:10px;
  color:var(--muted);
  background:transparent;
}

.tabs button.active{
  background:var(--primary);
  color:white;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:7px;
}

.field input,
.field textarea,
.searchInput{
  width:100%;
  border:1px solid var(--border);
  outline:none;
  background:#0d1016;
  color:var(--text);
  border-radius:13px;
  padding:13px 14px;
}

.field input:focus,
.field textarea:focus,
.searchInput:focus{
  border-color:var(--primary);
}

.primaryBtn{
  width:100%;
  padding:14px;
  border-radius:14px;
  color:#fff;
  font-weight:700;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 8px 22px rgba(108,99,255,.22);
}

.secondaryBtn{
  padding:11px 15px;
  border-radius:12px;
  color:var(--text);
  background:var(--card2);
  border:1px solid var(--border);
}

.authMsg{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin-top:13px;
}

/* APP */

#app{
  min-height:100vh;
  padding-bottom:80px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(9,11,16,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.05);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:800;
  font-size:20px;
}

.brandIcon{
  width:34px;
  height:34px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--primary),#927cff);
}

.topActions{
  display:flex;
  gap:7px;
}

.iconBtn{
  width:39px;
  height:39px;
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  position:relative;
}

.badge{
  position:absolute;
  top:-4px;
  right:-3px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:9px;
  background:var(--red);
  color:#fff;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* CONTENT */

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px 14px;
}

.pageTitle{
  font-size:27px;
  font-weight:800;
  letter-spacing:-.7px;
}

.pageSub{
  color:var(--muted);
  font-size:14px;
  margin-top:4px;
}

.section{
  margin-top:22px;
}

/* QUICK ACTIONS */

.quickGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quickCard{
  padding:17px;
  border-radius:18px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#141823,#0f1219);
}

.quickIcon{
  font-size:23px;
  margin-bottom:10px;
}

.quickCard strong{
  display:block;
}

.quickCard span{
  color:var(--muted);
  font-size:12px;
  display:block;
  margin-top:4px;
}

/* POLL */

.pollCard{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:21px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.14);
}

.pollHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.userInfo{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:39px;
  height:39px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#454bff,#9b75ff);
  font-weight:800;
  flex-shrink:0;
}

.userName{
  font-size:14px;
  font-weight:700;
}

.time{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.moreBtn{
  width:34px;
  height:34px;
  border-radius:10px;
  color:var(--muted);
  background:transparent;
}

.pollQuestion{
  font-size:18px;
  line-height:1.4;
  font-weight:750;
  margin:17px 0 14px;
}

.option{
  position:relative;
  width:100%;
  overflow:hidden;
  text-align:left;
  color:var(--text);
  background:#0d1016;
  border:1px solid var(--border);
  border-radius:13px;
  padding:13px 14px;
  margin-top:8px;
}

.option:hover{
  border-color:#41485b;
}

.optionBar{
  position:absolute;
  inset:0 auto 0 0;
  background:rgba(108,99,255,.17);
  width:0;
  transition:.3s;
}

.optionContent{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.optionText{
  font-size:14px;
}

.percent{
  font-size:12px;
  color:var(--muted);
}

.pollStats{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.pollActions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.actionBtn{
  flex:1;
  padding:10px;
  border-radius:11px;
  color:var(--muted);
  background:transparent;
}

.actionBtn:hover{
  background:var(--card2);
  color:var(--text);
}

.actionBtn.liked{
  color:#ff5d72;
}

/* SEARCH */

.searchBox{
  position:relative;
  margin-top:15px;
}

.searchIcon{
  position:absolute;
  left:13px;
  top:12px;
  color:var(--muted);
}

.searchBox input{
  padding-left:39px;
}

/* CREATE */

.createCard{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
}

.createCard textarea{
  resize:none;
  min-height:100px;
}

.optionRow{
  display:flex;
  gap:8px;
  margin-top:9px;
}

.optionRow input{
  flex:1;
}

.removeOption{
  width:43px;
  border-radius:12px;
  color:var(--red);
  background:#21131a;
}

.addOption{
  margin-top:10px;
  color:var(--primary2);
  background:transparent;
}

/* PROFILE */

.profileHero{
  text-align:center;
  padding:18px 0 8px;
}

.profileHero .avatar{
  width:80px;
  height:80px;
  margin:auto;
  font-size:27px;
}

.profileHero h2{
  margin-top:12px;
}

.profileHero p{
  color:var(--muted);
  margin-top:4px;
}

.profileStats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-top:18px;
}

.profileStats div{
  text-align:center;
}

.profileStats strong{
  display:block;
  font-size:19px;
}

.profileStats span{
  color:var(--muted);
  font-size:12px;
}

.profileTabs{
  display:flex;
  border-bottom:1px solid var(--border);
  margin:20px 0 14px;
}

.profileTabs button{
  flex:1;
  background:transparent;
  color:var(--muted);
  padding:12px;
}

.profileTabs button.active{
  color:var(--text);
  border-bottom:2px solid var(--primary);
}

/* CHAT */

.chatList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.chatItem{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
}

.chatPreview{
  flex:1;
  min-width:0;
}

.chatPreview strong{
  display:block;
}

.chatPreview span{
  color:var(--muted);
  font-size:12px;
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chatWindow{
  position:fixed;
  inset:0;
  z-index:50;
  background:var(--bg);
  display:flex;
  flex-direction:column;
}

.chatHeader{
  height:62px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  border-bottom:1px solid var(--border);
}

.chatMessages{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:15px;
  margin-bottom:8px;
  font-size:14px;
  line-height:1.35;
}

.message.mine{
  margin-left:auto;
  background:var(--primary);
  border-bottom-right-radius:4px;
}

.message.theirs{
  background:var(--card2);
  border-bottom-left-radius:4px;
}

.chatInput{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--border);
  background:var(--card);
}

.chatInput input{
  flex:1;
  background:#0c0f15;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:13px;
  padding:12px;
  outline:none;
}

.sendBtn{
  width:48px;
  border-radius:13px;
  background:var(--primary);
  color:#fff;
}

/* NOTIFICATIONS */

.notice{
  display:flex;
  gap:11px;
  padding:14px;
  border-bottom:1px solid var(--border);
}

.noticeIcon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--card2);
}

.noticeText{
  flex:1;
  font-size:13px;
}

.noticeText span{
  display:block;
  color:var(--muted);
  margin-top:3px;
  font-size:11px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.emptyIcon{
  font-size:40px;
  margin-bottom:12px;
}

/* BOTTOM NAV */

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  height:68px;
  display:flex;
  justify-content:space-around;
  background:rgba(12,14,20,.94);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}

.navBtn{
  position:relative;
  flex:1;
  background:transparent;
  color:#737b8d;
  font-size:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.navBtn span:first-child{
  font-size:20px;
}

.navBtn.active{
  color:#fff;
}

.createNav{
  margin-top:-17px;
}

.createCircle{
  width:52px;
  height:52px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--primary),#957cff);
  box-shadow:0 10px 25px rgba(108,99,255,.35);
  font-size:25px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:60;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modalBox{
  width:100%;
  max-width:720px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px 24px 0 0;
  padding:18px;
}

.modalBox h3{
  margin-bottom:14px;
}

.modalAction{
  width:100%;
  text-align:left;
  background:transparent;
  color:var(--text);
  padding:14px;
  border-radius:12px;
}

.modalAction:hover{
  background:var(--card2);
}

.modalAction.danger{
  color:var(--red);
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(20px);
  z-index:100;
  background:#f7f8fb;
  color:#111;
  padding:11px 16px;
  border-radius:12px;
  font-size:13px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADER */

.loader{
  display:flex;
  justify-content:center;
  padding:35px;
}

.spinner{
  width:27px;
  height:27px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@media(min-width:700px){
  .bottomNav{
    left:50%;
    transform:translateX(-50%);
    width:720px;
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen">

  <div class="authBox">

    <div class="logo">
      <div class="logoMark">⚡</div>
      <h1>Poll Pulse</h1>
      <p>Your opinion. Your pulse.</p>
    </div>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showAuth('login')">
        Login
      </button>
      <button id="signupTab" onclick="showAuth('signup')">
        Sign up
      </button>
    </div>

    <div id="loginForm">

      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="you@example.com">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Password">
      </div>

      <button class="primaryBtn" onclick="login()">
        Login
      </button>

      <button
        class="secondaryBtn"
        style="width:100%;margin-top:10px"
        onclick="resetPassword()">
        Forgot password?
      </button>

    </div>

    <div id="signupForm" class="hidden">

      <div class="field">
        <label>Username</label>
        <input id="signupUsername" placeholder="@username">
      </div>

      <div class="field">
        <label>Display name</label>
        <input id="signupName" placeholder="Your name">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="signupEmail" type="email" placeholder="you@example.com">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="signupPassword" type="password" placeholder="Create password">
      </div>

      <button class="primaryBtn" onclick="signup()">
        Create account
      </button>

    </div>

    <div id="authMsg" class="authMsg"></div>

  </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

  <header class="topbar">

    <div class="brand">
      <div class="brandIcon">⚡</div>
      Poll Pulse
    </div>

    <div class="topActions">

      <button class="iconBtn" onclick="showPage('search')">
        🔎
      </button>

      <button class="iconBtn" onclick="showPage('notifications')">
        🔔
        <span id="notificationBadge" class="badge hidden">0</span>
      </button>

    </div>

  </header>


  <main id="content"></main>


  <nav class="bottomNav">

    <button class="navBtn active" data-page="home" onclick="showPage('home')">
      <span>🏠</span>
      Home
    </button>

    <button class="navBtn" data-page="search" onclick="showPage('search')">
      <span>🔎</span>
      Search
    </button>

    <button class="navBtn createNav" data-page="create" onclick="showPage('create')">
      <span class="createCircle">＋</span>
      Create
    </button>

    <button class="navBtn" data-page="chat" onclick="showPage('chat')">
      <span>💬</span>
      Chat
      <span id="chatBadge" class="badge hidden">0</span>
    </button>

    <button class="navBtn" data-page="profile" onclick="showPage('profile')">
      <span>👤</span>
      Profile
    </button>

  </nav>

</section>


<!-- CHAT WINDOW -->

<div id="chatWindow" class="chatWindow hidden">

  <header class="chatHeader">

    <button class="iconBtn" onclick="closeChat()">←</button>

    <div class="userInfo">
      <div id="chatAvatar" class="avatar">U</div>

      <div>
        <div id="chatName" class="userName">User</div>
        <div class="time">Chat</div>
      </div>
    </div>

  </header>

  <div id="chatMessages" class="chatMessages"></div>

  <div class="chatInput">

    <input
      id="messageInput"
      placeholder="Write a message..."
      onkeydown="if(event.key==='Enter')sendMessage()">

    <button class="sendBtn" onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>


<!-- MODAL -->

<div id="modal" class="modal hidden" onclick="closeModal(event)">

  <div class="modalBox" onclick="event.stopPropagation()">

    <h3 id="modalTitle">Options</h3>

    <div id="modalContent"></div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://dbpbkvfaxgifjeveijqf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

let supabaseClient = null;
let currentUser = null;
let currentProfile = null;
let currentPage = "home";
let currentChatUser = null;
let messageSubscription = null;

function initSupabase(){

  if(!window.supabase){
    showAuthMessage("Supabase failed to load.");
    return false;
  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  return true;
}


/* =========================
   HELPERS
========================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function initials(name){

  const n = String(name || "U").trim();

  if(!n) return "U";

  return n
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function timeAgo(date){

  if(!date) return "";

  const seconds =
    Math.floor((Date.now()-new Date(date).getTime())/1000);

  if(seconds < 60) return "now";

  if(seconds < 3600)
    return Math.floor(seconds/60)+"m";

  if(seconds < 86400)
    return Math.floor(seconds/3600)+"h";

  if(seconds < 604800)
    return Math.floor(seconds/86400)+"d";

  return new Date(date).toLocaleDateString();
}

function showToast(message){

  const t = document.getElementById("toast");

  t.textContent = message;
  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>t.classList.remove("show"),2200);
}

function showAuthMessage(message){

  document.getElementById("authMsg").textContent =
    message;
}


/* =========================
   AUTH UI
========================= */

function showAuth(type){

  const login =
    document.getElementById("loginForm");

  const signup =
    document.getElementById("signupForm");

  const loginTab =
    document.getElementById("loginTab");

  const signupTab =
    document.getElementById("signupTab");

  if(type==="login"){

    login.classList.remove("hidden");
    signup.classList.add("hidden");

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

  }else{

    signup.classList.remove("hidden");
    login.classList.add("hidden");

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

  }

  showAuthMessage("");
}


/* =========================
   SIGNUP
========================= */

async function signup(){

  const username =
    document.getElementById("signupUsername").value.trim();

  const displayName =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if(!username || !email || !password){

    showAuthMessage("Please fill all required fields.");
    return;
  }

  if(password.length < 6){

    showAuthMessage("Password should be at least 6 characters.");
    return;
  }

  showAuthMessage("Creating your account...");

  const {data,error} =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){

    showAuthMessage(error.message);
    return;
  }

  if(data.user){

    const {error:profileError} =
      await supabaseClient
      .from("profiles")
      .upsert({
        id:data.user.id,
        email,
        username:username.replace(/^@/,""),
        display_name:displayName || username
      });

    if(profileError){

      console.log(profileError);

      showAuthMessage(
        "Account created, but profile setup needs attention."
      );

    }else{

      showAuthMessage(
        "Account created successfully!"
      );

    }
  }
}

/* =========================
   POLL ENRICH
========================= */

async function enrichPolls(polls){

  for(const poll of polls){

    if(poll.user_id){

      const {data:profile} =
        await supabaseClient
        .from("profiles")
        .select("username,display_name")
        .eq("id",poll.user_id)
        .maybeSingle();

      if(profile){

        const name =
          profile.display_name ||
          profile.username ||
          "User";

        const userEl =
          document.getElementById(`user-${poll.id}`);

        const avatarEl =
          document.getElementById(`avatar-${poll.id}`);

        if(userEl)
          userEl.textContent=name;

        if(avatarEl)
          avatarEl.textContent=initials(name);

      }

    }

    await updatePollVotes(poll);

    await updateLikeState(poll.id);

  }

}


/* =========================
   VOTES
========================= */

async function updatePollVotes(poll){

  const {data,error} =
    await supabaseClient
    .from("votes")
    .select("option")
    .eq("poll_id",poll.id);

  if(error){
    console.log(error);
    return;
  }

  const votes = data || [];
  const total = votes.length;

  const counts =
    poll.options.map(
      (_,index)=>
        votes.filter(v=>Number(v.option)===index).length
    );

  const totalEl =
    document.getElementById(`votes-${poll.id}`);

  if(totalEl)
    totalEl.textContent =
      `${total} ${total===1?"vote":"votes"}`;

  counts.forEach((count,index)=>{

    const percent =
      total
      ? Math.round(count/total*100)
      : 0;

    const bar =
      document.getElementById(
        `bar-${poll.id}-${index}`
      );

    const text =
      document.getElementById(
        `percent-${poll.id}-${index}`
      );

    if(bar)
      bar.style.width=percent+"%";

    if(text)
      text.textContent=percent+"%";

  });

}

async function vote(pollId,option){

  if(!currentUser){

    showToast("Please login first.");
    return;
  }

  const {data:existing} =
    await supabaseClient
    .from("votes")
    .select("id")
    .eq("poll_id",pollId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(existing){

    showToast("You already voted.");
    return;
  }

  const {error} =
    await supabaseClient
    .from("votes")
    .insert({
      poll_id:pollId,
      user_id:currentUser.id,
      option
    });

  if(error){

    showToast(error.message);
    return;
  }

  showToast("Vote recorded! 🗳️");

  const {data:poll} =
    await supabaseClient
    .from("polls")
    .select("*")
    .eq("id",pollId)
    .single();

  if(poll)
    await updatePollVotes(poll);

}

async function toggleLike(pollId){

  if(!currentUser){

    showToast("Please login first.");
    return;
  }

  const {data:existing} =
    await supabaseClient
    .from("likes")
    .select("id")
    .eq("poll_id",pollId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(existing){

    await supabaseClient
      .from("likes")
      .delete()
      .eq("id",existing.id);

  }else{

    const {error} =
      await supabaseClient
      .from("likes")
      .insert({
        poll_id:pollId,
        user_id:currentUser.id
      });

    if(error){

    }

  }

  await updateLikeState(pollId);

/* =========================
   OPEN CHAT
========================= */

async function openChat(userId,name){

  currentChatUser = {
    id:userId,
    name
  };

  document
    .getElementById("chatWindow")
    .classList.remove("hidden");

  document
    .getElementById("chatName")
    .textContent=name;

  document
    .getElementById("chatAvatar")
    .textContent=initials(name);

  await loadMessages();

  if(messageSubscription){

    supabaseClient
      .removeChannel(messageSubscription);

  }

  messageSubscription =
    supabaseClient
    .channel("chat-"+userId)
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      payload=>{

        const m=payload.new;

        if(
          (
            m.sender_id===currentUser.id &&
            m.receiver_id===userId
          ) ||
          (
            m.sender_id===userId &&
            m.receiver_id===currentUser.id
          )
        ){

          loadMessages();

        }

      }
    )
    .subscribe();

}


function closeChat(){

  document
    .getElementById("chatWindow")
    .classList.add("hidden");

  currentChatUser=null;

  if(messageSubscription){

    supabaseClient
      .removeChannel(messageSubscription);

    messageSubscription=null;

  }

}


async function loadMessages(){

  if(!currentChatUser) return;

  const {data,error} =
    await supabaseClient
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at",{ascending:true});

  if(error){

    console.log(error);
    return;
  }

  const box =
    document.getElementById("chatMessages");

  box.innerHTML =
    (data || []).map(m=>`

      <div class="message ${
        m.sender_id===currentUser.id
        ? "mine"
        : "theirs"
      }">

        ${esc(m.message)}

      </div>

    `).join("");

  box.scrollTop=box.scrollHeight;

}


async function sendMessage(){

  if(!currentChatUser) return;

  const input =
    document.getElementById("messageInput");

  const message =
    input.value.trim();

  if(!message) return;

  input.value="";

  const {error} =
    await supabaseClient
    .from("messages")
    .insert({
      sender_id:currentUser.id,
      receiver_id:currentChatUser.id,
      message
    });

  if(error){

    showToast(error.message);
    input.value=message;
    return;
  }

  await loadMessages();

}


/* =========================
   NOTIFICATIONS
========================= */

async function loadNotifications(){

  const {data,error} =
    await supabaseClient
    .from("notifications")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false})
    .limit(50);

  const content =
    document.getElementById("content");

  if(error){

    content.innerHTML=`
      <div class="container">

        <div class="pageTitle">
          Notifications
        </div>

        <div class="empty">
          Notifications unavailable.
        </div>

      </div>
    `;

    return;
  }

  content.innerHTML=`

    <div class="container">

      <div class="pageTitle">
        Notifications
      </div>

      <div class="section">

        ${
          data?.length
          ? data.map(n=>`

            <div class="notice">

              <div class="noticeIcon">
                ${
                  n.type==="like"
                  ? "❤️"
                  : n.type==="follow"
                  ? "👤"
                  : "🔔"
                }
              </div>

              <div class="noticeText">

                ${esc(n.message || "New activity")}

                <span>
                  ${timeAgo(n.created_at)}
                </span>

              </div>

            </div>

          `).join("")
          : `
            <div class="empty">
              <div class="emptyIcon">🔔</div>
              You're all caught up.
            </div>
          `
        }

      </div>

    </div>
  `;

  await supabaseClient
    .from("notifications")
    .update({read:true})
    .eq("user_id",currentUser.id);

  updateNotificationBadge(0);

}


/* =========================
   BADGES
========================= */

async function loadBadges(){

  if(!currentUser) return;

  try{

    const {count} =
      await supabaseClient
      .from("notifications")
      .select("*",{count:"exact",head:true})
      .eq("user_id",currentUser.id)
      .eq("read",false);

    updateNotificationBadge(count || 0);

  }catch(e){

    console.log(e);

  }

}


function updateNotificationBadge(count){

  const badge =
    document.getElementById("notificationBadge");

  if(!badge) return;

  if(count>0){

    badge.textContent =
      count>99 ? "99+" : count;

    badge.classList.remove("hidden");

  }else{

    badge.classList.add("hidden");

  }

}


/* =========================
   POLL MENU
========================= */

function pollMenu(pollId){

  const isMine =
    false;

  document.getElementById("modalTitle")
    .textContent="Poll options";

  document.getElementById("modalContent")
    .innerHTML=`

      <button
        class="modalAction"
        onclick="sharePoll('${pollId}');closeModal()">
        ↗ Share poll
      </button>

      <button
        class="modalAction"
        onclick="copyPollId('${pollId}');closeModal()">
        📋 Copy poll ID
      </button>

    `;

  document
    .getElementById("modal")
    .classList.remove("hidden");

}


function closeModal(){

  document
    .getElementById("modal")
    .classList.add("hidden");

}


function copyPollId(id){

  if(navigator.clipboard){

    navigator.clipboard.writeText(id);

    showToast("Poll ID copied.");

  }

}


/* =========================
   SHARE
========================= */

async function sharePoll(id){

  const url =
    location.origin +
    location.pathname +
    "?poll="+encodeURIComponent(id);

  if(navigator.share){

    try{

      await navigator.share({
        title:"Poll Pulse",
        text:"Check out this poll on Poll Pulse!",
        url
      });

    }catch(e){}

  }else{

    if(navigator.clipboard){

      await navigator.clipboard.writeText(url);

      showToast("Poll link copied! 🔗");

    }

  }

}


/* =========================
   AUTH STATE
========================= */

async function initApp(){

  if(!initSupabase()) return;

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){

    currentUser=data.session.user;

    await loadProfile();

    openApp();

  }else{

    document
      .getElementById("authScreen")
      .classList.remove("hidden");

  }

  supabaseClient.auth.onAuthStateChange(
    async(event,session)=>{

      if(session){

        currentUser=session.user;

      }

    }
  );

}


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  initApp
);

</script>

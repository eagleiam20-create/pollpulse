<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Poll Pulse Chats</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    /* =========================
       INBOX
    ========================== */

    .inbox {
      min-height: 100vh;
      background: #fff;
    }

    .topbar {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,.97);
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-title {
      font-size: 21px;
      font-weight: 700;
    }

    .topbar-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .topbar-icon:active {
      background: #f2f2f2;
    }

    .search-wrap {
      padding: 14px 16px 8px;
    }

    .search-box {
      width: 100%;
      height: 42px;
      border: 0;
      outline: 0;
      border-radius: 12px;
      background: #f1f1f1;
      padding: 0 15px;
      font-size: 15px;
    }

    .section-title {
      padding: 15px 16px 8px;
      font-size: 14px;
      font-weight: 700;
    }

    /* =========================
       CHAT LIST
    ========================== */

    .chat-list {
      padding-bottom: 20px;
    }

    .chat-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: #fff;
      text-align: left;
      transition: background .15s;
    }

    .chat-item:hover {
      background: #f8f8f8;
    }

    .chat-item:active {
      background: #f1f1f1;
    }

    .avatar {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-weight: 700;
      font-size: 20px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-info {
      min-width: 0;
      flex: 1;
    }

    .chat-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      color: #8e8e8e;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .chat-preview-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .chat-preview {
      color: #737373;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0095f6;
      flex: 0 0 8px;
    }

    .empty {
      text-align: center;
      padding: 60px 25px;
      color: #777;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 45px 20px;
      color: #777;
      font-size: 14px;
    }

    .error-box {
      margin: 20px 16px;
      padding: 14px;
      border-radius: 12px;
      background: #fff0f0;
      color: #d00;
      font-size: 13px;
      line-height: 1.4;
    }

    /* =========================
       CHAT SCREEN
    ========================== */

    .chat-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 100;
    }

    .chat-screen.active {
      display: flex;
      flex-direction: column;
    }

    .chat-topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid #eee;
      background: #fff;
      flex-shrink: 0;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      font-size: 30px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:active {
      background: #f2f2f2;
    }

    .chat-user-avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 50%;
      overflow: hidden;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .chat-user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-user-info {
      min-width: 0;
      flex: 1;
    }

    .chat-user-name {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-user-status {
      color: #777;
      font-size: 12px;
      margin-top: 2px;
    }

    .header-action {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      font-size: 21px;
    }

    /* =========================
       MESSAGES
    ========================== */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overscroll-behavior: contain;
    }

    .date-label {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin: 8px 0 15px;
    }

    .message-row {
      width: 100%;
      display: flex;
    }

    .message-row.received {
      justify-content: flex-start;
    }

    .message-row.sent {
      justify-content: flex-end;
    }

    .message {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .received .message {
      background: #efefef;
      color: #111;
      border-bottom-left-radius: 6px;
    }

    .sent .message {
      background: #3797f0;
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .message-meta {
      font-size: 10px;
      margin-top: 4px;
      text-align: right;
      opacity: .68;
    }

    .typing {
      display: none;
      padding: 4px 16px 8px;
      color: #888;
      font-size: 12px;
      background: #fff;
    }

    .typing.show {
      display: block;
    }

    /* =========================
       INPUT
    ========================== */

    .message-input-area {
      padding: 9px 10px;
      border-top: 1px solid #eee;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-bottom: calc(9px + env(safe-area-inset-bottom));
    }

    .input-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      font-size: 21px;
      flex: 0 0 38px;
    }

    .message-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      border: 1px solid #ddd;
      border-radius: 22px;
      outline: none;
      padding: 0 15px;
      font-size: 14px;
      background: #fafafa;
    }

    .message-input:focus {
      border-color: #bbb;
      background: #fff;
    }

    .send-btn {
      height: 40px;
      padding: 0 13px;
      border-radius: 20px;
      background: #0095f6;
      color: white;
      font-size: 14px;
      font-weight: 700;
    }

    .send-btn:disabled {
      opacity: .55;
      cursor: default;
    }

    .send-btn:active {
      transform: scale(.97);
    }

    /* =========================
       SEARCH USERS
    ========================== */

    .search-results {
      background: #fff;
      border-top: 1px solid #eee;
    }

    .search-result {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: #fff;
      text-align: left;
    }

    .search-result:hover {
      background: #f7f7f7;
    }

    .search-result-info {
      min-width: 0;
      flex: 1;
    }

    .search-result-name {
      font-size: 15px;
      font-weight: 600;
    }

    .search-result-username {
      color: #777;
      font-size: 13px;
      margin-top: 3px;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (min-width: 700px) {
      body {
        background: #f5f5f5;
      }

      .app {
        min-height: 100vh;
        box-shadow: 0 0 20px rgba(0,0,0,.06);
      }
    }

    @media (max-width: 380px) {
      .avatar {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
      }

      .message {
        max-width: 84%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         INBOX
    ========================== -->

    <main class="inbox" id="inbox">

      <header class="topbar">

        <div class="topbar-left">
          <div class="topbar-title">
            Chats
          </div>
        </div>

        <button
          class="topbar-icon"
          id="newChatBtn"
          type="button"
          aria-label="New chat"
        >
          ✎
        </button>

      </header>


      <div class="search-wrap">

        <input
          id="searchInput"
          class="search-box"
          type="text"
          placeholder="Search people..."
          autocomplete="off"
        >

      </div>


      <div id="searchResults" class="search-results"></div>


      <div class="section-title">
        Messages
      </div>


      <div
        class="chat-list"
        id="chatList"
      >
        <div class="loading">
          Loading chats...
        </div>
      </div>

    </main>


    <!-- =========================
         CHAT SCREEN
    ========================== -->

    <section
      class="chat-screen"
      id="chatScreen"
    >

      <header class="chat-topbar">

        <button
          class="back-btn"
          id="backBtn"
          type="button"
          aria-label="Back"
        >
          ‹
        </button>


        <div
          class="chat-user-avatar"
          id="chatAvatar"
        >
          U
        </div>


        <div class="chat-user-info">

          <div
            class="chat-user-name"
            id="chatUserName"
          >
            User
          </div>

          <div
            class="chat-user-status"
            id="chatUserStatus"
          >
            Chat
          </div>

        </div>


        <button
          class="header-action"
          type="button"
          aria-label="Info"
        >
          ⓘ
        </button>

      </header>


      <div
        class="messages"
        id="messages"
      ></div>


      <div
        class="typing"
        id="typingIndicator"
      >
        Typing...
      </div>


      <div class="message-input-area">

        <button
          class="input-icon"
          type="button"
          aria-label="Emoji"
          id="emojiBtn"
        >
          😊
        </button>


        <input
          id="messageInput"
          class="message-input"
          type="text"
          placeholder="Message..."
          autocomplete="off"
        >


        <button
          id="sendBtn"
          class="send-btn"
          type="button"
        >
          Send
        </button>

      </div>

    </section>

  </div>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://dbpbkvfaxgifjeveijqf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       STATE
    ===================================================== */

    let currentUser = null;
    let currentChatUser = null;
    let realtimeChannel = null;
    let searchTimer = null;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const $ = id =>
      document.getElementById(id);


    /* =====================================================
       INITIALIZE
    ===================================================== */

    async function init() {

      try {

        const {
          data: {
            session
          }
        } = await supabaseClient.auth.getSession();


        if (!session) {

          $("chatList").innerHTML = `
            <div class="empty">
              Please login first.
            </div>
          `;

          return;
        }


        currentUser =
          session.user;


        await loadChats();

        setupRealtime();

      } catch (error) {

        console.error(
          "INIT ERROR:",
          error
        );

        showError(
          error.message
        );

      }

    }


    /* =====================================================
       LOAD CHAT LIST
    ===================================================== */

    async function loadChats() {

      if (!currentUser) return;


      const list =
        $("chatList");


      list.innerHTML = `
        <div class="loading">
          Loading chats...
        </div>
      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .select(`
              id,
              sender_id,
              receiver_id,
              message,
              read,
              created_at,
              message_type
            `)
            .or(
              `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {
          throw error;
        }


        if (!data || data.length === 0) {

          list.innerHTML = `
            <div class="empty">
              No chats yet.<br>
              Search someone above to start chatting.
            </div>
          `;

          return;
        }


        /*
          Keep only the newest message
          for each conversation.
        */

        const conversations =
          new Map();


        data.forEach(message => {

          const otherId =
            message.sender_id === currentUser.id
              ? message.receiver_id
              : message.sender_id;


          if (!conversations.has(otherId)) {

            conversations.set(
              otherId,
              message
            );

          }

        });


        const userIds =
          [...conversations.keys()];


        if (!userIds.length) {

          list.innerHTML = `
            <div class="empty">
              No chats yet.
            </div>
          `;

          return;
        }


        const {
          data: profiles,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(`
              id,
              username,
              display_name,
              avatar_url
            `)
            .in(
              "id",
              userIds
            );


        if (profileError) {
          throw profileError;
        }


        list.innerHTML = "";


        const profileMap =
          new Map(
            (profiles || []).map(
              profile => [
                profile.id,
                profile
              ]
            )
          );


        userIds.forEach(userId => {

          const message =
            conversations.get(userId);

          const profile =
            profileMap.get(userId);


          if (!profile) return;


          const item =
            createChatItem(
              profile,
              message
            );


          list.appendChild(item);

        });


        if (!list.children.length) {

          list.innerHTML = `
            <div class="empty">
              No chats found.
            </div>
          `;

        }

      } catch (error) {

        console.error(
          "LOAD CHATS:",
          error
        );

        showError(
          error.message
        );

      }

    }


    /* =====================================================
       CREATE CHAT ITEM
    ===================================================== */

    function createChatItem(
      profile,
      message
    ) {

      const item =
        document.createElement(
          "button"
        );

      item.className =
        "chat-item";

      item.type =
        "button";


      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";


      setAvatar(
        avatar,
        profile
      );


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "chat-info";


      const nameRow =
        document.createElement(
          "div"
        );

      nameRow.className =
        "chat-name-row";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "chat-name";

      name.textContent =
        profile.display_name ||
        profile.username ||
        "User";


      const time =
        document.createElement(
          "div"
        );

      time.className =
        "chat-time";

      time.textContent =
        formatChatTime(
          message.created_at
        );


      nameRow.appendChild(
        name
      );

      nameRow.appendChild(
        time
      );


      const previewRow =
        document.createElement(
          "div"
        );

      previewRow.className =
        "chat-preview-row";


      const preview =
        document.createElement(
          "div"
        );

      preview.className =
        "chat-preview";


      let previewText =
        message.message || "";


      if (
        message.message_type &&
        message.message_type !== "text"
      ) {

        if (
          message.message_type === "image"
        ) {

          previewText =
            "📷 Photo";

        } else {

          previewText =
            "Message";

        }

      }


      if (
        message.sender_id ===
        currentUser.id
      ) {

        previewText =
          "You: " + previewText;

      }


      preview.textContent =
        previewText;


      previewRow.appendChild(
        preview
      );


      if (
        message.receiver_id ===
          currentUser.id &&
        message.read === false
      ) {

        const dot =
          document.createElement(
            "div"
          );

        dot.className =
          "unread-dot";

        previewRow.appendChild(
          dot
        );

      }


      info.appendChild(
        nameRow
      );

      info.appendChild(
        previewRow
      );


      item.appendChild(
        avatar
      );

      item.appendChild(
        info
      );


      item.addEventListener(
        "click",
        () => {
          openChat(
            profile
          );
        }
      );


      return item;

    }


    /* =====================================================
       OPEN CHAT
    ===================================================== */

    async function openChat(
      profile
    ) {

      if (!currentUser) return;


      currentChatUser =
        profile;


      $("chatUserName").textContent =
        profile.display_name ||
        profile.username ||
        "User";


      $("chatUserStatus").textContent =
        "Chat";


      setAvatar(
        $("chatAvatar"),
        profile
      );


      $("chatScreen")
        .classList
        .add("active");


      $("messages").innerHTML = `
        <div class="loading">
          Loading messages...
        </div>
      `;


      await loadMessages();

    }


    /* =====================================================
       CLOSE CHAT
    ===================================================== */

    function closeChat() {

      currentChatUser =
        null;


      $("chatScreen")
        .classList
        .remove("active");

    }


    /* =====================================================
       LOAD MESSAGES
    ===================================================== */

    async function loadMessages() {

      if (
        !currentUser ||
        !currentChatUser
      ) return;


      const box =
        $("messages");


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .select(`
              id,
              sender_id,
              receiver_id,
              message,
              read,
              read_at,
              delivered_at,
              created_at,
              message_type,
              media_url
            `)
            .or(
              `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (error) {
          throw error;
        }


        box.innerHTML = "";


        if (!data || data.length === 0) {

          box.innerHTML = `
            <div class="empty">
              No messages yet.<br>
              Say hi 👋
            </div>
          `;

          return;
        }


        const dateLabel =
          document.createElement(
            "div"
          );

        dateLabel.className =
          "date-label";

        dateLabel.textContent =
          "Today";

        box.appendChild(
          dateLabel
        );


        data.forEach(
          message => {

            const row =
              document.createElement(
                "div"
              );


            const mine =
              message.sender_id ===
              currentUser.id;


            row.className =
              "message-row " +
              (
                mine
                  ? "sent"
                  : "received"
              );


            const bubble =
              document.createElement(
                "div"
              );

            bubble.className =
              "message";


            /*
              Text / image message
            */

            if (
              message.message_type ===
                "image" &&
              message.media_url
            ) {

              const image =
                document.createElement(
                  "img"
                );

              image.src =
                message.media_url;

              image.alt =
                "Image";

              image.style.maxWidth =
                "220px";

              image.style.borderRadius =
                "14px";

              bubble.appendChild(
                image
              );


              if (
                message.message
              ) {

                const text =
                  document.createElement(
                    "div"
                  );

                text.textContent =
                  message.message;

                text.style.marginTop =
                  "6px";

                bubble.appendChild(
                  text
                );

              }

            } else {

              bubble.textContent =
                message.message ||
                "";

            }


            const meta =
              document.createElement(
                "div"
              );

            meta.className =
              "message-meta";


            let status =
              "";


            if (mine) {

              if (message.read) {

                status =
                  " · Seen";

              } else if (
                message.delivered_at
              ) {

                status =
                  " · Delivered";

              } else {

                status =
                  " · Sent";

              }

            }


            meta.textContent =
              formatMessageTime(
                message.created_at
              ) +
              status;


            bubble.appendChild(
              meta
            );


            row.appendChild(
              bubble
            );


            box.appendChild(
              row
            );

          }
        );


        await markMessagesRead(
          data
        );


        scrollMessages();

      } catch (error) {

        console.error(
          "LOAD MESSAGES:",
          error
        );

        box.innerHTML = `
          <div class="error-box">
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    /* =====================================================
       MARK AS READ
    ===================================================== */

    async function markMessagesRead(
      messages
    ) {

      if (!currentUser) return;


      const unreadIds =
        messages
          .filter(
            message =>
              message.receiver_id ===
                currentUser.id &&
              message.read === false
          )
          .map(
            message =>
              message.id
          );


      if (
        unreadIds.length === 0
      ) return;


      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .update({
            read: true,
            read_at:
              new Date()
                .toISOString()
          })
          .in(
            "id",
            unreadIds
          );


      if (error) {

        console.error(
          "MARK READ:",
          error
        );

      }

    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    async function sendMessage() {

      if (
        !currentUser ||
        !currentChatUser
      ) {

        return;

      }


      const input =
        $("messageInput");


      const text =
        input.value.trim();


      if (!text) return;


      const button =
        $("sendBtn");


      button.disabled =
        true;


      try {

        const {
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                currentUser.id,

              receiver_id:
                currentChatUser.id,

              message:
                text,

              read:
                false,

              message_type:
                "text",

              delivered_at:
                new Date()
                  .toISOString()

            });


        if (error) {
          throw error;
        }


        input.value = "";


        await loadMessages();

        await loadChats();


      } catch (error) {

        console.error(
          "SEND MESSAGE:",
          error
        );


        alert(
          "Message error: " +
          error.message
        );


      } finally {

        button.disabled =
          false;

      }

    }


    /* =====================================================
       SEARCH USERS
    ===================================================== */

    async function searchUsers() {

      clearTimeout(
        searchTimer
      );


      searchTimer =
        setTimeout(
          runUserSearch,
          300
        );

    }


    async function runUserSearch() {

      const query =
        $("searchInput")
          .value
          .trim();


      const results =
        $("searchResults");


      if (!query) {

        results.innerHTML =
          "";

        return;

      }


      if (!currentUser) return;


      results.innerHTML = `
        <div class="loading">
          Searching...
        </div>
      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("profiles")
            .select(`
              id,
              username,
              display_name,
              avatar_url
            `)
            .ilike(
              "username",
              "%" +
              query +
              "%"
            )
            .neq(
              "id",
              currentUser.id
            )
            .limit(15);


        if (error) {
          throw error;
        }


        results.innerHTML =
          "";


        if (
          !data ||
          data.length === 0
        ) {

          results.innerHTML = `
            <div class="empty">
              No users found.
            </div>
          `;

          return;

        }


        data.forEach(
          profile => {

            const item =
              document.createElement(
                "button"
              );

            item.className =
              "search-result";

            item.type =
              "button";


            const avatar =
              document.createElement(
                "div"
              );

            avatar.className =
              "avatar";


            setAvatar(
              avatar,
              profile
            );


            const info =
              document.createElement(
                "div"
              );

            info.className =
              "search-result-info";


            const name =
              document.createElement(
                "div"
              );

            name.className =
              "search-result-name";

            name.textContent =
              profile.display_name ||
              profile.username ||
              "User";


            const username =
              document.createElement(
                "div"
              );

            username.className =
              "search-result-username";

            username.textContent =
              "@" +
              (
                profile.username ||
                "user"
              );


            info.appendChild(
              name
            );

            info.appendChild(
              username
            );


            item.appendChild(
              avatar
            );

            item.appendChild(
              info
            );


            item.addEventListener(
              "click",
              async () => {

                $("searchInput")
                  .value = "";

                results.innerHTML =
                  "";

                await openChat(
                  profile
                );

              }
            );


            results.appendChild(
              item
            );

          }
        );

      } catch (error) {

        console.error(
          "SEARCH:",
          error
        );


        results.innerHTML = `
          <div class="error-box">
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    /* =====================================================
       REALTIME
    ===================================================== */

    function setupRealtime() {

      if (!currentUser) return;


      if (realtimeChannel) {

        supabaseClient.removeChannel(
          realtimeChannel
        );

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "pollpulse-chat-" +
            currentUser.id
          )
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "messages"
            },
            async () => {

              await loadChats();


              if (
                currentChatUser
              ) {

                await loadMessages();

              }

            }
          )
          .subscribe();

    }


    /* =====================================================
       AVATAR
    ===================================================== */

    function setAvatar(
      element,
      profile
    ) {

      element.innerHTML =
        "";


      if (
        profile &&
        profile.avatar_url
      ) {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          profile.avatar_url;

        img.alt =
          "";

        img.onerror =
          () => {

            element.innerHTML =
              "";

            element.textContent =
              getInitial(
                profile
              );

          };


        element.appendChild(
          img
        );

      } else {

        element.textContent =
          getInitial(
            profile
          );

      }

    }


    function getInitial(
      profile
    ) {

      return (
        (
          profile?.display_name ||
          profile?.username ||
          "U"
        )
        .charAt(0)
        .toUpperCase()
      );

    }


    /* =====================================================
       SEARCH INPUT
    ===================================================== */

    $("searchInput")
      .addEventListener(
        "input",
        searchUsers
      );


    /* =====================================================
       SEND BUTTON
    ===================================================== */

    $("sendBtn")
      .addEventListener(
        "click",
        sendMessage
      );


    /* =====================================================
       ENTER TO SEND
    ===================================================== */

    $("messageInput")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            sendMessage();

          }

        }
      );


    /* =====================================================
       BACK BUTTON
    ===================================================== */

    $("backBtn")
      .addEventListener(
        "click",
        closeChat
      );


    /* =====================================================
       NEW CHAT BUTTON
    ===================================================== */

    $("newChatBtn")
      .addEventListener(
        "click",
        () => {

          $("searchInput")
            .focus();

        }
      );


    /* =====================================================
       EMOJI BUTTON
    ===================================================== */

    $("emojiBtn")
      .addEventListener(
        "click",
        () => {

          const input =
            $("messageInput");

          input.value += " 😊";

          input.focus();

        }
      );


    /* =====================================================
       FORMAT TIME
    ===================================================== */

    function formatChatTime(
      date
    ) {

      const d =
        new Date(date);

      const now =
        new Date();

      const diff =
        now - d;

      const minutes =
        Math.floor(
          diff / 60000
        );


      if (
        minutes < 1
      ) {

        return "now";

      }


      if (
        minutes < 60
      ) {

        return (
          minutes +
          "m"
        );

      }


      const hours =
        Math.floor(
          minutes / 60
        );


      if (
        hours < 24
      ) {

        return (
          hours +
          "h"
        );

      }


      const days =
        Math.floor(
          hours / 24
        );


      if (
        days < 7
      ) {

        return (
          days +
          "d"
        );

      }


      return d.toLocaleDateString();

    }


    function formatMessageTime(
      date
    ) {

      return new Date(
        date
      ).toLocaleTimeString(
        [],
        {
          hour:
            "numeric",

          minute:
            "2-digit"
        }
      );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollMessages() {

      const box =
        $("messages");


      requestAnimationFrame(
        () => {

          box.scrollTop =
            box.scrollHeight;

        }
      );

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      $("chatList").innerHTML = `
        <div class="error-box">
          ${escapeHtml(message)}
        </div>
      `;

    }


    /* =====================================================
       START APP
    ===================================================== */

    init();

  </script>

</body>

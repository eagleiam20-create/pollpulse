<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Poll Pulse Chats</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      position: relative;
    }

    /* =========================
       INBOX
    ========================= */

    .inbox {
      min-height: 100vh;
      background: #fff;
    }

    .topbar {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,.96);
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-title {
      font-size: 21px;
      font-weight: 700;
    }

    .topbar-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .search-wrap {
      padding: 14px 16px 8px;
    }

    .search-box {
      width: 100%;
      height: 42px;
      border: 0;
      outline: 0;
      border-radius: 12px;
      background: #f1f1f1;
      padding: 0 15px;
      font-size: 15px;
    }

    .section-title {
      padding: 15px 16px 8px;
      font-size: 14px;
      font-weight: 700;
    }

    /* =========================
       CHAT LIST
    ========================= */

    .chat-list {
      padding-bottom: 20px;
    }

    .chat-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: #fff;
      text-align: left;
      transition: background .15s;
    }

    .chat-item:hover {
      background: #f8f8f8;
    }

    .chat-item:active {
      background: #f1f1f1;
    }

    .avatar {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-weight: 700;
      font-size: 20px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-info {
      min-width: 0;
      flex: 1;
    }

    .chat-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      color: #8e8e8e;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .chat-preview-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
    }

    .chat-preview {
      color: #737373;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0095f6;
      flex: 0 0 8px;
    }

    .empty {
      text-align: center;
      padding: 60px 25px;
      color: #777;
      font-size: 14px;
    }

    /* =========================
       CHAT SCREEN
    ========================= */

    .chat-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 100;
    }

    .chat-screen.active {
      display: flex;
      flex-direction: column;
    }

    .chat-topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid #eee;
      background: #fff;
      flex-shrink: 0;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      font-size: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:active {
      background: #f2f2f2;
    }

    .chat-user-avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 50%;
      overflow: hidden;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .chat-user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-user-info {
      min-width: 0;
      flex: 1;
    }

    .chat-user-name {
      font-size: 15px;
      font-weight: 700;
    }

    .chat-user-status {
      color: #777;
      font-size: 12px;
      margin-top: 2px;
    }

    .header-action {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      font-size: 21px;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .date-label {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin: 8px 0 15px;
    }

    .message-row {
      width: 100%;
      display: flex;
    }

    .message-row.received {
      justify-content: flex-start;
    }

    .message-row.sent {
      justify-content: flex-end;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .received .message {
      background: #efefef;
      color: #111;
      border-bottom-left-radius: 6px;
    }

    .sent .message {
      background: #3797f0;
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .message-meta {
      font-size: 10px;
      margin-top: 4px;
      text-align: right;
      opacity: .65;
    }

    .typing {
      display: none;
      padding: 4px 16px 8px;
      color: #888;
      font-size: 12px;
    }

    .typing.show {
      display: block;
    }

    /* =========================
       MESSAGE INPUT
    ========================= */

    .message-input-area {
      padding: 9px 10px;
      border-top: 1px solid #eee;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-bottom: calc(9px + env(safe-area-inset-bottom));
    }

    .input-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      font-size: 21px;
      flex: 0 0 38px;
    }

    .message-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      border: 1px solid #ddd;
      border-radius: 22px;
      outline: none;
      padding: 0 15px;
      font-size: 14px;
      background: #fafafa;
    }

    .message-input:focus {
      border-color: #bbb;
      background: #fff;
    }

    .send-btn {
      height: 40px;
      padding: 0 13px;
      border-radius: 20px;
      background: #0095f6;
      color: white;
      font-size: 14px;
      font-weight: 700;
    }

    .send-btn:active {
      transform: scale(.97);
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 700px) {
      body {
        background: #f5f5f5;
      }

      .app {
        min-height: 100vh;
        box-shadow: 0 0 20px rgba(0,0,0,.06);
      }

      .chat-screen {
        position: fixed;
      }
    }

    @media (max-width: 380px) {
      .avatar {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
      }

      .message {
        max-width: 82%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         INBOX
    ========================== -->

    <main class="inbox" id="inbox">

      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">Chats</div>
        </div>

        <button class="topbar-icon" id="newChatBtn" type="button">
          ✎
        </button>
      </header>

      <div class="search-wrap">
        <input
          id="searchInput"
          class="search-box"
          type="text"
          placeholder="Search"
          autocomplete="off"
        >
      </div>

      <div class="section-title">
        Messages
      </div>

      <div class="chat-list" id="chatList">

        <!-- Demo chat -->

        <button class="chat-item" type="button" onclick="openChat('Aarav', 'A')">

          <div class="avatar">
            A
          </div>

          <div class="chat-info">

            <div class="chat-name-row">
              <div class="chat-name">
                Aarav
              </div>

              <div class="chat-time">
                2m
              </div>
            </div>

            <div class="chat-preview-row">

              <div class="chat-preview">
                Hey! How are you?
              </div>

              <div class="unread-dot"></div>

            </div>

          </div>

        </button>


        <button class="chat-item" type="button" onclick="openChat('Rahul', 'R')">

          <div class="avatar">
            R
          </div>

          <div class="chat-info">

            <div class="chat-name-row">
              <div class="chat-name">
                Rahul
              </div>

              <div class="chat-time">
                1h
              </div>
            </div>

            <div class="chat-preview-row">

              <div class="chat-preview">
                Nice poll 👍
              </div>

            </div>

          </div>

        </button>


        <button class="chat-item" type="button" onclick="openChat('Priya', 'P')">

          <div class="avatar">
            P
          </div>

          <div class="chat-info">

            <div class="chat-name-row">
              <div class="chat-name">
                Priya
              </div>

              <div class="chat-time">
                3h
              </div>
            </div>

            <div class="chat-preview-row">

              <div class="chat-preview">
                See you tomorrow
              </div>

            </div>

          </div>

        </button>

      </div>

    </main>


    <!-- =========================
         CHAT SCREEN
    ========================== -->

    <section class="chat-screen" id="chatScreen">

      <header class="chat-topbar">

        <button
          class="back-btn"
          type="button"
          onclick="closeChat()"
          aria-label="Back"
        >
          ‹
        </button>

        <div class="chat-user-avatar" id="chatAvatar">
          U
        </div>

        <div class="chat-user-info">

          <div class="chat-user-name" id="chatUserName">
            User
          </div>

          <div class="chat-user-status" id="chatUserStatus">
            Active now
          </div>

        </div>

        <button
          class="header-action"
          type="button"
          aria-label="Info"
        >
          ⓘ
        </button>

      </header>


      <div class="messages" id="messages">

        <div class="date-label">
          Today
        </div>

        <div class="message-row received">

          <div class="message">
            Hey! How are you?
            <div class="message-meta">
              10:20 AM
            </div>
          </div>

        </div>

        <div class="message-row sent">

          <div class="message">
            I'm good! What about you?
            <div class="message-meta">
              10:21 AM · Seen
            </div>
          </div>

        </div>

        <div class="message-row received">

          <div class="message">
            I'm good too 😊
            <div class="message-meta">
              10:22 AM
            </div>
          </div>

        </div>

      </div>


      <div class="typing" id="typingIndicator">
        Typing...
      </div>


      <div class="message-input-area">

        <button
          class="input-icon"
          type="button"
          aria-label="Emoji"
        >
          😊
        </button>

        <input
          id="messageInput"
          class="message-input"
          type="text"
          placeholder="Message..."
          autocomplete="off"
        >

        <button
          id="sendBtn"
          class="send-btn"
          type="button"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </section>

  </div>


  <script>

    let currentChatUser = null;

    /* =========================
       OPEN CHAT
    ========================== */

    function openChat(name, initial) {

      currentChatUser = {
        name: name,
        initial: initial
      };

      document.getElementById("chatUserName").textContent = name;

      document.getElementById("chatAvatar").textContent = initial;

      document.getElementById("chatUserStatus").textContent = "Active now";

      document.getElementById("chatScreen").classList.add("active");

      setTimeout(function () {

        document.getElementById("messageInput").focus();

        scrollMessages();

      }, 100);

    }


    /* =========================
       CLOSE CHAT
    ========================== */

    function closeChat() {

      document
        .getElementById("chatScreen")
        .classList.remove("active");

      currentChatUser = null;

    }


    /* =========================
       SEND MESSAGE
    ========================== */

    function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();

      if (!text) return;

      const messages =
        document.getElementById("messages");

      const row =
        document.createElement("div");

      row.className =
        "message-row sent";

      const message =
        document.createElement("div");

      message.className =
        "message";

      message.textContent =
        text;

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      meta.textContent =
        "Just now · Sent";

      message.appendChild(meta);

      row.appendChild(message);

      messages.appendChild(row);

      input.value = "";

      scrollMessages();

    }


    /* =========================
       ENTER TO SEND
    ========================== */

    document
      .getElementById("messageInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      });


    /* =========================
       SEARCH
    ========================== */

    document
      .getElementById("searchInput")
      .addEventListener("input", function() {

        const query =
          this.value.toLowerCase().trim();

        const chats =
          document.querySelectorAll(".chat-item");

        chats.forEach(function(chat) {

          const name =
            chat
              .querySelector(".chat-name")
              .textContent
              .toLowerCase();

          chat.style.display =
            name.includes(query)
              ? "flex"
              : "none";

        });

      });


    /* =========================
       SCROLL
    ========================== */

    function scrollMessages() {

      const box =
        document.getElementById("messages");

      box.scrollTop =
        box.scrollHeight;

    }


    /* =========================
       NEW CHAT
    ========================== */

    document
      .getElementById("newChatBtn")
      .addEventListener("click", function() {

        document
          .getElementById("searchInput")
          .focus();

      });

  </script>

</body>
</html>

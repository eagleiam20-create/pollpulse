<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Poll Pulse • Chats</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #eef1f6;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --surface-3: #f0f2f5;

      --text: #111827;
      --muted: #7b8494;
      --line: #e8ebf0;

      --primary: #147df5;
      --primary-dark: #0968d7;
      --primary-soft: #eaf3ff;

      --sent: #147df5;
      --received: #f0f2f5;

      --danger: #dc2626;

      --shadow:
        0 24px 70px rgba(25, 35, 55, .13);

      --radius: 24px;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);
      background:
        radial-gradient(
          circle at top left,
          #ffffff 0,
          #eef1f6 42%,
          #e7ebf2 100%
        );

      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    input {
      -webkit-tap-highlight-color: transparent;
    }

    /* =====================================================
       APP
    ===================================================== */

    .app {
      position: relative;

      width: min(1180px, calc(100vw - 32px));
      height: min(860px, calc(100dvh - 32px));

      margin: 16px auto;

      display: grid;
      grid-template-columns: 355px minmax(0, 1fr);

      background: var(--surface);

      border: 1px solid rgba(255,255,255,.8);
      border-radius: var(--radius);

      overflow: hidden;

      box-shadow: var(--shadow);
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
      min-width: 0;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: #fff;

      border-right: 1px solid var(--line);
    }

    .sidebar-header {
      padding: 24px 20px 15px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 850;
      letter-spacing: -.7px;
    }

    .brand-subtitle {
      margin-top: 4px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 500;
    }

    .new-chat-btn {
      width: 42px;
      height: 42px;

      border-radius: 14px;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          #2994ff,
          #086ee4
        );

      font-size: 20px;

      box-shadow:
        0 7px 18px rgba(20,125,245,.22);

      transition:
        transform .15s,
        box-shadow .15s;
    }

    .new-chat-btn:hover {
      transform: translateY(-1px);

      box-shadow:
        0 10px 22px rgba(20,125,245,.28);
    }

    .new-chat-btn:active {
      transform: scale(.94);
    }

    /* =====================================================
       SEARCH
    ===================================================== */

    .search-wrap {
      padding: 0 18px 14px;
    }

    .search-box-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: #8b94a4;

      font-size: 15px;

      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 44px;

      border: 1px solid transparent;
      border-radius: 13px;

      outline: none;

      background: var(--surface-3);

      padding: 0 14px 0 40px;

      color: var(--text);

      font-size: 14px;

      transition:
        background .2s,
        border .2s,
        box-shadow .2s;
    }

    .search-input::placeholder {
      color: #8b94a4;
    }

    .search-input:focus {
      background: #fff;
      border-color: #dce2eb;

      box-shadow:
        0 0 0 4px rgba(20,125,245,.07);
    }

    /* =====================================================
       SEARCH RESULTS
    ===================================================== */

    .search-results {
      max-height: 270px;

      overflow-y: auto;

      border-bottom: 1px solid var(--line);
    }

    .search-result {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 11px;

      padding: 10px 18px;

      background: #fff;

      text-align: left;

      transition:
        background .15s;
    }

    .search-result:hover {
      background: #f7f9fc;
    }

    .search-result-info {
      min-width: 0;
      flex: 1;
    }

    .search-result-name {
      font-size: 14px;
      font-weight: 750;
    }

    .search-result-username {
      margin-top: 2px;

      color: var(--muted);

      font-size: 12px;
    }

    /* =====================================================
       CHAT LIST HEADER
    ===================================================== */

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 6px 20px 9px;
    }

    .list-heading-title {
      font-size: 13px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .list-heading-count {
      color: var(--muted);

      font-size: 11px;
    }

    /* =====================================================
       CHAT LIST
    ===================================================== */

    .chat-list {
      flex: 1;

      overflow-y: auto;

      padding: 2px 8px 15px;

      scrollbar-width: thin;
    }

    .chat-item {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 12px;

      border-radius: 15px;

      background: transparent;

      text-align: left;

      transition:
        background .15s,
        transform .1s;
    }

    .chat-item:hover {
      background: #f5f7fa;
    }

    .chat-item:active {
      transform: scale(.99);
    }

    .chat-item.active {
      background: var(--primary-soft);
    }

    .chat-info {
      min-width: 0;
      flex: 1;
    }

    .chat-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .chat-name {
      min-width: 0;

      font-size: 14px;
      font-weight: 750;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      flex-shrink: 0;

      color: #9aa2af;

      font-size: 10px;
    }

    .chat-preview-row {
      display: flex;
      align-items: center;

      gap: 7px;

      margin-top: 4px;
    }

    .chat-preview {
      min-width: 0;

      color: var(--muted);

      font-size: 12px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-dot {
      width: 7px;
      height: 7px;

      flex: 0 0 7px;

      border-radius: 50%;

      background: var(--primary);
    }

    /* =====================================================
       AVATAR
    ===================================================== */

    .avatar {
      width: 52px;
      height: 52px;

      flex: 0 0 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #dce3ed,
          #c7d0dc
        );

      color: #556070;

      font-size: 17px;
      font-weight: 800;
    }

    .avatar.small {
      width: 42px;
      height: 42px;

      flex-basis: 42px;

      font-size: 14px;
    }

    .avatar img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    /* =====================================================
       EMPTY / LOADING
    ===================================================== */

    .empty {
      padding: 55px 25px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.65;
    }

    .empty-icon {
      width: 58px;
      height: 58px;

      margin: 0 auto 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: var(--surface-3);

      font-size: 25px;
    }

    .empty strong {
      color: var(--text);
      font-weight: 750;
    }

    .loading {
      padding: 35px 20px;

      color: var(--muted);

      text-align: center;

      font-size: 13px;
    }

    .error-box {
      margin: 16px;

      padding: 13px;

      border-radius: 13px;

      background: #fff1f1;

      color: var(--danger);

      font-size: 12px;
      line-height: 1.5;
    }

    /* =====================================================
       CHAT PANEL
    ===================================================== */

    .chat-panel {
      min-width: 0;
      min-height: 0;

      position: relative;

      display: flex;
      flex-direction: column;

      background: #fbfcfe;
    }

    /* =====================================================
       CHAT EMPTY
    ===================================================== */

    .chat-placeholder {
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      text-align: center;
    }

    .placeholder-inner {
      max-width: 360px;
    }

    .placeholder-icon {
      width: 78px;
      height: 78px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 25px;

      background: var(--primary-soft);

      color: var(--primary);

      font-size: 34px;
    }

    .placeholder-title {
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -.3px;
    }

    .placeholder-text {
      margin-top: 7px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.6;
    }

    /* =====================================================
       ACTIVE CHAT
    ===================================================== */

    .chat-view {
      position: absolute;
      inset: 0;

      display: none;
      flex-direction: column;

      background: #fbfcfe;
    }

    .chat-view.active {
      display: flex;
    }

    .chat-header {
      min-height: 72px;

      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 11px;

      padding: 10px 16px;

      border-bottom: 1px solid var(--line);

      background: rgba(255,255,255,.94);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .mobile-back {
      display: none;

      width: 38px;
      height: 38px;

      flex: 0 0 38px;

      border-radius: 12px;

      background: var(--surface-3);

      color: var(--text);

      font-size: 24px;
      line-height: 1;
    }

    .chat-header-info {
      min-width: 0;
      flex: 1;
    }

    .chat-header-name {
      font-size: 15px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-status {
      margin-top: 3px;

      color: var(--muted);

      font-size: 11px;
    }

    .header-action {
      width: 38px;
      height: 38px;

      flex: 0 0 38px;

      border-radius: 12px;

      background: var(--surface-3);

      color: #5f6978;

      font-size: 17px;
    }

    /* =====================================================
       MESSAGES
    ===================================================== */

    .messages {
      min-height: 0;
      flex: 1;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 20px 22px 18px;

      display: flex;
      flex-direction: column;

      gap: 5px;

      background:
        radial-gradient(
          circle at top,
          #ffffff 0,
          #fbfcfe 48%,
          #f5f7fa 100%
        );

      scrollbar-width: thin;

      overscroll-behavior: contain;
    }

    .date-label {
      align-self: center;

      margin: 2px 0 14px;

      padding: 5px 11px;

      border-radius: 20px;

      background: #eef1f5;

      color: #8b94a2;

      font-size: 10px;
      font-weight: 650;
    }

    .message-row {
      width: 100%;

      display: flex;

      animation: messageIn .16s ease-out;
    }

    .message-row.received {
      justify-content: flex-start;
    }

    .message-row.sent {
      justify-content: flex-end;
    }

    .message {
      max-width: min(68%, 470px);

      padding: 10px 13px;

      border-radius: 17px;

      font-size: 14px;
      line-height: 1.48;

      white-space: pre-wrap;
      word-break: break-word;

      box-shadow:
        0 1px 2px rgba(15,23,42,.04);
    }

    .received .message {
      background: var(--received);

      color: var(--text);

      border-bottom-left-radius: 5px;
    }

    .sent .message {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #2994ff,
          #0876e4
        );

      border-bottom-right-radius: 5px;

      box-shadow:
        0 4px 12px rgba(20,125,245,.16);
    }

    .message img {
      display: block;

      max-width: 270px;
      max-height: 340px;

      border-radius: 13px;

      object-fit: cover;
    }

    .message-meta {
      margin-top: 4px;

      text-align: right;

      font-size: 9px;
      line-height: 1;

      opacity: .68;
    }

    /* =====================================================
       INPUT
    ===================================================== */

    .message-input-area {
      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 8px;

      padding:
        10px 14px
        calc(10px + env(safe-area-inset-bottom));

      border-top: 1px solid var(--line);

      background: rgba(255,255,255,.96);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .input-icon {
      width: 40px;
      height: 40px;

      flex: 0 0 40px;

      border-radius: 13px;

      background: var(--surface-3);

      font-size: 19px;

      transition:
        transform .1s,
        background .15s;
    }

    .input-icon:active {
      transform: scale(.92);
    }

    .message-input {
      min-width: 0;
      flex: 1;

      height: 42px;

      border: 1px solid #e0e4ea;
      border-radius: 14px;

      outline: none;

      background: #f9fafb;

      padding: 0 14px;

      color: var(--text);

      font-size: 14px;

      transition:
        background .2s,
        border .2s,
        box-shadow .2s;
    }

    .message-input::placeholder {
      color: #9aa2ae;
    }

    .message-input:focus {
      background: #fff;

      border-color: #cbd4df;

      box-shadow:
        0 0 0 3px rgba(20,125,245,.06);
    }

    .send-btn {
      height: 42px;
      min-width: 66px;

      padding: 0 15px;

      border-radius: 13px;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          #2994ff,
          #0876e4
        );

      font-size: 12px;
      font-weight: 800;

      box-shadow:
        0 5px 13px rgba(20,125,245,.18);

      transition:
        transform .1s,
        opacity .15s;
    }

    .send-btn:active {
      transform: scale(.94);
    }

    .send-btn:disabled {
      opacity: .5;

      box-shadow: none;

      cursor: default;
    }

    /* =====================================================
       ANIMATION
    ===================================================== */

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 760px) {

      body {
        background: #fff;
        overflow: hidden;
      }

      .app {
        width: 100%;
        height: 100dvh;

        margin: 0;

        display: block;

        border: 0;
        border-radius: 0;

        box-shadow: none;
      }

      .sidebar {
        width: 100%;
        height: 100dvh;

        border-right: 0;
      }

      .chat-panel {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100dvh;

        z-index: 50;

        transform: translateX(100%);

        transition:
          transform .22s ease;

        background: #fbfcfe;
      }

      .chat-panel.mobile-open {
        transform: translateX(0);
      }

      .chat-placeholder {
        display: none;
      }

      .chat-view {
        position: absolute;
        inset: 0;
      }

      .mobile-back {
        display: flex;

        align-items: center;
        justify-content: center;
      }

      .messages {
        padding:
          18px 13px
          14px;
      }

      .message {
        max-width: 82%;
      }

      .chat-header {
        min-height: 66px;

        padding:
          env(safe-area-inset-top)
          10px
          0
          10px;
      }

      .sidebar-header {
        padding-top:
          calc(20px + env(safe-area-inset-top));
      }
    }

    @media (max-width: 390px) {

      .brand-title {
        font-size: 22px;
      }

      .avatar {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }

      .message {
        max-width: 86%;
      }

      .send-btn {
        min-width: 57px;
        padding: 0 11px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">

        <div class="brand-row">

          <div>
            <div class="brand-title">
              Chats
            </div>

            <div class="brand-subtitle">
              Poll Pulse messages
            </div>
          </div>

          <button
            id="newChatBtn"
            class="new-chat-btn"
            type="button"
            aria-label="New chat"
          >
            ✎
          </button>

        </div>

      </div>


      <div class="search-wrap">

        <div class="search-box-wrap">

          <span class="search-icon">
            🔎
          </span>

          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Search people..."
            autocomplete="off"
          >

        </div>

      </div>


      <div
        id="searchResults"
        class="search-results"
      ></div>


      <div class="list-heading">

        <div class="list-heading-title">
          Messages
        </div>

        <div
          id="chatCount"
          class="list-heading-count"
        ></div>

      </div>


      <div
        id="chatList"
        class="chat-list"
      >

        <div class="loading">
          Loading chats...
        </div>

      </div>

    </aside>


    <!-- ===================================================
         CHAT PANEL
    ==================================================== -->

    <main
      id="chatPanel"
      class="chat-panel"
    >

      <!-- Empty state -->

      <div
        id="chatPlaceholder"
        class="chat-placeholder"
      >

        <div class="placeholder-inner">

          <div class="placeholder-icon">
            💬
          </div>

          <div class="placeholder-title">
            Your messages
          </div>

          <div class="placeholder-text">
            Select a conversation from the left,
            or search for someone to start a new chat.
          </div>

        </div>

      </div>


      <!-- Active chat -->

      <section
        id="chatView"
        class="chat-view"
      >

        <header class="chat-header">

          <button
            id="backBtn"
            class="mobile-back"
            type="button"
            aria-label="Back"
          >
            ‹
          </button>


          <div
            id="chatAvatar"
            class="avatar small"
          >
            U
          </div>


          <div class="chat-header-info">

            <div
              id="chatUserName"
              class="chat-header-name"
            >
              User
            </div>

            <div
              id="chatUserStatus"
              class="chat-header-status"
            >
              Message
            </div>

          </div>


          <button
            id="infoBtn"
            class="header-action"
            type="button"
            aria-label="Information"
          >
            ⓘ
          </button>

        </header>


        <div
          id="messages"
          class="messages"
        ></div>


        <div class="message-input-area">

          <button
            id="emojiBtn"
            class="input-icon"
            type="button"
            aria-label="Emoji"
          >
            😊
          </button>


          <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Write a message..."
            autocomplete="off"
          >


          <button
            id="sendBtn"
            class="send-btn"
            type="button"
          >
            Send
          </button>

        </div>

      </section>

    </main>

  </div>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://dbpbkvfaxgifjeveijqf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    /* =====================================================
       STATE
    ===================================================== */

    let currentUser = null;
    let currentChatUser = null;

    let realtimeChannel = null;
    let searchTimer = null;


    /* =====================================================
       HELPER
    ===================================================== */

    const $ = id =>
      document.getElementById(id);


    /* =====================================================
       INIT
    ===================================================== */

    async function init() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {
          throw error;
        }


        const session =
          data?.session;


        if (!session) {

          $("chatList").innerHTML = `
            <div class="empty">
              <div class="empty-icon">
                🔐
              </div>

              <strong>Please login first.</strong>

              <br>

              Open Poll Pulse and login,
              then return here.
            </div>
          `;

          return;
        }


        currentUser =
          session.user;


        await loadChats();

        setupRealtime();


      } catch (error) {

        console.error(
          "INIT ERROR:",
          error
        );

        showError(
          error.message
        );

      }

    }


    /* =====================================================
       LOAD CHATS
    ===================================================== */

    async function loadChats() {

      if (!currentUser) return;


      const list =
        $("chatList");


      list.innerHTML = `
        <div class="loading">
          Loading chats...
        </div>
      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .select(`
              id,
              sender_id,
              receiver_id,
              message,
              read,
              created_at,
              message_type
            `)
            .or(
              `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {
          throw error;
        }


        if (!data || data.length === 0) {

          $("chatCount").textContent = "";

          list.innerHTML = `
            <div class="empty">
              <div class="empty-icon">
                💬
              </div>

              <strong>No chats yet</strong>

              <br>

              Search someone above
              to start chatting.
            </div>
          `;

          return;
        }


        const conversations =
          new Map();


        data.forEach(message => {

          const otherId =
            message.sender_id === currentUser.id
              ? message.receiver_id
              : message.sender_id;


          if (!conversations.has(otherId)) {

            conversations.set(
              otherId,
              message
            );

          }

        });


        const userIds =
          [...conversations.keys()];


        const {
          data: profiles,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(`
              id,
              username,
              display_name,
              avatar_url
            `)
            .in(
              "id",
              userIds
            );


        if (profileError) {
          throw profileError;
        }


        const profileMap =
          new Map(
            (profiles || []).map(
              profile => [
                profile.id,
                profile
              ]
            )
          );


        list.innerHTML = "";


        $("chatCount").textContent =
          userIds.length +
          (
            userIds.length === 1
              ? " chat"
              : " chats"
          );


        userIds.forEach(userId => {

          const message =
            conversations.get(userId);

          const profile =
            profileMap.get(userId);


          if (!profile) return;


          const item =
            createChatItem(
              profile,
              message
            );


          if (
            currentChatUser &&
            currentChatUser.id === profile.id
          ) {

            item.classList.add("active");

          }


          list.appendChild(item);

        });


        if (!list.children.length) {

          list.innerHTML = `
            <div class="empty">
              No chats found.
            </div>
          `;

        }

      } catch (error) {

        console.error(
          "LOAD CHATS:",
          error
        );

        showError(
          error.message
        );

      }

    }


    /* =====================================================
       CHAT ITEM
    ===================================================== */

    function createChatItem(
      profile,
      message
    ) {

      const item =
        document.createElement("button");


      item.className =
        "chat-item";


      item.type =
        "button";


      const avatar =
        document.createElement("div");


      avatar.className =
        "avatar";


      setAvatar(
        avatar,
        profile
      );


      const info =
        document.createElement("div");


      info.className =
        "chat-info";


      const nameRow =
        document.createElement("div");


      nameRow.className =
        "chat-name-row";


      const name =
        document.createElement("div");


      name.className =
        "chat-name";


      name.textContent =
        profile.display_name ||
        profile.username ||
        "User";


      const time =
        document.createElement("div");


      time.className =
        "chat-time";


      time.textContent =
        formatChatTime(
          message.created_at
        );


      nameRow.appendChild(name);
      nameRow.appendChild(time);


      const previewRow =
        document.createElement("div");


      previewRow.className =
        "chat-preview-row";


      const preview =
        document.createElement("div");


      preview.className =
        "chat-preview";


      let previewText =
        message.message || "";


      if (
        message.message_type &&
        message.message_type !== "text"
      ) {

        previewText =
          message.message_type === "image"
            ? "📷 Photo"
            : "Message";

      }


      if (
        message.sender_id ===
        currentUser.id
      ) {

        previewText =
          "You: " +
          previewText;

      }


      preview.textContent =
        previewText;


      previewRow.appendChild(
        preview
      );


      if (
        message.receiver_id ===
          currentUser.id &&
        message.read === false
      ) {

        const dot =
          document.createElement("div");


        dot.className =
          "unread-dot";


        previewRow.appendChild(dot);

      }


      info.appendChild(nameRow);
      info.appendChild(previewRow);


      item.appendChild(avatar);
      item.appendChild(info);


      item.addEventListener(
        "click",
        () => {

          openChat(profile);

        }
      );


      return item;

    }


    /* =====================================================
       OPEN CHAT
    ===================================================== */

    async function openChat(profile) {

      if (!currentUser) return;


      currentChatUser =
        profile;


      $("chatUserName").textContent =
        profile.display_name ||
        profile.username ||
        "User";


      $("chatUserStatus").textContent =
        profile.username
          ? "@" + profile.username
          : "Message";


      setAvatar(
        $("chatAvatar"),
        profile
      );


      $("chatPlaceholder")
        .style.display = "none";


      $("chatView")
        .classList
        .add("active");


      $("chatPanel")
        .classList
        .add("mobile-open");


      document
        .querySelectorAll(".chat-item")
        .forEach(item => {
          item.classList.remove("active");
        });


      await loadMessages();


      setTimeout(
        () => {

          $("messageInput").focus();

        },
        120
      );

    }


    /* =====================================================
       CLOSE CHAT
    ===================================================== */

    function closeChat() {

      currentChatUser =
        null;


      $("chatView")
        .classList
        .remove("active");


      $("chatPanel")
        .classList
        .remove("mobile-open");


      $("chatPlaceholder")
        .style.display = "";


      $("messageInput").value =
        "";

    }


    /* =====================================================
       LOAD MESSAGES
    ===================================================== */

    async function loadMessages() {

      if (
        !currentUser ||
        !currentChatUser
      ) return;


      const box =
        $("messages");


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .select(`
              id,
              sender_id,
              receiver_id,
              message,
              read,
              read_at,
              delivered_at,
              created_at,
              message_type,
              media_url
            `)
            .or(
              `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (error) {
          throw error;
        }


        box.innerHTML = "";


        if (!data || data.length === 0) {

          box.innerHTML = `
            <div class="empty">
              <div class="empty-icon">
                👋
              </div>

              <strong>Start the conversation</strong>

              <br>

              Send your first message.
            </div>
          `;

          return;

        }


        const dateLabel =
          document.createElement("div");


        dateLabel.className =
          "date-label";


        dateLabel.textContent =
          getDateLabel(
            data[0].created_at
          );


        box.appendChild(
          dateLabel
        );


        data.forEach(message => {

          const row =
            document.createElement("div");


          const mine =
            message.sender_id ===
            currentUser.id;


          row.className =
            "message-row " +
            (
              mine
                ? "sent"
                : "received"
            );


          const bubble =
            document.createElement("div");


          bubble.className =
            "message";


          if (
            message.message_type === "image" &&
            message.media_url
          ) {

            const image =
              document.createElement("img");


            image.src =
              message.media_url;


            image.alt =
              "Image";


            image.onerror =
              () => {
                image.style.display =
                  "none";
              };


            bubble.appendChild(
              image
            );


            if (message.message) {

              const text =
                document.createElement("div");


              text.textContent =
                message.message;


              text.style.marginTop =
                "7px";


              bubble.appendChild(
                text
              );

            }

          } else {

            bubble.textContent =
              message.message ||
              "";

          }


          const meta =
            document.createElement("div");


          meta.className =
            "message-meta";


          let status =
            "";


          if (mine) {

            if (message.read) {

              status =
                " · Seen";

            } else if (
              message.delivered_at
            ) {

              status =
                " · Delivered";

            } else {

              status =
                " · Sent";

            }

          }


          meta.textContent =
            formatMessageTime(
              message.created_at
            ) +
            status;


          bubble.appendChild(meta);


          row.appendChild(
            bubble
          );


          box.appendChild(
            row
          );

        });


        await markMessagesRead(
          data
        );


        scrollMessages();


      } catch (error) {

        console.error(
          "LOAD MESSAGES:",
          error
        );


        box.innerHTML = `
          <div class="error-box">
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    /* =====================================================
       MARK READ
    ===================================================== */

    async function markMessagesRead(messages) {

      if (!currentUser) return;


      const unreadIds =
        messages
          .filter(
            message =>
              message.receiver_id ===
                currentUser.id &&
              message.read === false
          )
          .map(
            message =>
              message.id
          );


      if (!unreadIds.length) {
        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .update({
            read: true,
            read_at:
              new Date().toISOString()
          })
          .in(
            "id",
            unreadIds
          );


      if (error) {

        console.error(
          "MARK READ:",
          error
        );

      }

    }


    /* =====================================================
       SEND
    ===================================================== */

    async function sendMessage() {

      if (
        !currentUser ||
        !currentChatUser
      ) return;


      const input =
        $("messageInput");


      const text =
        input.value.trim();


      if (!text) return;


      const button =
        $("sendBtn");


      button.disabled =
        true;


      try {

        const {
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                currentUser.id,

              receiver_id:
                currentChatUser.id,

              message:
                text,

              read:
                false,

              message_type:
                "text",

              delivered_at:
                new Date().toISOString()

            });


        if (error) {
          throw error;
        }


        input.value = "";


        await loadMessages();

        await loadChats();


        input.focus();


      } catch (error) {

        console.error(
          "SEND MESSAGE:",
          error
        );


        alert(
          "Message error: " +
          error.message
        );


      } finally {

        button.disabled =
          false;

      }

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    function searchUsers() {

      clearTimeout(
        searchTimer
      );


      searchTimer =
        setTimeout(
          runUserSearch,
          300
        );

    }


    async function runUserSearch() {

      const query =
        $("searchInput")
          .value
          .trim();


      const results =
        $("searchResults");


      if (!query) {

        results.innerHTML =
          "";

        return;

      }


      if (!currentUser) return;


      results.innerHTML = `
        <div class="loading">
          Searching...
        </div>
      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("profiles")
            .select(`
              id,
              username,
              display_name,
              avatar_url
            `)
            .ilike(
              "username",
              "%" + query + "%"
            )
            .neq(
              "id",
              currentUser.id
            )
            .limit(15);


        if (error) {
          throw error;
        }


        results.innerHTML =
          "";


        if (
          !data ||
          data.length === 0
        ) {

          results.innerHTML = `
            <div class="empty">
              <div class="empty-icon">
                🔎
              </div>

              No users found.
            </div>
          `;

          return;

        }


        data.forEach(
          profile => {

            const item =
              document.createElement("button");


            item.className =
              "search-result";


            item.type =
              "button";


            const avatar =
              document.createElement("div");


            avatar.className =
              "avatar small";


            setAvatar(
              avatar,
              profile
            );


            const info =
              document.createElement("div");


            info.className =
              "search-result-info";


            const name =
              document.createElement("div");


            name.className =
              "search-result-name";


            name.textContent =
              profile.display_name ||
              profile.username ||
              "User";


            const username =
              document.createElement("div");


            username.className =
              "search-result-username";


            username.textContent =
              "@" +
              (
                profile.username ||
                "user"
              );


            info.appendChild(name);
            info.appendChild(username);


            item.appendChild(avatar);
            item.appendChild(info);


            item.addEventListener(
              "click",
              async () => {

                $("searchInput")
                  .value = "";

                results.innerHTML =
                  "";

                await openChat(
                  profile
                );

              }
            );


            results.appendChild(
              item
            );

          }
        );


      } catch (error) {

        console.error(
          "SEARCH:",
          error
        );


        results.innerHTML = `
          <div class="error-box">
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    /* =====================================================
       REALTIME
    ===================================================== */

    function setupRealtime() {

      if (!currentUser) return;


      if (realtimeChannel) {

        supabaseClient.removeChannel(
          realtimeChannel
        );

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "pollpulse-chat-" +
            currentUser.id
          )
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "messages"
            },
            async () => {

              await loadChats();


              if (currentChatUser) {

                await loadMessages();

              }

            }
          )
          .subscribe();

    }


    /* =====================================================
       AVATAR
    ===================================================== */

    function setAvatar(
      element,
      profile
    ) {

      element.innerHTML =
        "";


      if (
        profile &&
        profile.avatar_url
      ) {

        const img =
          document.createElement("img");


        img.src =
          profile.avatar_url;


        img.alt =
          "";


        img.onerror =
          () => {

            element.innerHTML =
              "";

            element.textContent =
              getInitial(profile);

          };


        element.appendChild(
          img
        );


      } else {

        element.textContent =
          getInitial(profile);

      }

    }


    function getInitial(profile) {

      return (
        (
          profile?.display_name ||
          profile?.username ||
          "U"
        )
          .charAt(0)
          .toUpperCase()
      );

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    $("searchInput")
      .addEventListener(
        "input",
        searchUsers
      );


    $("sendBtn")
      .addEventListener(
        "click",
        sendMessage
      );


    $("messageInput")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            sendMessage();

          }

        }
      );


    $("backBtn")
      .addEventListener(
        "click",
        closeChat
      );


    $("newChatBtn")
      .addEventListener(
        "click",
        () => {

          $("searchInput").focus();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


    $("emojiBtn")
      .addEventListener(
        "click",
        () => {

          const input =
            $("messageInput");


          input.value +=
            (
              input.value
                ? " 😊"
                : "😊"
            );


          input.focus();

        }
      );


    $("infoBtn")
      .addEventListener(
        "click",
        () => {

          if (!currentChatUser) {
            return;
          }


          const username =
            currentChatUser.username
              ? "@" +
                currentChatUser.username
              : "";


          alert(
            (
              currentChatUser.display_name ||
              currentChatUser.username ||
              "User"
            ) +
            (
              username
                ? "\n" + username
                : ""
            )
          );

        }
      );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          currentChatUser
        ) {

          closeChat();

        }

      }
    );


    /* =====================================================
       TIME
    ===================================================== */

    function formatChatTime(date) {

      const d =
        new Date(date);

      const now =
        new Date();


      const diff =
        now - d;


      const minutes =
        Math.floor(
          diff / 60000
        );


      if (minutes < 1) {
        return "now";
      }


      if (minutes < 60) {
        return minutes + "m";
      }


      const hours =
        Math.floor(
          minutes / 60
        );


      if (hours < 24) {
        return hours + "h";
      }


      const days =
        Math.floor(
          hours / 24
        );


      if (days < 7) {
        return days + "d";
      }


      return d.toLocaleDateString(
        [],
        {
          day: "numeric",
          month: "short"
        }
      );

    }


    function formatMessageTime(date) {

      return new Date(date)
        .toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit"
          }
        );

    }


    function getDateLabel(date) {

      const d =
        new Date(date);

      const now =
        new Date();


      if (
        d.toDateString() ===
        now.toDateString()
      ) {

        return "Today";

      }


      const yesterday =
        new Date(now);


      yesterday.setDate(
        now.getDate() - 1
      );


      if (
        d.toDateString() ===
        yesterday.toDateString()
      ) {

        return "Yesterday";

      }


      return d.toLocaleDateString(
        [],
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value) {

      return String(
        value || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollMessages() {

      const box =
        $("messages");


      requestAnimationFrame(
        () => {

          box.scrollTop =
            box.scrollHeight;

        }
      );

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(message) {

      $("chatList").innerHTML = `
        <div class="error-box">
          ${escapeHtml(message)}
        </div>
      `;

    }


    /* =====================================================
       START
    ===================================================== */

    init();

  </script>

</body>
</html>

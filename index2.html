<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Poll Pulse • Chats</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #111111;
      --muted: #8a8a8f;
      --line: #ececef;
      --search: #f1f1f3;
      --blue: #0095f6;
      --blue-dark: #0077cc;
      --received: #eeeeF0;
      --sent: #3797f0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    input {
      -webkit-tap-highlight-color: transparent;
    }

    /* =====================================================
       APP SHELL
    ===================================================== */

    .app {
      width: 100%;
      max-width: 620px;
      min-height: 100dvh;
      margin: auto;
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 700px) {
      body {
        padding: 18px 0;
      }

      .app {
        min-height: calc(100dvh - 36px);
        border-radius: 22px;
        box-shadow: 0 12px 50px rgba(0, 0, 0, .10);
      }
    }

    /* =====================================================
       INBOX
    ===================================================== */

    .inbox {
      min-height: 100dvh;
      background: #fff;
    }

    .topbar {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding:
        env(safe-area-inset-top)
        17px
        0
        17px;

      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);

      position: sticky;
      top: 0;
      z-index: 20;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .topbar-subtitle {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .topbar-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f3f3f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      transition: transform .15s, background .15s;
    }

    .topbar-icon:active {
      transform: scale(.92);
      background: #e8e8ea;
    }

    /* =====================================================
       SEARCH
    ===================================================== */

    .search-wrap {
      padding: 14px 16px 7px;
      background: #fff;
    }

    .search-container {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
      font-size: 16px;
      pointer-events: none;
    }

    .search-box {
      width: 100%;
      height: 44px;

      border: 0;
      outline: 0;
      border-radius: 13px;

      background: var(--search);

      padding:
        0
        15px
        0
        40px;

      font-size: 15px;
      color: #111;

      transition: background .2s, box-shadow .2s;
    }

    .search-box::placeholder {
      color: #888;
    }

    .search-box:focus {
      background: #e9e9eb;
      box-shadow: 0 0 0 2px rgba(0, 149, 246, .10);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 17px 8px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
    }

    .section-count {
      color: #999;
      font-size: 12px;
    }

    /* =====================================================
       SEARCH RESULTS
    ===================================================== */

    .search-results {
      background: #fff;
    }

    .search-result {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 11px 17px;

      background: #fff;
      text-align: left;

      transition: background .15s;
    }

    .search-result:hover {
      background: #f8f8f8;
    }

    .search-result:active {
      background: #eeeeee;
    }

    .search-result-info {
      min-width: 0;
      flex: 1;
    }

    .search-result-name {
      font-size: 15px;
      font-weight: 700;
    }

    .search-result-username {
      color: #888;
      font-size: 13px;
      margin-top: 3px;
    }

    /* =====================================================
       AVATARS
    ===================================================== */

    .avatar {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #e8e8e8,
          #d0d0d0
        );

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      color: #555;
      font-weight: 800;
      font-size: 19px;

      position: relative;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =====================================================
       CHAT LIST
    ===================================================== */

    .chat-list {
      padding-bottom: 20px;
    }

    .chat-item {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 13px;

      padding: 11px 17px;

      background: #fff;
      text-align: left;

      transition:
        background .15s,
        transform .08s;
    }

    .chat-item:hover {
      background: #fafafa;
    }

    .chat-item:active {
      background: #f1f1f1;
      transform: scale(.995);
    }

    .chat-info {
      min-width: 0;
      flex: 1;
    }

    .chat-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-name {
      min-width: 0;

      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      color: #999;
      font-size: 11px;
      flex: 0 0 auto;
    }

    .chat-preview-row {
      display: flex;
      align-items: center;
      gap: 7px;

      margin-top: 5px;
    }

    .chat-preview {
      min-width: 0;

      color: #777;
      font-size: 13.5px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;

      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 3px rgba(0, 149, 246, .10);
    }

    /* =====================================================
       EMPTY / LOADING / ERROR
    ===================================================== */

    .empty {
      text-align: center;
      padding: 65px 25px;
      color: #858585;
      font-size: 14px;
      line-height: 1.6;
    }

    .empty-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;

      border-radius: 50%;

      background: #f1f1f3;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
    }

    .loading {
      text-align: center;
      padding: 45px 20px;
      color: #888;
      font-size: 14px;
    }

    .error-box {
      margin: 20px 16px;
      padding: 14px;

      border-radius: 13px;

      background: #fff0f0;
      color: #d00000;

      font-size: 13px;
      line-height: 1.5;
    }

    /* =====================================================
       CHAT SCREEN
    ===================================================== */

    .chat-screen {
      display: none;

      position: fixed;
      inset: 0;

      background: #fff;

      z-index: 100;

      overflow: hidden;
    }

    .chat-screen.active {
      display: flex;
      flex-direction: column;
    }

    .chat-topbar {
      min-height: 68px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding:
        env(safe-area-inset-top)
        10px
        0
        10px;

      border-bottom: 1px solid var(--line);

      background: rgba(255,255,255,.97);

      flex-shrink: 0;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .back-btn {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;

      border-radius: 50%;

      background: transparent;

      font-size: 35px;
      font-weight: 300;
      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #111;

      transition: background .15s, transform .1s;
    }

    .back-btn:active {
      background: #f0f0f0;
      transform: scale(.92);
    }

    .chat-user-avatar {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;

      border-radius: 50%;

      overflow: hidden;

      background: #ddd;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: 800;
      color: #555;
    }

    .chat-user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .chat-user-info {
      min-width: 0;
      flex: 1;
    }

    .chat-user-name {
      font-size: 15px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-user-status {
      color: #777;
      font-size: 11px;
      margin-top: 3px;
    }

    .header-action {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;

      border-radius: 50%;

      background: transparent;

      font-size: 21px;

      transition: background .15s, transform .1s;
    }

    .header-action:active {
      background: #f1f1f1;
      transform: scale(.92);
    }

    /* =====================================================
       MESSAGES
    ===================================================== */

    .messages {
      flex: 1;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 20px 13px 14px;

      background:
        radial-gradient(
          circle at top,
          #ffffff 0,
          #ffffff 55%,
          #fafafa 100%
        );

      display: flex;
      flex-direction: column;
      gap: 5px;

      overscroll-behavior: contain;

      scrollbar-width: thin;
    }

    .date-label {
      align-self: center;

      padding: 5px 11px;

      border-radius: 20px;

      background: #f0f0f2;

      color: #888;

      font-size: 10px;
      font-weight: 600;

      margin: 3px 0 13px;
    }

    .message-row {
      width: 100%;
      display: flex;
    }

    .message-row.received {
      justify-content: flex-start;
    }

    .message-row.sent {
      justify-content: flex-end;
    }

    .message {
      max-width: min(78%, 340px);

      padding: 10px 13px;

      border-radius: 20px;

      font-size: 15px;
      line-height: 1.4;

      word-break: break-word;
      white-space: pre-wrap;

      box-shadow: 0 1px 1px rgba(0,0,0,.03);
    }

    .received .message {
      background: var(--received);
      color: #111;

      border-bottom-left-radius: 6px;
    }

    .sent .message {
      background:
        linear-gradient(
          135deg,
          #45a8f5,
          #168ee8
        );

      color: #fff;

      border-bottom-right-radius: 6px;

      box-shadow:
        0 2px 5px rgba(0, 149, 246, .16);
    }

    .message img {
      display: block;
      max-width: 230px;
      max-height: 320px;
      border-radius: 15px;
      object-fit: cover;
    }

    .message-meta {
      font-size: 9px;
      margin-top: 4px;
      text-align: right;
      opacity: .68;
      line-height: 1;
    }

    .typing {
      display: none;

      padding: 4px 17px 8px;

      color: #888;

      font-size: 12px;

      background: #fff;
    }

    .typing.show {
      display: block;
    }

    /* =====================================================
       INPUT BAR
    ===================================================== */

    .message-input-area {
      padding:
        8px
        10px
        calc(8px + env(safe-area-inset-bottom))
        10px;

      border-top: 1px solid var(--line);

      background: rgba(255,255,255,.98);

      display: flex;
      align-items: center;
      gap: 7px;

      flex-shrink: 0;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .input-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;

      border-radius: 50%;

      background: #f2f2f4;

      font-size: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform .1s, background .15s;
    }

    .input-icon:active {
      transform: scale(.9);
      background: #e7e7e9;
    }

    .message-input {
      flex: 1;
      min-width: 0;

      height: 42px;

      border: 1px solid #dedee1;
      border-radius: 22px;

      outline: none;

      padding: 0 15px;

      font-size: 14px;

      background: #fafafa;

      color: #111;

      transition:
        border .2s,
        background .2s,
        box-shadow .2s;
    }

    .message-input::placeholder {
      color: #999;
    }

    .message-input:focus {
      border-color: #c7c7ca;
      background: #fff;

      box-shadow:
        0 0 0 3px rgba(0,149,246,.06);
    }

    .send-btn {
      height: 42px;

      min-width: 62px;

      padding: 0 14px;

      border-radius: 21px;

      background:
        linear-gradient(
          135deg,
          #20a0f6,
          #007fe0
        );

      color: #fff;

      font-size: 13px;
      font-weight: 800;

      box-shadow:
        0 3px 8px rgba(0,149,246,.20);

      transition:
        transform .1s,
        opacity .15s;
    }

    .send-btn:active {
      transform: scale(.94);
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: default;
      box-shadow: none;
    }

    /* =====================================================
       DESKTOP CHAT WIDTH
    ===================================================== */

    @media (min-width: 700px) {
      .chat-screen {
        position: absolute;
        inset: 0;
        border-radius: 22px;
      }

      .message {
        max-width: 65%;
      }
    }

    @media (max-width: 380px) {
      .avatar {
        width: 53px;
        height: 53px;
        flex-basis: 53px;
      }

      .message {
        max-width: 84%;
      }

      .send-btn {
        min-width: 54px;
        padding: 0 11px;
      }

      .topbar-title {
        font-size: 20px;
      }
    }

    /* =====================================================
       SMALL ANIMATION
    ===================================================== */

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message-row {
      animation: messageIn .16s ease-out;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =================================================
         INBOX
    ================================================= -->

    <main class="inbox" id="inbox">

      <header class="topbar">

        <div class="topbar-left">

          <div>
            <div class="topbar-title">
              Chats
            </div>

            <span class="topbar-subtitle">
              Poll Pulse messages
            </span>
          </div>

        </div>

        <button
          class="topbar-icon"
          id="newChatBtn"
          type="button"
          aria-label="New chat"
        >
          ✎
        </button>

      </header>


      <div class="search-wrap">

        <div class="search-container">

          <span class="search-icon">
            🔎
          </span>

          <input
            id="searchInput"
            class="search-box"
            type="text"
            placeholder="Search people..."
            autocomplete="off"
          >

        </div>

      </div>


      <div
        id="searchResults"
        class="search-results"
      ></div>


      <div class="section-header">

        <div class="section-title">
          Messages
        </div>

        <div
          class="section-count"
          id="chatCount"
        ></div>

      </div>


      <div
        class="chat-list"
        id="chatList"
      >

        <div class="loading">
          Loading chats...
        </div>

      </div>

    </main>


    <!-- =================================================
         CHAT SCREEN
    ================================================= -->

    <section
      class="chat-screen"
      id="chatScreen"
    >

      <header class="chat-topbar">

        <button
          class="back-btn"
          id="backBtn"
          type="button"
          aria-label="Back"
        >
          ‹
        </button>


        <div
          class="chat-user-avatar"
          id="chatAvatar"
        >
          U
        </div>


        <div class="chat-user-info">

          <div
            class="chat-user-name"
            id="chatUserName"
          >
            User
          </div>

          <div
            class="chat-user-status"
            id="chatUserStatus"
          >
            Message
          </div>

        </div>


        <button
          class="header-action"
          type="button"
          aria-label="Info"
        >
          ⓘ
        </button>

      </header>


      <div
        class="messages"
        id="messages"
      ></div>


      <div
        class="typing"
        id="typingIndicator"
      >
        Typing...
      </div>


      <div class="message-input-area">

        <button
          class="input-icon"
          type="button"
          aria-label="Emoji"
          id="emojiBtn"
        >
          😊
        </button>


        <input
          id="messageInput"
          class="message-input"
          type="text"
          placeholder="Message..."
          autocomplete="off"
        >


        <button
          id="sendBtn"
          class="send-btn"
          type="button"
        >
          Send
        </button>

      </div>

    </section>

  </div>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://dbpbkvfaxgifjeveijqf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    /* =====================================================
       STATE
    ===================================================== */

    let currentUser = null;
    let currentChatUser = null;
    let realtimeChannel = null;
    let searchTimer = null;


    /* =====================================================
       ELEMENT HELPER
    ===================================================== */

    const $ = id =>
      document.getElementById(id);


    /* =====================================================
       INITIALIZE
    ===================================================== */

    async function init() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {
          throw error;
        }


        const session =
          data?.session;


        if (!session) {

          $("chatList").innerHTML = `
            <div class="empty">

              <div class="empty-icon">
                🔐
              </div>

              <strong>Please login first.</strong>

              <br>

              Open Poll Pulse and login,
              then return here.

            </div>
          `;

          return;
        }


        currentUser =
          session.user;


        await loadChats();

        setupRealtime();

      } catch (error) {

        console.error(
          "INIT ERROR:",
          error
        );

        showError(
          error.message
        );

      }

    }


    /* =====================================================
       LOAD CHATS
    ===================================================== */

    async function loadChats() {

      if (!currentUser) return;


      const list =
        $("chatList");


      list.innerHTML = `
        <div class="loading">
          Loading chats...
        </div>
      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .select(`
              id,
              sender_id,
              receiver_id,
              message,
              read,
              created_at,
              message_type
            `)
            .or(
              `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {
          throw error;
        }


        if (!data || data.length === 0) {

          $("chatCount").textContent = "";

          list.innerHTML = `
            <div class="empty">

              <div class="empty-icon">
                💬
              </div>

              <strong>No chats yet</strong>

              <br>

              Search someone above
              to start chatting.

            </div>
          `;

          return;
        }


        const conversations =
          new Map();


        data.forEach(message => {

          const otherId =
            message.sender_id === currentUser.id
              ? message.receiver_id
              : message.sender_id;


          if (!conversations.has(otherId)) {

            conversations.set(
              otherId,
              message
            );

          }

        });


        const userIds =
          [...conversations.keys()];


        const {
          data: profiles,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(`
              id,
              username,
              display_name,
              avatar_url
            `)
            .in(
              "id",
              userIds
            );


        if (profileError) {
          throw profileError;
        }


        const profileMap =
          new Map(
            (profiles || []).map(
              profile => [
                profile.id,
                profile
              ]
            )
          );


        list.innerHTML = "";


        $("chatCount").textContent =
          userIds.length +
          (
            userIds.length === 1
              ? " chat"
              : " chats"
          );


        userIds.forEach(userId => {

          const message =
            conversations.get(userId);

          const profile =
            profileMap.get(userId);


          if (!profile) return;


          list.appendChild(
            createChatItem(
              profile,
              message
            )
          );

        });


        if (!list.children.length) {

          list.innerHTML = `
            <div class="empty">
              No chats found.
            </div>
          `;

        }

      } catch (error) {

        console.error(
          "LOAD CHATS:",
          error
        );

        showError(
          error.message
        );

      }

    }


    /* =====================================================
       CREATE CHAT ITEM
    ===================================================== */

    function createChatItem(
      profile,
      message
    ) {

      const item =
        document.createElement(
          "button"
        );

      item.className =
        "chat-item";

      item.type =
        "button";


      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";


      setAvatar(
        avatar,
        profile
      );


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "chat-info";


      const nameRow =
        document.createElement(
          "div"
        );

      nameRow.className =
        "chat-name-row";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "chat-name";

      name.textContent =
        profile.display_name ||
        profile.username ||
        "User";


      const time =
        document.createElement(
          "div"
        );

      time.className =
        "chat-time";

      time.textContent =
        formatChatTime(
          message.created_at
        );


      nameRow.appendChild(name);
      nameRow.appendChild(time);


      const previewRow =
        document.createElement(
          "div"
        );

      previewRow.className =
        "chat-preview-row";


      const preview =
        document.createElement(
          "div"
        );

      preview.className =
        "chat-preview";


      let previewText =
        message.message || "";


      if (
        message.message_type &&
        message.message_type !== "text"
      ) {

        if (
          message.message_type === "image"
        ) {

          previewText =
            "📷 Photo";

        } else {

          previewText =
            "Message";

        }

      }


      if (
        message.sender_id ===
        currentUser.id
      ) {

        previewText =
          "You: " +
          previewText;

      }


      preview.textContent =
        previewText;


      previewRow.appendChild(
        preview
      );


      if (
        message.receiver_id ===
          currentUser.id &&
        message.read === false
      ) {

        const dot =
          document.createElement(
            "div"
          );

        dot.className =
          "unread-dot";

        previewRow.appendChild(
          dot
        );

      }


      info.appendChild(nameRow);
      info.appendChild(previewRow);


      item.appendChild(avatar);
      item.appendChild(info);


      item.addEventListener(
        "click",
        () => {

          openChat(profile);

        }
      );


      return item;

    }


    /* =====================================================
       OPEN CHAT
    ===================================================== */

    async function openChat(profile) {

      if (!currentUser) return;


      currentChatUser =
        profile;


      $("chatUserName").textContent =
        profile.display_name ||
        profile.username ||
        "User";


      $("chatUserStatus").textContent =
        profile.username
          ? "@" + profile.username
          : "Message";


      setAvatar(
        $("chatAvatar"),
        profile
      );


      $("chatScreen")
        .classList
        .add("active");


      document.body.style.overflow =
        "hidden";


      $("messages").innerHTML = `
        <div class="loading">
          Loading messages...
        </div>
      `;


      await loadMessages();


      setTimeout(
        () => {

          $("messageInput").focus();

        },
        100
      );

    }


    /* =====================================================
       CLOSE CHAT
    ===================================================== */

    function closeChat() {

      currentChatUser =
        null;


      $("chatScreen")
        .classList
        .remove("active");


      document.body.style.overflow =
        "";

    }


    /* =====================================================
       LOAD MESSAGES
    ===================================================== */

    async function loadMessages() {

      if (
        !currentUser ||
        !currentChatUser
      ) return;


      const box =
        $("messages");


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .select(`
              id,
              sender_id,
              receiver_id,
              message,
              read,
              read_at,
              delivered_at,
              created_at,
              message_type,
              media_url
            `)
            .or(
              `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (error) {
          throw error;
        }


        box.innerHTML = "";


        if (!data || data.length === 0) {

          box.innerHTML = `
            <div class="empty">

              <div class="empty-icon">
                👋
              </div>

              <strong>Start the conversation</strong>

              <br>

              Send your first message.

            </div>
          `;

          return;
        }


        const dateLabel =
          document.createElement(
            "div"
          );

        dateLabel.className =
          "date-label";

        dateLabel.textContent =
          getDateLabel(
            data[0].created_at
          );

        box.appendChild(
          dateLabel
        );


        data.forEach(message => {

          const row =
            document.createElement(
              "div"
            );


          const mine =
            message.sender_id ===
            currentUser.id;


          row.className =
            "message-row " +
            (
              mine
                ? "sent"
                : "received"
            );


          const bubble =
            document.createElement(
              "div"
            );

          bubble.className =
            "message";


          if (
            message.message_type ===
              "image" &&
            message.media_url
          ) {

            const image =
              document.createElement(
                "img"
              );

            image.src =
              message.media_url;

            image.alt =
              "Image";


            image.onerror =
              () => {

                image.style.display =
                  "none";

              };


            bubble.appendChild(
              image
            );


            if (
              message.message
            ) {

              const text =
                document.createElement(
                  "div"
                );

              text.textContent =
                message.message;

              text.style.marginTop =
                "7px";

              bubble.appendChild(
                text
              );

            }

          } else {

            bubble.textContent =
              message.message ||
              "";

          }


          const meta =
            document.createElement(
              "div"
            );

          meta.className =
            "message-meta";


          let status =
            "";


          if (mine) {

            if (message.read) {

              status =
                " · Seen";

            } else if (
              message.delivered_at
            ) {

              status =
                " · Delivered";

            } else {

              status =
                " · Sent";

            }

          }


          meta.textContent =
            formatMessageTime(
              message.created_at
            ) +
            status;


          bubble.appendChild(
            meta
          );


          row.appendChild(
            bubble
          );


          box.appendChild(
            row
          );

        });


        await markMessagesRead(
          data
        );


        scrollMessages();

      } catch (error) {

        console.error(
          "LOAD MESSAGES:",
          error
        );


        box.innerHTML = `
          <div class="error-box">
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    /* =====================================================
       MARK READ
    ===================================================== */

    async function markMessagesRead(messages) {

      if (!currentUser) return;


      const unreadIds =
        messages
          .filter(
            message =>
              message.receiver_id ===
                currentUser.id &&
              message.read === false
          )
          .map(
            message =>
              message.id
          );


      if (
        unreadIds.length === 0
      ) return;


      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .update({
            read: true,
            read_at:
              new Date().toISOString()
          })
          .in(
            "id",
            unreadIds
          );


      if (error) {

        console.error(
          "MARK READ:",
          error
        );

      }

    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    async function sendMessage() {

      if (
        !currentUser ||
        !currentChatUser
      ) return;


      const input =
        $("messageInput");


      const text =
        input.value.trim();


      if (!text) return;


      const button =
        $("sendBtn");


      button.disabled =
        true;


      try {

        const {
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                currentUser.id,

              receiver_id:
                currentChatUser.id,

              message:
                text,

              read:
                false,

              message_type:
                "text",

              delivered_at:
                new Date().toISOString()

            });


        if (error) {
          throw error;
        }


        input.value = "";


        await loadMessages();

        await loadChats();


        input.focus();

      } catch (error) {

        console.error(
          "SEND MESSAGE:",
          error
        );


        alert(
          "Message error: " +
          error.message
        );

      } finally {

        button.disabled =
          false;

      }

    }


    /* =====================================================
       SEARCH USERS
    ===================================================== */

    function searchUsers() {

      clearTimeout(
        searchTimer
      );


      searchTimer =
        setTimeout(
          runUserSearch,
          300
        );

    }


    async function runUserSearch() {

      const query =
        $("searchInput")
          .value
          .trim();


      const results =
        $("searchResults");


      if (!query) {

        results.innerHTML =
          "";

        return;

      }


      if (!currentUser) return;


      results.innerHTML = `
        <div class="loading">
          Searching...
        </div>
      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("profiles")
            .select(`
              id,
              username,
              display_name,
              avatar_url
            `)
            .ilike(
              "username",
              "%" +
              query +
              "%"
            )
            .neq(
              "id",
              currentUser.id
            )
            .limit(15);


        if (error) {
          throw error;
        }


        results.innerHTML =
          "";


        if (
          !data ||
          data.length === 0
        ) {

          results.innerHTML = `
            <div class="empty">
              <div class="empty-icon">
                🔎
              </div>
              No users found.
            </div>
          `;

          return;

        }


        data.forEach(profile => {

          const item =
            document.createElement(
              "button"
            );

          item.className =
            "search-result";

          item.type =
            "button";


          const avatar =
            document.createElement(
              "div"
            );

          avatar.className =
            "avatar";


          setAvatar(
            avatar,
            profile
          );


          const info =
            document.createElement(
              "div"
            );

          info.className =
            "search-result-info";


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "search-result-name";

          name.textContent =
            profile.display_name ||
            profile.username ||
            "User";


          const username =
            document.createElement(
              "div"
            );

          username.className =
            "search-result-username";

          username.textContent =
            "@" +
            (
              profile.username ||
              "user"
            );


          info.appendChild(name);
          info.appendChild(username);


          item.appendChild(avatar);
          item.appendChild(info);


          item.addEventListener(
            "click",
            async () => {

              $("searchInput")
                .value = "";

              results.innerHTML =
                "";

              await openChat(
                profile
              );

            }
          );


          results.appendChild(
            item
          );

        });

      } catch (error) {

        console.error(
          "SEARCH:",
          error
        );


        results.innerHTML = `
          <div class="error-box">
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    /* =====================================================
       REALTIME
    ===================================================== */

    function setupRealtime() {

      if (!currentUser) return;


      if (realtimeChannel) {

        supabaseClient.removeChannel(
          realtimeChannel
        );

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "pollpulse-chat-" +
            currentUser.id
          )
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "messages"
            },
            async () => {

              await loadChats();


              if (
                currentChatUser
              ) {

                await loadMessages();

              }

            }
          )
          .subscribe();

    }


    /* =====================================================
       AVATAR
    ===================================================== */

    function setAvatar(
      element,
      profile
    ) {

      element.innerHTML =
        "";


      if (
        profile &&
        profile.avatar_url
      ) {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          profile.avatar_url;

        img.alt =
          "";


        img.onerror =
          () => {

            element.innerHTML =
              "";

            element.textContent =
              getInitial(
                profile
              );

          };


        element.appendChild(
          img
        );

      } else {

        element.textContent =
          getInitial(
            profile
          );

      }

    }


    function getInitial(profile) {

      return (
        (
          profile?.display_name ||
          profile?.username ||
          "U"
        )
          .charAt(0)
          .toUpperCase()
      );

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    $("searchInput")
      .addEventListener(
        "input",
        searchUsers
      );


    $("sendBtn")
      .addEventListener(
        "click",
        sendMessage
      );


    $("messageInput")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            sendMessage();

          }

        }
      );


    $("backBtn")
      .addEventListener(
        "click",
        closeChat
      );


    $("newChatBtn")
      .addEventListener(
        "click",
        () => {

          $("searchInput").focus();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


    $("emojiBtn")
      .addEventListener(
        "click",
        () => {

          const input =
            $("messageInput");


          input.value +=
            (
              input.value
                ? " 😊"
                : "😊"
            );


          input.focus();

        }
      );


    /* =====================================================
       ESCAPE CHAT WITH ESC KEY
    ===================================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          currentChatUser
        ) {

          closeChat();

        }

      }
    );


    /* =====================================================
       TIME
    ===================================================== */

    function formatChatTime(date) {

      const d =
        new Date(date);

      const now =
        new Date();

      const diff =
        now - d;


      const minutes =
        Math.floor(
          diff / 60000
        );


      if (minutes < 1) {
        return "now";
      }


      if (minutes < 60) {
        return minutes + "m";
      }


      const hours =
        Math.floor(
          minutes / 60
        );


      if (hours < 24) {
        return hours + "h";
      }


      const days =
        Math.floor(
          hours / 24
        );


      if (days < 7) {
        return days + "d";
      }


      return d.toLocaleDateString(
        [],
        {
          day: "numeric",
          month: "short"
        }
      );

    }


    function formatMessageTime(date) {

      return new Date(
        date
      ).toLocaleTimeString(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

    }


    function getDateLabel(date) {

      const d =
        new Date(date);

      const now =
        new Date();


      const sameDay =
        d.toDateString() ===
        now.toDateString();


      if (sameDay) {
        return "Today";
      }


      const yesterday =
        new Date(now);

      yesterday.setDate(
        now.getDate() - 1
      );


      if (
        d.toDateString() ===
        yesterday.toDateString()
      ) {

        return "Yesterday";

      }


      return d.toLocaleDateString(
        [],
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value) {

      return String(
        value || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollMessages() {

      const box =
        $("messages");


      requestAnimationFrame(
        () => {

          box.scrollTop =
            box.scrollHeight;

        }
      );

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(message) {

      $("chatList").innerHTML = `
        <div class="error-box">
          ${escapeHtml(message)}
        </div>
      `;

    }


    /* =====================================================
       START
    ===================================================== */

    init();

  </script>

</body>
</html>

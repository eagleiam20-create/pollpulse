<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#6c5ce7">

  <title>Poll Pulse - Change DP</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: #f5f4fb;
      color: #171725;
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: min(100%, 520px);
      min-height: calc(100vh - 40px);
      background: #fff;
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(40, 35, 90, .12);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .back-btn {
      width: 45px;
      height: 45px;
      flex: 0 0 45px;
      border-radius: 14px;
      background: #f1f0f7;
      color: #29283a;
      font-size: 23px;
      display: grid;
      place-items: center;
    }

    .back-btn:active {
      transform: scale(.94);
    }

    .brand {
      min-width: 0;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: #9090a2;
      font-size: 12px;
    }

    .content {
      width: 100%;
      text-align: center;
      padding-top: 28px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -.7px;
    }

    .description {
      margin: 8px auto 0;
      max-width: 340px;
      color: #88889b;
      font-size: 14px;
      line-height: 1.5;
    }

    .avatar-area {
      display: flex;
      justify-content: center;
      margin: 30px 0 20px;
    }

    .avatar-wrap {
      position: relative;
      width: 155px;
      height: 155px;
    }

    .avatar,
    .placeholder {
      width: 155px;
      height: 155px;
      border-radius: 50%;
    }

    .avatar {
      object-fit: cover;
      background: #eee;
      border: 5px solid #fff;
      box-shadow:
        0 12px 35px rgba(108, 92, 231, .22),
        0 0 0 1px #eee;
    }

    .placeholder {
      display: grid;
      place-items: center;
      background: linear-gradient(
        135deg,
        #6c5ce7,
        #927ff2
      );
      color: #fff;
      font-size: 58px;
      font-weight: 800;
      border: 5px solid #fff;
      box-shadow:
        0 12px 35px rgba(108, 92, 231, .22);
    }

    .camera-btn {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #6c5ce7;
      color: #fff;
      border: 4px solid #fff;
      font-size: 21px;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 22px rgba(108, 92, 231, .3);
      z-index: 5;
    }

    .camera-btn:active {
      transform: scale(.9);
    }

    .user-name {
      font-size: 20px;
      font-weight: 800;
    }

    .user-username {
      margin-top: 4px;
      color: #9292a3;
      font-size: 13px;
    }

    /*
      IMPORTANT:
      File input ko display:none nahi kar rahe.
      Mobile browsers par hidden input kabhi-kabhi
      programmatic click ko block kar dete hain.
    */
    #avatarFile {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
    }

    .info-box {
      margin-top: 25px;
      padding: 16px;
      border-radius: 18px;
      background: #f8f7fc;
      border: 1px solid #eceaf5;
    }

    .info-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .info-text {
      color: #8c8c9e;
      font-size: 12px;
      line-height: 1.5;
    }

    .main-btn {
      width: 100%;
      min-height: 55px;
      margin-top: 16px;
      border-radius: 17px;
      background: #6c5ce7;
      color: white;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 10px 25px rgba(108, 92, 231, .23);
    }

    .main-btn:active {
      transform: scale(.985);
    }

    .main-btn:disabled {
      opacity: .65;
    }

    .status {
      min-height: 22px;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.4;
    }

    .success {
      color: #15834a;
    }

    .error {
      color: #d53d56;
    }

    .loading {
      color: #6c5ce7;
    }

    .hidden {
      display: none !important;
    }

    .login-message {
      text-align: center;
      margin-top: 80px;
      color: #77778a;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -4px;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 0;
      }

      .card {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
        padding:
          max(18px, env(safe-area-inset-top))
          17px
          max(25px, env(safe-area-inset-bottom));
        box-shadow: none;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <main class="card">

    <div class="topbar">

      <button
        id="backBtn"
        class="back-btn"
        type="button"
        aria-label="Back"
      >
        ←
      </button>

      <div class="brand">
        <div class="brand-title">
          Poll Pulse
        </div>

        <div class="brand-subtitle">
          Profile picture
        </div>
      </div>

    </div>


    <div id="loginMessage" class="login-message hidden">
      Please login to Poll Pulse first.
    </div>


    <section id="content" class="content hidden">

      <h1>
        Change your DP
      </h1>

      <p class="description">
        Select a photo from your phone and set it as your
        Poll Pulse profile picture.
      </p>


      <div class="avatar-area">

        <div class="avatar-wrap">

          <div
            id="placeholder"
            class="placeholder"
          >
            ?
          </div>

          <img
            id="avatarPreview"
            class="avatar hidden"
            alt="Profile picture"
          >

          <button
            id="cameraBtn"
            class="camera-btn"
            type="button"
            aria-label="Select photo"
          >
            📷
          </button>

        </div>

      </div>


      <div id="displayName" class="user-name">
        Loading...
      </div>

      <div id="username" class="user-username">
        Loading...
      </div>


      <div class="info-box">

        <div class="info-title">
          Choose your photo
        </div>

        <div class="info-text">
          JPG, PNG, WEBP or GIF · Maximum 5 MB
        </div>

      </div>


      <!--
        IMPORTANT:
        This input is intentionally NOT display:none.
        It is hidden outside the screen so mobile browsers
        can still open the file picker.
      -->
      <input
        id="avatarFile"
        type="file"
        accept="image/*"
      >


      <button
        id="chooseBtn"
        class="main-btn"
        type="button"
      >
        Choose Photo
      </button>


      <div
        id="status"
        class="status"
      ></div>

    </section>

  </main>

</div>


<script>
  /* =========================================================
     SUPABASE CONFIG
     ========================================================= */

  const SUPABASE_URL =
    "https://dbpbkvfaxgifjeveijqf.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_G45cAQkTBfiS1E2a9zSe8g_ULSq4Ri7";


  /* =========================================================
     VARIABLES
     ========================================================= */

  let sb = null;
  let currentUser = null;
  let currentProfile = null;
  let selectedFile = null;


  /* =========================================================
     ELEMENTS
     ========================================================= */

  const content =
    document.getElementById("content");

  const loginMessage =
    document.getElementById("loginMessage");

  const avatarFile =
    document.getElementById("avatarFile");

  const cameraBtn =
    document.getElementById("cameraBtn");

  const chooseBtn =
    document.getElementById("chooseBtn");

  const avatarPreview =
    document.getElementById("avatarPreview");

  const placeholder =
    document.getElementById("placeholder");

  const displayName =
    document.getElementById("displayName");

  const username =
    document.getElementById("username");

  const status =
    document.getElementById("status");

  const backBtn =
    document.getElementById("backBtn");


  /* =========================================================
     SUPABASE INIT
     ========================================================= */

  function initSupabase() {

    if (!window.supabase) {

      setStatus(
        "Supabase load nahi hua. Internet check karo.",
        "error"
      );

      return false;
    }

    sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    return true;
  }


  /* =========================================================
     STATUS
     ========================================================= */

  function setStatus(text, type) {

    status.textContent = text;

    status.className =
      "status " + (type || "");
  }


  /* =========================================================
     MOBILE FILE PICKER
     ========================================================= */

  function openFilePicker() {

    if (!avatarFile) {
      return;
    }

    /*
      IMPORTANT:
      No setTimeout.
      No Promise.
      No async function here.

      This is called directly from the tap event,
      which is safer for iPhone/Android browsers.
    */

    avatarFile.value = "";

    avatarFile.click();
  }


  /*
    Camera icon
  */

  cameraBtn.addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      openFilePicker();
    },
    false
  );


  /*
    Main Choose Photo button
  */

  chooseBtn.addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      if (!selectedFile) {

        openFilePicker();

      } else {

        uploadAvatar();

      }
    },
    false
  );


  /* =========================================================
     FILE SELECTED
     ========================================================= */

  avatarFile.addEventListener(
    "change",
    function(event) {

      const files =
        event.target.files;

      if (!files || !files.length) {
        return;
      }

      const file =
        files[0];

      if (!file.type.startsWith("image/")) {

        selectedFile = null;

        setStatus(
          "Please image file select karo.",
          "error"
        );

        return;
      }


      if (
        file.size >
        5 * 1024 * 1024
      ) {

        selectedFile = null;

        setStatus(
          "Image 5 MB se chhoti honi chahiye.",
          "error"
        );

        return;
      }


      selectedFile = file;


      /*
        Preview
      */

      const url =
        URL.createObjectURL(file);

      avatarPreview.src = url;

      avatarPreview.classList.remove(
        "hidden"
      );

      placeholder.classList.add(
        "hidden"
      );


      chooseBtn.textContent =
        "Upload DP";


      setStatus(
        "Photo select ho gayi. Ab Upload DP dabao.",
        "success"
      );

    },
    false
  );


  /* =========================================================
     GET SESSION
     ========================================================= */

  async function start() {

    if (!initSupabase()) {
      return;
    }

    try {

      const result =
        await sb.auth.getSession();

      if (result.error) {
        throw result.error;
      }

      currentUser =
        result.data &&
        result.data.session
          ? result.data.session.user
          : null;


      if (!currentUser) {

        content.classList.add(
          "hidden"
        );

        loginMessage.classList.remove(
          "hidden"
        );

        return;
      }


      content.classList.remove(
        "hidden"
      );

      loginMessage.classList.add(
        "hidden"
      );


      await loadProfile();

    } catch (error) {

      console.error(error);

      setStatus(
        error.message ||
        "Session load nahi hui.",
        "error"
      );
    }
  }


  /* =========================================================
     LOAD PROFILE
     ========================================================= */

  async function loadProfile() {

    const result =
      await sb
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();


    if (result.error) {

      console.error(result.error);

      setStatus(
        "Profile load nahi ho saki.",
        "error"
      );

      return;
    }


    currentProfile =
      result.data || {};


    const name =
      currentProfile.display_name ||
      currentProfile.username ||
      currentUser.email?.split("@")[0] ||
      "User";


    const userName =
      currentProfile.username
        ? "@" + currentProfile.username
        : "";


    displayName.textContent =
      name;

    username.textContent =
      userName;


    if (currentProfile.avatar_url) {

      avatarPreview.src =
        currentProfile.avatar_url +
        (
          currentProfile.avatar_url.includes("?")
            ? "&"
            : "?"
        ) +
        "v=" +
        Date.now();

      avatarPreview.classList.remove(
        "hidden"
      );

      placeholder.classList.add(
        "hidden"
      );

    } else {

      placeholder.textContent =
        name
          .charAt(0)
          .toUpperCase();

      placeholder.classList.remove(
        "hidden"
      );

      avatarPreview.classList.add(
        "hidden"
      );
    }
  }


  /* =========================================================
     UPLOAD
     ========================================================= */

  async function uploadAvatar() {

    if (!currentUser) {

      setStatus(
        "Please login first.",
        "error"
      );

      return;
    }


    if (!selectedFile) {

      openFilePicker();

      return;
    }


    chooseBtn.disabled = true;

    cameraBtn.disabled = true;


    chooseBtn.innerHTML =
      '<span class="spinner"></span>Uploading...';


    setStatus(
      "DP upload ho rahi hai...",
      "loading"
    );


    try {

      /*
        Safe extension
      */

      let extension = "jpg";

      if (
        selectedFile.type ===
        "image/png"
      ) {
        extension = "png";
      }

      if (
        selectedFile.type ===
        "image/webp"
      ) {
        extension = "webp";
      }

      if (
        selectedFile.type ===
        "image/gif"
      ) {
        extension = "gif";
      }


      /*
        Unique path
      */

      const filePath =
        currentUser.id +
        "/" +
        Date.now() +
        "." +
        extension;


      /* -----------------------------------------
         STORAGE UPLOAD
         ----------------------------------------- */

      const upload =
        await sb
          .storage
          .from("avatars")
          .upload(
            filePath,
            selectedFile,
            {
              cacheControl: "3600",
              upsert: false,
              contentType:
                selectedFile.type
            }
          );


      if (upload.error) {

        console.error(
          "Storage error:",
          upload.error
        );

        throw upload.error;
      }


      /* -----------------------------------------
         PUBLIC URL
         ----------------------------------------- */

      const publicResult =
        sb
          .storage
          .from("avatars")
          .getPublicUrl(filePath);


      const publicUrl =
        publicResult.data?.publicUrl;


      if (!publicUrl) {

        throw new Error(
          "Public avatar URL nahi mili."
        );
      }


      /* -----------------------------------------
         UPDATE PROFILE
         ----------------------------------------- */

      const update =
        await sb
          .from("profiles")
          .update({
            avatar_url: publicUrl
          })
          .eq(
            "id",
            currentUser.id
          );


      if (update.error) {

        console.error(
          "Profile update error:",
          update.error
        );

        throw update.error;
      }


      /* -----------------------------------------
         SHOW NEW DP
         ----------------------------------------- */

      avatarPreview.src =
        publicUrl +
        "?v=" +
        Date.now();


      avatarPreview.classList.remove(
        "hidden"
      );

      placeholder.classList.add(
        "hidden"
      );


      selectedFile = null;

      avatarFile.value = "";


      chooseBtn.textContent =
        "Choose New Photo";


      setStatus(
        "✓ DP successfully update ho gayi!",
        "success"
      );


    } catch (error) {

      console.error(
        "UPLOAD ERROR:",
        error
      );


      setStatus(
        error.message ||
        "DP upload nahi ho payi.",
        "error"
      );


      chooseBtn.textContent =
        selectedFile
          ? "Upload DP"
          : "Choose Photo";

    } finally {

      chooseBtn.disabled = false;

      cameraBtn.disabled = false;
    }
  }


  /* =========================================================
     AUTH STATE
     ========================================================= */

  function listenForAuth() {

    if (!sb) {
      return;
    }


    sb.auth.onAuthStateChange(
      function(event, session) {

        if (
          event === "SIGNED_IN" &&
          session
        ) {

          currentUser =
            session.user;

          loginMessage.classList.add(
            "hidden"
          );

          content.classList.remove(
            "hidden"
          );

          loadProfile();
        }


        if (
          event === "SIGNED_OUT"
        ) {

          currentUser = null;

          content.classList.add(
            "hidden"
          );

          loginMessage.classList.remove(
            "hidden"
          );
        }
      }
    );
  }


  /* =========================================================
     BACK
     ========================================================= */

  backBtn.addEventListener(
    "click",
    function() {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      } else {

        window.location.href =
          "index.html";
      }
    }
  );


  /* =========================================================
     START APP
     ========================================================= */

  start().then(function() {

    listenForAuth();

  });

</script>

</body>
</html>
